          openCabinetRackDialog(mode, payload = {}) {
            this.state.ui.cabinetRackDialog = {
              mode: mode || "add",
              unit: payload.unit || "",
              deviceCode: payload.deviceCode || "",
              deviceName: payload.deviceName || "",
              startU: payload.startU || "",
              uHeight: payload.uHeight || ""
            };
            this.emit();
          }

          setCabinetRackDialogMode(mode) {
            if (!this.state.ui.cabinetRackDialog) {
              return;
            }
            this.state.ui.cabinetRackDialog.mode = mode || "add";
            this.emit();
          }

          selectCabinetRackDevice(rowId) {
            if (!this.state.ui.cabinetRackDialog || !rowId) {
              return;
            }
            this.state.ui.cabinetRackDialog.selectedDeviceId = rowId;
            this.emit();
          }

          closeCabinetRackDialog() {
            this.state.ui.cabinetRackDialog = null;
            this.emit();
          }

          confirmCabinetRackAction(label) {
            const dialog = this.state.ui.cabinetRackDialog;
            const unitText = dialog?.unit ? "第" + dialog.unit + "U位" : "当前U位";
            const selectedDevice = dialog?.selectedDeviceId ? this.getRowById(VIEW_IDS.IT_FACILITY, dialog.selectedDeviceId) : null;
            const deviceText = selectedDevice?.name || dialog?.deviceName || dialog?.deviceCode || "当前设备";
            this.state.ui.cabinetRackDialog = null;
            this.pushToast(label || "操作完成", unitText + " · " + deviceText + " 已完成原型操作反馈。", "success");
          }

          isPendingInitializationView(viewId) {
            return viewId === VIEW_IDS.PENDING_IT_ASSET || viewId === VIEW_IDS.PENDING_ASSET;
          }

          getInitializationTargetView(viewId) {
            if (viewId === VIEW_IDS.PENDING_IT_ASSET) {
              return VIEW_IDS.IT_FACILITY;
            }
            if (viewId === VIEW_IDS.PENDING_ASSET) {
              return VIEW_IDS.STATION_FACILITY;
            }
            return viewId;
          }

          openInitializationOperationPage(sourceViewId, rowIds = []) {
            const selectedRowIds = Array.isArray(rowIds) ? rowIds.filter(Boolean) : [rowIds].filter(Boolean);
            if (!this.isPendingInitializationView(sourceViewId)) {
              return;
            }
            if (!selectedRowIds.length) {
              this.pushToast("初始化", "请先勾选需要初始化的资产。", "warning");
              return;
            }
            this.openOperationPage(this.getInitializationTargetView(sourceViewId), null, "初始化", selectedRowIds, {
              source: "pendingInit",
              sourceViewId
            });
          }

          openOperationPage(viewId, rowId, action, selectedRowIds = [], options = {}) {
            this.state.ui.operationPage = {
              viewId,
              rowId,
              action,
              selectedRowIds: Array.isArray(selectedRowIds) ? selectedRowIds.slice() : [],
              source: options.source || "",
              sourceViewId: options.sourceViewId || viewId,
              focusColumnKey: options.focusColumnKey || ""
            };
            this.state.ui.guidePage = null;
            this.state.ui.detailPage = null;
            this.state.ui.drawer = null;
            this.state.ui.operationAssetDialog = null;
            this.state.ui.ledgerHierarchyMenuOpen = false;
            this.closeRowMoreMenu(false);
            this.closeGuideMenu(false);
            this.emit();
          }

          closeOperationPage() {
            this.state.ui.operationPage = null;
            this.state.ui.operationAssetDialog = null;
            this.emit();
          }

          openOperationAssetDialog() {
            const page = this.state.ui.operationPage;
            if (!page) {
              return;
            }
            const sourceViewId = page.sourceViewId || page.viewId;
            const rows = this.getListRows(sourceViewId);
            if (!rows.length) {
              this.pushToast("选择资产", "当前没有可选择的资产。", "warning");
              return;
            }
            const selectedRowIds = Array.isArray(page.selectedRowIds) && page.selectedRowIds.length
              ? page.selectedRowIds.slice()
              : (page.rowId ? [page.rowId] : []);
            this.state.ui.operationAssetDialog = {
              sourceViewId,
              selectedRowIds
            };
            this.emit();
          }

          closeOperationAssetDialog() {
            this.state.ui.operationAssetDialog = null;
            this.emit();
          }

          toggleOperationAssetDialogSelection(rowId) {
            const dialog = this.state.ui.operationAssetDialog;
            if (!dialog || !rowId) {
              return;
            }
            const selected = new Set(dialog.selectedRowIds || []);
            if (selected.has(rowId)) {
              selected.delete(rowId);
            } else {
              selected.add(rowId);
            }
            dialog.selectedRowIds = [...selected];
            this.emit();
          }

          confirmOperationAssetDialogSelection() {
            const dialog = this.state.ui.operationAssetDialog;
            const page = this.state.ui.operationPage;
            if (!dialog || !page) {
              return;
            }
            const selectedRowIds = Array.isArray(dialog.selectedRowIds)
              ? dialog.selectedRowIds.filter(Boolean)
              : [];
            if (!selectedRowIds.length) {
              this.pushToast("选择资产", "请至少选择一条资产。", "warning");
              return;
            }
            page.selectedRowIds = selectedRowIds;
            page.sourceViewId = dialog.sourceViewId || page.sourceViewId || page.viewId;
            page.rowId = null;
            this.state.ui.operationAssetDialog = null;
            this.pushToast("已选择资产", "已将 " + selectedRowIds.length + " 条资产带入电子表格。", "success");
          }

          completePendingInitialization(page) {
            const sourceViewId = page.sourceViewId || this.state.ui.operationPage?.sourceViewId || VIEW_IDS.PENDING_ASSET;
            const targetViewId = page.viewId;
            const rows = (Array.isArray(page.selectedRows) && page.selectedRows.length
              ? page.selectedRows
              : (page.row ? [page.row] : [])).filter(Boolean);
            if (!rows.length) {
              this.pushToast("初始化", "请先选择需要初始化的资产。", "warning");
              return;
            }
            const sourceRows = this.state.data.lists[sourceViewId] || [];
            const targetRows = this.state.data.lists[targetViewId] || [];
            const sourceIds = new Set(rows.map((row) => row.id));
            const existingIds = new Set(targetRows.map((row) => row.id));
            const idPrefix = targetViewId === VIEW_IDS.IT_FACILITY ? "IT" : "ST";
            let nextNumber = targetRows.length + 1;
            const buildId = () => {
              let nextId = "";
              do {
                nextId = idPrefix + "-" + pad(nextNumber++, 3);
              } while (existingIds.has(nextId));
              existingIds.add(nextId);
              return nextId;
            };
            const initializedRows = rows.map((row, index) => {
              const assetStatus = targetViewId === VIEW_IDS.IT_FACILITY ? "空闲" : "在用";
              const normalizedDescription = row.description === "-" ? "" : (row.description || "");
              const normalizedTag = row.dataTag === "-" ? "" : (row.dataTag || "");
              return {
                ...row,
                id: buildId(),
                assetStatus,
                assetSummary: getAssetFlowStatus(targetViewId, index, assetStatus, assetStatus),
                description: normalizedDescription,
                dataTag: normalizedTag,
                relatedAsset: row.relatedAsset || "",
                ratedPower: row.ratedPower || (targetViewId === VIEW_IDS.IT_FACILITY ? "2" : ""),
                uHeight: row.uHeight || (targetViewId === VIEW_IDS.IT_FACILITY ? "1" : ""),
                portCount: row.portCount || (targetViewId === VIEW_IDS.IT_FACILITY ? "8" : ""),
                startU: row.startU || ""
              };
            });
            this.state.data.lists[sourceViewId] = sourceRows.filter((row) => !sourceIds.has(row.id));
            this.state.data.lists[targetViewId] = [...initializedRows, ...targetRows];
            this.state.ui.operationPage = null;
            this.state.ui.operationAssetDialog = null;
            this.state.ui.currentView = targetViewId;
            this.state.ui.pagers[targetViewId] = 1;
            this.state.ui.listSelections[sourceViewId] = [];
            this.state.ui.listSelections[targetViewId] = [];
            const targetTitle = LIST_PAGE_META[targetViewId]?.title || "台账";
            this.pushToast("初始化完成", rows.length + " 条资产已写入" + targetTitle + "台账。", "success");
          }

          toggleGuideMenu() {
            this.closeRowMoreMenu(false);
            this.state.ui.guideMenuOpen = !this.state.ui.guideMenuOpen;
            this.emit();
          }

          toggleDemandExplain() {
            this.state.ui.demandExplainEnabled = !this.state.ui.demandExplainEnabled;
            this.state.ui.guideMenuOpen = false;
            if (!this.state.ui.demandExplainEnabled) {
              window.demandExplainController?.hide();
            }
            this.emit();
          }

          setDemandExplainScope(version) {
            if (version === "off") {
              this.state.ui.demandExplainEnabled = false;
              this.state.ui.guideMenuOpen = false;
              window.demandExplainController?.hide();
              this.emit();
              return;
            }
            const versions = new Set(VERSION_REQUIREMENTS.map((item) => item.version));
            this.state.ui.versionRequirementFilter = version === "all" || versions.has(version) ? version : "all";
            this.state.ui.focusedRequirementId = null;
            this.state.ui.demandExplainEnabled = true;
            this.state.ui.guideMenuOpen = false;
            this.emit();
          }

          closeGuideMenu(shouldEmit = true) {
            if (!this.state.ui.guideMenuOpen) {
              return false;
            }
            this.state.ui.guideMenuOpen = false;
            if (shouldEmit) {
              this.emit();
            }
            return true;
          }

          openGuidePage(pageId = "flowcharts") {
            const guidePages = new Set(["flowcharts", "versionRequirements", "requirementSpec"]);
            const page = guidePages.has(pageId) ? pageId : "flowcharts";
            this.state.ui.guidePage = page;
            this.state.ui.guideMenuOpen = false;
            this.closeRowMoreMenu(false);
            const url = new URL(window.location.href);
            url.hash = "guide=" + encodeURIComponent(page);
            window.history.replaceState(null, "", url.toString());
            this.emit();
          }

          closeGuidePage() {
            this.state.ui.guidePage = null;
            this.state.ui.guideMenuOpen = false;
            this.emit();
          }

          setVersionRequirementFilter(version) {
            const versions = new Set(VERSION_REQUIREMENTS.map((item) => item.version));
            this.state.ui.versionRequirementFilter = version === "all" || versions.has(version) ? version : "all";
            this.state.ui.focusedRequirementId = null;
            this.emit();
          }

          openVersionRequirementTarget(reqId) {
            const requirement = VERSION_REQUIREMENTS.find((item) => item.id === reqId);
            if (!requirement) {
              this.pushToast("未找到需求索引", "该需求条目不存在或已被移除。", "warning");
              return;
            }
            this.state.ui.versionRequirementFilter = requirement.version || "all";
            this.state.ui.focusedRequirementId = requirement.id;
            this.state.ui.demandExplainEnabled = true;
            if (requirement.showDescriptionDialog) {
              this.openRequirementDescriptionDialog(requirement.id);
              return;
            }
            if (!requirement.targetView) {
              this.pushToast("待确认索引", "“" + requirement.description + "”暂未绑定到当前原型页面，请确认后再补充索引。", "warning");
              this.emit();
              return;
            }
            if (requirement.targetAction === "批量入库") {
              this.openOperationPage(requirement.targetView || VIEW_IDS.IT_FACILITY, null, "入库");
              return;
            }
            if (requirement.targetAction === "批量上架") {
              this.openOperationPage(requirement.targetView || VIEW_IDS.IT_FACILITY, null, "上架");
              return;
            }
            if (requirement.id === "V3R5-4112") {
              const targetView = requirement.targetView || VIEW_IDS.IT_FACILITY;
              const sampleRow = this.getFilteredRows(targetView)[0] || this.getListRows(targetView)[0];
              if (sampleRow) {
                this.openDetailPage(targetView, sampleRow.id);
                this.state.ui.versionRequirementFilter = requirement.version || "all";
                this.state.ui.focusedRequirementId = requirement.id;
                this.state.ui.demandExplainEnabled = true;
                this.state.ui.detailPage.activeTab = "history";
                this.state.ui.detailPage.historyRange = "全部";
                this.pushToast("已定位需求范围", "已跳转到“" + requirement.targetLabel + "”。", "success");
                this.emit();
              }
              return;
            }
            if (requirement.id === "V3R5-4427") {
              const targetView = requirement.targetView || VIEW_IDS.STATION_FACILITY;
              const sampleRow = this.getFilteredRows(targetView)[0] || this.getListRows(targetView)[0];
              if (sampleRow) {
                this.openDetailPage(targetView, sampleRow.id);
                this.state.ui.versionRequirementFilter = requirement.version || "all";
                this.state.ui.focusedRequirementId = requirement.id;
                this.state.ui.demandExplainEnabled = true;
                this.state.ui.detailPage.activeTab = "position";
                this.pushToast("已定位需求范围", "已跳转到“" + requirement.targetLabel + "”。", "success");
                this.emit();
              }
              return;
            }
            this.state.ui.currentTopNav = INTEGRATION_VIEW_IDS.has(requirement.targetView) ? "集成系统" : "运营管理";
            this.state.ui.currentView = requirement.targetView || VIEW_IDS.IT_FACILITY;
            if (requirement.id === "V3R5-4110") {
              if (!this.state.ui.listViewModes) {
                this.state.ui.listViewModes = {};
              }
              this.state.ui.listViewModes[requirement.targetView] = "space";
            }
            if (requirement.id === "V3R5-4111") {
              if (!this.state.ui.listViewModes) {
                this.state.ui.listViewModes = {};
              }
              this.state.ui.listViewModes[requirement.targetView] = "standard";
            }
            if (requirement.id === "V3R5-4186") {
              if (!this.state.ui.listViewModes) {
                this.state.ui.listViewModes = {};
              }
              this.state.ui.listViewModes[requirement.targetView] = "standard";
              const sampleRows = this.getCurrentPageRows(requirement.targetView, this.getFilteredRows(requirement.targetView)).slice(0, 2);
              this.state.ui.listSelections[requirement.targetView] = sampleRows.map((row) => row.id);
              this.state.ui.batchSelectionMenuOpen = requirement.targetView;
            }
            if (requirement.id === "V3R5-4336") {
              this.state.ui.templateConfig.objectTypeTreeOpen = true;
              this.state.ui.templateConfig.objectTypeExpandedNodes = {
                ...(this.state.ui.templateConfig.objectTypeExpandedNodes || {}),
                device: true,
                electricalDevice: true,
                hvacDevice: true
              };
            }
            this.state.ui.guidePage = null;
            this.state.ui.operationPage = null;
            this.state.ui.detailPage = null;
            this.state.ui.drawer = null;
            this.state.ui.ledgerHierarchyMenuOpen = false;
            this.closeGuideMenu(false);
            this.pushToast(requirement.status === "待确认索引" ? "已跳转待确认范围" : "已定位需求范围", "已跳转到“" + requirement.targetLabel + "”。", requirement.status === "待确认索引" ? "warning" : "success");
            this.emit();
          }

          setAssetDetailTab(tabId) {
            if (!this.state.ui.detailPage) {
              return;
            }
            this.state.ui.detailPage.activeTab = tabId;
            this.emit();
          }

          setAssetHistoryRange(rangeLabel) {
            if (!this.state.ui.detailPage) {
              return;
            }
            this.state.ui.detailPage.historyRange = rangeLabel;
            this.emit();
          }

          closeDrawer() {
            this.state.ui.drawer = null;
            this.emit();
          }

          closeRowMoreMenu(shouldEmit = true) {
            if (!this.state.ui.rowMoreMenu) {
              return false;
            }
            this.state.ui.rowMoreMenu = null;
            if (shouldEmit) {
              this.emit();
            }
            return true;
          }

          isRowMoreMenuOpen(viewId, rowId) {
            const rowMoreMenu = this.state.ui.rowMoreMenu;
            return Boolean(rowMoreMenu && rowMoreMenu.viewId === viewId && rowMoreMenu.rowId === rowId);
          }

          toggleRowMoreMenu(viewId, rowId) {
            this.closeGuideMenu(false);
            if (this.isRowMoreMenuOpen(viewId, rowId)) {
              this.state.ui.rowMoreMenu = null;
            } else {
              this.state.ui.rowMoreMenu = { viewId, rowId };
            }
            this.emit();
          }

          executeRowMoreAction(viewId, rowId, label) {
            const row = this.getRowById(viewId, rowId);
            const menuClosed = this.closeRowMoreMenu(false);
            if (!row) {
              if (menuClosed) {
                this.emit();
              }
              return;
            }
            if (label === "关联设备") {
              this.openRelationDialog(viewId, rowId);
              return;
            }
            if (ROW_MORE_PAGE_META[label]) {
              this.openOperationPage(viewId, rowId, label);
              return;
            }
            this.pushToast(label, row.name + " 已触发“" + label + "”演示动作。", "info");
          }

          openRelationDialog(viewId, rowId) {
            const row = this.getRowById(viewId, rowId);
            if (!row) {
              return;
            }
            this.state.ui.drawer = null;
            this.state.ui.operationPage = null;
            this.state.ui.guidePage = null;
            const defaultSource = RELATION_VIEW_TO_VIEW_ID[viewId] || "itFacility";
            this.state.ui.relationDialog = {
              viewId,
              rowId,
              step: 1,
              relationType: null,
              sourceViewId: defaultSource,
              keywords: { name: "", assetCode: "", assetCategory: "", assetLocation: "" },
              searchExpanded: false,
              page: 1,
              pageSize: 10,
              selected: [],
              error: null
            };
            this.emit();
          }

          closeRelationDialog() {
            if (!this.state.ui.relationDialog) {
              return;
            }
            this.state.ui.relationDialog = null;
            this.emit();
          }

          setRelationType(type) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            if (type !== RELATION_TYPE_PARENT && type !== RELATION_TYPE_CHILD) {
              return;
            }
            if (dialog.relationType !== type) {
              dialog.selected = [];
            }
            dialog.relationType = type;
            dialog.error = null;
            this.emit();
          }

          relationGoStep(step) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            const target = Number(step) === 2 ? 2 : 1;
            if (target === 2 && !dialog.relationType) {
              dialog.error = "请先选择关联类型。";
              this.emit();
              return;
            }
            if (target === 2) {
              const currentRow = this.getRowById(dialog.viewId, dialog.rowId);
              if (currentRow && this.isRelationStatusBlocked(currentRow.assetStatus)) {
                dialog.error = "当前资产状态为「" + currentRow.assetStatus + "」，禁止新增主从关系。";
                this.emit();
                return;
              }
              const existingParent = this.findParentOf(dialog.viewId, dialog.rowId);
              const existingChildren = this.findChildrenOf(dialog.viewId, dialog.rowId);
              if (dialog.relationType === RELATION_TYPE_PARENT) {
                if (existingParent) {
                  const parentRow = this.getRowById(existingParent.parentViewId, existingParent.parentRowId);
                  dialog.error = "当前设备已关联主设备「" + (parentRow?.name || existingParent.parentRowId) + "」，从设备只能关联一个主设备，请先解绑。";
                  this.emit();
                  return;
                }
                if (existingChildren.length > 0) {
                  dialog.error = "当前设备已作为主设备绑定了 " + existingChildren.length + " 个从设备，仅允许两层关系，不能再被关联为从。";
                  this.emit();
                  return;
                }
              } else {
                if (existingParent) {
                  const parentRow = this.getRowById(existingParent.parentViewId, existingParent.parentRowId);
                  dialog.error = "当前设备已是「" + (parentRow?.name || existingParent.parentRowId) + "」的从设备，仅允许两层关系，不能再关联从设备。";
                  this.emit();
                  return;
                }
              }
            }
            dialog.step = target;
            dialog.error = null;
            this.emit();
          }

          setRelationSource(sourceViewId) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.sourceViewId = sourceViewId;
            dialog.page = 1;
            dialog.selected = [];
            dialog.error = null;
            this.emit();
          }

          setRelationField(field, value) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            const allowed = ["name", "assetCode", "assetCategory", "assetLocation"];
            if (allowed.indexOf(field) === -1) {
              return;
            }
            dialog.keywords = { ...dialog.keywords, [field]: String(value || "") };
            dialog.page = 1;
            dialog.selected = [];
            this.emit();
          }

          resetRelationKeywords() {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.keywords = { name: "", assetCode: "", assetCategory: "", assetLocation: "" };
            dialog.page = 1;
            dialog.selected = [];
            this.emit();
          }

          toggleRelationSearchExpanded() {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.searchExpanded = !dialog.searchExpanded;
            this.emit();
          }

          setRelationPage(page) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.page = Math.max(1, Number(page) || 1);
            this.emit();
          }

          setRelationPageSize(size) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.pageSize = Math.max(1, Number(size) || 10);
            dialog.page = 1;
            this.emit();
          }

          toggleRelationSelection(sourceViewId, rowId) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            if (!Array.isArray(dialog.selected)) {
              dialog.selected = dialog.selected ? [dialog.selected] : [];
            }
            const idx = dialog.selected.findIndex((item) => item.sourceViewId === sourceViewId && item.rowId === rowId);
            if (dialog.relationType === RELATION_TYPE_PARENT) {
              dialog.selected = [{ sourceViewId, rowId }];
            } else if (idx >= 0) {
              dialog.selected.splice(idx, 1);
            } else {
              dialog.selected.push({ sourceViewId, rowId });
            }
            dialog.error = null;
            this.emit();
          }

          isRelationCandidateSelected(sourceViewId, rowId) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog || !Array.isArray(dialog.selected)) {
              return false;
            }
            return dialog.selected.some((item) => item.sourceViewId === sourceViewId && item.rowId === rowId);
          }

          confirmRelation() {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            const selectedList = Array.isArray(dialog.selected) ? dialog.selected : (dialog.selected ? [dialog.selected] : []);
            if (selectedList.length === 0) {
              dialog.error = "请先勾选至少一条设备记录。";
              this.emit();
              return;
            }
            if (dialog.relationType === RELATION_TYPE_PARENT && selectedList.length > 1) {
              dialog.error = "关联主设备只能选择一条记录。";
              this.emit();
              return;
            }
            for (let i = 0; i < selectedList.length; i++) {
              const candidate = selectedList[i];
              const validation = this.validateRelation(dialog, candidate);
              if (!validation.ok) {
                const targetRow = this.getRowById(candidate.sourceViewId, candidate.rowId);
                dialog.error = "「" + (targetRow?.name || candidate.rowId) + "」校验未通过：" + validation.message;
                this.emit();
                return;
              }
            }
            const currentRow = this.getRowById(dialog.viewId, dialog.rowId);
            const today = new Date().toISOString().slice(0, 10);
            const relations = selectedList.map((candidate) => (
              dialog.relationType === RELATION_TYPE_PARENT
                ? {
                    parentViewId: candidate.sourceViewId,
                    parentRowId: candidate.rowId,
                    childViewId: dialog.viewId,
                    childRowId: dialog.rowId,
                    linkedAt: today
                  }
                : {
                    parentViewId: dialog.viewId,
                    parentRowId: dialog.rowId,
                    childViewId: candidate.sourceViewId,
                    childRowId: candidate.rowId,
                    linkedAt: today
                  }
            ));
            this.state.data.relations.push(...relations);
            this.state.ui.relationDialog = null;
            const verb = dialog.relationType === RELATION_TYPE_PARENT ? "主设备" : "从设备";
            const message = selectedList.length === 1
              ? (currentRow?.name || "当前设备") + " 已关联" + verb + "「" + (this.getRowById(selectedList[0].sourceViewId, selectedList[0].rowId)?.name || "目标设备") + "」。"
              : (currentRow?.name || "当前设备") + " 已关联 " + selectedList.length + " 个" + verb + "。";
            this.pushToast("关联成功", message, "success");
          }

          validateRelation(dialog, candidate) {
            const currentRow = this.getRowById(dialog.viewId, dialog.rowId);
            const targetRow = this.getRowById(candidate.sourceViewId, candidate.rowId);
            if (!currentRow || !targetRow) {
              return { ok: false, message: "找不到当前设备或目标设备。" };
            }
            if (dialog.viewId === candidate.sourceViewId && dialog.rowId === candidate.rowId) {
              return { ok: false, message: "不能将设备关联到其自身。" };
            }
            if (this.isRelationStatusBlocked(currentRow.assetStatus)) {
              return { ok: false, message: "当前资产状态为「" + currentRow.assetStatus + "」，禁止新增主从关系。" };
            }
            if (this.isRelationStatusBlocked(targetRow.assetStatus)) {
              return { ok: false, message: "所选设备状态为「" + targetRow.assetStatus + "」，禁止建立关联。" };
            }
            const currentChildren = this.findChildrenOf(dialog.viewId, dialog.rowId);
            const currentParent = this.findParentOf(dialog.viewId, dialog.rowId);
            const targetChildren = this.findChildrenOf(candidate.sourceViewId, candidate.rowId);
            const targetParent = this.findParentOf(candidate.sourceViewId, candidate.rowId);
            if (dialog.relationType === RELATION_TYPE_PARENT) {
              if (currentParent) {
                return { ok: false, message: "当前设备已关联主设备，从设备只能关联一个主设备。" };
              }
              if (currentChildren.length > 0) {
                return { ok: false, message: "当前设备已作为主设备绑定了 " + currentChildren.length + " 个从设备，仅允许两层关系。" };
              }
              if (targetParent) {
                const targetParentRow = this.getRowById(targetParent.parentViewId, targetParent.parentRowId);
                return { ok: false, message: "所选主设备本身已是「" + (targetParentRow?.name || targetParent.parentRowId) + "」的从设备，仅允许两层关系。" };
              }
              if (this.wouldCauseCycle({
                parentViewId: candidate.sourceViewId,
                parentRowId: candidate.rowId,
                childViewId: dialog.viewId,
                childRowId: dialog.rowId
              })) {
                return { ok: false, message: "该关联会形成循环（祖孙互绑），已阻止。" };
              }
            } else {
              if (currentParent) {
                const parentRow = this.getRowById(currentParent.parentViewId, currentParent.parentRowId);
                return { ok: false, message: "当前设备已是「" + (parentRow?.name || currentParent.parentRowId) + "」的从设备，仅允许两层关系，不能再关联从设备。" };
              }
              if (targetParent) {
                const targetParentRow = this.getRowById(targetParent.parentViewId, targetParent.parentRowId);
                return { ok: false, message: "所选设备已关联主设备「" + (targetParentRow?.name || targetParent.parentRowId) + "」，请先解绑后再操作。" };
              }
              if (targetChildren.length > 0) {
                return { ok: false, message: "所选设备已作为主设备绑定了 " + targetChildren.length + " 个从设备，仅允许两层关系。" };
              }
              if (this.wouldCauseCycle({
                parentViewId: dialog.viewId,
                parentRowId: dialog.rowId,
                childViewId: candidate.sourceViewId,
                childRowId: candidate.rowId
              })) {
                return { ok: false, message: "该关联会形成循环（祖孙互绑），已阻止。" };
              }
            }
            return { ok: true };
          }

          isRelationStatusBlocked(status) {
            return RELATION_NON_BINDABLE_STATUS.indexOf(String(status || "")) !== -1;
          }

          findParentOf(viewId, rowId) {
            const relations = this.state.data.relations || [];
            return relations.find((rel) => rel.childViewId === viewId && rel.childRowId === rowId) || null;
          }

          findChildrenOf(viewId, rowId) {
            const relations = this.state.data.relations || [];
            return relations.filter((rel) => rel.parentViewId === viewId && rel.parentRowId === rowId);
          }

          wouldCauseCycle(candidate) {
            const visited = new Set();
            const queue = [{ viewId: candidate.childViewId, rowId: candidate.childRowId }];
            while (queue.length) {
              const node = queue.shift();
              const key = node.viewId + "::" + node.rowId;
              if (visited.has(key)) {
                continue;
              }
              visited.add(key);
              if (node.viewId === candidate.parentViewId && node.rowId === candidate.parentRowId) {
                return true;
              }
              const children = this.findChildrenOf(node.viewId, node.rowId);
              children.forEach((child) => queue.push({ viewId: child.childViewId, rowId: child.childRowId }));
            }
            return false;
          }

          getRelationSourceTabs() {
            return [
              { id: VIEW_IDS.IT_FACILITY, label: "IT设施-台账" },
              { id: VIEW_IDS.STATION_FACILITY, label: "场地设施-台账" },
              { id: VIEW_IDS.CABINET, label: "机柜管理-台账" },
              { id: VIEW_IDS.SPARE_PART, label: "备件-台账" },
              { id: "all", label: "全部" }
            ];
          }

          getRelationCandidateRows() {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return [];
            }
            const tabs = this.getRelationSourceTabs().filter((tab) => tab.id !== "all");
            const sourceTab = tabs.find((tab) => tab.id === dialog.sourceViewId);
            const buildRows = (tab) => {
              const list = this.getListRows(tab.id) || [];
              return list.map((row) => ({
                ...row,
                __sourceViewId: tab.id,
                __sourceLabel: tab.label
              }));
            };
            const rows = dialog.sourceViewId === "all"
              ? tabs.flatMap((tab) => buildRows(tab))
              : (sourceTab ? buildRows(sourceTab) : []);
            const keywords = dialog.keywords || {};
            const matches = (row, field) => {
              const value = String(keywords[field] || "").trim().toLowerCase();
              if (!value) {
                return true;
              }
              return String(row[field] || "").toLowerCase().includes(value);
            };
            return rows.filter((row) =>
              matches(row, "name")
              && matches(row, "assetCode")
              && matches(row, "assetCategory")
              && matches(row, "assetLocation")
            );
          }

          isRowExpanded(viewId, rowId) {
            if (this.isLedgerHierarchyEnabled() && this.findChildrenOf(viewId, rowId).length > 0) {
              return this.state.ui.collapsedRows?.[viewId]?.[rowId] !== true;
            }
            const map = this.state.ui.expandedRows?.[viewId];
            if (map && map[rowId]) return true;
            const auto = this.state.ui.autoExpandRows?.[viewId];
            return !!(auto && auto[rowId]);
          }

          toggleRowExpansion(viewId, rowId) {
            if (this.isLedgerHierarchyEnabled() && this.findChildrenOf(viewId, rowId).length > 0) {
              if (!this.state.ui.collapsedRows) {
                this.state.ui.collapsedRows = {};
              }
              const bucket = this.state.ui.collapsedRows[viewId] || {};
              if (bucket[rowId]) {
                delete bucket[rowId];
              } else {
                bucket[rowId] = true;
              }
              this.state.ui.collapsedRows[viewId] = bucket;
              this.emit();
              return;
            }
            if (!this.state.ui.expandedRows) {
              this.state.ui.expandedRows = {};
            }
            const bucket = this.state.ui.expandedRows[viewId] || {};
            if (bucket[rowId]) {
              delete bucket[rowId];
            } else {
              bucket[rowId] = true;
            }
            this.state.ui.expandedRows[viewId] = bucket;
            this.emit();
          }

          unbindRelation(parentViewId, parentRowId, childViewId, childRowId) {
            const relations = this.state.data.relations || [];
            const before = relations.length;
            this.state.data.relations = relations.filter((rel) => !(
              rel.parentViewId === parentViewId
              && rel.parentRowId === parentRowId
              && rel.childViewId === childViewId
              && rel.childRowId === childRowId
            ));
            const removed = before - this.state.data.relations.length;
            const parentRow = this.getRowById(parentViewId, parentRowId);
            const childRow = this.getRowById(childViewId, childRowId);
            if (removed > 0) {
              this.pushToast(
                "已解绑",
                "「" + (childRow?.name || childRowId) + "」已从主设备「" + (parentRow?.name || parentRowId) + "」解除关联。",
                "success"
              );
            } else {
              this.emit();
            }
          }

          getRelationRowDisableReason(row) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog || !row) {
              return null;
            }
            if (row.__sourceViewId === dialog.viewId && row.id === dialog.rowId) {
              return "当前设备";
            }
            if (this.isRelationStatusBlocked(row.assetStatus)) {
              return row.assetStatus;
            }
            const targetParent = this.findParentOf(row.__sourceViewId, row.id);
            const targetChildren = this.findChildrenOf(row.__sourceViewId, row.id);
            if (targetParent) {
              return "已是从设备";
            }
            if (targetChildren.length > 0) {
              return "已是主设备";
            }
            return null;
          }

          executeDrawerAction() {
            const drawer = this.state.ui.drawer;
            if (!drawer) {
              return;
            }
            const row = this.getRowById(drawer.viewId, drawer.rowId);
            if (!row) {
              return;
            }
            if (drawer.viewId === VIEW_IDS.PENDING_ASSET) {
              row.assetStatus = "已初始化";
              this.pushToast("初始化完成", row.name + " 已完成初始化并可进入正式台账。", "success");
            } else {
              this.pushToast("已记录操作", row.name + " 的演示操作已执行。", "success");
            }
            this.state.ui.drawer = null;
            this.emit();
          }

            if (action === "查看") {
              this.openDetailPage(viewId, rowId);
              return;
            }
            if (action === "初始化") {
              if (this.isPendingInitializationView(viewId)) {
                this.openInitializationOperationPage(viewId, [rowId]);

              this.openOperationPage(viewId, rowId, "初始化");

            const fields = meta.columns.filter((column) => column.key !== "__select" && column.key !== "__actions");
            const relationColumn = { key: "__relation", label: "关系" };
            const exportColumns = fields.length > 0
              ? [fields[0], relationColumn, ...fields.slice(1)]
              : [relationColumn];
            const csvRows = [exportColumns.map((column) => column.label)];
            const formatCell = (value) => {
              if (value === undefined || value === null) {
                return "";
              }
              return String(value);
            };
            let parentCount = 0;
            let childCount = 0;
            let independentCount = 0;
            const buildLine = (row, relationLabel) => exportColumns.map((column) => {
              if (column.key === "__relation") return relationLabel;
              return formatCell(row[column.key]);
            });
            const topRows = rows.filter((row) => !this.findParentOf(viewId, row.id));
            topRows.forEach((row) => {
              const children = this.findChildrenOf(viewId, row.id);
              const isParent = children.length > 0;
              if (isParent) parentCount += 1; else independentCount += 1;
              csvRows.push(buildLine(row, isParent ? "主设备" : "独立设备"));
              children.forEach((rel) => {
                const childRow = this.getRowById(rel.childViewId, rel.childRowId);
                if (!childRow) return;
                childCount += 1;
                csvRows.push(buildLine(childRow, "从设备"));
              });
            });
            const escapeCsv = (value) => {
              const str = formatCell(value);
              if (/[",\n\r]/.test(str)) {
                return '"' + str.replace(/"/g, '""') + '"';
              }
              return str;
            };
            const csvBody = csvRows.map((columns) => columns.map(escapeCsv).join(",")).join("\r\n");
            const csvText = "\uFEFF" + csvBody;
            const now = new Date();
            const stamp = now.getFullYear()
              + pad(now.getMonth() + 1)
              + pad(now.getDate())
              + "_"
              + pad(now.getHours())
              + pad(now.getMinutes())
              + pad(now.getSeconds());
            const fileName = "R5_" + meta.title + "_" + stamp + ".csv";
            const totalRows = parentCount + independentCount + childCount;
            const summary = "主设备 " + parentCount
              + " / 从设备 " + childCount
              + " / 独立设备 " + independentCount
              + " = 共 " + totalRows + " 行";
            this.pushToast("正在生成", "导出 " + summary + "……", "info");
            try {
              const blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 0);
              setTimeout(() => {
                this.pushToast("导出完成", "已下载 " + fileName + "（" + summary + "）", "success");
              }, 600);
            } catch (error) {
              this.pushToast("导出失败", "浏览器拒绝了文件下载请求。", "warning");
            }
          }

          handleTinyTool(label) {
            this.closeRowMoreMenu(false);
            this.pushToast("页面工具", "已打开“" + label + "”演示入口。", "info");
          }

          getOperationPageData() {
            const operationPage = this.state.ui.operationPage;
            if (!operationPage) {
              return null;
            }

            const meta = ROW_MORE_PAGE_META[operationPage.action];
            if (!meta) {
              return null;
            }
            const sourceViewId = operationPage.sourceViewId || operationPage.viewId;
            const row = operationPage.rowId
              ? this.getRowById(sourceViewId, operationPage.rowId)
              : null;
            if (operationPage.rowId && !row) {
              return null;
            }

            const normalize = (value) => (value === undefined || value === null || value === "" ? "-" : String(value));
            const getDefaultPowerOnTime = (sourceRow = {}, rowIndex = 0) => {
              const existingValue = sourceRow.powerOnTime || sourceRow.onlineTime || sourceRow.startupTime;
              if (existingValue) {
                return normalize(existingValue);
              }
              const sequence = Number(String(sourceRow.serialCode || sourceRow.id || rowIndex + 1).replace(/\D/g, "")) || rowIndex + 1;
              const day = 1 + (sequence % 4);
              const hour = 8 + (sequence % 9);
              const minute = (sequence % 4) * 15;
              return "2026-06-" + pad(day) + " " + pad(hour) + ":" + pad(minute) + ":00";
            };
            const toColumnLetter = (index) => {
              let number = index + 1;
              let result = "";
              while (number > 0) {
                const mod = (number - 1) % 26;
                result = String.fromCharCode(65 + mod) + result;
                number = Math.floor((number - 1) / 26);
              }
              return result;
            };
            const isHeaderBatchOperation = operationPage.source === "headerBatch";
            const hiddenColumnKeys = new Set();
            if (operationPage.action === "入库") {
              hiddenColumnKeys.add("assetStatus");
              hiddenColumnKeys.add("assetSummary");
              hiddenColumnKeys.add("assetLocation");
            }
            if (
              isHeaderBatchOperation
              && operationPage.viewId === VIEW_IDS.IT_FACILITY
              && operationPage.action === "上架"
            ) {
              hiddenColumnKeys.add("assetStatus");
              hiddenColumnKeys.add("assetSummary");
              hiddenColumnKeys.add("assetLocation");
            }
            if (operationPage.viewId !== VIEW_IDS.IT_FACILITY) {
              hiddenColumnKeys.add("uHeight");
              hiddenColumnKeys.add("powerOnTime");
            }
            const baseRequiredActions = new Set(["入库", "上架", "部署", "编辑", "迁出", "变动", "下架", "初始化"]);
            const baseRequiredColumnKeys = new Set(["assetCode", "name", "uHeight", "assetCategory"]);
            const baseColumns = OPERATION_SHEET_COLUMNS
              .filter((column) => !hiddenColumnKeys.has(column.key))
              .map((column) => ({
                ...column,
                required: baseRequiredActions.has(operationPage.action) && baseRequiredColumnKeys.has(column.key)
                  ? true
                  : column.required
              }));
            const getExtraColumns = () => {
              if (operationPage.action === "入库") {
                return [
                  { key: "warehouseLocation", label: "库房位置", width: 186, required: true }
                ];
              }
              if (isHeaderBatchOperation && operationPage.viewId === VIEW_IDS.IT_FACILITY) {
                const headerBatchColumnsByAction = {
                  "上架": [
                    { key: "shelfLocation", label: "上架位置", width: 186, required: true },
                    { key: "operationStartU", label: "开始U位", width: 108, required: true }
                  ]
                };
                return headerBatchColumnsByAction[operationPage.action] || [];
              }
              if (operationPage.viewId === VIEW_IDS.IT_FACILITY) {
                const extraColumnsByAction = {
                  "上架": [
                    { key: "shelfLocation", label: "上架位置", width: 186, required: true },
                    { key: "operationStartU", label: "开始U位", width: 108, required: true }
                  ],
                  "变动": [
                    { key: "newLocation", label: "新位置", width: 186, required: true },
                    { key: "operationStartU", label: "开始U位", width: 108, required: true }
                  ],
                  "下架": [
                    { key: "offShelfLocation", label: "下架后位置", width: 186, required: true }
                  ]
                };
                return extraColumnsByAction[operationPage.action] || [];
              }
              if (operationPage.viewId === VIEW_IDS.STATION_FACILITY || operationPage.viewId === VIEW_IDS.CABINET) {
                const extraColumnsByAction = {
                  "部署": [
                    { key: "deployLocation", label: "部署位置", width: 186, required: true }
                  ],
                  "回库": [
                    { key: "returnLocation", label: "回库后位置", width: 186, required: true }
                  ],
                  "变动": [
                    { key: "newLocation", label: "新位置", width: 186, required: true }
                  ]
                };
                return extraColumnsByAction[operationPage.action] || [];
              }
              if (operationPage.viewId === VIEW_IDS.SPARE_PART) {
                const extraColumnsByAction = {
                  "调拨": [
                    { key: "transferWarehouse", label: "调拨仓库", width: 186, required: true }
                  ]
                };
                return extraColumnsByAction[operationPage.action] || [];
              }
              return [];
            };
            const extraColumns = getExtraColumns();
            const sheetColumns = [...baseColumns, ...extraColumns].map((column, index) => ({
              ...column,
              letter: toColumnLetter(index)
            }));
            const baseColumnKeys = baseColumns.map((column) => column.key);
            const allColumnKeys = sheetColumns.map((column) => column.key);
            const getReadonlyColumnKeys = () => {
              const editableDisabledKeys = ["assetStatus", "assetSummary", "assetLocation", "assetCategory"];
              if (isHeaderBatchOperation && operationPage.viewId === VIEW_IDS.IT_FACILITY && ["入库", "上架"].includes(operationPage.action)) {
                return [];
              }
              if (operationPage.viewId === VIEW_IDS.IT_FACILITY) {
                const readonlyColumnKeysByAction = {
                  "上架": baseColumnKeys,
                  "编辑": editableDisabledKeys,
                  "迁出": allColumnKeys,
                  "变动": baseColumnKeys,
                  "下架": baseColumnKeys
                };
                return readonlyColumnKeysByAction[operationPage.action] || [];
              }
              if (operationPage.viewId === VIEW_IDS.STATION_FACILITY || operationPage.viewId === VIEW_IDS.CABINET) {
                const readonlyColumnKeysByAction = {
                  "部署": baseColumnKeys,
                  "编辑": editableDisabledKeys,
                  "报废": allColumnKeys,
                  "回库": baseColumnKeys,
                  "变动": baseColumnKeys
                };
                return readonlyColumnKeysByAction[operationPage.action] || [];
              }
              if (operationPage.viewId === VIEW_IDS.SPARE_PART) {
                const readonlyColumnKeysByAction = {
                  "出库": allColumnKeys,
                  "编辑": ["assetCategory", "assetLocation"],
                  "调拨": baseColumnKeys,
                  "报废": allColumnKeys
                };
                return readonlyColumnKeysByAction[operationPage.action] || [];
              }
              return [];
            };
            const readonlyColumnKeys = getReadonlyColumnKeys();
            const selectedRows = Array.isArray(operationPage.selectedRowIds)
              ? operationPage.selectedRowIds.map((rowId) => this.getRowById(sourceViewId, rowId)).filter(Boolean)
              : [];
            if (operationPage.selectedRowIds?.length && !selectedRows.length) {
              return null;
            }
            const sourceRows = selectedRows.length ? selectedRows : (row ? [row] : []);
            const emptySheetValues = Object.fromEntries(sheetColumns.map((column) => [column.key, ""]));
            const buildSheetValues = (sourceRow, rowIndex = 0) => {
              const description = sourceRow
                ? normalize(sourceRow.description || sourceRow.assetSummary || [sourceRow.assetCategory, sourceRow.assetLocation].filter(Boolean).join(" / "))
                : "";
              return sourceRow
                ? {
                  assetCode: normalize(sourceRow.assetCode),
                  name: normalize(sourceRow.name),
                  assetStatus: normalize(sourceRow.assetStatus),
                  assetSummary: normalize(sourceRow.assetSummary || sourceRow.processStatus || sourceRow.flowStatus || getAssetFlowStatus(operationPage.viewId, rowIndex, sourceRow.assetStatus, sourceRow.assetStatus)),
                  assetCategory: normalize(sourceRow.assetCategory),
                  assetLocation: normalize(sourceRow.assetLocation),
                  uHeight: normalize(sourceRow.uHeight || sourceRow.cabinetHeight || 2),
                  powerOnTime: getDefaultPowerOnTime(sourceRow, rowIndex),
                  portCount: normalize(sourceRow.portCount || 1),
                  serialCode: normalize(sourceRow.serialCode || sourceRow.serialNumber || sourceRow.id),
                  description,
                  warehouseLocation: "",
                  shelfLocation: "",
                  deployLocation: "",
                  newLocation: "",
                  returnLocation: "",
                  offShelfLocation: "",
                  transferWarehouse: "",
                  operationStartU: ""
                }
                : { ...emptySheetValues };
            };
            const sheetRows = sourceRows.length
              ? sourceRows.map((sourceRow, index) => buildSheetValues(sourceRow, index))
              : [{ ...emptySheetValues }];
            const sheetValues = sheetRows[0] || { ...emptySheetValues };
            const editableBlankRows = Boolean(meta.editableBlankRows || (isHeaderBatchOperation && operationPage.viewId === VIEW_IDS.IT_FACILITY && operationPage.action === "上架"));

            return {
              ...meta,
              editableBlankRows,
              viewId: operationPage.viewId,
              sourceViewId,
              rowId: operationPage.rowId,
              action: operationPage.action,
              source: operationPage.source || "",
              row,
              selectedRows,
              filterLabel: "设备列表",
              filterValue: "全部",
              filterOptions: ["全部"],
              sheetColumns,
              sheetValues,
              sheetRows,
              readonlyColumnKeys,
              rowCount: editableBlankRows ? 20 : Math.max(21, sheetRows.length),
              focusColumnKey: operationPage.focusColumnKey || "",
              labelCode: sourceRows[0] ? normalize(sourceRows[0].assetCode) : "",
              labelName: sourceRows[0] ? normalize(sourceRows[0].name) : ""
            };
          }

          submitOperationPage() {
            const page = this.getOperationPageData();
            if (!page) {
              return;
            }
            if (page.mode === "batchCreate") {
              this.pushToast("入库提交", "已提交批量入库作业，原型中保留固定行数，不自动新增行。", "success");
              return;
            }
            if (page.source === "headerBatch") {
              this.pushToast(page.title + "提交", "已提交批量" + page.title + "作业，原型中保留固定行数，不自动新增行。", "success");
              return;
            }
            if (page.source === "pendingInit") {
              this.completePendingInitialization(page);
              return;
            }
            const selectedCount = Array.isArray(page.selectedRows) ? page.selectedRows.length : 0;
            const subject = selectedCount > 0
              ? selectedCount + " 条资产"
              : ((page.row?.name || page.row?.assetCode || page.labelName || "当前资产"));
            this.pushToast(page.title + "提交", subject + " 的“" + page.title + "”流程已提交为原型演示。", "success");
          }

          handleOperationTool(label) {
            const page = this.getOperationPageData();
            const title = page?.title || "页面";
            if (label === "上传本地数据") {
              this.downloadOperationLocalDataTemplate();
              this.openLocalDataUploadDialog();
              return;
            }
            if (label === "选择资产") {
              this.openOperationAssetDialog();
              return;
            }
            if (label === "上传作业模板") {
              this.pushToast("上传作业模板", "已打开“" + title + "”作业模板上传入口，原型中不接入真实文件。", "info");
              return;
            }
            this.pushToast(label, "已触发“" + title + "”页中的“" + label + "”操作。", "info");
          }

              message: "请选择本地 Excel 文件，支持 .xls / .xlsx。"

              powerOnTime: "示例：2026-06-02 09:15:00；格式 YYYY-MM-DD HH:mm:ss",
              portCount: "示例：24；填写正整数",
              serialCode: "示例：001",
              description: "示例：设备安装说明或备注",

          buildOperationTemplateWorkbook(page, templateType = "") {
            const escapeCell = (value) => escapeHtml(value ?? "");
            const columns = page.sheetColumns || [];
            const sampleRow = Object.fromEntries(columns.map((column) => [column.key, ""]));
            columns.forEach((column) => {
              const value = page.sheetValues?.[column.key] || page.sheetRows?.[0]?.[column.key] || "";
              sampleRow[column.key] = value === "-" ? "" : value;
            });
            const fieldCodeMap = {
              assetCode: "asset_num",
              name: "name",
              assetStatus: "asset_status",
              assetSummary: "asset_flow_status",
              assetCategory: "manage_type",
              assetLocation: "location",
              uHeight: "u",
              powerOnTime: "power_on_time",
              portCount: "port_count",
              serialCode: "serial_num",
              description: "description",
              warehouseLocation: "warehouse_location",
              shelfLocation: "location",
              deployLocation: "location",
              newLocation: "new_location",
              returnLocation: "return_location",
              offShelfLocation: "off_shelf_location",
              transferWarehouse: "transfer_warehouse",
              operationStartU: "startU"
            };
            const title = [LIST_PAGE_META[page.viewId]?.title || "台账", page.title || page.action, templateType].filter(Boolean).join("-");
            const colCount = Math.max(1, columns.length);
            const fillTips = [

              "2.位置类字段请填写完整路径，需精确到可上架/部署/入库的具体位置。",
              "3.导入资产模板格式不能随便修改；字段编码行和字段名称行请勿删除或调整顺序。",
              "4.字段填写格式示例：" + columns.map((column) => column.label + "（" + this.getOperationTemplateExample(column, page).replace(/^示例：/, "") + "）").join("；")
            ].join("       ");
            const codeHeader = columns.map((column) => `<th class="code-header">${escapeCell(fieldCodeMap[column.key] || column.key)}</th>`).join("");
            const importHeader = columns.map((column) => `<th class="field-header">${column.required ? `<span class="required">*</span>` : ""}${escapeCell(column.required && column.label === "名称" ? "资产名称" : column.label)}</th>`).join("");

            const exampleRows = (Array.isArray(page.sheetRows) && page.sheetRows.length ? page.sheetRows.slice(0, 3) : [sampleRow]).map((row) => `
              <tr>

              </tr>
            `).join("");
            return `
              <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                  <meta charset="UTF-8" />
                  <!--[if gte mso 9]>
                  <xml>
                    <x:ExcelWorkbook>
                      <x:ExcelWorksheets>
                        <x:ExcelWorksheet>
                          <x:Name>导入模板</x:Name>
                          <x:WorksheetOptions><x:Selected/></x:WorksheetOptions>
                        </x:ExcelWorksheet>
                        <x:ExcelWorksheet>
                          <x:Name>导入示例</x:Name>
                          <x:WorksheetOptions></x:WorksheetOptions>
                        </x:ExcelWorksheet>
                      </x:ExcelWorksheets>
                    </x:ExcelWorkbook>
                  </xml>
                  <![endif]-->
                  <style>
                    table { border-collapse: collapse; font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 12px; }
                    th, td { border: 1px solid #bfbfbf; padding: 8px 10px; mso-number-format:"\\@"; vertical-align: middle; width: 150px; height: 30px; }
                    th { font-weight: 700; text-align: center; white-space: normal; }
                    .required { color: #ff0000; }
                    .tips { border: 1px solid #bfbfbf; height: 64px; white-space: normal; text-align: left; vertical-align: top; color: #1f3349; }
                    .sheet-title { height: 44px; font-weight: 700; font-size: 16px; text-align: center; vertical-align: middle; }
                    .code-header { background: #ffffff; color: #000000; font-size: 12px; }
                    .field-header { background: #c0c0c0; color: #000000; font-size: 12px; font-weight: 400; }
                    .example-note { border: 1px solid #bfbfbf; height: 34px; text-align: left; color: #1f3349; }
                  </style>
                </head>
                <body>
                  <div class="sheet1">

                    <tr><td class="sheet-title" colspan="${colCount}">${escapeCell(title)}</td></tr>
                    <tr>${codeHeader}</tr>
                    <tr>${importHeader}</tr>
                    ${blankRows}
                  </table>
                  </div>
                  <br style="mso-special-character:line-break;page-break-before:always;" />
                  <div class="sheet2">
                  <table>
                    <tr><td class="example-note" colspan="${colCount}">1.${escapeCell(title)}导入示例，位置类字段需填写完整路径，示例如下。</td></tr>

                    <tr>${codeHeader}</tr>
                    <tr>${importHeader}</tr>
                    ${exampleRows}

                    <tr>${importHeader}</tr>
                    ${exampleRows}

                  </div>
                </body>
              </html>
            `;
          }

          downloadOperationLocalDataTemplate(templateType = "") {
            const page = this.getOperationPageData();
            if (!page) {
              this.pushToast("下载失败", "当前页面无法识别在线表字段。", "warning");
              return;
            }
            const workbookText = "\uFEFF" + this.buildOperationTemplateWorkbook(page, templateType);
            const now = new Date();
            const stamp = now.getFullYear()
              + pad(now.getMonth() + 1)
              + pad(now.getDate())
              + "_"
              + pad(now.getHours())
              + pad(now.getMinutes())
              + pad(now.getSeconds());
            const fileName = [LIST_PAGE_META[page.viewId]?.title || "台账", page.title || page.action, "上传本地数据模板", stamp].filter(Boolean).join("_") + ".xls";
            try {
              const blob = new Blob([workbookText], { type: "application/vnd.ms-excel;charset=utf-8;" });
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 0);
              this.pushToast("模板已下载", "已导出与在线表字段一致的 Excel 模板，并包含字段说明。", "success");
            } catch (error) {

          findTemplateObjectNode(nodeId, nodes = TEMPLATE_OBJECT_TREE) {
            for (const node of nodes) {
              if (node.id === nodeId) {
                return node;
              }
              const match = this.findTemplateObjectNode(nodeId, node.children || []);
              if (match) {
                return match;
              }
            }
            return null;
          }

          getTemplateObjectLeafIds(nodes = TEMPLATE_OBJECT_TREE) {
            const ids = [];
            const walk = (items) => {
              items.forEach((node) => {
                if (node.children?.length) {
                  walk(node.children);
                } else {
                  ids.push(node.id);
                }
              });
            };
            walk(nodes);
            return ids;
          }

            const plan = this.getMasterSlaveTemplateDownloadPlan(dialog.scope, dialog.ledgers, this.getMasterSlaveTemplateDialogRules(dialog));
            if (!plan.ok) {
              this.pushToast(plan.title, plan.message, plan.tone || "warning");
              return;
            }
            dialog.downloadProgress = {
              status: "running",
              percent: 8,
              message: "正在准备模板数据..."
            };
            this.emit();
            this.runMasterSlaveTemplateDownloadProgress(plan, 0);

          clearMasterSlaveTemplateDownloadTimer() {
            if (this.masterSlaveTemplateDownloadTimer) {
              clearTimeout(this.masterSlaveTemplateDownloadTimer);
              this.masterSlaveTemplateDownloadTimer = null;
            }

          cancelMasterSlaveTemplateDownload() {
            const dialog = this.state.ui.masterSlaveTemplateDialog;
            if (!dialog || !dialog.downloadProgress) {
