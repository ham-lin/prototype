<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R5资产管理原型</title>
    <style>
      :root {
        --primary: #1677ff;
        --primary-deep: #0958d9;
        --primary-soft: #e8f3ff;
        --topbar: #1185ff;
        --bg: #f4f7fb;
        --surface: #ffffff;
        --surface-muted: #fafcff;
        --border: #e6edf5;
        --border-strong: #d4deea;
        --text: #1f2d3d;
        --text-secondary: #5f7086;
        --text-tertiary: #90a0b5;
        --success: #2e9c57;
        --warning: #d58c13;
        --danger: #ef5b56;
        --shadow: 0 6px 18px rgba(15, 37, 65, 0.08);
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --topbar-h: 50px;
        --sidebar-w: 232px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        background: none;
        cursor: pointer;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: #fff;
        color: var(--text);
        padding: 6px 10px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      select:disabled,
      input:disabled,
      textarea:disabled {
        background: #f4f6f9;
        color: #9aa7b8;
        border-color: #e1e7ef;
        cursor: not-allowed;
      }

      input[type="checkbox"],
      input[type="radio"] {
        width: 14px;
        height: 14px;
        padding: 0;
        margin: 0;
        flex: 0 0 14px;
        accent-color: var(--primary);
        box-shadow: none;
      }

      input[type="checkbox"]:focus,
      input[type="radio"]:focus {
        box-shadow: none;
      }

      input[type="radio"] {
        border-radius: 50%;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15);
      }

      body ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      body ::-webkit-scrollbar-thumb {
        background: rgba(117, 139, 167, 0.32);
        border-radius: 999px;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-width: 1280px;
      }

      .app-topbar {
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 12px 0 14px;
        background: linear-gradient(90deg, #0e85ff 0%, #0e83fc 34%, #0d7ef4 100%);
        color: #fff;
        box-shadow: 0 1px 4px rgba(17, 71, 135, 0.14);
        flex-shrink: 0;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
      }

      .brand-text {
        font-size: 16px;
        white-space: nowrap;
      }

      .app-grid-btn {
        width: 24px;
        height: 24px;
        color: rgba(255, 255, 255, 0.92);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
      }

      .topbar-nav {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
      }

      .topbar-nav button {
        height: 30px;
        padding: 0 12px;
        border-radius: 5px;
        color: rgba(255, 255, 255, 0.78);
        white-space: nowrap;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .topbar-nav button.is-active {
        color: #fff;
        background: rgba(255, 255, 255, 0.16);
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .topbar-guide-wrap {
        position: relative;
        z-index: 24;
      }

      .topbar-guide-btn {
        height: 30px;
        padding: 0 14px;
        border-radius: 15px;
        border: 1px solid rgba(255, 255, 255, 0.9);
        background: #fff;
        color: var(--primary-deep);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: 0 4px 12px rgba(9, 88, 217, 0.24);
        transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
      }

      .topbar-guide-btn:hover,
      .topbar-guide-btn.is-open {
        background: #f3f8ff;
        border-color: #fff;
        box-shadow: 0 6px 16px rgba(9, 88, 217, 0.32);
        transform: translateY(-1px);
      }

      .topbar-guide-btn svg {
        flex-shrink: 0;
        transition: transform 0.15s ease;
      }

      .topbar-guide-btn.is-open svg {
        transform: rotate(180deg);
      }

      .topbar-guide-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        min-width: 128px;
        padding: 4px;
        border-radius: 8px;
        border: 1px solid #dbe6f2;
        background: #fff;
        box-shadow: 0 10px 24px rgba(32, 58, 85, 0.16);
      }

      .topbar-guide-item {
        display: block;
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        text-align: left;
        color: #3d5874;
        white-space: nowrap;
      }

      .topbar-guide-item:hover {
        background: #f5f9ff;
        color: var(--primary-deep);
      }

      .topbar-guide-item.is-active {
        background: var(--primary-soft);
        color: var(--primary-deep);
        font-weight: 600;
      }

      .topbar-guide-cascade {
        position: relative;
      }

      .topbar-guide-cascade-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .topbar-guide-cascade-trigger::after {
        content: "›";
        color: #90a0b5;
        font-size: 14px;
      }

      .topbar-guide-submenu {
        display: none;
        position: absolute;
        top: -4px;
        right: calc(100% + 6px);
        min-width: 118px;
        padding: 4px;
        border-radius: 8px;
        border: 1px solid #dbe6f2;
        background: #fff;
        box-shadow: 0 10px 24px rgba(32, 58, 85, 0.16);
      }

      .topbar-guide-cascade:hover .topbar-guide-submenu,
      .topbar-guide-cascade:focus-within .topbar-guide-submenu {
        display: block;
      }

      .topbar-icon {
        position: relative;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.9);
      }

      .topbar-badge {
        position: absolute;
        top: -3px;
        right: -7px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 999px;
        background: #ff5a5a;
        color: #fff;
        font-size: 12px;
        line-height: 18px;
        text-align: center;
      }

      .topbar-user {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 8px;
        border-left: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
      }

      .topbar-avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
      }

      .app-main {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      .app-sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: #fff;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .sidebar-header {
        padding: 12px 12px 8px;
        font-size: 16px;
        font-weight: 700;
      }

      .sidebar-scroll {
        flex: 1;
        overflow: auto;
        padding: 0 4px 12px;
      }

      .sidebar-group {
        margin-bottom: 4px;
      }

      .sidebar-trigger,
      .sidebar-child,
      .sidebar-static {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 6px;
        color: var(--text-secondary);
        text-align: left;
        min-height: 34px;
        overflow: hidden;
        font-size: 15px;
      }

      .sidebar-trigger:hover,
      .sidebar-child:hover,
      .sidebar-static:hover {
        background: #f4f8fd;
      }

      .sidebar-trigger .arrow {
        margin-left: auto;
        width: 0;
        height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 5px solid #9aacc3;
        transition: transform 0.15s ease;
      }

      .sidebar-trigger.is-open .arrow {
        transform: rotate(90deg);
      }

      .sidebar-icon {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: #ecf4ff;
        border: 1px solid #d7e7ff;
        color: var(--primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .sidebar-icon svg {
        width: 12px;
        height: 12px;
        display: block;
      }

      .sidebar-trigger.is-active-group {
        color: var(--primary);
        background: #f5f9ff;
      }

      .sidebar-static.is-active {
        color: var(--primary);
        background: #f5f9ff;
        font-weight: 600;
      }

      .sidebar-trigger.is-active-group .sidebar-icon,
      .sidebar-static.is-active .sidebar-icon {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .sidebar-children {
        padding: 2px 0 2px 20px;
      }

      .sidebar-child {
        position: relative;
        padding-left: 14px;
        font-size: 15px;
      }

      .sidebar-trigger > span:not(.sidebar-icon):not(.arrow),
      .sidebar-static > span:not(.sidebar-icon),
      .sidebar-child {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar-child::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 50%;
        width: 4px;
        height: 4px;
        margin-top: -2px;
        border-radius: 50%;
        background: #b8c7d8;
      }

      .sidebar-child.is-active {
        background: #eaf4ff;
        color: var(--primary);
        font-weight: 600;
      }

      .sidebar-child.is-active::before {
        background: var(--primary);
      }

      .sidebar-footer {
        padding: 10px 12px 12px;
        border-top: 1px solid var(--border);
        color: var(--text-tertiary);
      }

      .collapse-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-secondary);
      }

      .workspace {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 10px 12px;
      }

      .page-surface {
        min-height: calc(100vh - var(--topbar-h) - 20px);
        background: #fff;
        border: 1px solid #eef3f9;
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .page-toolbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 22px;
        padding: 12px 14px 10px;
      }

      .operation-page {
        display: flex;
        flex-direction: column;
        height: calc(100vh - var(--topbar-h) - 20px);
        min-height: 620px;
      }

      .operation-page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px 8px;
      }

      .operation-page-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #31485f;
        font-size: 14px;
        font-weight: 700;
      }

      .operation-page-back svg {
        color: #4c647c;
        flex-shrink: 0;
      }

      .operation-submit-btn {
        min-width: 72px;
      }

      .operation-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        flex: 1;
        padding: 0 12px 12px;
      }

      .operation-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 2px;
      }

      .operation-filter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #4d6279;
        font-size: 12px;
      }

      .operation-filter select {
        width: 88px;
        height: 28px;
        border-radius: 4px;
      }

      .operation-toolbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .operation-toolbar-actions .btn {
        height: 28px;
        padding: 0 12px;
        border-radius: 14px;
        font-size: 12px;
      }

      .operation-sheet-shell {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 620px;
        border: 1px solid #eaf0f7;
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
      }

      .operation-sheet-wrap {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: #fff;
      }

      .operation-vtable-container {
        width: 100%;
        height: 100%;
        min-height: 620px;
      }

      .operation-vtable-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 620px;
        padding: 24px;
        color: var(--text-secondary);
        background: #fbfdff;
        text-align: center;
      }

      .vtable-search-select-menu {
        position: absolute;
        z-index: 9999;
        max-height: 176px;
        overflow: auto;
        border: 1px solid #d8e3f0;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 8px 22px rgba(30, 55, 85, 0.16);
      }

      .vtable-search-select-option {
        padding: 7px 10px;
        color: #31485f;
        font-size: 12px;
        line-height: 1.4;
        cursor: pointer;
      }

      .vtable-search-select-option:hover,
      .vtable-search-select-option.is-active {
        background: #e8f3ff;
        color: var(--primary-deep);
      }

      .vtable-search-select-empty {
        padding: 10px;
        color: var(--text-tertiary);
        font-size: 12px;
      }

      .operation-fill-menu {
        position: fixed;
        z-index: 10000;
        width: 148px;
        padding: 6px 0;
        border: 1px solid #d8e3f0;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 10px 24px rgba(30, 55, 85, 0.18);
      }

      .operation-fill-menu button {
        display: grid;
        grid-template-columns: 18px 1fr;
        align-items: center;
        width: 100%;
        height: 28px;
        padding: 0 10px;
        border: 0;
        background: transparent;
        color: #31485f;
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }

      .operation-fill-menu button:hover {
        background: #e8f3ff;
        color: var(--primary-deep);
      }

      .operation-fill-menu .fill-menu-check {
        color: #1d2129;
        font-weight: 700;
      }

      .operation-sheet-table {
        width: max-content;
        min-width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }

      .operation-sheet-table col.row-index {
        width: 36px;
      }

      .operation-sheet-table thead th {
        position: static;
        height: 20px;
        padding: 0;
        border-right: 1px solid #edf2f8;
        border-bottom: 1px solid #edf2f8;
        background: #f7fbff;
        color: #667f99;
        font-size: 11px;
        font-weight: 500;
        text-align: center;
      }

      .operation-sheet-table thead th.sheet-corner {
        background: #fff;
      }

      .operation-sheet-table tbody th,
      .operation-sheet-table tbody td {
        border-right: 1px solid #edf2f8;
        border-bottom: 1px solid #edf2f8;
      }

      .operation-sheet-table tbody th {
        width: 36px;
        min-width: 36px;
        padding: 0;
        text-align: center;
        color: #7389a0;
        font-size: 11px;
        font-weight: 500;
        background: #fff;
      }

      .operation-sheet-table td {
        height: 24px;
        padding: 0 6px;
        color: #31485f;
        font-size: 12px;
        white-space: nowrap;
      }

      .operation-sheet-table .field-row th {
        background: #fff;
      }

      .operation-sheet-table .field-row td {
        height: 22px;
        background: #fbfdff;
        color: #5f748a;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
      }

      .operation-sheet-table td.is-selected {
        background: #d9ecff;
        box-shadow: inset 0 0 0 1px #6aa9f6;
      }

      .operation-sheet-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        padding: 8px 10px;
        border-top: 1px solid #eef3f8;
        background: #fff;
      }

      .operation-zoom {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #6b8198;
        font-size: 12px;
      }

      .operation-zoom button {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid #d8e1ec;
        color: #677e95;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 1;
      }

      .operation-zoom-bar {
        position: relative;
        width: 48px;
        height: 4px;
        border-radius: 999px;
        background: #d8e2ee;
      }

      .operation-zoom-bar::after {
        content: "";
        position: absolute;
        right: 11px;
        top: -2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #79a9e3;
      }

      .operation-print-page {
        padding: 12px 16px 16px;
      }

      .operation-print-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .operation-print-close {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        color: #8ba0b5;
        font-size: 18px;
        line-height: 1;
      }

      .operation-print-stage {
        min-height: 600px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 42px;
      }

      .operation-print-label {
        width: 102px;
        min-height: 60px;
        padding: 8px 9px;
        border: 1px solid #e6edf5;
        background: #fff;
        box-shadow: 0 4px 10px rgba(40, 65, 92, 0.06);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .operation-print-qr {
        width: 24px;
        height: 24px;
        background:
          linear-gradient(90deg, #111 50%, transparent 50%) 0 0 / 6px 6px,
          linear-gradient(#111 50%, transparent 50%) 0 0 / 6px 6px,
          linear-gradient(90deg, transparent 50%, #111 50%) 3px 3px / 6px 6px,
          linear-gradient(transparent 50%, #111 50%) 3px 3px / 6px 6px,
          #fff;
        border: 1px solid #d9e3ef;
      }

      .operation-print-brand {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }

      .operation-print-brand strong {
        color: #2c517d;
        font-size: 10px;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }

      .operation-print-brand span {
        color: #6a7f95;
        font-size: 9px;
        white-space: nowrap;
      }

      .guide-page {
        display: flex;
        flex-direction: column;
      }

      .guide-page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px 10px;
        border-bottom: 1px solid #eef3f8;
      }

      .guide-page-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #4b647d;
        font-size: 13px;
        font-weight: 700;
      }

      .guide-page-title {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 700;
        color: #30465d;
      }

      .guide-page-subtitle {
        margin-top: 6px;
        color: #6a8198;
        font-size: 13px;
      }

      .guide-page-body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 18px;
      }

      .guide-page-note {
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #e3eef9;
        background: #f7fbff;
        color: #5e748b;
        font-size: 13px;
        line-height: 1.7;
      }

      .guide-card-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .guide-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 174px;
        padding: 16px;
        border-radius: 10px;

        color: #1f2d3d;

      }

      .requirement-spec-doc code {

        border: 1px solid #e5edf7;
        border-radius: 10px;
        background: #f8fbff;

        font-weight: 700;

      .mode-chip {

        padding: 0 12px;

        align-items: center;
        justify-content: space-between;
        gap: 8px;

        padding: 4px 0;
        border: 1px solid #d8e3f0;
        border-radius: 4px;
        background: #fff;
        box-shadow: 0 8px 22px rgba(30, 55, 85, 0.14);

      .mode-chip-option {

        margin: 0;

        margin: 2px 0;

        gap: 4px;

        padding: 0 6px;
        border-radius: 4px;

        background: #f4f8fc;

      .ledger-space-tree-row.is-active {

        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

        gap: 4px;
        font: inherit;
        text-align: left;
        cursor: pointer;

        transform: rotate(90deg);

      .ledger-space-tree-icon {
        flex: 0 0 auto;
        color: #3f8bd8;
        font-size: 11px;

        text-overflow: ellipsis;

      .ledger-space-tree-node.is-match .ledger-space-tree-label {
        color: var(--primary-deep);

      }

      .ledger-space-tree-empty {

      .cabinet-space-stat {

        gap: 14px;
        align-items: start;

        flex-direction: column;
        gap: 10px;
        box-shadow: 0 4px 14px rgba(31, 57, 91, 0.04);

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;

        font-size: 13px;

        color: #18365f;

        font-weight: 700;

        border-radius: 6px;

        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 3px;

        color: #53667f;
        font-size: 12px;

        background: #e8eef7;

        border-radius: inherit;
        background: #2d8cff;

      .cabinet-card-meta {

        text-overflow: ellipsis;

        display: inline-flex;
        align-items: center;

        border-radius: 6px;

        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;

        border-color: #d5e4f7;
        background: #f8fbff;

        top: calc(100% + 6px);
        right: 0;
        width: 268px;
        padding: 12px 12px 14px;
        border: 1px solid #e4ebf3;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 8px 18px rgba(34, 61, 92, 0.10);

        font-weight: 600;
        color: #3f5067;

        background: rgba(236, 246, 255, 0.96);
        color: var(--primary);
        font-size: 11px;
        font-weight: 600;
        line-height: 18px;
        white-space: nowrap;
        transform: translate(-50%, -50%);
      }

      .cabinet-mounted-device {
        position: absolute;
        left: 2px;
        right: 2px;
        min-height: 15px;
        border: 1px solid #05070a;
        border-radius: 1px;
        background:
          linear-gradient(180deg, #34393d 0%, #23282c 48%, #15191d 50%, #292e32 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55),
          0 1px 2px rgba(0, 0, 0, 0.35);
        cursor: pointer;
        outline: none;
        pointer-events: auto;
      }

      .cabinet-mounted-device::before,
      .cabinet-mounted-device::after {
        content: "";
        position: absolute;
        top: 4px;
        bottom: 4px;
        width: 3px;
        border-radius: 1px;
        background: #070a0d;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }

      .cabinet-mounted-device::before {
        left: 4px;
      }

      .cabinet-mounted-device::after {
        right: 4px;
      }

      .cabinet-mounted-device:focus,
      .cabinet-mounted-device:hover {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.12),
          inset 0 -1px 0 rgba(0, 0, 0, 0.6),
          0 0 0 2px rgba(41, 132, 255, 0.42);
      }

      .cabinet-mounted-face {
        position: absolute;
        inset: 3px 11px;
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .cabinet-mounted-leds {
        display: grid;
        grid-template-columns: repeat(2, 4px);
        gap: 3px;
        flex-shrink: 0;
      }

      .cabinet-mounted-leds i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #21d56a;
        box-shadow: 0 0 4px rgba(33, 213, 106, 0.75);
      }

      .cabinet-mounted-leds i:nth-child(2n) {
        background: #f2ce4d;
        box-shadow: 0 0 4px rgba(242, 206, 77, 0.62);
      }

      .cabinet-mounted-bays {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 2px;
        flex: 1;
        min-width: 0;
        height: 70%;
      }

      .cabinet-mounted-bays span {
        border: 1px solid rgba(126, 136, 143, 0.65);
        border-radius: 1px;
        background:
          linear-gradient(180deg, #1f2428 0%, #111519 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      }

      .cabinet-mounted-ports {
        display: grid;
        grid-template-columns: repeat(3, 5px);
        gap: 2px;
        flex-shrink: 0;
      }

      .cabinet-mounted-ports i {
        width: 5px;
        height: 4px;
        border: 1px solid #586169;
        background: #06090c;
      }

      .cabinet-mounted-tooltip {
        position: absolute;
        left: calc(100% + 18px);
        top: 50%;
        z-index: 8;
        width: 224px;
        padding: 8px 12px;
        border-radius: 2px;
        background: rgba(49, 56, 64, 0.96);
        color: #fff;
        font-size: 12px;
        line-height: 1.7;
        text-align: left;
        transform: translateY(-50%);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        box-shadow: 0 8px 18px rgba(17, 24, 33, 0.16);
        transition: opacity 0.15s ease, visibility 0.15s ease;
      }

      .cabinet-mounted-tooltip::before {
        content: "";
        position: absolute;
        left: -5px;
        top: 50%;
        width: 8px;
        height: 8px;
        background: rgba(49, 56, 64, 0.96);
        transform: translateY(-50%) rotate(45deg);
      }

      .cabinet-mounted-device:hover .cabinet-mounted-tooltip,
      .cabinet-mounted-device:focus .cabinet-mounted-tooltip {
        opacity: 1;
        visibility: visible;
      }

      .cabinet-mounted-tooltip span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .cabinet-mounted-device:hover .cabinet-mounted-face,
      .cabinet-mounted-device:focus .cabinet-mounted-face {
        opacity: 0.2;
      }

      .cabinet-device-actions {
        position: absolute;
        inset: 0;
        z-index: 7;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: rgba(12, 16, 20, 0.68);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.15s ease, visibility 0.15s ease;
      }

      .cabinet-mounted-device:hover .cabinet-device-actions,
      .cabinet-mounted-device:focus-within .cabinet-device-actions,
      .cabinet-mounted-device:focus .cabinet-device-actions {
        opacity: 1;
        visibility: visible;
      }

      .cabinet-device-action-btn {
        height: 24px;
        padding: 0 9px;
        border: 1px solid rgba(255, 255, 255, 0.36);
        border-radius: 2px;

        font-size: 12px;
        font-weight: 600;

      .cabinet-device-action-btn.is-danger:hover {

        color: #fff1f1;

      .cabinet-contains-rack .rack-index {

      /* Arco Design inspired component polish for the HTML prototype. */
      :root {
        --primary: #165dff;
        --primary-deep: #0e42d2;
        --primary-soft: #e8f3ff;
        --topbar: #165dff;
        --bg: #f2f3f5;
        --surface-muted: #f7f8fa;
        --border: #e5e6eb;
        --border-strong: #c9cdd4;
        --text: #1d2129;
        --text-secondary: #4e5969;
        --text-tertiary: #86909c;
        --success: #00b42a;
        --warning: #ff7d00;
        --danger: #f53f3f;
        --shadow: 0 4px 10px rgba(29, 33, 41, 0.08);
        --radius-sm: 2px;
        --radius-md: 4px;
        --radius-lg: 6px;
      }

        color: var(--text);
        background: var(--bg);
        font-size: 14px;
      }

      select,
      textarea {

        border-color: var(--border);
        border-radius: 2px;
        color: var(--text);
        background: #fff;
      }

      input:hover,
      select:hover,
      textarea:hover {
        border-color: var(--primary);
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.12);
      }

      input:disabled,
      select:disabled,
      textarea:disabled {
        color: var(--text-tertiary);
        background: #f2f3f5;
        border-color: var(--border);
      }

      .app-topbar {
        background: #165dff;
        box-shadow: 0 2px 8px rgba(22, 93, 255, 0.18);
      }

      .topbar-nav {
        gap: 4px;
      }

      .topbar-nav button {
        height: 34px;
        padding: 0 14px;
        border-radius: 4px 4px 0 0;
        color: rgba(255, 255, 255, 0.78);
      }

      .topbar-nav button:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
      }

      .topbar-nav button.is-active {
        color: var(--primary);
        background: #fff;
        font-weight: 600;
      }

      .app-sidebar {
        border-right-color: var(--border);
        background: #fff;
      }

      .sidebar-trigger,
      .sidebar-child,
      .sidebar-static {
        min-height: 36px;
        border-radius: 4px;
        color: var(--text-secondary);
        font-size: 14px;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .sidebar-trigger:hover,
      .sidebar-child:hover,
      .sidebar-static:hover {
        background: #f7f8fa;
        color: var(--primary);
      }

      .sidebar-trigger.is-active-group,
      .sidebar-static.is-active,
      .sidebar-child.is-active {
        background: #e8f3ff;
        color: var(--primary);
        font-weight: 600;
      }

      .sidebar-icon {
        width: 16px;
        height: 16px;
        border: 0;
        background: transparent;
        color: #86909c;
      }

      .sidebar-trigger.is-active-group .sidebar-icon,
      .sidebar-static.is-active .sidebar-icon {
        background: transparent;
        color: var(--primary);
      }

      .page-surface {

        border-radius: 4px;
        box-shadow: var(--shadow);
      }

      .list-page-surface {

        display: flex;
        flex-direction: column;
      }

      .list-page-surface .page-toolbar,
      .list-page-surface .pagination {
        flex-shrink: 0;
      }

      .config-toolbar,
      .page-toolbar,
      .integration-list-head {
        border-bottom-color: var(--border);
        background: #fff;
      }

      .btn {
        height: 32px;
        padding: 0 15px;
        border-radius: 2px;
        border-color: var(--border);
        color: var(--text);
        background: #fff;
        font-weight: 400;
      }

      .btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: #fff;
      }

      .btn:disabled {
        color: var(--text-tertiary);
        background: #f2f3f5;
        border-color: var(--border);
        cursor: not-allowed;
      }

      .btn-primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .btn-primary:hover {
        border-color: #4080ff;
        background: #4080ff;
        color: #fff;
      }

      .btn-danger-text {
        border-color: transparent;
        color: #d93026;
        background: transparent;
      }

      .btn-danger-text:hover {
        border-color: transparent;
        color: #b42318;
        background: #fff1f0;
      }

      .btn-danger {
        border-color: #f53f3f;
        background: #f53f3f;
        color: #fff;
      }

      .btn-danger:hover {
        border-color: #cb2634;
        background: #cb2634;
        color: #fff;
      }

      .btn-light {
        border-color: transparent;
        color: var(--primary);
        background: #e8f3ff;
      }

      thead th,
      .integration-data-table th,
      .integration-config-table th {
        background: #f7f8fa;
        color: var(--text);
        font-weight: 600;
        border-bottom-color: var(--border);
      }

      tbody td,
      .integration-data-table td,
      .integration-config-table td {
        color: var(--text);
        border-bottom-color: var(--border);
      }

      tbody tr:hover,

        background: #f7f8fa;
      }

      .action-link,
      .integration-action-link {
        color: var(--primary);
        font-weight: 500;
      }

      .action-link:hover,
      .integration-action-link:hover {
        color: var(--primary-deep);
      }

      .pagination,
      .integration-list-footer {
        border-top-color: var(--border);
        color: var(--text-secondary);
        background: #fff;
      }

      .page-size,
      .pager-btn,
      .pager-ellipsis,
      .integration-pager select,
      .integration-pager input {
        min-height: 28px;
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--text-secondary);

      .pager-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .pager-btn.is-active,
      .integration-pager strong {
        min-width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;

        color: var(--primary);
        background: #fff;

      .integration-list-filters input,
      .integration-list-filters select,

        height: 32px;

      .integration-status-card {
        border-color: var(--border);
        border-radius: 2px;
        box-shadow: none;
      }

      button.integration-status-card {

      }

      .integration-tabs {

      .integration-tabs button.is-active {
        color: var(--primary);

        border-bottom-color: var(--primary);
      }

      .toast,
      .action-more-menu,
      .topbar-guide-menu,
      .relation-modal,
      .drawer {
        border-radius: 4px;
        box-shadow: 0 6px 18px rgba(29, 33, 41, 0.12);
      }

      /* Arco Menu/Layout refinement: closer to Layout.Sider + Menu vertical mode. */
      :root {
        --sidebar-w: 232px;
      }

      .app-sidebar {
        background: #fff;
        border-right: 1px solid var(--border);
      }

      .sidebar-header {
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
      }

      .sidebar-scroll {
        padding: 4px 8px 12px;
      }

      .sidebar-group {
        margin-bottom: 2px;
      }

      .sidebar-trigger,
      .sidebar-static {
        position: relative;
        min-height: 40px;
        padding: 0 12px;
        border-radius: 4px;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 40px;
      }

      .sidebar-child {
        position: relative;
        min-height: 40px;
        padding: 0 12px 0 38px;
        border-radius: 4px;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 40px;
      }

      .sidebar-trigger:hover,
      .sidebar-static:hover,
      .sidebar-child:hover {
        background: #f7f8fa;
        color: var(--primary);
      }

      .sidebar-trigger.is-active-group {
        color: var(--primary);
        background: transparent;
        font-weight: 500;
      }

      .sidebar-static.is-active,
      .sidebar-child.is-active {
        color: var(--primary);
        background: #e8f3ff;
        font-weight: 600;
      }

      .sidebar-static.is-active::before,
      .sidebar-child.is-active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 7px;
        width: 3px;
        height: 26px;
        border-radius: 0 2px 2px 0;
        background: var(--primary);
      }

      .sidebar-child::before {
        content: "";
        position: absolute;
        left: 22px;
        top: 18px;
        width: 4px;
        height: 4px;
        margin: 0;
        border-radius: 50%;
        background: #c9cdd4;
      }

      .sidebar-child.is-active::before {
        left: 0;
        top: 7px;
        width: 3px;
        height: 26px;
        border-radius: 0 2px 2px 0;
        background: var(--primary);
      }

      .sidebar-version-tag {
        margin-left: auto;
        height: 16px;
        padding: 0 5px;
        border-radius: 999px;
        background: #eef5ff;
        color: #3f6fae;
        font-size: 10px;
        line-height: 16px;
        font-weight: 600;
        flex-shrink: 0;
      }

      .sidebar-static > span:not(.sidebar-icon):not(.sidebar-version-tag),
      .sidebar-child > span:not(.sidebar-version-tag) {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-static > .sidebar-version-tag,
      .sidebar-child > .sidebar-version-tag {
        min-width: auto;
        overflow: visible;
        text-overflow: clip;
      }

      .sidebar-children {
        padding: 2px 0 4px;
      }

      .sidebar-icon {
        width: 16px;
        height: 16px;
        color: var(--text-tertiary);
        margin-right: 4px;
      }

      .sidebar-trigger.is-active-group .sidebar-icon,
      .sidebar-static.is-active .sidebar-icon,
      .sidebar-trigger:hover .sidebar-icon,
      .sidebar-static:hover .sidebar-icon {
        color: var(--primary);
      }

      .sidebar-trigger .arrow {
        border-left-color: #c9cdd4;
      }

      .sidebar-trigger.is-open .arrow {
        transform: rotate(90deg);
        border-left-color: var(--text-tertiary);
      }

      .sidebar-trigger.is-active-group .arrow {
        border-left-color: var(--primary);

      .collapse-link {
        min-height: 32px;
        padding: 0 4px;
        color: var(--text-tertiary);
      }

      .collapse-link:hover {
        color: var(--primary);
      }

      /* Arco component details: Form / Table / Pagination density and states. */
      .config-toolbar {
        min-height: 56px;
        padding: 0 16px;
      }

      .page-card-title,
      .integration-list-title {

    <div class="app-shell">

# R5资产管理-主从设备 需求规格

## 1. 文档说明

| 项目 | 内容 |
|---|---|
| 文档名称 | R5资产管理-主从设备 需求规格 |
| 当前版本 | V1.2 |
| 文档日期 | 2026-06-02 |
| 适用范围 | R5资产管理原型、资产台账、资产基础配置、主从设备配置、模板导入导出、导入结果、主从关系展示、关系拓扑、资产表单设计、资产详情设计、资产树搜索 |

本文档用于定义资产管理模块中“主从设备”能力的产品需求，覆盖主从关系展示、维护、模板导入、导入结果、模板下载、从设备自动填充规则配置及资产详情关系拓扑。

## 2. 需求背景与目标

数据中心资产台账中，设备之间常存在明确的配套、依附或从属关系。例如：

- 配电柜与电量仪。
- 插接箱与开关量。
- 机柜与 PDU。
- IT 设备与其配套采集设备或接入设备。

如果系统仅按单体资产维护台账，会存在以下问题：

- 无法结构化表达设备之间的主从关系。
- 无法在台账中快速查看主设备下关联了哪些从设备。
- 批量维护主从关系时，需要人工重复填写大量编号。
- 主从关系维护缺少标准模板和校验规则。
- 编号存在规律时，系统无法辅助自动预填从设备编号。

本需求目标如下：

- 支持在资产台账中展示主设备与从设备关系。
- 支持主从关系开启、关闭和展示模式配置。
- 支持通过表格导入更新主从关系。
- 支持下载主从关系维护模板。
- 支持按编号规则自动预填从设备编号，降低人工填写成本。
- 支持主从关系的手工维护、查看和解绑。
- 支持查看导入结果、异常明细及导出异常数据。
- 支持在资产详情中通过关系拓扑表达主设备指向从设备的关系。

## 3. 术语定义

| 术语 | 定义 |
|---|---|
| 主设备 | 主从关系中的上级或主体设备，例如配电柜、插接箱、机柜 |
| 从设备 | 依附、配套或从属于主设备的设备，例如电量仪、开关量、PDU |
| 主从关系 | 一个主设备与一个或多个从设备之间的绑定关系 |
| 自动填充规则 | 根据主设备编号生成或匹配从设备编号的规则 |
| 导入模板 | 用于批量维护主从关系的 Excel 模板 |
| 导入结果 | 展示导入成功数量、失败数量、失败数据位置、异常原因及异常数据导出入口 |
| 关系拓扑 | 在资产详情中以节点和方向箭头展示当前资产与主设备或从设备之间的关系 |
| 全量设备展示 | 主设备、从设备、独立设备均在台账中展示 |
| 仅展示主设备 | 台账默认仅展示主设备和独立设备，从设备通过展开主设备查看 |

## 4. 业务范围

本期主从设备能力覆盖以下台账：

- IT设施
- 场地设施
- 机柜
- 备件

本期重点覆盖资产台账中的主从关系展示、模板下载、导入维护及自动填充规则配置。

资产位置字段展示需统一采用 `楼栋-楼层-房间` 格式，例如 `1号楼-1层-中心机房`。

本期暂不展开以下能力：

- 后端真实导入解析实现。
- 审批流配置。
- 自动发现真实设备关系。
- 与监控系统实时联动绑定。
- 多级复杂拓扑推导。

## 5. 用户场景

### 5.1 台账查看主从关系

用户在资产台账中查看资产时，可以展开主设备，查看其关联的从设备。

示例：

- 配电柜展开后查看其关联的电量仪。
- 插接箱展开后查看其关联的开关量。
- 机柜展开后查看其关联的 PDU。

### 5.2 从设备反查主设备

用户查看从设备时，可以通过展开行查看其所属主设备。

### 5.3 下载模板维护主从关系

用户需要批量维护主从关系时，可下载模板。模板中以当前行 `设备编号` 作为主设备编号，用户只需维护 `从设备编号`。

### 5.4 自动预填从设备编号

当主从设备编号存在规律时，用户可以配置自动填充规则，系统根据主设备编号自动生成或匹配从设备编号。

### 5.5 手工新增或解绑主从关系

用户可在台账行操作中手工建立主从关系，也可解除已有关系。

### 5.6 查看导入结果与异常数据

用户完成表格导入后，可在导入记录中查看导入结果。系统需展示成功数量、失败数量、失败数据位置、异常原因，并提供导出异常数据入口，便于用户线下修正后重新导入。

### 5.7 查看资产详情关系拓扑

用户进入资产详情后，可切换到 `关系拓扑` 页签查看主从关系。存在主从关系时，系统使用方向箭头从主设备指向从设备，并在关系线上展示 `有一部分`；不存在主从关系时展示空态。

## 6. 功能总览

主从设备功能包括：

- 主从设备开关。
- 展示模式配置。
- 台账主从关系展示。
- 主从关系手工维护。
- 主从关系表格导入。
- 主从关系导入记录。
- 导入结果与异常数据导出。
- 主从关系模板下载。
- 从设备自动填充规则配置。
- 资产详情关系拓扑。
- 主从关系校验。

## 7. 主从设备基础配置

入口位于 `资产基础配置` 页面中的 `主从设备配置` 区域。

配置项包括：

- 是否开启主从设备关系。
- 主从关系数据维护。
- 展示模式配置。

### 7.1 是否开启主从设备关系

系统支持开启或关闭主从设备关系。

- 开启：台账中展示主从关系展开入口、主设备行、从设备行。
- 关闭：台账中不展示主从关系结构。

### 7.2 主从关系数据维护

支持以下入口：

- 表格导入更新。
- 导入记录。
- 下载模板。

### 7.3 展示模式配置

系统支持两种展示模式：

| 展示模式 | 说明 |
|---|---|
| 全量设备展示 | 主设备、从设备、独立设备均在台账中展示 |
| 仅展示主设备 | 台账默认仅展示主设备和独立设备，从设备通过展开主设备查看 |

当主从设备关系关闭时，展示模式配置不生效，台账不展示主从关系展开入口。

## 8. 台账主从关系展示

台账中存在主从关系时，设备名称列显示展开入口。

### 8.1 主设备行展示

主设备行展开后，应展示其从设备信息，包括：

- 从设备名称。
- 从设备编号。
- 所属台账。
- 查看从设备。
- 解绑。

### 8.2 从设备行展示

从设备行展开后，应展示其所属主设备信息，包括：

- 主设备名称。
- 主设备编号。
- 所属台账。
- 查看主设备。
- 解绑。

### 8.3 展开与收起

用户点击行首展开按钮后，系统展示主从关系行；再次点击后收起。

### 8.4 资产详情关系拓扑

资产详情需提供 `关系拓扑` 页签。

展示规则如下：

- 当前资产存在主从关系时，展示主设备节点、从设备节点及方向关系线。
- 方向关系线应从主设备指向从设备。
- 关系线中间展示关系名称 `有一部分`。
- 当前资产为主设备时，拓扑从当前设备指向下级从设备。
- 当前资产为从设备时，拓扑从所属主设备指向当前设备。
- 当前资产不存在主设备或从设备时，展示空态文案 `暂无主从设备关系`，不展示占位拓扑。

异常处理如下：

- 主设备或从设备不存在、已删除或无权限查看时，应提示关系异常。
- 关系方向缺失、重复关系、循环关系或超过两层关系时，不应渲染误导性的拓扑关系。

## 9. 主从关系手工维护

用户可通过行操作进入关联设备弹窗。

手工维护流程包括：

1. 选择关联类型。
2. 选择目标设备来源台账。
3. 查询目标设备。
4. 勾选目标设备。
5. 确认建立关系。

### 9.1 关联类型

系统支持两种关联类型：

- 关联主设备：将当前设备作为从设备，选择其主设备。
- 关联从设备：将当前设备作为主设备，选择其从设备。

### 9.2 目标设备查询

支持按以下条件查询目标设备：

- 名称。
- 资产编号。
- 资产分类。
- 资产位置。

### 9.3 确认关联

用户确认后，系统建立主从关系，并在台账中展示对应关系。

确认关联前需进行以下异常判断：

- 未选择关联类型时，不允许进入下一步。
- 未选择目标设备时，不允许确认关联。
- 当前设备与目标设备不能为同一设备。
- 当前设备作为从设备时，只能关联一个主设备。
- 当前设备已作为主设备绑定从设备时，不能再被关联为从设备。
- 当前设备已作为从设备时，不能再关联从设备。
- 目标从设备已存在主设备时，需先解绑原关系。
- 禁止形成循环关系。
- 仅支持两层主从关系。
- 已报废、待报废、已迁出、待迁出、已废弃等状态设备禁止建立主从关系。
- 目标设备不存在、已删除、无权限或来源台账不匹配时，应提示异常并阻止保存。

## 10. 主从关系导入更新

用户可通过 `表格导入更新` 入口导入主从关系数据。

导入用途包括：

- 批量新增主从关系。
- 批量更新已有主从关系。
- 批量维护一主多从关系。

导入时，系统以模板中的 `设备编号` 作为主设备编号，以 `从设备编号` 作为从设备编号。

`从设备编号` 允许为空。为空表示当前主设备本次不建立主从关系，不作为异常数据处理。

### 10.1 导入文件弹窗

用户点击 `表格导入更新` 后打开导入文件弹窗。

弹窗要求如下：

- 支持选择 `.xls` 或 `.xlsx` 文件。
- 用户点击 `导入` 后，系统先进行文件格式和模板结构校验。
- 未完成导入校验前，点击 `确定` 不应保存导入结果。
- 未选择文件、文件格式不正确、模板列缺失或文件解析失败时，需在弹窗内提示异常原因。

### 10.2 导入记录

系统需记录每次导入批次，展示：

- 文件名称。
- 导入时间。
- 导入人员。
- 处理状态。
- 查看导入结果。
- 下载导入文件。
- 删除导入记录。

导入中任务不建议删除；原文件不存在、已清理或无权限时，下载入口需提示不可下载。

### 10.3 导入结果

用户点击 `查看导入结果` 后，系统打开导入结果弹窗。

弹窗展示内容包括：

- 成功导入数量。
- 导入失败数量。
- 失败数据位置。
- 异常信息。
- 异常信息说明区块。
- 导出异常数据按钮。
- 确定按钮。
- 右上角关闭按钮。

`导出异常数据` 用于导出当前批次失败明细。若当前批次无异常数据，应提示无可导出的异常数据。

异常信息说明区块需罗列所有可能失败类型，并明确说明：`从设备编号` 允许为空，表示该主设备本次不建立主从关系，不计入异常。

导入结果需覆盖以下异常类型：

- 主设备编号为空。
- 主设备或从设备编号不存在。
- 台账类型不匹配。
- 主设备与从设备相同。
- 同一单元格内重复填写同一从设备编号。
- 从设备已存在主设备。
- 已是从设备的资产继续作为主设备导致超过两层。
- 导入后形成循环关系。
- 设备状态禁止建立关系。
- 导入关系与已有关系重复。
- 文件格式错误、模板列缺失或文件解析失败。

## 11. 下载模板

用户点击 `下载模板` 后打开下载模板弹窗。

弹窗支持：

- 导出全量台账数据。
- 导出部分台账数据。
- 选择导出台账范围。
- 配置从设备自动填充规则。

可选台账包括：

- IT设施。
- 场地设施。
- 机柜。
- 备件。

### 11.1 模板字段

模板数据页字段包括：

| 字段 | 说明 |
|---|---|
| 台账类型 | 当前数据所属台账类型 |
| 设备编号 | 当前行设备编号，作为主设备编号 |
| 设备名称 | 当前行设备名称 |
| 资产状态 | 当前行设备资产状态 |
| 资产位置 | 当前行设备资产位置 |
| 从设备编号 | 需要绑定到当前主设备下的从设备编号；允许为空，表示不建立主从关系 |

模板不包含 `数据范围` 和 `关系说明` 字段。

### 11.2 填写说明 Sheet

模板应包含 `填写说明` Sheet，用于说明：

- 模板用途。
- 导出范围。
- 字段填写要求。
- 从设备编号填写方式。
- 系统校验规则。

填写说明需明确：

- `设备编号` 不能为空，且必须能匹配到台账设备。
- `从设备编号` 允许为空；为空表示当前主设备本次不建立主从关系。
- 填写多个从设备编号时，支持使用中文顿号 `、`、英文逗号 `,` 或换行分隔。
- 拆分后的每个非空从设备编号都必须能匹配到台账设备。

## 12. 从设备自动填充规则

默认不自动填充，从设备编号列保持为空。

用户需要自动预填时，可点击 `配置自动填充规则` 打开二次弹窗。

主弹窗应展示自动填充摘要：

- 当前是否自动填充。
- 已启用规则数量。
- 预计可预填行数。
- 配置自动填充规则入口。

二次弹窗支持：

- 查看规则说明示例。
- 加载推荐规则。
- 新增规则。
- 删除规则。
- 启用或停用规则。
- 配置规则名称。
- 配置匹配规则。
- 配置规则参数。
- 查看预填效果预览。

自动填充规则仅用于辅助生成模板中的 `从设备编号`。未匹配到从设备编号时，该行从设备编号可保持为空，不视为异常。

### 12.1 规则名称

规则名称为普通文本框。

建议填写格式：

`主设备类型 -> 从设备类型`

示例：

- `配电柜 -> 电量仪`
- `插接箱 -> 开关量`
- `机柜 -> PDU`

系统可根据规则名称自动识别主设备类型和从设备类型，用于限定该规则匹配范围。

## 13. 自动填充规则类型

系统支持以下规则类型。

### 13.1 前缀 + 主设备编号

适用于从设备编号在主设备编号前增加固定前缀的场景。

示例：

- 主设备编号：`ESE-LPB1-1F-05`
- 前缀：`DB_`
- 从设备编号：`DB_ESE-LPB1-1F-05`

### 13.2 主设备编号 + 分隔符 + 序号

适用于一主多从，且从设备编号以序号区分的场景。

示例：

- 主设备编号：`D1E-ABPB1-4F-12-02`
- 分隔符：`#`
- 起始序号：`1`
- 结束序号：`2`
- 从设备编号：`D1E-ABPB1-4F-12-02#1`、`D1E-ABPB1-4F-12-02#2`

### 13.3 前缀 + 主设备编号 + 后缀列表

适用于从设备编号由前缀、主设备编号和后缀组成的场景。

示例：

- 主设备编号：`ES-NW31-R-01-2`
- 前缀：`PDU_`
- 后缀列表：`-A,-B`
- 从设备编号：`PDU_ES-NW31-R-01-2-A`、`PDU_ES-NW31-R-01-2-B`

### 13.4 包含主设备编号（兜底）

适用于编号规律不稳定时，从台账中查找包含主设备编号的设备。

示例：

- 主设备编号：`ES-NW31-R-01-2`
- 可匹配从设备编号：`PDU_ES-NW31-R-01-2-A`

该规则匹配范围较宽，建议仅在编号规律不稳定时临时使用。

## 14. 推荐规则

系统提供推荐规则一键加载。

| 规则名称 | 匹配规则 | 参数 |
|---|---|---|
| 配电柜 -> 电量仪 | 前缀 + 主设备编号 | 前缀：`DB_` |
| 插接箱 -> 开关量 | 主设备编号 + 分隔符 + 序号 | 分隔符：`#`，起始序号：`1`，结束序号：`2` |
| 机柜 -> PDU | 前缀 + 主设备编号 + 后缀列表 | 前缀：`PDU_`，后缀列表：`-A,-B` |

## 15. 示例数据规则

## 16. 系统校验规则

系统需校验：

- 主设备编号不能为空。
- 从设备编号允许为空；为空表示当前主设备本次不建立主从关系。
- 已填写的从设备编号必须存在于台账中。
- 主设备与已填写的从设备不能相同。
- 一个从设备只能关联一个主设备。
- 一个主设备可关联多个从设备。
- 禁止形成循环关系。
- 仅支持两层主从关系。
- 已报废、待报废、已迁出、待迁出、已废弃等状态设备禁止建立关系。
- 同一个 `从设备编号` 单元格内不能重复填写同一非空从设备编号。
- 导入文件必须为支持格式，且模板列完整。
- 下载部分台账模板时，至少选择一个台账范围。
- 资产位置字段需按 `楼栋-楼层-房间` 格式展示。

## 17. 异常与提示

系统需提供以下提示：

| 场景 | 提示要求 |
|---|---|
| 未选择台账 | 提示用户至少选择一个台账范围 |
| 所选台账无数据 | 提示下载失败或暂无可导出数据 |
| 规则无匹配结果 | 预览显示“无匹配从设备” |
| 下载模板成功 | 提示模板已下载 |
| 浏览器拒绝下载 | 提示下载失败 |
| 当前设备状态禁止关联 | 提示禁止新增主从关系 |
| 关系冲突 | 提示已有主设备或存在循环关系 |
| 未选择导入文件 | 提示用户先选择 Excel 文件 |
| 导入文件格式错误 | 提示仅支持 `.xls` 或 `.xlsx` 文件 |
| 模板列缺失或解析失败 | 提示文件格式不符合模板要求 |
| 主设备编号为空 | 在导入结果中标明失败位置和原因 |
| 设备编号不存在 | 在导入结果中标明失败编号 |
| 台账类型不匹配 | 在导入结果中标明失败位置和原因 |
| 自关联 | 提示主设备与从设备不能相同 |
| 一从多主 | 提示从设备已存在主设备，需先解绑 |
| 超过两层关系 | 提示仅支持两层主从关系 |
| 循环关系 | 提示禁止循环绑定 |
| 重复关系 | 提示关系已存在 |
| 无异常数据可导出 | 点击导出异常数据时提示无可导出内容 |
| 关系拓扑无数据 | 展示暂无主从设备关系空态 |
| 关系拓扑数据异常 | 提示关联设备不存在、关系方向异常或关系重复 |

- 填写说明 Sheet 内容准确。
- 导入文件弹窗可校验未选择文件、文件格式错误和模板结构异常。
- 导入记录页可查看导入结果、下载导入文件和删除记录。
- 导入结果弹窗展示成功数量、失败数量、失败位置和异常原因。
- 导入结果弹窗提供 `导出异常数据` 按钮。
- 导入结果弹窗右上角提供关闭按钮。
- 异常信息说明区块完整罗列异常类型，并说明从设备编号允许为空。

## 20. 待确认事项

建议按以下设计口径收敛，后续评审时可确认是否调整：

| 事项 | 建议设计 |
|---|---|
| 自动填充规则保存范围 | 建议保存为资产模板配置的一部分，按系统/租户级配置生效，不按个人用户单独保存。 |
| 自动填充规则维护权限 | 建议仅具备资产基础配置维护权限的用户可新增、修改、删除规则；普通台账用户仅使用规则生成模板。 |
| 跨台账建立主从关系 | 建议允许在配置范围内跨台账建立关系，例如机柜与 PDU、配电柜与电量仪；但必须统一执行一从一主、两层关系、状态禁用和循环关系校验。 |
| 导入遇到已有关系 | 建议不覆盖、不静默跳过。若导入关系与已有关系冲突或重复，应在导入结果中提示异常，并标明失败行和原因。 |
| 导入空从设备编号 | 建议允许为空，表示当前主设备本次不建立主从关系，不计入异常。 |
| 操作审计日志 | 建议记录主从关系新增、解绑、导入、删除导入记录、配置变更等关键操作，至少记录操作人、操作时间、操作对象和变更前后信息。 |
| 后端接口与持久化 | 建议正式实现时提供后端接口，持久化主从关系、自动填充规则、导入记录、导入结果和异常文件；原型仅表达交互和规则。 |

## 21. V1.2 资产树搜索功能

需求来源：`V3R5-4185`

### 21.1 功能范围

资产树搜索功能覆盖以下页面：

- 资产表单设计。
- 资产详情设计。

两个页面中的资产树均需提供搜索入口，用于快速定位资产分类节点。

### 21.2 搜索入口

资产树面板顶部增加搜索输入框。

输入框要求如下：

- 默认提示文案为 `请输入资产分类名称`。
- 支持按资产分类名称关键字实时搜索。
- 支持中文、英文、数字等普通文本关键字。
- 搜索框为空时展示完整资产树，并恢复用户原有展开状态。

### 21.3 搜索结果展示

用户输入关键字后，系统实时过滤资产树。

展示规则如下：

- 命中当前节点时展示该节点。
- 命中子节点时，保留父级路径并自动展开至命中节点。
- 命中节点需有明显高亮样式。
- 搜索结果中的节点仍支持点击选择。
- 点击节点后，右侧表单字段配置或详情设计配置应随当前资产分类切换。

### 21.4 无结果状态

当没有匹配的资产分类时，资产树区域展示空态文案：

`未找到匹配的资产分类`

无结果状态下不应清空当前已选择资产分类，也不应清空已配置字段、页签或布局。

### 21.5 异常与边界

- 搜索仅影响前端展示，不修改资产分类结构。
- 清空搜索后需恢复原资产树和展开状态。
- 搜索过程中不应影响当前选中节点。
- 输入特殊字符、空格或无效关键字时，页面不应报错。
- 在资产表单设计和资产详情设计之间切换时，各自保留独立搜索状态。

## 22. V1.2 资产概览

需求来源：`V3R5-4117`、`V3R5-4113`

### 22.1 功能范围

资产概览用于集中展示资产规模、状态、分类、厂商、趋势和预警等关键指标。

本期覆盖以下能力：

- 资产概览菜单入口。
- 与容量能效风格一致的看板布局。
- 按层级查看资产概览。
- 从概览图表进入对应数据范围。

### 22.2 页面入口

在设备管理左侧菜单中增加 `资产概览` 入口。

入口要求如下：

- 位于台账类菜单之前，便于用户优先查看总览。
- 菜单版本标签应按需求说明版本筛选联动。
- 点击后进入资产概览看板页面。

### 22.3 页面布局

资产概览页面包含以下区域：

- 顶部层级页签：概览、IT设施、场地设施、机柜、备件。
- 看板管理入口：用于后续维护看板配置、展示范围或布局。
- 资产数量统计。
- 资产状态统计。
- 资产分类 Top10。
- 资产类型统计。
- 资产厂商统计。
- 近30天资产使用趋势。
- 近30天资产总量统计。
- 近30天资产进报废趋势。
- 资产到期数统计量。

### 22.4 交互规则

- 用户可通过顶部层级页签切换概览范围。
- 用户可通过看板管理入口维护看板配置、展示范围或布局。
- 图表卡片支持点击下钻，点击后进入对应资产列表或明细范围。
- 当前原型阶段以静态数据表达页面结构、视觉风格和下钻入口。

### 22.5 异常与边界

- 当前层级无数据时，图表区域应展示空态。
- 用户无层级权限时，应提示无权限查看。
- 筛选条件无匹配数据时，应提示暂无数据并保留筛选条件。
- 下钻目标不存在或已被删除时，应提示无法定位数据范围。

        function escapeHtml(value) {
          return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function pad(value, length = 2) {
          return String(value).padStart(length, "0");
        }

        function summarizeText(value, max = 22) {
          const text = String(value ?? "");
          return text.length > max ? text.slice(0, max) + "..." : text;
        }

        function formatInlineMarkdown(value) {
          return escapeHtml(value)
            .replace(/`([^`]+)`/g, "<code>$1</code>")
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        }

        function slugifyHeading(value) {
          return String(value || "")
            .replace(/[^\u4e00-\u9fa5a-zA-Z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .toLowerCase();
        }

        function getRequirementSpecMarkdown() {
          const source = document.getElementById("requirement-spec-source");
          return source ? source.textContent.trim() : "";
        }

        function renderRequirementSpecMarkdown(markdown) {
          const lines = String(markdown || "").split(/\r?\n/);
          const html = [];
          const toc = [];
          let listType = null;
          let tableRows = [];

          const closeList = () => {
            if (listType) {
              html.push("</" + listType + ">");
              listType = null;
            }
          };

          const closeTable = () => {
            if (tableRows.length === 0) {
              return;
            }
            const [head, ...body] = tableRows;
            html.push("<table><thead><tr>" + head.map((cell) => "<th>" + formatInlineMarkdown(cell) + "</th>").join("") + "</tr></thead><tbody>");
            body.forEach((row) => {
              html.push("<tr>" + row.map((cell) => "<td>" + formatInlineMarkdown(cell) + "</td>").join("") + "</tr>");
            });
            html.push("</tbody></table>");
            tableRows = [];
          };

          const parseTableRow = (line) => line
            .replace(/^\|/, "")
            .replace(/\|$/, "")
            .split("|")
            .map((cell) => cell.trim());

          lines.forEach((rawLine) => {
            const line = rawLine.trim();
            if (!line) {
              closeList();
              closeTable();
              return;
            }
            const heading = /^(#{1,3})\s+(.+)$/.exec(line);
            if (heading) {
              closeList();
              closeTable();
              const level = heading[1].length;
              const title = heading[2].trim();
              const id = "spec-" + slugifyHeading(title);
              if (level <= 2) {
                toc.push({ id, title, level });
              }
              html.push("<h" + level + " id=\"" + id + "\">" + formatInlineMarkdown(title) + "</h" + level + ">");
              return;
            }
            if (/^\|.+\|$/.test(line)) {
              if (!/^\|[\s:-]+\|/.test(line)) {
                tableRows.push(parseTableRow(line));
              }
              return;
            }
            closeTable();
            const unordered = /^-\s+(.+)$/.exec(line);
            if (unordered) {
              if (listType !== "ul") {
                closeList();
                html.push("<ul>");
                listType = "ul";
              }
              html.push("<li>" + formatInlineMarkdown(unordered[1]) + "</li>");
              return;
            }
            const ordered = /^\d+\.\s+(.+)$/.exec(line);
            if (ordered) {
              if (listType !== "ol") {
                closeList();
                html.push("<ol>");
                listType = "ol";
              }
              html.push("<li>" + formatInlineMarkdown(ordered[1]) + "</li>");
              return;
            }
            closeList();
            html.push("<p>" + formatInlineMarkdown(line) + "</p>");
          });
          closeList();
          closeTable();

          return {
            html: html.join(""),
            toc
          };
        }

        function getInitialGuidePage() {
          const match = String(window.location.hash || "").match(/(?:^#|&)guide=([^&]+)/);
          const page = match ? decodeURIComponent(match[1]) : "";
          return ["flowcharts", "versionRequirements", "requirementSpec"].includes(page) ? page : null;
        }

        function createMermaidLiveUrl(code) {
          const payload = JSON.stringify({
            code,
            mermaid: JSON.stringify({ theme: "default" }),
            panZoom: true,
            updateDiagram: true
          });
          const bytes = new TextEncoder().encode(payload);

          if (window.pako?.deflate) {
            const compressed = window.pako.deflate(bytes, { level: 9 });
            return "https://mermaid.live/edit#pako:" + toBase64Url(compressed);
          }

          return "https://mermaid.live/edit#base64:" + toBase64Url(bytes);
        }

        function toBase64Url(bytes) {
          let binary = "";
          const chunkSize = 0x8000;

          for (let index = 0; index < bytes.length; index += chunkSize) {
            binary += Array.from(
              bytes.subarray(index, Math.min(index + chunkSize, bytes.length)),
              (byte) => String.fromCharCode(byte)
            ).join("");
          }

          return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
        }

        function buildPager(current, total) {
          if (total <= 7) {
            return Array.from({ length: total }, (_, index) => index + 1);
          }
          if (current <= 4) {
            return [1, 2, 3, 4, 5, "...", total];
          }
          if (current >= total - 3) {
            return [1, "...", total - 4, total - 3, total - 2, total - 1, total];
          }
          return [1, "...", current - 1, current, current + 1, "...", total];
        }

        function disambiguateNames(rows, key = "name") {
          const counts = rows.reduce((acc, row) => {
            const name = String(row[key] || "");
            acc[name] = (acc[name] || 0) + 1;
            return acc;
          }, {});
          const seen = {};
          return rows.map((row) => {
            const name = String(row[key] || "");
            if (counts[name] <= 1) {
              return row;
            }
            seen[name] = (seen[name] || 0) + 1;
            return { ...row, [key]: pad(seen[name], 2) + "# " + name };
          });
        }

        function expandRows(baseRows, total, buildRow) {
          return Array.from({ length: total }, (_, index) => {
            const source = baseRows[index % baseRows.length];
            return buildRow(source, index, Math.floor(index / baseRows.length));
          });
        }

        class EventBus {
          constructor() {
            this.listeners = new Set();
          }

          subscribe(listener) {
            this.listeners.add(listener);
            return () => this.listeners.delete(listener);
          }

          emit() {
            this.listeners.forEach((listener) => listener());
          }
        }

            const dialog = this.state.ui.advancedSearch;

            const allowed = this.getAdvancedSearchFieldOptions(dialog.viewId).map((item) => item.key);
            if (!allowed.includes(field)) {
              return;
            }
            dialog.fields = {
              ...(dialog.fields || {}),
              [field]: String(value || "")
            };
            if (shouldEmit) {
              this.emit();

          addAdvancedSearchCondition(field) {
            const dialog = this.state.ui.advancedSearch;
            if (!dialog) {
              return;
            }
            const allowed = this.getAdvancedSearchFieldOptions(dialog.viewId).map((item) => item.key);
            if (!allowed.includes(field)) {
              return;
            }
            const activeFields = Array.isArray(dialog.activeFields) ? dialog.activeFields : ["assetCode", "assetCategory", "assetLocation"];
            if (!activeFields.includes(field)) {
              dialog.activeFields = [...activeFields, field];
            }
            dialog.fieldMenuOpen = false;
            this.emit();
          }

          removeAdvancedSearchCondition(field) {
            const dialog = this.state.ui.advancedSearch;
            if (!dialog) {
              return;
            }
            const fixedFields = ["assetCode", "assetCategory", "assetLocation", "vendor", "model"];
            if (fixedFields.includes(field)) {
              return;
            }
            const activeFields = Array.isArray(dialog.activeFields) ? dialog.activeFields : fixedFields;
            dialog.activeFields = activeFields.filter((item) => item !== field);
            dialog.fields = {
              ...(dialog.fields || {}),
              [field]: ""
            };
            dialog.fieldMenuOpen = false;
            this.emit();
          }

          getAdvancedSearchFieldOptions(viewId) {
            const meta = LIST_PAGE_META[viewId] || {};
            const columnOptions = (meta.columns || [])
              .filter((column) => column.key && !column.key.startsWith("__"))
              .map((column) => ({ key: column.key, label: column.label }));
            const extraOptions = [
              { key: "model", label: "型号" },
              { key: "productionDate", label: "投产日期" },
              { key: "id", label: "ID" }
            ];
            const merged = [...columnOptions, ...extraOptions];
            const seen = new Set();
            return merged.filter((item) => {
              if (!item.key || seen.has(item.key)) {
                return false;
              }
              seen.add(item.key);
              return true;
            });
          }

          resetAdvancedSearch() {
            const dialog = this.state.ui.advancedSearch;
            if (!dialog) {
              return;

            dialog.fields = {
              assetCode: "",

              model: "",

              productionDate: "",

            const dialog = this.state.ui.advancedSearch;
            if (!dialog || !LIST_PAGE_META[dialog.viewId]) {
              return;
            }
            const currentFilter = this.state.ui.filters[dialog.viewId] || {};
            this.state.ui.filters[dialog.viewId] = {
              keyword: currentFilter.keyword || "",
              assetCode: dialog.fields?.assetCode || "",
              assetCategory: dialog.fields?.assetCategory || "",

              name: dialog.fields?.name || "",

              productionDate: dialog.fields?.productionDate || "",
              id: dialog.fields?.id || "",
              vendor: dialog.fields?.vendor || ""
            };
            this.state.ui.pagers[dialog.viewId] = 1;
            if (this.state.ui.listSelections) {
              this.state.ui.listSelections[dialog.viewId] = [];

            this.state.ui.batchSelectionMenuOpen = null;

            this.pushToast("高级查询完成", LIST_PAGE_META[dialog.viewId].title + " 已按高级条件完成筛选。", "success");
          }

          saveAdvancedSearchShortcut() {

          resetFilter(viewId) {
            this.state.ui.filters[viewId] = {

              assetCode: "",

              assetLocation: "",
              uHeight: "",
              name: "",

              model: "",
              assetStatus: "",
              productionDate: "",

          getSpaceTreeRootId(viewId) {
            return this.createSpaceTreeNodeId(viewId, ["工程"]);
          }

          createSpaceTreeNodeId(viewId, pathParts) {
            const scope = encodeURIComponent(String(viewId || "ledger"));
            const path = pathParts.map((part) => encodeURIComponent(String(part || "未命名"))).join("/");
            return "space:" + scope + ":" + path;
          }

          ensureSpaceTreeState(viewId) {
            if (!this.state.ui.spaceTrees) {
              this.state.ui.spaceTrees = {};
            }
            const rootId = this.getSpaceTreeRootId(viewId);
            if (!this.state.ui.spaceTrees[viewId]) {
              const expandedNodes = { [rootId]: true };
              const markDefaultExpanded = (nodes, depth = 0) => {
                nodes.forEach((node) => {
                  if (node.children?.length && depth < 3) {
                    expandedNodes[node.id] = true;
                    markDefaultExpanded(node.children, depth + 1);
                  }
                });
              };
              markDefaultExpanded(this.buildSpaceViewTree(viewId));
              this.state.ui.spaceTrees[viewId] = {
                activeNode: rootId,
                treeSearch: "",
                expandedNodes
              };
            }
            const treeState = this.state.ui.spaceTrees[viewId];
            if (!treeState.expandedNodes) {
              treeState.expandedNodes = { [rootId]: true };
            }
            if (!treeState.activeNode) {
              treeState.activeNode = rootId;
            }
            return treeState;
          }

          buildSpaceViewTree(viewId) {
            const rows = this.getListRows(viewId);
            const root = {
              id: this.getSpaceTreeRootId(viewId),
              label: "工程",
              count: rows.length,
              children: []
            };
            const childMaps = new Map([[root.id, new Map()]]);
            const getChild = (parent, pathParts, label) => {
              if (!childMaps.has(parent.id)) {
                childMaps.set(parent.id, new Map());
              }
              const childrenByLabel = childMaps.get(parent.id);
              if (!childrenByLabel.has(label)) {
                const child = {
                  id: this.createSpaceTreeNodeId(viewId, pathParts),
                  label,
                  count: 0,
                  children: []
                };
                childrenByLabel.set(label, child);
                childMaps.set(child.id, new Map());
                parent.children.push(child);
              }
              return childrenByLabel.get(label);
            };
            rows.forEach((row) => {
              const location = String(row.assetLocation || row.position || "未配置位置").trim() || "未配置位置";
              const parts = location.split(/[-/＞>]/).map((part) => part.trim()).filter(Boolean);
              const normalizedParts = parts.length ? parts : ["未配置位置"];
              let parent = root;
              const pathParts = ["工程"];
              normalizedParts.forEach((label) => {
                pathParts.push(label);
                parent = getChild(parent, pathParts, label);
                parent.count += 1;
              });
            });
            return [root];
          }

          setSpaceTreeNode(viewId, nodeId) {
            if (!viewId || !nodeId) {
              return;
            }
            const treeState = this.ensureSpaceTreeState(viewId);
            treeState.activeNode = nodeId;
            const path = this.findNodePath(this.buildSpaceViewTree(viewId), nodeId);
            path.slice(0, -1).forEach((id) => {
              treeState.expandedNodes[id] = true;
            });
            this.emit();
          }

          toggleSpaceTreeNode(viewId, nodeId) {
            if (!viewId || !nodeId) {
              return;
            }
            const treeState = this.ensureSpaceTreeState(viewId);
            treeState.expandedNodes[nodeId] = !treeState.expandedNodes[nodeId];
            this.emit();
          }

          setSpaceTreeSearch(viewId, keyword, shouldEmit = true) {
            if (!viewId) {
              return;
            }
            const treeState = this.ensureSpaceTreeState(viewId);
            treeState.treeSearch = String(keyword || "");
            if (shouldEmit) {
              this.emit();
            }
          }

          getListRows(viewId) {
            return this.state.data.lists[viewId] || [];
          }

          getRowById(viewId, rowId) {
            return this.getListRows(viewId).find((item) => item.id === rowId) || null;
          }

          getCabinetUsage(row, index = 0) {
            const height = Number(row.cabinetHeight) || 42;
            const seed = Number(String(row.id || "").replace(/\D/g, "")) || index + 1;
            const deviceCount = row.assetStatus === "空闲" ? 0 : 1 + (seed % 5);
            const usedU = row.assetStatus === "空闲" ? 0 : Math.min(height, deviceCount * 2 + (seed % 4));
            const percent = height > 0 ? Math.round((usedU / height) * 100) : 0;
            return {
              height,
              deviceCount,
              usedU,
              freeU: Math.max(0, height - usedU),
              percent
            };
          }

          getColumnWidth(viewId, columnKey) {
            return this.state.ui.columnWidths?.[viewId]?.[columnKey] || DEFAULT_COLUMN_WIDTHS[columnKey] || 128;
          }

          setColumnWidth(viewId, columnKey, width) {
            if (!this.state.ui.columnWidths[viewId]) {
              this.state.ui.columnWidths[viewId] = {};
            }
            const minWidth = columnKey === "__select" ? 36 : columnKey === "__actions" ? 86 : 72;
            this.state.ui.columnWidths[viewId][columnKey] = Math.max(minWidth, Math.round(width));
            this.emit();
          }

          getSelectedRowIds(viewId) {
            return this.state.ui.listSelections?.[viewId] || [];
          }

          isRowSelected(viewId, rowId) {
            return this.getSelectedRowIds(viewId).includes(rowId);
          }

          toggleListRowSelection(viewId, rowId) {
            if (!viewId || !rowId) {
              return;
            }
            if (!this.state.ui.listSelections) {
              this.state.ui.listSelections = {};
            }
            const selected = new Set(this.getSelectedRowIds(viewId));
            if (selected.has(rowId)) {
              selected.delete(rowId);
            } else {
              selected.add(rowId);
            }
            this.state.ui.listSelections[viewId] = Array.from(selected);
            this.state.ui.batchSelectionMenuOpen = null;
            this.emit();
          }

          toggleListPageSelection(viewId) {
            if (!viewId) {
              return;
            }
            if (!this.state.ui.listSelections) {
              this.state.ui.listSelections = {};
            }
            const rows = this.getCurrentPageRows(viewId);
            const rowIds = rows.map((row) => row.id).filter(Boolean);
            const selected = this.getSelectedRowIds(viewId);
            const allSelected = rowIds.length > 0 && rowIds.every((id) => selected.includes(id));
            const nextSelected = new Set(selected);
            rowIds.forEach((id) => {
              if (allSelected) {
                nextSelected.delete(id);
              } else {
                nextSelected.add(id);
              }
            });
            this.state.ui.listSelections[viewId] = Array.from(nextSelected);
            this.state.ui.batchSelectionMenuOpen = null;
            this.emit();
          }

          clearListSelection(viewId) {
            if (this.state.ui.listSelections?.[viewId]?.length) {
              this.state.ui.listSelections[viewId] = [];
              this.state.ui.batchSelectionMenuOpen = null;
              this.emit();
            }
          }

          toggleBatchSelectionMenu(viewId) {
            this.state.ui.batchSelectionMenuOpen = this.state.ui.batchSelectionMenuOpen === viewId ? null : viewId;
            this.closeRowMoreMenu(false);
            this.closeGuideMenu(false);
            this.emit();
          }

          closeBatchSelectionMenu(shouldEmit = true) {
            if (!this.state.ui.batchSelectionMenuOpen) {
              return false;
            }
            this.state.ui.batchSelectionMenuOpen = null;
            if (shouldEmit) {
              this.emit();
            }
            return true;
          }

          handleBatchSelectionAction(viewId, actionLabel) {
            const selected = this.getSelectedRowIds(viewId);
            const count = selected.length;
            this.state.ui.batchSelectionMenuOpen = null;
            if (!count) {
              this.pushToast("批量操作", "请先勾选需要操作的资产。", "warning");
              return;
            }
            if (this.isPendingInitializationView(viewId) && actionLabel === "初始化") {
              this.openInitializationOperationPage(viewId, selected);
              return;
            }
            const sheetBatchActionsByView = {
              [VIEW_IDS.IT_FACILITY]: ["上架", "编辑", "迁出", "变动", "下架"],
              [VIEW_IDS.STATION_FACILITY]: ["部署", "编辑", "报废", "回库", "变动"],
              [VIEW_IDS.CABINET]: ["部署", "编辑", "报废", "回库", "变动"],
              [VIEW_IDS.SPARE_PART]: ["出库", "编辑", "调拨"]
            };
            const sheetActions = sheetBatchActionsByView[viewId] || [];
            if (sheetActions.includes(actionLabel)) {
              this.openOperationPage(viewId, null, actionLabel, selected);
              return;
            }
            this.pushToast(actionLabel || "批量操作", "已对 " + count + " 条资产触发“" + (actionLabel || "批量操作") + "”原型交互。", "info");
          }

          getFilteredRows(viewId) {
            const rows = this.getListRows(viewId);
            const filter = this.state.ui.filters[viewId] || {};
            const keyword = (filter.keyword || "").trim().toLowerCase();
            const advancedConditions = ["assetCode", "assetCategory", "assetLocation", "uHeight", "name", "ratedPower", "model", "assetStatus", "productionDate", "id", "vendor"].map((key) => ({
              key,
              value: filter[key]
            })).map((item) => ({
              key: item.key,
              value: String(item.value || "").trim().toLowerCase()
            })).filter((item) => item.value);
            const applyMasterSlaveMode = (items) => {
              if (!this.isLedgerHierarchyEnabled()) {
                return items;
              }
              return items.filter((row) => !this.findParentOf(viewId, row.id));
            };
            if (!this.state.ui.autoExpandRows) {
              this.state.ui.autoExpandRows = {};
            }
            if (!keyword && advancedConditions.length === 0) {
              this.state.ui.autoExpandRows[viewId] = {};
              return applyMasterSlaveMode(rows);
            }
            const rowMatchesAdvanced = (row) => {
              if (!row || advancedConditions.length === 0) return true;
              return advancedConditions.every((condition) => {
                const rawValue = condition.key === "model"
                  ? (row.model || String(row.assetCategory || "").split(">").slice(-1)[0])
                  : row[condition.key];
                const value = String(rawValue || "").toLowerCase();
                return value.includes(condition.value);
              });
            };
            const rowMatchesKeyword = (row) => {
              if (!row) return false;
              return !keyword || Object.values(row).join(" ").toLowerCase().includes(keyword);
            };
            const rowMatchesAll = (row) => {
              return rowMatchesKeyword(row) && rowMatchesAdvanced(row);
            };
            const autoExpand = {};
            const result = rows.filter((row) => {
              if (rowMatchesAll(row)) {
                return true;
              }
              const children = this.findChildrenOf(viewId, row.id);
              for (const rel of children) {
                const childRow = this.getRowById(rel.childViewId, rel.childRowId);
                if (rowMatchesAll(childRow)) {
                  autoExpand[row.id] = true;
                  return true;
                }
              }
              const parentRel = this.findParentOf(viewId, row.id);
              if (parentRel) {
                const parentRow = this.getRowById(parentRel.parentViewId, parentRel.parentRowId);
                if (rowMatchesAll(parentRow)) {
                  autoExpand[row.id] = true;
                  return true;
                }
              }
              return false;
            });
            this.state.ui.autoExpandRows[viewId] = autoExpand;
            return applyMasterSlaveMode(result);
          }

          getListPageMeta(viewId, rows = this.getFilteredRows(viewId)) {
            const meta = LIST_PAGE_META[viewId] || {};
            const pageSize = Math.max(1, Number(meta.pageSize) || 8);
            const total = rows.length;
            const pageCount = Math.max(1, Math.ceil(total / pageSize));
            const currentPage = Math.max(1, Math.min(pageCount, Number(this.state.ui.pagers[viewId]) || 1));
            return {
              pageSize,
              total,
              pageCount,
              currentPage,
              totalText: "共 " + total + " 条"
            };
          }

          getCurrentPageRows(viewId, rows = this.getFilteredRows(viewId)) {
            const pageMeta = this.getListPageMeta(viewId, rows);
            const start = (pageMeta.currentPage - 1) * pageMeta.pageSize;
            return rows.slice(start, start + pageMeta.pageSize);

            this.closeGuideMenu(false);
            this.emit();

              viewId,
              rowId,
              activeTab: viewId === VIEW_IDS.CABINET ? "contains" : "basic",
              historyRange: "全部"

            this.closeGuideMenu(false);
            this.emit();

            this.closeRowMoreMenu(false);
