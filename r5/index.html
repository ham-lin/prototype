            this.clearMasterSlaveTemplateDownloadTimer();
            dialog.downloadProgress = null;
            this.pushToast("已取消下载", "主从设备关系模板下载已取消。", "info");
          }

          runMasterSlaveTemplateDownloadProgress(plan, stepIndex = 0) {
            const steps = [
              { percent: 28, message: "正在读取台账数据..." },
              { percent: 52, message: "正在生成主从关系字段..." },
              { percent: 76, message: "正在写入模板内容..." },
              { percent: 96, message: "正在准备下载文件..." },
              { percent: 100, message: "准备完成，正在下载..." }
            ];
            this.clearMasterSlaveTemplateDownloadTimer();
            this.masterSlaveTemplateDownloadTimer = setTimeout(() => {
              const dialog = this.state.ui.masterSlaveTemplateDialog;
              if (!dialog || dialog.downloadProgress?.status !== "running") {
                this.clearMasterSlaveTemplateDownloadTimer();
                return;
              }
              const step = steps[stepIndex];
              if (step) {
                dialog.downloadProgress = {
                  ...dialog.downloadProgress,
                  ...step
                };
                this.emit();
                this.runMasterSlaveTemplateDownloadProgress(plan, stepIndex + 1);
                return;
              }
              this.clearMasterSlaveTemplateDownloadTimer();
              this.downloadMasterSlaveTemplateFromPlan(plan);
            }, 360);
          }

          getMasterSlaveTemplateDownloadPlan(scope = "all", ledgers = {}, autoFillRules = []) {
            const ledgerOptions = this.getMasterSlaveTemplateLedgerOptions();
            const selectedLedgers = scope === "all"
              ? ledgerOptions
              : ledgerOptions.filter((item) => ledgers[item.viewId]);
            if (selectedLedgers.length === 0) {
              return {
                ok: false,
                title: "请选择台账",
                message: "部分台账数据至少需要选择一个台账范围。",
                tone: "warning"
              };
            }
            const headers = ["台账类型", "设备编号", "设备名称", "资产状态", "资产位置", "从设备编号"];
            const allEntries = this.getMasterSlaveTemplateDeviceEntries(selectedLedgers);
            const allCodes = new Set(allEntries.map((entry) => entry.code).filter(Boolean));
            const rows = selectedLedgers.flatMap((ledger) =>
              (this.getListRows(ledger.viewId) || []).map((row) => [
                ledger.label,
                this.getMasterSlaveTemplateDeviceCode(row),
                row.name || "",
                row.assetStatus || "",
                row.assetLocation || row.position || "",
                this.generateMasterSlaveChildCodes(row, autoFillRules, allCodes, allEntries).join("、")
              ])
            );
            if (rows.length === 0) {
              return {
                ok: false,
                title: "下载失败",
                message: "所选台账暂无可导出的样例数据。",
                tone: "warning"
              };
            }
            return {
              ok: true,
              scope,
              selectedLedgers,
              headers,
              rows
            };
          }

          downloadMasterSlaveTemplate(scope = "all", ledgers = {}, autoFillRules = []) {
            const plan = this.getMasterSlaveTemplateDownloadPlan(scope, ledgers, autoFillRules);
            if (!plan.ok) {
              this.pushToast(plan.title, plan.message, plan.tone || "warning");
              return;
            }
            this.downloadMasterSlaveTemplateFromPlan(plan);
          }

          downloadMasterSlaveTemplateFromPlan(plan) {
            const workbookText = this.buildMasterSlaveTemplateWorkbook(plan.headers, plan.rows, plan.scope, plan.selectedLedgers);
            try {
              const blob = new Blob([workbookText], { type: "application/vnd.ms-excel;charset=utf-8;" });
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = "主从设备关系导入模板_" + (plan.scope === "all" ? "全量台账" : "部分台账") + ".xls";
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 0);
              this.state.ui.masterSlaveTemplateDialog = null;
              this.pushToast("模板已下载", "已下载包含" + plan.selectedLedgers.length + "类台账数据的主从设备关系导入模板。", "success");
            } catch (error) {
              if (this.state.ui.masterSlaveTemplateDialog) {
                this.state.ui.masterSlaveTemplateDialog.downloadProgress = null;
              }
              this.pushToast("下载失败", "浏览器拒绝了模板下载请求。", "warning");
            }
            this.emit();
          }

          getMasterSlaveTemplateDeviceCode(row) {
            return String(row?.assetCode || row?.serialCode || row?.serialNumber || row?.id || "");
          }

          getMasterSlaveTemplateDeviceEntries(selectedLedgers) {
            return selectedLedgers.flatMap((ledger) =>
              (this.getListRows(ledger.viewId) || []).map((row) => ({
                ledger,
                row,
                code: this.getMasterSlaveTemplateDeviceCode(row),
                name: row.name || "",
                category: row.assetCategory || ""
              }))
            );
          }

          getMasterSlaveTemplateDeviceCodeSet(selectedLedgers) {
            return new Set(this.getMasterSlaveTemplateDeviceEntries(selectedLedgers).map((entry) => entry.code).filter(Boolean));
          }

          getSelectedMasterSlaveTemplateLedgers(dialog) {
            const scope = dialog?.scope || "all";
            const ledgers = dialog?.ledgers || {};
            const ledgerOptions = this.getMasterSlaveTemplateLedgerOptions();
            return scope === "all" ? ledgerOptions : ledgerOptions.filter((item) => ledgers[item.viewId]);
          }

          normalizeMasterSlaveRuleText(value) {
            return String(value || "").trim().toLowerCase();
          }

          isMasterSlaveRuleMatched(row, rule) {
            if (!rule || rule.enabled === false || rule.ruleType === "none") {
              return false;
            }
            const keyword = this.normalizeMasterSlaveRuleText(rule.masterKeyword);
            if (!keyword) {
              return true;
            }
            const mainCode = this.getMasterSlaveTemplateDeviceCode(row);
            const haystack = this.normalizeMasterSlaveRuleText([
              mainCode,
              row?.name,
              row?.assetCategory
            ].join(" "));
            return haystack.includes(keyword);
          }

          isMasterSlaveEntryMatched(entry, keyword) {
            const normalized = this.normalizeMasterSlaveRuleText(keyword);
            if (!normalized) {
              return true;
            }
            const haystack = this.normalizeMasterSlaveRuleText([
              entry?.code,
              entry?.name,
              entry?.category
            ].join(" "));
            return haystack.includes(normalized);
          }

          buildMasterSlaveCandidateCodes(mainCode, rule = {}, allCodes = new Set()) {
            const start = Math.max(1, Number(rule.start) || 1);
            const end = Math.max(start, Number(rule.end || rule.count) || start);
            if (rule.ruleType === "prefix") {
              return [(rule.prefix || "") + mainCode];
            }
            if (rule.ruleType === "suffixSequence") {
              const delimiter = rule.delimiter || "#";
              return Array.from({ length: end - start + 1 }, (_, index) => mainCode + delimiter + (start + index));
            }
            if (rule.ruleType === "prefixSuffixEnum") {
              const prefix = rule.prefix || "";
              const suffixes = String(rule.suffixes || "")
                .split(/[,\uFF0C\u3001\n\r]+/)
                .map((item) => item.trim())
                .filter(Boolean);
              return suffixes.map((suffix) => prefix + mainCode + suffix);
            }
            if (rule.ruleType === "contains") {
              return Array.from(allCodes).filter((code) => code.indexOf(mainCode) > -1);
            }
            return [];
          }

          filterMasterSlaveCandidateCodes(candidates, mainCode, rule, allCodes, allEntries) {
            const unique = Array.from(new Set(candidates.filter(Boolean))).filter((code) => code !== mainCode);
            if (rule.onlyExisting === false) {
              return unique;
            }
            return unique.filter((code) => {
              if (!allCodes.has(code)) {
                return false;
              }
              const entry = allEntries.find((item) => item.code === code);
              return this.isMasterSlaveEntryMatched(entry, rule.childKeyword);
            });
          }

          resolveMasterSlaveTemplateRule(row, autoFillRules = [], allCodes = new Set(), allEntries = []) {
            const mainCode = this.getMasterSlaveTemplateDeviceCode(row);
            if (!mainCode) {
              return { rule: null, children: [] };
            }
            const rules = Array.isArray(autoFillRules) ? autoFillRules : [autoFillRules];
            for (const rule of rules) {
              if (!this.isMasterSlaveRuleMatched(row, rule)) {
                continue;
              }
              const candidates = this.buildMasterSlaveCandidateCodes(mainCode, rule, allCodes);
              const children = this.filterMasterSlaveCandidateCodes(candidates, mainCode, rule, allCodes, allEntries);
              if (children.length > 0 || rule.onlyExisting === false) {
                return { rule, children };
              }
            }
            return { rule: null, children: [] };
          }

          generateMasterSlaveChildCodes(row, autoFillRules = [], allCodes = new Set(), allEntries = []) {
            return this.resolveMasterSlaveTemplateRule(row, autoFillRules, allCodes, allEntries).children;
          }

          getMasterSlaveTemplatePreviewRows(dialog) {
            const selectedLedgers = this.getSelectedMasterSlaveTemplateLedgers(dialog);
            const allEntries = this.getMasterSlaveTemplateDeviceEntries(selectedLedgers);
            const allCodes = new Set(allEntries.map((entry) => entry.code).filter(Boolean));
            const rules = this.getMasterSlaveTemplateDialogRules(dialog);
            const rows = allEntries.map((entry) => {
              const resolved = this.resolveMasterSlaveTemplateRule(entry.row, rules, allCodes, allEntries);
              return {
                ledger: entry.ledger.label,
                code: entry.code,
                ruleName: resolved.rule?.name || "",
                children: resolved.children
              };
            });
            const matchedRows = rows.filter((row) => row.children.length > 0);
            const unmatchedRows = rows.filter((row) => row.children.length === 0);
            return [...matchedRows, ...unmatchedRows].slice(0, 5);
          }

          getMasterSlaveTemplateAutoFillSummary(dialog) {
            const selectedLedgers = this.getSelectedMasterSlaveTemplateLedgers(dialog);
            const allEntries = this.getMasterSlaveTemplateDeviceEntries(selectedLedgers);
            const allCodes = new Set(allEntries.map((entry) => entry.code).filter(Boolean));
            const rules = this.getEnabledMasterSlaveTemplateRules(dialog);
            const matchedCount = allEntries.reduce((count, entry) => {
              const resolved = this.resolveMasterSlaveTemplateRule(entry.row, rules, allCodes, allEntries);
              return count + (resolved.children.length > 0 ? 1 : 0);
            }, 0);
            return {
              enabledRulesCount: rules.length,
              matchedCount,
              totalCount: allEntries.length
            };
          }

          buildMasterSlaveTemplateWorkbook(headers, dataRows, scope, selectedLedgers) {
            const escapeXml = (value) => String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
            const renderSheet = (name, rows) => `
              <Worksheet ss:Name="${escapeXml(name)}">
                <Table>
                  ${rows.map((row) => `
                    <Row>
                      ${row.map((cell) => `<Cell><Data ss:Type="String">${escapeXml(cell)}</Data></Cell>`).join("")}
                    </Row>
                  `).join("")}
                </Table>
              </Worksheet>
            `;
            const ledgerLabels = selectedLedgers.map((item) => item.label).join("、");
            const instructionRows = [
              ["填写说明", ""],
              ["模板用途", "用于通过表格导入或更新主从设备关系数据。"],
              ["导出范围", scope === "all" ? "全量台账数据" : "部分台账数据：" + ledgerLabels],
              ["", ""],
              ["填写要求", ""],
              ["1", "系统带出的台账类型、设备编号、设备名称、资产状态、资产位置用于辅助识别设备，请勿随意修改。"],
              ["2", "数据页每一行的“设备编号”即当前行主设备编号，导入时系统按该编号作为主设备。"],
              ["3", "下载模板时可配置自动填充规则，系统会按规则预填“从设备编号”。"],
              ["4", "若未自动填充或需调整，用户可手动填写“从设备编号”；多个编号支持用中文顿号“、”、英文逗号“,”或换行分隔。"],
              ["", ""],
              ["系统校验规则", ""],
              ["1", "设备编号不能为空，且必须能匹配到台账设备。"],
              ["2", "从设备编号允许为空；为空表示当前主设备本次不建立主从关系。"],
              ["3", "填写多个从设备编号时，系统会按“、”、\",\"或换行拆分；拆分后的每个非空编号都必须能匹配到台账设备。"],
              ["4", "设备编号和任一从设备编号不能相同。"],
              ["5", "同一个“从设备编号”单元格内不能重复填写同一从设备编号。"],
              ["6", "从设备只能关联一个主设备；若已存在主设备，导入时应提示冲突。"],
              ["7", "主设备可关联多个从设备。"],
              ["8", "仅支持两层主从关系：已是从设备的资产不能再作为主设备。"],
              ["9", "禁止形成循环关系，例如 A 为 B 的主设备时，B 不能再作为 A 的主设备。"],
              ["10", "已报废、待报废、已迁出、待迁出、已废弃等状态的设备禁止建立主从关系。"],
              ["11", "设备编号不存在、台账类型不匹配或重复导入同一关系时，系统应给出校验失败提示，并标明具体失败编号。"]
            ];
            return `<?xml version="1.0" encoding="UTF-8"?>
              <?mso-application progid="Excel.Sheet"?>
              <Workbook
                xmlns="urn:schemas-microsoft-com:office:spreadsheet"
                xmlns:o="urn:schemas-microsoft-com:office:office"
                xmlns:x="urn:schemas-microsoft-com:office:excel"
                xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
                ${renderSheet("主从关系数据", [headers, ...dataRows])}
                ${renderSheet("填写说明", instructionRows)}
              </Workbook>`;
          }

          saveTemplateConfig() {
            this.pushToast("配置已保存", "资产基础配置已暂存到当前原型状态。", "success");
            this.emit();
          }

          getActiveFormNodeLabel() {
            return this.findNodeLabel(FORM_TREE, this.state.ui.formDesign.activeNode) || "资产";
          }

          getFormFieldOptions() {
            const nodeId = this.state.ui.formDesign.activeNode;
            return FORM_FIELD_LIBRARY[nodeId] || FORM_FIELD_LIBRARY.default;
          }

          getSelectedFormFields() {
            const nodeId = this.state.ui.formDesign.activeNode;
            const selections = this.state.ui.formDesign.selections[nodeId] || this.state.ui.formDesign.selections.default;
            return selections;
          }

          setFormNode(nodeId) {
            this.state.ui.formDesign.activeNode = nodeId;
            this.expandTreeAncestors(this.state.ui.formDesign.expandedNodes, nodeId);
            if (!this.state.ui.formDesign.selections[nodeId]) {
              const fallback = FORM_FIELD_LIBRARY[nodeId] || FORM_FIELD_LIBRARY.default;
              this.state.ui.formDesign.selections[nodeId] = fallback.slice(0, Math.min(3, fallback.length));
            }
            this.emit();
          }

          setFormTreeSearch(keyword, shouldEmit = true) {
            this.state.ui.formDesign.treeSearch = String(keyword || "");
            if (shouldEmit) {
              this.emit();
            }
          }

          toggleFormTreeNode(nodeId) {
            const current = Boolean(this.state.ui.formDesign.expandedNodes[nodeId]);
            this.state.ui.formDesign.expandedNodes[nodeId] = !current;
            this.emit();
          }

          toggleFormField(fieldName) {
            const nodeId = this.state.ui.formDesign.activeNode;
            const current = new Set(this.state.ui.formDesign.selections[nodeId] || []);
            if (current.has(fieldName)) {
              current.delete(fieldName);
            } else {
              current.add(fieldName);
            }
            this.state.ui.formDesign.selections[nodeId] = Array.from(current);
            this.emit();
          }

          saveFormDesign() {
            this.pushToast("表单设计已保存", this.getActiveFormNodeLabel() + " 的表单字段显示配置已更新。", "success");
            this.emit();
          }

          setDetailNode(nodeId) {
            this.state.ui.detailDesign.activeNode = nodeId;
            this.expandTreeAncestors(this.state.ui.detailDesign.expandedNodes, nodeId);
            this.emit();
          }

          setDetailTreeSearch(keyword, shouldEmit = true) {
            this.state.ui.detailDesign.treeSearch = String(keyword || "");
            if (shouldEmit) {
              this.emit();
            }
          }

          toggleDetailTreeNode(nodeId) {
            const current = Boolean(this.state.ui.detailDesign.expandedNodes[nodeId]);
            this.state.ui.detailDesign.expandedNodes[nodeId] = !current;
            this.emit();
          }

          getRequiredDetailFields(tabId) {
            const options = DETAIL_FIELDS[tabId] || [];
            return DETAIL_REQUIRED_FIELDS.filter((field) => options.includes(field));
          }

          getDetailFieldOrder(tabId) {
            const options = DETAIL_FIELDS[tabId] || [];
            const current = this.state.ui.detailDesign.orders?.[tabId] || [];
            const normalized = [...current.filter((field) => options.includes(field)), ...options.filter((field) => !current.includes(field))];
            this.state.ui.detailDesign.orders[tabId] = normalized;
            return normalized;
          }

          getSelectedDetailFields(tabId) {
            const options = DETAIL_FIELDS[tabId] || [];
            const current = (this.state.ui.detailDesign.selections[tabId] || []).filter((field) => options.includes(field));
            const required = this.getRequiredDetailFields(tabId);
            const normalized = [];

            [...required, ...current].forEach((field) => {
              if (!normalized.includes(field)) {
                normalized.push(field);
              }
            });

            this.state.ui.detailDesign.selections[tabId] = normalized;
            return normalized;
          }

          setDetailTab(tabId) {
            this.state.ui.detailDesign.activeTab = tabId;
            this.getDetailFieldOrder(tabId);
            this.getSelectedDetailFields(tabId);
            this.emit();
          }

          setDetailLayout(layout) {
            this.state.ui.detailDesign.layout = layout;
            this.emit();
          }

          toggleDetailField(fieldName) {
            const tabId = this.state.ui.detailDesign.activeTab;
            const required = new Set(this.getRequiredDetailFields(tabId));
            if (required.has(fieldName)) {
              return;
            }
            const order = this.getDetailFieldOrder(tabId);
            const set = new Set(this.getSelectedDetailFields(tabId));
            if (set.has(fieldName)) {
              set.delete(fieldName);
            } else {
              set.add(fieldName);
            }
            this.state.ui.detailDesign.selections[tabId] = order.filter((field) => set.has(field));
            this.emit();
          }

          reorderDetailField(sourceField, targetField) {
            const tabId = this.state.ui.detailDesign.activeTab;
            const order = this.getDetailFieldOrder(tabId).slice();
            const sourceIndex = order.indexOf(sourceField);
            const targetIndex = order.indexOf(targetField);
            if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) {
              return;
            }

            const [movedField] = order.splice(sourceIndex, 1);
            order.splice(targetIndex, 0, movedField);
            this.state.ui.detailDesign.orders[tabId] = order;

            const selected = new Set(this.getSelectedDetailFields(tabId));
            this.state.ui.detailDesign.selections[tabId] = order.filter((field) => selected.has(field));
            this.emit();
          }

          saveDetailDesign() {
            this.pushToast("详情设计已保存", "当前详情页签字段展示规则已更新。", "success");
            this.emit();
          }

          setLabelTemplate(templateId) {
            this.state.ui.labelConfig.activeTemplateId = templateId;
            this.emit();
          }

          setLabelField(key, value) {
            const nextValue = key === "width" || key === "height" ? Math.max(20, Number(value) || 20) : value;
            this.state.ui.labelConfig[key] = nextValue;
            this.emit();
          }

          uploadLogo() {
            this.pushToast("上传入口已触发", "原型中未接入真实文件上传，已模拟打开 Logo 上传区域。", "info");
          }

          configureBinding() {
            this.pushToast("字段绑定", "已打开配置字段绑定入口，可继续扩展为真实字段映射。", "info");
          }

          previewLabelPrint() {
            this.pushToast("打印预览", "标签打印预览已按当前模板和尺寸刷新。", "success");
          }

          saveLabelConfig() {
            this.pushToast("标签配置已保存", "标签模板、尺寸和绑定字段已保存到当前原型。", "success");
          }

          pushToast(title, message, tone = "success") {
            const toast = {
              id: "toast-" + Date.now() + "-" + Math.random().toString(16).slice(2, 7),
              title,
              message,
              tone
            };
            this.state.ui.toasts = [toast, ...this.state.ui.toasts].slice(0, 4);
            this.emit();
            setTimeout(() => {
              const before = this.state.ui.toasts.length;
              this.state.ui.toasts = this.state.ui.toasts.filter((item) => item.id !== toast.id);
              if (before !== this.state.ui.toasts.length) {
                this.emit();
              }
            }, 2600);
          }

          findNodeLabel(nodes, targetId) {
            for (const node of nodes) {
              if (node.id === targetId) {
                return node.label;
              }
              if (node.children) {
                const child = this.findNodeLabel(node.children, targetId);
                if (child) {
                  return child;
                }
              }
            }
            return "";
          }

          findNodePath(nodes, targetId, path = []) {
            for (const node of nodes) {
              const nextPath = [...path, node.id];
              if (node.id === targetId) {
                return nextPath;
              }
              if (node.children) {
                const childPath = this.findNodePath(node.children, targetId, nextPath);
                if (childPath.length) {
                  return childPath;
                }
              }
            }
            return [];
          }

          expandTreeAncestors(expandedNodes, targetId) {
            const path = this.findNodePath(FORM_TREE, targetId);
            path.slice(0, -1).forEach((nodeId) => {
              expandedNodes[nodeId] = true;
            });
          }

          filterTreeByKeyword(nodes, keyword) {
            const query = String(keyword || "").trim().toLowerCase();
            if (!query) {
              return {
                nodes,
                matchedIds: new Set(),
                expandedIds: new Set()
              };
            }
            const matchedIds = new Set();
            const expandedIds = new Set();
            const walk = (items, ancestors = []) => items
              .map((node) => {
                const childResult = walk(node.children || [], [...ancestors, node.id]);
                const matchedSelf = String(node.label || "").toLowerCase().includes(query);
                if (!matchedSelf && childResult.nodes.length === 0) {
                  return null;
                }
                if (matchedSelf) {
                  matchedIds.add(node.id);
                }
                if (childResult.nodes.length > 0) {
                  expandedIds.add(node.id);
                }
                ancestors.forEach((id) => expandedIds.add(id));
                return {
                  ...node,
                  children: childResult.nodes
                };
              })
              .filter(Boolean);
            return {
              nodes: walk(nodes),
              matchedIds,
              expandedIds
            };
          }
        }

        class SearchableSelectEditor {
          constructor(options = []) {
            this.editorType = "Input";
            this.setOptions(options);
            this.container = null;
            this.input = null;
            this.menu = null;
            this.endEdit = null;
            this.activeIndex = 0;
          }

          setOptions(options) {
            this.options = Array.from(new Set((options || []).filter(Boolean).map((item) => String(item))));
          }

          createElements() {
            this.input = document.createElement("input");
            this.input.type = "text";
            this.input.autocomplete = "off";
            this.input.style.position = "absolute";
            this.input.style.padding = "4px 8px";
            this.input.style.boxSizing = "border-box";
            this.input.style.backgroundColor = "#fff";
            this.input.style.borderRadius = "0";
            this.input.style.border = "2px solid #4a90e2";
            this.input.style.outline = "none";
            this.input.style.fontSize = "12px";

            this.menu = document.createElement("div");
            this.menu.className = "vtable-search-select-menu";

            this.input.addEventListener("input", () => {
              this.activeIndex = 0;
              this.renderOptions();
            });
            this.input.addEventListener("keydown", (event) => this.handleKeydown(event));
            this.input.addEventListener("blur", () => {
              setTimeout(() => {
                if (!this.isEditorElement(document.activeElement)) {
                  this.finishEdit();
                }
              }, 120);
            });
            this.menu.addEventListener("mousedown", (event) => event.preventDefault());

            this.container.appendChild(this.input);
            this.container.appendChild(this.menu);
          }

          onStart({ value, referencePosition, container, endEdit }) {
            this.container = container;
            this.endEdit = endEdit;
            if (!this.input || !this.menu) {
              this.createElements();
            } else {
              this.container.appendChild(this.input);
              this.container.appendChild(this.menu);
            }
            this.setValue(value);
            if (referencePosition?.rect) {
              this.adjustPosition(referencePosition.rect);
            }
            this.input.focus();
            this.input.select();
            this.renderOptions();
          }

          setValue(value) {
            if (this.input) {
              this.input.value = value === undefined || value === null ? "" : String(value);
            }
          }

          getValue() {
            return this.input?.value || "";
          }

          handleKeydown(event) {
            const filtered = this.getFilteredOptions();
            if (event.key === "ArrowDown") {
              event.preventDefault();
              this.activeIndex = Math.min(filtered.length - 1, this.activeIndex + 1);
              this.renderOptions();
              return;
            }
            if (event.key === "ArrowUp") {
              event.preventDefault();
              this.activeIndex = Math.max(0, this.activeIndex - 1);
              this.renderOptions();
              return;
            }
            if (event.key === "Enter") {
              event.preventDefault();
              if (filtered[this.activeIndex]) {
                this.setValue(filtered[this.activeIndex]);
              }
              this.finishEdit();
              return;
            }
            if (event.key === "Escape") {
              this.finishEdit();
            }
          }

          adjustPosition(rect) {

        class DateTimePickerEditor {
          constructor() {

            const top = rect.top - 1;
            const left = rect.left - 1;
            const width = Math.max(168, rect.width + 2);
            const height = rect.height + 2;
            this.input.style.top = top + "px";
            this.input.style.left = left + "px";
            this.input.style.width = width + "px";
            this.input.style.height = height + "px";
          }

          finishEdit() {
            if (typeof this.endEdit === "function") {
              this.endEdit();
            }
          }

          onEnd() {
            if (this.input?.parentNode) {
              this.input.parentNode.removeChild(this.input);
            }
            this.input = null;
            this.container = null;
            this.endEdit = null;
          }

          isEditorElement(element) {
            return Boolean(element && element === this.input);
          }

          validateValue() {
            return true;
          }
        }

          bindFillHandle() {

          normalizeFillRange(args = {}, fallback = null) {

            const startCol = Number(target?.startCol ?? args.startCol ?? args.sourceCol);
            const endCol = Number(target?.endCol ?? args.endCol ?? args.targetCol ?? args.col ?? startCol);
            const startRow = Number(target?.startRow ?? args.startRow ?? args.sourceRow);

            const normalized = {
              startCol: Math.min(startCol, endCol),
              endCol: Math.max(startCol, endCol),
              startRow: Math.min(startRow, endRow),
              endRow: Math.max(startRow, endRow)

              normalized.sourceStartRow = normalized.startRow;
              normalized.sourceEndRow = normalized.startRow;

            if (Number.isFinite(sourceRange.startCol) && Number.isFinite(sourceRange.endCol)) {
              normalized.sourceStartCol = Math.min(sourceRange.startCol, sourceRange.endCol);
              normalized.sourceEndCol = Math.max(sourceRange.startCol, sourceRange.endCol);

              <button type="button" data-fill-mode="format"><span></span><span>仅填充格式</span></button>

          getTargetRows(range) {

            const sourceEnd = Math.max(range.sourceStartRow, range.sourceEndRow);
            const fillStart = Math.min(range.startRow, range.endRow);
            const fillEnd = Math.max(range.startRow, range.endRow);
            for (let row = Math.max(2, fillStart); row <= fillEnd; row += 1) {

          }

          getTargetCols(range) {
            const cols = [];
            const sourceStart = Math.min(range.sourceStartCol, range.sourceEndCol);
            const sourceEnd = Math.max(range.sourceStartCol, range.sourceEndCol);
            const fillStart = Math.min(range.startCol, range.endCol);
            const fillEnd = Math.max(range.startCol, range.endCol);
            for (let col = Math.max(1, fillStart); col <= fillEnd; col += 1) {
              if (col < sourceStart || col > sourceEnd) {

              }
              cols.push(col);
            }

          getFieldByCol(col) {
            return this.columns?.[col]?.field || "";
          }

          getRecordByTableRow(row) {
            return this.records?.[row - 1] || null;
          }

          getCellValue(row, col) {
            const field = this.getFieldByCol(col);
            const record = this.getRecordByTableRow(row);
            if (!record || !field) {
              return "";
            }
            return record[field] ?? "";
          }

          isRecordFillEditable(row, col) {
            const record = this.getRecordByTableRow(row);
            const field = this.getFieldByCol(col);
            if (!record || !field) {
              return false;
            }
            if (this.readonlyColumnKeys.has(field)) {
              return false;
            }
            return record.__rowType === "data" || record.__rowType === "blankEditable";
          }

          getSeriesValue(sourceValue, offset) {
            const text = sourceValue === undefined || sourceValue === null ? "" : String(sourceValue);
            if (!text) {
              return "";
            }
            const numeric = text.match(/^(.*?)(-?\d+)(\D*)$/);
            if (numeric) {
              const prefix = numeric[1];
              const rawNumber = numeric[2];
              const suffix = numeric[3];
              const nextNumber = Number(rawNumber) + offset;
              const padded = rawNumber.startsWith("0")
                ? String(Math.abs(nextNumber)).padStart(rawNumber.length, "0")
                : String(Math.abs(nextNumber));
              return prefix + (nextNumber < 0 ? "-" : "") + padded + suffix;
            }
            const dateTime = text.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})(?::(\d{2}))?$/);
            if (dateTime) {
              const date = new Date(
                Number(dateTime[1]),
                Number(dateTime[2]) - 1,
                Number(dateTime[3]),
                Number(dateTime[4]),
                Number(dateTime[5]) + offset,
                Number(dateTime[6] || 0)
              );
              return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
                + " " + pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds());
            }
            return text;
          }

          commitCellUpdates(updates) {
            updates.forEach((update) => {
              const record = this.getRecordByTableRow(update.row);
              if (record) {
                record[update.field] = update.value;
              }
            });
            const cellValues = updates.map((update) => ({
              col: update.col,
              row: update.row,
              value: update.value
            }));
            const table = this.instance;
            const candidateCalls = [
              () => typeof table?.changeCellValues === "function" && (table.changeCellValues(cellValues), true),
              () => typeof table?.changeCellValues === "function" && (table.changeCellValues(cellValues.map(({ col, row, value }) => [col, row, value])), true),
              () => typeof table?.setRecords === "function" && (table.setRecords(this.records), true),
              () => typeof table?.updateRecords === "function" && (table.updateRecords(this.records), true)
            ];
            for (const call of candidateCalls) {
              try {
                if (call()) {
                  return;
                }
              } catch (error) {
                // Try the next VTable-compatible update method.
              }
            }
            try {
              table?.renderWithRecreateCells?.();
            } catch (error) {
              // Last resort: records are already updated for subsequent table interactions.
            }
          }

          updateFillSelection(range) {
            const table = this.instance;
            if (!table) {
              return;
            }
            const start = { col: range.startCol, row: range.startRow };
            const end = { col: range.endCol, row: range.endRow };
            const candidateCalls = [
              () => typeof table.selectCell === "function" && (table.selectCell(start.col, start.row, end.col, end.row), true),
              () => typeof table.selectCells === "function" && (table.selectCells(start.col, start.row, end.col, end.row), true),
              () => typeof table.setCellRange === "function" && (table.setCellRange({ start, end }), true),
              () => typeof table.setSelectCellRange === "function" && (table.setSelectCellRange({ start, end }), true)
            ];
            for (const call of candidateCalls) {
              try {
                if (call()) {
                  return;
                }
              } catch (error) {
                // Selection APIs differ by VTable version.
              }
            }
          }

          registerEditor() {
            if (this.editorRegistered || !window.VTable?.register?.editor || !window.VTable?.editors?.InputEditor) {
              return;
            }
            const inputEditor = new window.VTable.editors.InputEditor();
            window.VTable.register.editor("operation-input-editor", inputEditor);
            window.VTable.register.editor("operation-asset-category-editor", this.selectEditors.assetCategory);
            window.VTable.register.editor("operation-asset-location-editor", this.selectEditors.assetLocation);
            window.VTable.register.editor("operation-start-u-editor", this.selectEditors.operationStartU);
            window.VTable.register.editor("operation-datetime-editor", this.dateTimeEditor);
            this.editorRegistered = true;
          }

          buildColumns(page) {
            const getRecordFromArgs = (args) => args?.record || args?.data || args?.table?.getCellOriginRecord?.(args.col, args.row);
            const readonlyColumnKeys = new Set(page.readonlyColumnKeys || []);
            const locationSelectFields = new Set(["assetLocation", "warehouseLocation", "shelfLocation", "deployLocation", "newLocation", "returnLocation", "offShelfLocation", "transferWarehouse"]);
            const requiredColumnKeys = new Set((page.sheetColumns || []).filter((column) => column.required).map((column) => column.key));
            const isReadonlyOperationField = (columnKey) => readonlyColumnKeys.has(columnKey);
            const editableBlankRows = Boolean(page.editableBlankRows);
            const getRowType = (args) => {
              const record = getRecordFromArgs(args);
              if (record?.__rowType) {
                return record.__rowType;
              }
              if (Number(args?.row) === 1) {
                return "field";
              }
              if (Number(args?.row) === 2) {
                return "data";
              }
              return "placeholder";
            };
            const isEditableRecordRow = (args) => {
              const rowType = getRowType(args);
              return rowType === "data" || (editableBlankRows && rowType === "blankEditable");
            };
            const buildBodyCellStyle = (columnKey, args) => {
              const rowType = getRowType(args);
              if (rowType === "field") {
                return {
                  textAlign: "center",
                  fontWeight: 600,
                  color: requiredColumnKeys.has(columnKey) ? "#d93026" : "#5f748a",
                  bgColor: "#fbfdff"
                };
              }
              if (rowType === "placeholder") {
                return {
                  textAlign: "left",
                  color: "#31485f",
                  bgColor: "#f7f9fc"
                };
              }
              if (rowType === "blankEditable") {
                return {
                  textAlign: "left",
                  color: "#31485f",
                  bgColor: "#fff"
                };
              }
              if (isReadonlyOperationField(columnKey)) {
                return {
                  textAlign: "left",
                  color: "#31485f",
                  bgColor: "#f3f6fa"
                };
              }
              return {
                textAlign: "left",
                color: "#31485f",
                bgColor: "#fff"
              };
            };
            const buildRowIndexStyle = (args) => {
              const rowType = getRowType(args);
              if (rowType === "placeholder") {
                return { textAlign: "center", color: "#b7c2ce", bgColor: "#f2f5f9" };
              }
              return { textAlign: "center", color: "#7389a0", bgColor: "#fff" };
            };
            const getEditor = (columnKey) => {
              if (!this.editorRegistered) {
                return undefined;
              }
              return (args) => {
                if (!isEditableRecordRow(args)) {
                  return undefined;
                }
                if (isReadonlyOperationField(columnKey)) {
                  return undefined;
                }
                if (columnKey === "assetCategory") {
                  return "operation-asset-category-editor";
                }
                if (locationSelectFields.has(columnKey)) {
                  return "operation-asset-location-editor";
                }
                if (columnKey === "operationStartU") {
                  return "operation-start-u-editor";
                }
                if (columnKey === "powerOnTime") {
                  return "operation-datetime-editor";
                }
                return "operation-input-editor";
              };
            };
            return [
              {
                field: "__rowIndex",
                title: "",
                width: 36,
                headerStyle: { bgColor: "#fff" },
                style: buildRowIndexStyle
              },
              ...page.sheetColumns.map((column) => ({
                field: column.key,
                title: column.letter,
                width: column.width,
                disableSelect: isReadonlyOperationField(column.key),
                disableHeaderSelect: isReadonlyOperationField(column.key),
                editor: getEditor(column.key),
                style: (args) => buildBodyCellStyle(column.key, args)
              }))
            ];
          }

          buildRecords(page) {
            this.updateSelectEditorOptions(page);
            const fieldRow = { __rowIndex: "", __rowType: "field" };
            page.sheetColumns.forEach((column) => {
              fieldRow[column.key] = column.required ? "*" + column.label : column.label;
            });
            if (page.editableBlankRows) {
              const blankRows = Array.from({ length: Math.max(1, page.rowCount || 20) }, (_, index) => {
                const row = { __rowIndex: String(index + 1), __rowType: "blankEditable" };
                page.sheetColumns.forEach((column) => {
                  row[column.key] = page.sheetValues?.[column.key] || "";
                });
                return row;
              });
              return [fieldRow, ...blankRows];
            }
            const valueRows = (Array.isArray(page.sheetRows) && page.sheetRows.length ? page.sheetRows : [page.sheetValues]).map((values, index) => {
              const row = { __rowIndex: String(index + 1), __rowType: "data" };
              page.sheetColumns.forEach((column) => {
                row[column.key] = values?.[column.key] || "";
              });
              return row;
            });
            const emptyRows = Array.from({ length: Math.max(0, page.rowCount - valueRows.length) }, (_, index) => {
              const row = { __rowIndex: String(valueRows.length + index + 1), __rowType: "placeholder" };
              page.sheetColumns.forEach((column) => {
                row[column.key] = "";
              });
              return row;
            });
            return [fieldRow, ...valueRows, ...emptyRows];
          }

          updateSelectEditorOptions(page) {
            const sheetRows = Array.isArray(page.sheetRows) ? page.sheetRows : [];
            const getCurrentValues = (keys) => {
              const keyList = Array.isArray(keys) ? keys : [keys];

              ...getCurrentValues(["assetLocation", "warehouseLocation", "shelfLocation", "deployLocation", "newLocation", "returnLocation", "offShelfLocation", "transferWarehouse"]),

            this.selectEditors.operationStartU.setOptions([

            ]);
          }

          captureRelationFieldFocus() {
            const active = document.activeElement;
            if (!active || typeof active.matches !== "function") {
              return null;
            }
            if (!active.matches('[data-role="relation-field"]')) {
              return null;
            }
            return {
              field: active.getAttribute("data-field"),
              start: active.selectionStart,
              end: active.selectionEnd
            };
          }

          restoreRelationFieldFocus(snapshot) {
            if (!snapshot || !snapshot.field) {
              return;
            }
            const next = this.nodes.overlay.querySelector('[data-role="relation-field"][data-field="' + snapshot.field + '"]');
            if (!next) {
              return;
            }
            next.focus();
            try {
              if (typeof snapshot.start === "number" && typeof snapshot.end === "number") {
                next.setSelectionRange(snapshot.start, snapshot.end);
              }
            } catch (error) {
              // ignore
            }
          }

          getSidebarVersionTag(item, state) {
            if (!item) {

            if (!state.ui.demandExplainEnabled) {

            const viewId = item.id || item.viewId;
            const inheritedVersions = {
              [VIEW_IDS.IT_FACILITY]: ["v1.1"],
              [VIEW_IDS.PENDING_IT_ASSET]: ["v1.1"],
              [VIEW_IDS.STATION_FACILITY]: ["v1.1"],

              [VIEW_IDS.DETAIL_DESIGN]: ["v1.2"]
            };
            const sharedRequirementViews = {
              "V3R5-4185": [VIEW_IDS.FORM_DESIGN, VIEW_IDS.DETAIL_DESIGN]
            };
            const versions = [
              ...(inheritedVersions[viewId] || []),
              ...VERSION_REQUIREMENTS
                .filter((requirement) => requirement.targetView === viewId || (sharedRequirementViews[requirement.id] || []).includes(viewId))
                .map((requirement) => requirement.version)
            ];
            const uniqueVersions = [...new Set(versions)].filter(Boolean);
            if (uniqueVersions.length === 0) {
              return "";
            }
            const activeVersion = state.ui.versionRequirementFilter || "all";
            if (activeVersion !== "all" && !uniqueVersions.includes(activeVersion)) {
              return "";
            }
            if (activeVersion !== "all") {
              return `<span class="sidebar-version-tag">${escapeHtml(activeVersion)}</span>`;
            }
            const sortedVersions = uniqueVersions.sort((a, b) => Number(a.replace(/[^\d.]/g, "")) - Number(b.replace(/[^\d.]/g, "")));
            const latestVersion = sortedVersions[sortedVersions.length - 1];
            return `<span class="sidebar-version-tag">${escapeHtml(latestVersion)}</span>`;

              return `

                        : tab.id === "history"
                          ? ' data-demand-version="v1.2" data-demand-req-id="V3R5-4112" data-demand-title="资产详情履历展示规则" data-demand-text="需求来源：V3R5-4112。||交互目的：在资产详情中按时间轴展示资产履历，便于追溯属性变更、流程状态变化和关系变化。||展示规则：履历页签展示全部、近7日、近10日、近15日筛选，默认选中全部；每条履历包含时间、操作类型、操作人和字段变更明细，字段明细需展示旧值与新值；页面内不得直接展示系统字段英文名或编码字段，需转译为中文业务字段名称。||状态限制：无履历数据时展示空态，不影响基本信息、位置信息、关系拓扑和包含设备页签。||异常判断：字段名称缺失、旧值或新值为空、履历来源异常时，应使用“空”或“-”兜底，不应导致页面空白或时间轴断裂。"'
                          : "";

                    <button class="${tab.id === detail.activeTab ? "is-active" : ""}" data-action="asset-detail-tab" data-value="${escapeHtml(tab.id)}"${demandAttrs}>${escapeHtml(tab.label)}</button>

                          : "";
                        return `
                        <button class="btn ${item.tone === "primary" ? "btn-primary" : item.tone === "light" ? "btn-light" : ""}" type="button" data-action="operation-tool" data-label="${escapeHtml(item.label)}"${demandAttrs}>
                          ${escapeHtml(item.label)}

                      }).join("")}

                      <div class="operation-vtable-container" data-role="operation-vtable"></div>

                        <div class="operation-zoom-bar" aria-hidden="true"></div>

                        <span>100%</span>
                      </div>
                    </div>

                </div>
              </div>

          renderPrintOperationPage(page) {

              case "relation":
                return this.renderAssetDetailRelation(detail);
              case "contains":
                return this.renderAssetDetailContains(detail);
              case "basic":
              default:
                return this.renderAssetDetailBasic(detail);

            return `

                return `

                <div class="asset-overview-nav">

                  <section class="overview-card">

                    <div class="overview-rank">
                      ${rankRows.map(([name, value]) => `
                        <button class="overview-rank-row overview-drilldown" type="button" data-action="asset-overview-drilldown" data-label="${escapeHtml("资产分类Top10 · " + name)}" data-view="${VIEW_IDS.STATION_FACILITY}">

                        ${renderEchartsTooltip("资产类型统计", [

                        { name: "新增资产", values: ["55件", "48件", "62件", "51件", "76件", "28件", "50件"], color: "#2aa7ee" },
                        { name: "净增资产", values: ["32件", "26件", "40件", "29件", "58件", "16件", "34件"], color: "#8bd3ff" }

                    <div class="overview-chart">${renderBars(categoryBars.map((value) => Math.max(18, value - 20)), Array.from({ length: 18 }, (_, index) => "7-" + (index + 1)), "近30天资产总量统计", VIEW_IDS.IT_FACILITY)}</div>

                    <div class="overview-card-title">近30天资产迁出/报废统计</div>

                      VIEW_IDS.IT_FACILITY,
                      ["200", "150", "100", "50", "0"],
                      trendXLabels,
                      [

                        { name: "报废", values: ["18件", "24件", "30件", "21件", "36件", "12件", "19件"], color: "#8bd3ff" }

          }

          renderListPage(viewId, state) {
            const meta = LIST_PAGE_META[viewId];
            const filteredRows = this.store.getFilteredRows(viewId);
            const pageMeta = this.store.getListPageMeta(viewId, filteredRows);
            const rows = this.store.getCurrentPageRows(viewId, filteredRows);
            const renderHeaderTools = meta.showTools && viewId !== VIEW_IDS.SPARE_PART;
            const renderTableTools = meta.showTools && viewId === VIEW_IDS.SPARE_PART;
            const hasSelection = this.store.getSelectedRowIds(viewId).length > 0;
            const viewMode = this.store.getListViewMode(viewId);
            const renderCabinetSpaceView = viewId === VIEW_IDS.CABINET && viewMode === "space";
            return `
              <div class="page-surface list-page-surface">
                ${this.renderMasterSlaveListAnnotations(meta)}
                <div class="page-toolbar">
                  <div class="page-toolbar-left">
                    <div class="page-title">${escapeHtml(meta.title)}</div>
                    ${meta.modeLabel ? this.renderModeChip(viewId, viewMode, state) : ""}
                    ${hasSelection ? this.renderBatchSelectionToolbar(viewId, state) : `
                      <form class="search-form" data-view="${escapeHtml(viewId)}">
                        <input class="search-input" name="keyword" placeholder="${escapeHtml(meta.placeholder)}" value="${escapeHtml(state.ui.filters[viewId].keyword)}" />
                        <button class="btn btn-primary" type="submit">查询</button>
                        ${meta.secondaryLabel ? `<button class="btn btn-light" type="button" data-action="open-advanced-search" data-view="${escapeHtml(viewId)}" data-demand-version="v1.2" data-demand-req-id="V3R5-4418" data-demand-title="高级搜索支持厂商和型号条件" data-demand-text="需求来源：V3R5-4418。||交互目的：点击高级搜索后打开右侧高级搜索面板，默认提供厂商、型号作为搜索条件，便于按设备来源和型号快速筛选台账资产。||展示规则：厂商和型号字段默认展示在高级搜索面板中，字段使用下拉选择，选项来自当前台账模拟数据去重结果；查询后按“满足以下全部条件”组合刷新列表。||状态限制：取消关闭面板不改变列表；重置清空高级条件并恢复默认条件项。||异常判断：当前台账无厂商或型号数据时，下拉保留请选择，不应影响其他条件查询。">${escapeHtml(meta.secondaryLabel)}</button>` : ""}
                      </form>
                    `}
                  </div>
                  <div class="toolbar-actions">
                    ${this.store.isPendingInitializationView(viewId) ? "" : this.renderLedgerHierarchyControl(viewId, state)}
                    ${meta.actions.map((action) => this.renderHeaderAction(action, viewId)).join("")}
                    ${renderHeaderTools ? this.renderToolbarTools() : ""}
                  </div>
                </div>
                <div class="ledger-list-body ${viewMode === "space" ? "is-space-view" : ""}">
                  ${viewMode === "space" ? this.renderSpaceViewTree(viewId) : ""}
                  ${renderCabinetSpaceView
                    ? this.renderCabinetSpaceView(rows, filteredRows, pageMeta)
                    : `
                      <div class="table-panel">
                        ${renderTableTools ? `<div class="table-panel-head">${this.renderToolbarTools()}</div>` : ""}
                        <div class="table-wrap">
                          ${this.renderListTable(viewId, rows)}
                        </div>
                        ${this.renderPagination(meta, viewId, pageMeta)}
                      </div>
                    `}
                </div>
              </div>
            `;
          }

          renderModeChip(viewId, viewMode, state) {
            const activeLabel = viewMode === "space" ? "空间视图" : "标准视图";
            const menuOpen = state.ui.listViewModeMenuOpen === viewId;
            return `
              <div class="mode-chip-wrap">
                <button class="mode-chip" type="button" data-action="toggle-list-view-mode-menu" data-view="${escapeHtml(viewId)}" aria-haspopup="menu" aria-expanded="${menuOpen ? "true" : "false"}">
                  <span>${escapeHtml(activeLabel)}</span>
                  <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                    <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </button>
                ${menuOpen ? `
                  <div class="mode-chip-menu" role="menu">
                    <button class="mode-chip-option ${viewMode === "standard" ? "is-active" : ""}" type="button" data-action="set-list-view-mode" data-view="${escapeHtml(viewId)}" data-mode="standard">标准视图</button>
                    <button class="mode-chip-option ${viewMode === "space" ? "is-active" : ""}" type="button" data-action="set-list-view-mode" data-view="${escapeHtml(viewId)}" data-mode="space">空间视图</button>
                  </div>
                ` : ""}
              </div>
            `;
          }

          renderSpaceViewTree(viewId) {
            const treeState = this.store.ensureSpaceTreeState(viewId);
            const treeSearch = treeState.treeSearch || "";
            const treeResult = this.store.filterTreeByKeyword(this.store.buildSpaceViewTree(viewId), treeSearch);
            const expandedNodes = treeSearch
              ? Object.fromEntries([...treeResult.expandedIds].map((id) => [id, true]))
              : treeState.expandedNodes;
            return `
              <aside class="ledger-space-tree-panel" aria-label="空间视图树" data-demand-version="v1.2" data-demand-req-id="V3R5-4110" data-demand-title="空间视图设备展示规则" data-demand-text="需求来源：V3R5-4110。||交互目的：优化空间视图模式下左侧空间树与右侧资产列表的展示关系。||展示规则：空间视图左侧仅展示空间层级树和节点数量，不在树节点下展开设备明细；设备仍在右侧台账列表中展示，右侧列表需保留完整列和行操作区域。||状态限制：空间树支持展开、收起和关键字搜索，搜索命中时展开到对应空间路径。||异常判断：无空间数据或无匹配节点时展示空态，不应在空间树中混入设备行或导致右侧列表丢失。">
                <div class="ledger-space-tree-search">
                  <input data-role="space-tree-search" data-view="${escapeHtml(viewId)}" placeholder="请输入关键字" value="${escapeHtml(treeSearch)}" />
                </div>
                <div class="ledger-space-tree" data-view="${escapeHtml(viewId)}">
                  ${treeResult.nodes.length > 0
                    ? this.renderSpaceTreeNodes(treeResult.nodes, viewId, treeState.activeNode, expandedNodes, treeResult.matchedIds)
                    : '<div class="ledger-space-tree-empty">未找到匹配的空间节点</div>'}
                </div>
              </aside>
            `;
          }

          getCabinetUsage(row, index = 0) {
            return this.store.getCabinetUsage(row, index);
          }

          renderCabinetMiniRack(usage) {
            const slots = 14;
            const usedSlots = usage.usedU > 0 ? Math.max(1, Math.round((usage.usedU / usage.height) * slots)) : 0;
            return `
              <div class="cabinet-mini-rack" aria-hidden="true">
                ${Array.from({ length: slots }, (_, index) => `
                  <span class="cabinet-mini-rack-unit ${index >= slots - usedSlots ? "is-used" : ""}"></span>
                `).join("")}
              </div>
            `;
          }

          renderCabinetSpaceView(rows, filteredRows, pageMeta) {
            const meta = LIST_PAGE_META[VIEW_IDS.CABINET];
            const statRows = filteredRows.length ? filteredRows : rows;
            const stats = statRows.reduce((acc, row, index) => {
              const usage = this.getCabinetUsage(row, index);
              acc.cabinets += 1;
              acc.devices += usage.deviceCount;
              acc.usedU += usage.usedU;
              acc.totalU += usage.height;
              return acc;
            }, { cabinets: 0, devices: 0, usedU: 0, totalU: 0 });
            const usageRate = stats.totalU > 0 ? Math.round((stats.usedU / stats.totalU) * 100) : 0;
            const cardRows = rows.length ? rows : statRows;
            return `
              <div class="cabinet-space-panel">
                <div class="cabinet-space-stats">
                  <section class="cabinet-space-stat">
                    <div>
                      <div class="cabinet-space-stat-title">机柜数</div>
                      <div class="cabinet-space-stat-value">${stats.cabinets}</div>
                      <div class="cabinet-space-stat-sub">当前筛选范围</div>
                    </div>
                    <div class="cabinet-space-stat-icon" aria-label="机柜数">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="7" y="3.5" width="10" height="17" rx="2" stroke="currentColor" stroke-width="1.7"></rect>
                        <path d="M10 7h4M10 10h4M10 13h4M10 16h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                      </svg>
                    </div>
                  </section>
                  <section class="cabinet-space-stat">
                    <div>
                      <div class="cabinet-space-stat-title">设备数</div>
                      <div class="cabinet-space-stat-value">${stats.devices}</div>
                      <div class="cabinet-space-stat-sub">已占用设备统计</div>
                    </div>
                    <div class="cabinet-space-stat-icon" aria-label="设备数">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <rect x="5" y="4" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.7"></rect>
                        <path d="M8 18h8M12 14v4M8.5 8h7M8.5 11h4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
                      </svg>
                    </div>
                  </section>
                  <section class="cabinet-space-stat">
                    <div>
                      <div class="cabinet-space-stat-title">利用率</div>
                      <div class="cabinet-space-stat-value">${usageRate}%</div>
                      <div class="cabinet-space-stat-sub">已使用：${stats.usedU}U　未使用：${Math.max(0, stats.totalU - stats.usedU)}U</div>
                    </div>
                    <div class="cabinet-space-stat-icon" aria-label="利用率">
                      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 18h16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>
                        <path d="M7 15l3.2-3.2 2.5 2.5L17.8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M15.5 8h2.8v2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                      </svg>
                    </div>
                  </section>
                </div>
                <div class="cabinet-space-content-head">
                  <input class="cabinet-space-search" type="text" placeholder="请搜索机柜名称/编号" aria-label="请搜索机柜名称或编号" />
                </div>
                ${cardRows.length
                  ? `<div class="cabinet-card-grid">
                      ${cardRows.map((row, index) => {
                        const usage = this.getCabinetUsage(row, index);
                        const percent = Math.min(100, Math.max(0, usage.percent));
                        const name = row.name || row.assetCode || "-";
                        return `
                          <button class="cabinet-visual-card" type="button" data-action="row-action" data-view="${escapeHtml(VIEW_IDS.CABINET)}" data-id="${escapeHtml(row.id)}" data-label="查看">
                            <div class="cabinet-visual-head">
                              <span class="cabinet-visual-title" title="${escapeHtml(name)}">${escapeHtml(name)}</span>
                              <span class="cabinet-visual-u">${escapeHtml(String(usage.height))}U</span>
                            </div>
                            ${this.renderCabinetMiniRack(usage)}
                            <div class="cabinet-usage-line">
                              <span>U位使用</span>
                              <strong>${usage.usedU}/${usage.height}</strong>
                            </div>
                            <div class="cabinet-usage-bar">
                              <span class="cabinet-usage-fill" style="width:${percent}%"></span>
                            </div>
                            <div class="cabinet-card-meta" title="${escapeHtml(row.assetLocation || "-")}">${escapeHtml(row.assetLocation || "-")}</div>
                            <div class="cabinet-card-meta">设备数：${usage.deviceCount} 台</div>
                          </button>
                        `;
                      }).join("")}
                    </div>`
                  : `<div class="cabinet-space-empty">暂无机柜数据</div>`}
                ${this.renderPagination(meta, VIEW_IDS.CABINET, pageMeta)}
              </div>
            `;
          }

          renderSpaceTreeNodes(nodes, viewId, activeNodeId, expandedNodes = {}, matchedIds = new Set(), depth = 0) {
            return `
              <ul>
                ${nodes.map((node) => {
                  const hasChildren = Array.isArray(node.children) && node.children.length > 0;
                  const isExpanded = hasChildren && Boolean(expandedNodes[node.id]);
                  const isMatched = matchedIds.has(node.id);
                  const icon = depth >= 2 ? "▣" : "◆";
                  return `
                    <li>
                      <div class="ledger-space-tree-row ${node.id === activeNodeId ? "is-active" : ""}">
                        ${hasChildren ? `
                          <button class="ledger-space-tree-toggle ${isExpanded ? "is-open" : ""}" type="button" data-action="toggle-space-tree" data-view="${escapeHtml(viewId)}" data-value="${escapeHtml(node.id)}" aria-label="${isExpanded ? "收起" : "展开"}${escapeHtml(node.label)}">
                            <span class="ledger-space-tree-caret" aria-hidden="true"></span>
                          </button>
                        ` : '<span class="ledger-space-tree-toggle-spacer" aria-hidden="true"></span>'}
                        <button class="ledger-space-tree-node ${isMatched ? "is-match" : ""}" type="button" data-action="space-tree-node" data-view="${escapeHtml(viewId)}" data-value="${escapeHtml(node.id)}" title="${escapeHtml(node.label)}">
                          <span class="ledger-space-tree-icon" aria-hidden="true">${icon}</span>
                          <span class="ledger-space-tree-label">${escapeHtml(node.label)}</span>
                          <span class="ledger-space-tree-count">${escapeHtml(String(node.count || 0))}</span>

          renderCabinetRackDialog(dialog) {
            const unitText = dialog.unit ? "第" + dialog.unit + "U位" : "当前U位";
