            const deviceRows = this.store.getListRows(VIEW_IDS.IT_FACILITY)
              .filter((row) => row.assetStatus === "空闲")
              .slice(0, 8);
            const fallbackDeviceRows = deviceRows.length ? deviceRows : this.store.getListRows(VIEW_IDS.IT_FACILITY).slice(0, 8);
            const selectedDevice = fallbackDeviceRows.find((row) => row.id === dialog.selectedDeviceId) || null;
            const listColumns = [
              { key: "name", label: "名称" },
              { key: "assetCode", label: "资产编号" },
              { key: "assetStatus", label: "资产状态" },
              { key: "assetCategory", label: "资产分类" },
              { key: "assetLocation", label: "资产位置" },
              { key: "serialCode", label: "序列号" }
            ];
            const shelfFields = [
              ...OPERATION_SHEET_COLUMNS,
              { key: "shelfLocation", label: "上架位置", width: 186, required: true },
              { key: "operationStartU", label: "开始U位", width: 108, required: true }
            ];
            const renderSelectOptions = (key, value = "") => {
              const optionMap = {
                assetStatus: ["空闲", "在用", "待上架"],
                assetCategory: OPERATION_SELECT_OPTIONS.assetCategory || [],
                assetLocation: OPERATION_SELECT_OPTIONS.assetLocation || [],
                shelfLocation: OPERATION_SELECT_OPTIONS.assetLocation || [],
                operationStartU: OPERATION_SELECT_OPTIONS.operationStartU || []
              };
              const options = optionMap[key] || [];
              if (!options.length) {
                return "";
              }
              return options.map((item) => `<option value="${escapeHtml(item)}"${String(value) === String(item) ? " selected" : ""}>${escapeHtml(item)}</option>`).join("");
            };
            const renderFormField = (field) => {
              const defaultValues = {
                assetStatus: "待上架",
                shelfLocation: "当前机柜 > " + unitText,
                operationStartU: dialog.unit || "1"
              };
              const value = defaultValues[field.key] || "";
              const hasOptions = Boolean(renderSelectOptions(field.key, value));
              return `
                <label class="${field.key === "description" ? "is-wide" : ""}">
                  <span>${escapeHtml(field.label)}${field.required ? " *" : ""}</span>
                  ${hasOptions
                    ? `<select>${renderSelectOptions(field.key, value)}</select>`
                    : `<input value="${escapeHtml(value)}" placeholder="请输入${escapeHtml(field.label)}" />`}
                </label>
              `;
            };
            let title = "添加设备";
            let subtitle = unitText + " · 请选择添加方式";
            let body = `
              <div class="cabinet-rack-choice-grid">
                <button class="cabinet-rack-choice" type="button" data-action="cabinet-rack-dialog-mode" data-mode="select">
                  <strong>选择设备</strong>
                  <span>从现有 IT 设备台账中选择待上架设备，并带入当前位置。</span>
                </button>
                <button class="cabinet-rack-choice" type="button" data-action="cabinet-rack-dialog-mode" data-mode="new">
                  <strong>添加新设备</strong>
                  <span>按 IT设备台账“上架”字段填写新设备信息。</span>
                </button>
              </div>
            `;
            let footer = `
              <button class="btn" type="button" data-action="close-cabinet-rack-dialog">取消</button>
            `;
            let compact = false;

            if (dialog.mode === "select") {
              title = "选择设备";
              subtitle = unitText + " · 选择可上架的 IT 设备";
              body = `
                <div class="cabinet-rack-device-list">
                  <table class="cabinet-rack-dialog-table">
                    <thead>
                      <tr>${listColumns.map((column) => `<th>${escapeHtml(column.label)}</th>`).join("")}</tr>
                    </thead>
                    <tbody>
                      ${fallbackDeviceRows.map((row) => `
                        <tr class="${row.id === dialog.selectedDeviceId ? "is-selected" : ""}" data-action="select-cabinet-rack-device" data-id="${escapeHtml(row.id)}" tabindex="0" aria-selected="${row.id === dialog.selectedDeviceId ? "true" : "false"}">
                          ${listColumns.map((column) => {
                            const value = row[column.key] || "-";
                            return `<td title="${escapeHtml(value)}">${escapeHtml(value)}</td>`;
                          }).join("")}
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
              `;
              footer = `
                <span class="cabinet-rack-selected-text">${selectedDevice ? `已选择：${escapeHtml(selectedDevice.name || selectedDevice.assetCode || selectedDevice.id)}` : "请点击列表行选择设备"}</span>
                <button class="btn" type="button" data-action="cabinet-rack-dialog-mode" data-mode="add">上一步</button>
                <button class="btn" type="button" data-action="close-cabinet-rack-dialog">取消</button>
                <button class="btn btn-primary" type="button" data-action="confirm-cabinet-rack-action" data-label="选择设备" ${selectedDevice ? "" : "disabled"}>确认选择</button>
              `;
            } else if (dialog.mode === "new") {
              title = "添加新设备";
              subtitle = unitText + " · 字段与 IT设备台账-上架 保持一致";
              body = `<div class="cabinet-rack-form">${shelfFields.map(renderFormField).join("")}</div>`;
              footer = `
                <button class="btn" type="button" data-action="cabinet-rack-dialog-mode" data-mode="add">上一步</button>
                <button class="btn" type="button" data-action="close-cabinet-rack-dialog">取消</button>
                <button class="btn btn-primary" type="button" data-action="confirm-cabinet-rack-action" data-label="添加新设备">提交</button>
              `;
            } else if (dialog.mode === "retire") {
              title = "迁出确认";
              subtitle = deviceText + " · " + unitText;
              compact = true;
              body = `<div class="cabinet-confirm-message">确认将 <strong>${escapeHtml(deviceText)}</strong> 从当前机柜迁出吗？迁出后设备将进入迁出流程。</div>`;
              footer = `
                <button class="btn" type="button" data-action="close-cabinet-rack-dialog">取消</button>
                <button class="btn btn-primary" type="button" data-action="confirm-cabinet-rack-action" data-label="迁出">确认迁出</button>
              `;
            } else if (dialog.mode === "offShelf") {
              title = "下架";
              subtitle = deviceText + " · " + unitText;
              compact = true;
              body = `
                <div class="cabinet-off-shelf-form">
                  <label>
                    <span>下架后位置 *</span>
                    <select>
                      ${(OPERATION_SELECT_OPTIONS.assetLocation || []).map((item) => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join("")}
                    </select>
                  </label>
                </div>
              `;
              footer = `
                <button class="btn" type="button" data-action="close-cabinet-rack-dialog">取消</button>
                <button class="btn btn-primary" type="button" data-action="confirm-cabinet-rack-action" data-label="下架">确认下架</button>
              `;
            }

            return `
              <div class="relation-modal-backdrop" data-action="close-cabinet-rack-dialog"></div>
              <section class="relation-modal cabinet-rack-dialog ${compact ? "compact" : ""}" role="dialog" aria-modal="true" aria-labelledby="cabinetRackDialogTitle">
                <header class="relation-modal-head">
                  <div>
                    <div class="relation-modal-title" id="cabinetRackDialogTitle">${escapeHtml(title)}</div>
                    <div class="relation-modal-subtitle">${escapeHtml(subtitle)}</div>
                  </div>
                  <button class="relation-modal-close" type="button" data-action="close-cabinet-rack-dialog" aria-label="关闭">×</button>
                </header>
                <div class="relation-modal-body">${body}</div>
                <footer class="relation-modal-footer">
                  <div class="relation-modal-actions">${footer}</div>
                </footer>
              </section>
            `;
          }

          renderOperationAssetDialog(dialog) {
            const sourceViewId = dialog.sourceViewId || VIEW_IDS.PENDING_ASSET;
            const sourceTitle = LIST_PAGE_META[sourceViewId]?.title || "资产列表";
            const selected = new Set(dialog.selectedRowIds || []);
            const rows = this.store.getFilteredRows(sourceViewId).slice(0, 60);
            const renderCell = (value) => `<td title="${escapeHtml(value || "-")}"><span class="cell-ellipsis">${escapeHtml(value || "-")}</span></td>`;
            return `
              <div class="relation-modal-backdrop" data-action="close-operation-asset-dialog"></div>
              <section class="relation-modal" role="dialog" aria-modal="true" aria-labelledby="operationAssetDialogTitle" style="width:min(980px,calc(100vw - 48px));">
                <header class="relation-modal-head">
                  <div>
                    <div class="relation-modal-title" id="operationAssetDialogTitle">选择资产</div>
                    <div class="relation-modal-subtitle">从「${escapeHtml(sourceTitle)}」中选择需要带入电子表格的资产。</div>
                  </div>
                  <button class="relation-modal-close" type="button" data-action="close-operation-asset-dialog" aria-label="关闭">×</button>
                </header>
                <div class="relation-modal-body" style="max-height:520px;overflow:auto;">
                  <table class="table-resizable" data-view="${escapeHtml(sourceViewId)}">
                    <colgroup>
                      <col style="width:44px;" />
                      <col style="width:170px;" />
                      <col style="width:150px;" />
                      <col style="width:100px;" />
                      <col style="width:210px;" />
                      <col style="width:170px;" />
                      <col style="width:140px;" />
                    </colgroup>
                    <thead>
                      <tr>
                        <th></th>
                        <th title="名称"><div class="th-content"><span class="th-label">名称</span></div></th>
                        <th title="资产编号"><div class="th-content"><span class="th-label">资产编号</span></div></th>
                        <th title="资产状态"><div class="th-content"><span class="th-label">资产状态</span></div></th>
                        <th title="资产分类"><div class="th-content"><span class="th-label">资产分类</span></div></th>
                        <th title="资产位置"><div class="th-content"><span class="th-label">资产位置</span></div></th>
                        <th title="序列号"><div class="th-content"><span class="th-label">序列号</span></div></th>
                      </tr>
                    </thead>
                    <tbody>
                      ${rows.length ? rows.map((row) => `
                        <tr class="${selected.has(row.id) ? "is-selected" : ""}">
                          <td>
                            <input type="checkbox" data-action="toggle-operation-asset-selection" data-id="${escapeHtml(row.id)}" aria-label="选择${escapeHtml(row.name || row.assetCode || "资产")}" ${selected.has(row.id) ? "checked" : ""} />
                          </td>
                          ${renderCell(row.name)}
                          ${renderCell(row.assetCode)}
                          ${renderCell(row.assetStatus)}
                          ${renderCell(row.assetCategory)}
                          ${renderCell(row.assetLocation)}
                          ${renderCell(row.serialNumber || row.serialCode)}
                        </tr>
                      `).join("") : `
                        <tr>
                          <td colspan="7">
                            <div class="empty-state">
                              <div class="empty-icon" aria-hidden="true"></div>
                              <div>没有可选择的资产</div>
                            </div>
                          </td>
                        </tr>
                      `}
                    </tbody>
                  </table>
                </div>
                <footer class="relation-modal-footer">
                  <div class="relation-modal-note">已选择 ${selected.size} 条资产</div>
                  <div class="relation-modal-actions">
                    <button class="btn" type="button" data-action="close-operation-asset-dialog">取消</button>
                    <button class="btn btn-primary" type="button" data-action="confirm-operation-asset-dialog">确认选择</button>
                  </div>
                </footer>
              </section>
            `;
          }

          renderOverlay(state) {
            if (state.ui.assetOverviewDialog) {
              return this.renderAssetOverviewDialog(state.ui.assetOverviewDialog);
            }
            if (state.ui.assetBoardSaveDialog) {
              return this.renderAssetBoardSaveDialog(state.ui.assetBoardSaveDialog);
            }
            if (state.ui.requirementDescriptionDialog) {
              return this.renderRequirementDescriptionDialog(state.ui.requirementDescriptionDialog);
            }
            if (state.ui.cabinetRackDialog) {
              return this.renderCabinetRackDialog(state.ui.cabinetRackDialog);
            }
            if (state.ui.operationAssetDialog) {
              return this.renderOperationAssetDialog(state.ui.operationAssetDialog);
            }
            if (state.ui.relationDialog) {
              return this.renderRelationDialog(state.ui.relationDialog);
            }
            if (state.ui.masterSlaveImportDialog) {
              return this.renderMasterSlaveImportDialog(state.ui.masterSlaveImportDialog);
            }
            if (state.ui.masterSlaveImportResultDialog) {
              return this.renderMasterSlaveImportResultDialog(state.ui.masterSlaveImportResultDialog);
            }
            if (state.ui.localDataUploadDialog) {
              return this.renderLocalDataUploadDialog(state.ui.localDataUploadDialog);
            }
            if (state.ui.masterSlaveTemplateDialog) {
              return this.renderMasterSlaveTemplateDialog(state.ui.masterSlaveTemplateDialog);
            }
            if (state.ui.advancedSearch) {
              return this.renderAdvancedSearchPanel(state.ui.advancedSearch);
            }
            const drawer = state.ui.drawer;
            if (!drawer) {
              return "";
            }
            const row = this.store.getListRows(drawer.viewId).find((item) => item.id === drawer.rowId);
            if (!row) {
              return "";
            }
            const title = LIST_PAGE_META[drawer.viewId]?.title || "详情";
            const entries = Object.entries(row).filter(([key]) => key !== "id");
            return `
              <div class="drawer-backdrop" data-action="close-drawer"></div>
              <aside class="drawer-panel" aria-label="${escapeHtml(title)}详情">
                <div class="drawer-head">
                  <div>
                    <h3>${escapeHtml(title)}详情</h3>
                    <div class="drawer-subtitle">${drawer.intent === "init" ? "确认资产初始化信息并执行当前动作。" : "查看当前台账记录的关键信息与操作反馈。"}</div>
                  </div>
                  <button class="close-btn" data-action="close-drawer" aria-label="关闭">×</button>
                </div>
                <div class="drawer-body">
                  <div class="drawer-grid">
                    ${entries.map(([key, value]) => `
                      <div class="drawer-field">
                        <strong>${escapeHtml(this.mapFieldLabel(key))}</strong>
                        <div>${escapeHtml(value || "-")}</div>
                      </div>
                    `).join("")}
                  </div>
                  <div class="drawer-note">${drawer.intent === "init" ? "初始化后将把当前记录从“待录入资产”演示流转到正式资产台账。" : "此侧栏用于承载查看、初始化、更多动作等交互，可继续扩展为编辑、流程审批或跳转详情页。"}</div>
                </div>
                <div class="drawer-footer">
                  <button class="btn" data-action="close-drawer">关闭</button>
                  <button class="btn btn-primary" data-action="drawer-action">${drawer.intent === "init" ? "执行初始化" : "确认操作"}</button>
                </div>
              </aside>
            `;
          }

          renderAdvancedSearchPanel(dialog) {
            const viewId = dialog.viewId || VIEW_IDS.IT_FACILITY;
            const fields = dialog.fields || {};
            const rows = this.store.getListRows(viewId);
            const categoryOptions = [...new Set(rows.map((row) => row.assetCategory).filter(Boolean))].slice(0, 24);
            const locationOptions = [...new Set(rows.map((row) => row.assetLocation).filter(Boolean))].slice(0, 24);
            const vendorOptions = [...new Set(rows.map((row) => row.vendor).filter(Boolean))].slice(0, 24);
            const modelOptions = [...new Set(rows.map((row) => row.model || String(row.assetCategory || "").split(">").slice(-1)[0]).filter(Boolean))].slice(0, 24);
            const fieldOptions = this.store.getAdvancedSearchFieldOptions(viewId);
            const activeFields = Array.isArray(dialog.activeFields) && dialog.activeFields.length
              ? dialog.activeFields
              : ["assetCode", "assetCategory", "assetLocation", "vendor", "model"];
            const optionList = (options, selected, placeholder) => `
              <option value="">${escapeHtml(placeholder)}</option>
              ${options.map((option) => `<option value="${escapeHtml(option)}"${option === selected ? " selected" : ""}>${escapeHtml(option)}</option>`).join("")}
            `;
            const renderSearchControl = (field) => {
              if (field === "assetCategory") {
                return `<select data-role="advanced-search-field" data-field="${escapeHtml(field)}">${optionList(categoryOptions, fields[field] || "", "请选择")}</select>`;
              }
              if (field === "assetLocation") {
                return `<select data-role="advanced-search-field" data-field="${escapeHtml(field)}">${optionList(locationOptions, fields[field] || "", "请选择")}</select>`;
              }
              if (field === "assetStatus") {
                return `<select data-role="advanced-search-field" data-field="${escapeHtml(field)}">${optionList(["在用", "空闲"], fields[field] || "", "请选择")}</select>`;
              }
              if (field === "vendor") {
                return `<select data-role="advanced-search-field" data-field="${escapeHtml(field)}">${optionList(vendorOptions, fields[field] || "", "请选择")}</select>`;
              }
              if (field === "model") {
                return `<select data-role="advanced-search-field" data-field="${escapeHtml(field)}">${optionList(modelOptions, fields[field] || "", "请选择")}</select>`;
              }
              return `<input type="text" data-role="advanced-search-field" data-field="${escapeHtml(field)}" value="${escapeHtml(fields[field] || "")}" />`;
            };
            const renderSearchField = (field) => {
              const meta = fieldOptions.find((item) => item.key === field);
              if (!meta) {
                return "";
              }
              const removable = !["assetCode", "assetCategory", "assetLocation", "vendor", "model"].includes(field);
              const demandAttrs = field === "vendor" || field === "model"
                ? ` data-demand-version="v1.2" data-demand-req-id="V3R5-4418" data-demand-title="高级搜索支持厂商和型号条件" data-demand-text="需求来源：V3R5-4418。||交互目的：高级搜索中默认提供厂商、型号作为查询条件，便于按设备来源和型号快速筛选台账资产。||展示规则：厂商和型号默认展示在高级搜索面板中，字段使用下拉选择，选项来自当前台账模拟数据去重结果。||状态限制：该条件与资产编号、资产分类、资产位置等条件按“满足以下全部条件”组合查询。||异常判断：当前台账无厂商或型号数据时，下拉保留请选择，不应影响其他条件查询。"`
                : "";
              return `
                <label class="advanced-search-field ${removable ? "is-removable" : ""}"${demandAttrs}>
                  <span>${escapeHtml(meta.label)}</span>
                  ${renderSearchControl(field)}
                  ${removable ? `<button class="advanced-search-remove" type="button" data-action="remove-advanced-search-condition" data-field="${escapeHtml(field)}" aria-label="清除${escapeHtml(meta.label)}条件">−</button>` : ""}
                </label>
              `;
            };
            return `
              <div class="advanced-search-backdrop" data-action="close-advanced-search"></div>
              <aside class="advanced-search-panel" role="dialog" aria-modal="true" aria-label="高级搜索">
                <header class="advanced-search-head">
                  <h3 class="advanced-search-title">高级搜索</h3>
                  <div class="advanced-search-actions">
                    <button class="btn btn-primary" type="button" data-action="save-advanced-search-shortcut">保存为快捷搜索</button>
                    <button class="btn btn-primary" type="button" data-action="apply-advanced-search">查询</button>
                    <button class="btn" type="button" data-action="reset-advanced-search">重置</button>
                    <button class="btn" type="button" data-action="close-advanced-search">取消</button>
                  </div>
                </header>
                <div class="advanced-search-body">
                  <label class="advanced-search-mode">
                    <input type="radio" checked />
                    <span>满足以下全部条件</span>
                  </label>
                  ${activeFields.map((field) => renderSearchField(field)).join("")}
                  <div class="advanced-search-add-wrap">
                    <button class="advanced-search-add" type="button" data-action="toggle-advanced-search-field-menu">
                      <span>+</span>
                      添加筛选条件
                    </button>
                    ${dialog.fieldMenuOpen ? `
                      <div class="advanced-search-field-menu">
                        ${fieldOptions.map((option) => {
                          const active = activeFields.includes(option.key);
                          return `<button class="advanced-search-field-option ${active ? "is-active" : ""}" type="button" data-action="select-advanced-search-field" data-field="${escapeHtml(option.key)}"${active ? " disabled" : ""}>${escapeHtml(option.label)}</button>`;
                        }).join("")}
                      </div>
                    ` : ""}
                  </div>
                </div>
              </aside>
            `;
          }

          renderAssetOverviewDialog(dialog) {
            const viewId = dialog.viewId || VIEW_IDS.IT_FACILITY;
            const allRows = this.store.getListRows(viewId);
            const rows = allRows.slice(0, 8);
            const pageSize = 8;
            const pageCount = Math.max(1, Math.ceil(allRows.length / pageSize));
            const title = dialog.title || "资产列表";
            return `
              <div class="relation-modal-backdrop" data-action="close-asset-overview-dialog"></div>
              <section class="relation-modal asset-overview-dialog" role="dialog" aria-modal="true" aria-labelledby="assetOverviewDialogTitle">
                <header class="relation-modal-head">

                    <div class="relation-modal-title" id="assetOverviewDialogTitle">${escapeHtml(title)} · 资产列表</div>

                    <table>
                      <thead>
                        <tr>
                          <th>资产名称</th>
                          <th>资产编号</th>
                          <th>资产分类</th>
                          <th>资产位置</th>
                          <th>资产状态</th>
                          <th>操作</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${rows.map((row) => `
                          <tr>
                            <td>${escapeHtml(row.name || "-")}</td>
                            <td>${escapeHtml(row.assetCode || row.serialCode || "-")}</td>
                            <td>${escapeHtml(row.assetCategory || "-")}</td>
                            <td>${escapeHtml(row.assetLocation || "-")}</td>
                            <td>${escapeHtml(row.assetStatus || "-")}</td>
                            <td><button class="asset-overview-dialog-op" type="button" data-action="top-action" data-label="查看资产详情">查看</button></td>
                          </tr>
                        `).join("")}
                      </tbody>
                    </table>
                  </div>
                </div>
                <footer class="relation-modal-footer">
                  <div class="asset-overview-dialog-pagination" aria-label="资产列表分页">
                    <span>共 ${allRows.length} 条</span>

          renderAssetBoardSaveDialog(dialog) {
            const mode = dialog.mode || "current";
            const nodes = dialog.nodes || {};
            const currentNodeType = dialog.currentNodeType || "园区";
            const expandedNodes = dialog.expandedNodes || {};
            const typeIconMap = {

              "楼层": "层",
              "房间": "房",
              "机柜列": "列"
            };
            const buildTree = () => {
              const root = [];
              const lookup = new Map();
              Object.keys(nodes).forEach((nodePath) => {
                const parts = nodePath.split(" / ");
                let parentPath = "";
                let siblings = root;
                parts.forEach((part, index) => {
                  const path = parentPath ? parentPath + " / " + part : part;
                  let item = lookup.get(path);
                  if (!item) {
                    item = { path, label: part, depth: index, children: [] };
                    lookup.set(path, item);
                    siblings.push(item);
                  }
                  parentPath = path;
                  siblings = item.children;
                });
              });
              return root;
            };
            const renderNode = (node) => {
              const hasChildren = node.children.length > 0;
              const expanded = !hasChildren || expandedNodes[node.path];
              const type = ["园区", "楼栋", "楼层", "房间", "机柜列"][node.depth] || "空间";
              return `
                <li>
                  <div class="asset-board-save-tree-row" style="padding-left:${6 + node.depth * 18}px;">

                      ? `<button class="asset-board-save-tree-toggle ${expanded ? "is-open" : ""}" type="button" data-action="toggle-asset-board-save-tree-node" data-node="${escapeHtml(node.path)}" aria-label="${expanded ? "收起" : "展开"}${escapeHtml(node.label)}"></button>`

                  ${hasChildren && expanded ? `<ul>${node.children.map(renderNode).join("")}</ul>` : ""}

              `;

                <input type="radio" name="assetBoardSaveMode" data-role="asset-board-save-mode" value="${escapeHtml(value)}"${mode === value ? " checked" : ""} />

                  <strong>${escapeHtml(title)}</strong>
                  <span>${escapeHtml(desc)}</span>
                </span>
              </label>
            `;
            return `
              <div class="relation-modal-backdrop" data-action="close-asset-board-save-dialog"></div>

              if (action === "close-asset-board-save-dialog") {
                this.store.closeAssetBoardSaveDialog();

              }
              if (action === "confirm-asset-board-save") {

              }
              if (action === "toggle-asset-board-save-tree-node") {
                this.store.toggleAssetBoardSaveTreeNode(actionTarget.getAttribute("data-node"));

                  return;

                this.store.closeRowMoreMenu(false);
                this.store.closeGuideMenu(false);
                this.store.pushToast("交互反馈", "已触发“" + label + "”原型交互。", "info");

              if (!this.columnResizeState) {

              const nextWidth = Math.max(
                this.columnResizeState.minWidth,
                this.columnResizeState.startWidth + (event.clientX - this.columnResizeState.startX)
              );
              this.columnResizeState.currentWidth = nextWidth;
              if (this.columnResizeState.col) {
                this.columnResizeState.col.style.width = nextWidth + "px";
              }
              if (this.columnResizeState.th) {
                this.columnResizeState.th.style.width = nextWidth + "px";

                return;

              if (role === "space-tree-search") {
                const viewId = target.getAttribute("data-view") || this.store.getState().ui.currentView;
                this.store.setSpaceTreeSearch(viewId, target.value, false);

              } else if (role === "template-object-search") {

                const nextInput = document.querySelector('[data-role="template-object-search"]');
                if (nextInput instanceof HTMLInputElement) {
                  nextInput.focus();
                  const length = nextInput.value.length;
                  nextInput.setSelectionRange(length, length);

              } else if (role === "form-tree-search") {
                this.store.setFormTreeSearch(target.value, false);
                this.refreshTreeSearchResult(role, target.closest(".panel"));

            document.addEventListener("dragstart", (event) => {
              const target = event.target;
              if (!(target instanceof HTMLElement)) {
                return;

              const handle = target.closest('[data-role="detail-field-drag"]');
              if (!handle) {
                return;
              }
              const row = handle.closest('[data-field-row="detail"]');
              const value = row?.getAttribute("data-value");
              if (!row || !value) {
                return;
              }

              this.clearDetailFieldDragState();
              this.detailFieldDragState = { value };
              row.classList.add("is-dragging");

              if (event.dataTransfer) {
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData("text/plain", value);
              }
            });

            document.addEventListener("dragover", (event) => {
              if (!this.detailFieldDragState) {
                return;
              }
              const target = event.target;
              if (!(target instanceof HTMLElement)) {
                return;
              }
              const row = target.closest('[data-field-row="detail"]');
              if (!row) {
                return;
              }

              event.preventDefault();
              document.querySelectorAll('[data-field-row="detail"].is-drop-target').forEach((node) => node.classList.remove("is-drop-target"));

              if (row.getAttribute("data-value") !== this.detailFieldDragState.value) {
                row.classList.add("is-drop-target");
                if (event.dataTransfer) {
                  event.dataTransfer.dropEffect = "move";
                }
              }
            });

            document.addEventListener("drop", (event) => {
              if (!this.detailFieldDragState) {
                return;

              const target = event.target;
              if (!(target instanceof HTMLElement)) {
                this.clearDetailFieldDragState();
                return;
              }
              const row = target.closest('[data-field-row="detail"]');
              if (!row) {
                this.clearDetailFieldDragState();
                return;
              }

              event.preventDefault();
              const sourceValue = this.detailFieldDragState.value;
              const targetValue = row.getAttribute("data-value");
              this.clearDetailFieldDragState();

              if (sourceValue && targetValue && sourceValue !== targetValue) {
                this.store.reorderDetailField(sourceValue, targetValue);
              }
            });

              this.clearDetailFieldDragState();

          captureRelationTableScroll() {
            const tableWrap = document.querySelector(".asset-relation-dialog .relation-table-wrap");
            if (!(tableWrap instanceof HTMLElement)) {
              return null;
            }
            return {
              left: tableWrap.scrollLeft,
              top: tableWrap.scrollTop
            };
          }

          restoreRelationTableScroll(scrollState) {
            if (!scrollState) {
              return;
            }
            window.requestAnimationFrame(() => {
              const tableWrap = document.querySelector(".asset-relation-dialog .relation-table-wrap");
              if (!(tableWrap instanceof HTMLElement)) {
                return;
              }
              tableWrap.scrollLeft = scrollState.left || 0;
              tableWrap.scrollTop = scrollState.top || 0;
            });
          }

          openFlowchartFile(filePath, label) {
            if (!filePath) {
              return;
            }
            const openedWindow = window.open(filePath, "_blank", "noopener");
            if (!openedWindow) {
              window.location.href = filePath;
            }
            this.store.pushToast("打开流程图", (label || "流程图") + " 已在新标签页打开。", "success");
          }

          refreshTreeSearchResult(role, panel) {
            if (!(panel instanceof HTMLElement)) {
              return;
            }
            const root = panel.querySelector(".tree-root");
            if (!(root instanceof HTMLElement)) {
              return;
            }
            const isFormTree = role === "form-tree-search";
            const treeState = isFormTree ? this.store.state.ui.formDesign : this.store.state.ui.detailDesign;
            const treeSearch = treeState.treeSearch || "";
            const treeResult = this.store.filterTreeByKeyword(FORM_TREE, treeSearch);
            const treeExpandedNodes = treeSearch
              ? Object.fromEntries([...treeResult.expandedIds].map((id) => [id, true]))
              : treeState.expandedNodes;
            root.innerHTML = treeResult.nodes.length > 0
              ? this.renderer.renderTree(
                treeResult.nodes,
                treeState.activeNode,
                isFormTree ? "form-node" : "detail-node",
                treeExpandedNodes,
                isFormTree ? "toggle-form-tree" : "toggle-detail-tree",
                treeResult.matchedIds
              )
              : '<div class="tree-empty">未找到匹配的资产分类</div>';
          }

          refreshSpaceTreeSearchResult(viewId, panel) {
            if (!viewId || !(panel instanceof HTMLElement)) {
              return;
            }
            const root = panel.querySelector(".ledger-space-tree");
            if (!(root instanceof HTMLElement)) {
              return;
            }
            const treeState = this.store.ensureSpaceTreeState(viewId);
            const treeSearch = treeState.treeSearch || "";
            const treeResult = this.store.filterTreeByKeyword(this.store.buildSpaceViewTree(viewId), treeSearch);
            const expandedNodes = treeSearch
              ? Object.fromEntries([...treeResult.expandedIds].map((id) => [id, true]))
              : treeState.expandedNodes;
            root.innerHTML = treeResult.nodes.length > 0
              ? this.renderer.renderSpaceTreeNodes(
                treeResult.nodes,
                viewId,
                treeState.activeNode,
                expandedNodes,
                treeResult.matchedIds
              )
              : '<div class="ledger-space-tree-empty">未找到匹配的空间节点</div>';
          }

          startColumnResize(handle, startX) {
            const key = handle.getAttribute("data-key");
            const viewId = handle.getAttribute("data-view");
            const th = handle.closest("th");
            const table = handle.closest("table");
            if (!key || !viewId || !th || !table) {
              return;
            }

            const col = table.querySelector(`col[data-key="${key}"]`);
            const handleNode = handle;
            handleNode.classList.add("is-dragging");
            document.body.style.cursor = "col-resize";
            document.body.style.userSelect = "none";
            this.columnResizeState = {
              key,
              viewId,
              startX,
              startWidth: th.getBoundingClientRect().width,
              currentWidth: th.getBoundingClientRect().width,
              minWidth: key === "__select" ? 36 : key === "__actions" ? 86 : 72,
              th,
              col,
              handleNode
            };
          }

          stopColumnResize() {
            if (!this.columnResizeState) {
              return;
            }

            const { viewId, key, currentWidth, handleNode } = this.columnResizeState;
            handleNode.classList.remove("is-dragging");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            this.store.setColumnWidth(viewId, key, currentWidth);
            this.columnResizeState = null;
          }

          clearDetailFieldDragState() {
            document.querySelectorAll('[data-field-row="detail"].is-dragging, [data-field-row="detail"].is-drop-target').forEach((node) => {
              node.classList.remove("is-dragging", "is-drop-target");
            });
            this.detailFieldDragState = null;
          }
        }

        class DemandExplainController {
          constructor() {
            this.enabled = false;
            this.activeVersion = "all";
            this.activeRequirementId = null;
            this.activeTrigger = null;
            this.hideTimer = null;
            this.popover = document.createElement("div");
            this.popover.className = "demand-popover";
            document.body.appendChild(this.popover);
            this.bindEvents();
          }

          bindEvents() {
            document.addEventListener("mouseover", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                this.showFor(trigger);
              }
            });
            document.addEventListener("mouseout", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                this.scheduleHide();
              }
            });
            this.popover.addEventListener("mouseenter", () => this.cancelHide());
            this.popover.addEventListener("mouseleave", () => this.scheduleHide());
            document.addEventListener("focusin", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                this.showFor(trigger);
              }
            });
            document.addEventListener("focusout", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                this.scheduleHide();
              }
            });
            document.addEventListener("click", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                event.preventDefault();
                event.stopPropagation();
                return;
              }
              if (!event.target.closest(".demand-popover")) {
                this.hide();
              }
            });
            window.addEventListener("scroll", () => this.hide(), true);
            window.addEventListener("resize", () => this.hide());
          }

          refresh(enabled, activeVersion = "all", activeRequirementId = null) {
            this.activeVersion = activeVersion || "all";
            this.activeRequirementId = activeRequirementId || null;
            this.setEnabled(enabled);
            const scopes = document.querySelectorAll("[data-demand-text]");
            scopes.forEach((scope) => {
              if (scope.classList.contains("demand-badge-trigger")) {
                return;
              }
              if (scope.closest("[data-demand-skip]")) {
                return;
              }
              if (scope.querySelector(":scope > .demand-badge")) {
                const trigger = scope.querySelector(":scope > .demand-badge .demand-badge-trigger");
                this.hydrateTrigger(trigger, scope);
                return;
              }
              scope.classList.add("demand-anchor");
              const badge = document.createElement("span");
              badge.className = "demand-badge";
              badge.hidden = !this.enabled;
              const trigger = document.createElement("button");
              trigger.type = "button";
              trigger.className = "demand-badge-trigger";
              trigger.textContent = "需";
              this.hydrateTrigger(trigger, scope);
              badge.appendChild(trigger);
              scope.appendChild(badge);
            });
            this.syncBadges();
          }

          hydrateTrigger(trigger, scope) {
            if (!trigger || !scope) {
              return;
            }
            const entries = this.getDemandEntries(scope);
            trigger.dataset.demandEntriesRef = JSON.stringify(entries);
            trigger.dataset.demandVersionsRef = entries.map((entry) => entry.version).join(",");
            trigger.dataset.demandReqIdsRef = String(scope.dataset.demandReqId || "")
              .split(",")
              .map((id) => id.trim())
              .filter(Boolean)
              .join(",");
          }

          getDemandEntries(scope) {
            const versions = String(scope.dataset.demandVersion || "v1.1")
              .split(",")
              .map((version) => version.trim())
              .filter(Boolean);
            const reqIds = String(scope.dataset.demandReqId || "")
              .split(",")
              .map((id) => id.trim())
              .filter(Boolean);
            const entries = versions.map((version, index) => {
              const suffix = this.toVersionDatasetSuffix(version);
              const duplicateIndex = versions.slice(0, index + 1).filter((item) => item === version).length;
              const duplicateSuffix = duplicateIndex > 1 ? suffix + duplicateIndex : suffix;
              return {
                version,
                reqId: reqIds[index] || reqIds[0] || "",
                title: scope.dataset["demandTitle" + duplicateSuffix] || scope.dataset["demandTitle" + suffix] || scope.dataset.demandTitle || "需求说明",
                text: scope.dataset["demandText" + duplicateSuffix] || scope.dataset["demandText" + suffix] || scope.dataset.demandText || ""
              };
            });
            return entries.length > 0 ? entries : [{ version: "v1.1", title: scope.dataset.demandTitle || "需求说明", text: scope.dataset.demandText || "" }];
          }

          toVersionDatasetSuffix(version) {
            const normalized = String(version || "")
              .replace(/^v/i, "")
              .split(".")
              .map((part) => part.replace(/\D/g, ""))
              .filter(Boolean)
              .join("");
            return normalized ? "V" + normalized : "";
          }

          setEnabled(enabled) {
            this.enabled = Boolean(enabled);
            if (!this.enabled) {
              this.hide();
            }
            this.syncBadges();
          }

          syncBadges() {
            document.querySelectorAll(".demand-badge").forEach((badge) => {
              const trigger = badge.querySelector(".demand-badge-trigger");
              const versions = String(trigger?.dataset.demandVersionsRef || "v1.1")
                .split(",")
                .map((version) => version.trim())
                .filter(Boolean);
              const reqIds = String(trigger?.dataset.demandReqIdsRef || "")
                .split(",")
                .map((id) => id.trim())
                .filter(Boolean);
              const matchedRequirement = !this.activeRequirementId || reqIds.includes(this.activeRequirementId);
              const matchedVersion = this.activeVersion === "all" || versions.includes(this.activeVersion);
              const matched = matchedRequirement && matchedVersion;
              badge.hidden = !this.enabled || !matched;
            });
          }

          showFor(trigger) {
            if (!this.enabled) {
              this.hide();
              return;
            }
            this.cancelHide();
            const entries = this.getVisibleEntries(trigger);
            if (entries.length === 0) {
              this.hide();
              return;
            }
            this.activeTrigger = trigger;
            const title = entries.length === 1 ? entries[0].title : "需求说明";
            const splitParts = (text) => String(text || "")
              .split("||")
              .map((part) => part.trim())
              .filter(Boolean);
            const escape = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;"
            }[ch]));
            const renderPart = (part) => {
              const isException = /^异常判断[：:]/.test(part);
              return '<p class="' + (isException ? "is-demand-exception" : "") + '">' + escape(part) + "</p>";
            };
            const renderEntry = (entry) => {
              const parts = splitParts(entry.text);
              const entryTitle = '<strong>' + escape((entry.version || "未标版本") + " · " + entry.title) + "</strong>";
              return entryTitle + parts.map(renderPart).join("");
            };
            this.popover.innerHTML = entries.map(renderEntry).join(entries.length > 1 ? '<hr style="border:0;border-top:1px solid #edf2f8;margin:10px 0;">' : "");
            this.popover.style.display = "block";
            this.position(trigger);
          }

          getVisibleEntries(trigger) {
            let entries = [];
            try {
              entries = JSON.parse(trigger.dataset.demandEntriesRef || "[]");
            } catch (error) {
              entries = [];
            }
            if (!Array.isArray(entries) || entries.length === 0) {
              entries = [{
                version: "v1.1",
                title: trigger.dataset.demandTitleRef || "需求说明",
                text: trigger.dataset.demandTextRef || ""
              }];
            }
            if (this.activeVersion === "all") {
              return this.activeRequirementId
                ? entries.filter((entry) => entry.reqId === this.activeRequirementId)
                : entries;
            }
            return entries.filter((entry) => {
              const matchedVersion = entry.version === this.activeVersion;
              const matchedRequirement = !this.activeRequirementId || entry.reqId === this.activeRequirementId;
              return matchedVersion && matchedRequirement;
            });
          }

          hide() {
            this.cancelHide();
            this.activeTrigger = null;
            this.popover.style.display = "none";
          }

          scheduleHide() {
            this.cancelHide();
            this.hideTimer = window.setTimeout(() => {
              if (this.popover.matches(":hover") || this.activeTrigger?.matches(":hover")) {
                this.scheduleHide();
                return;
              }
              this.hide();
            }, 160);
          }

          cancelHide() {
            if (this.hideTimer) {
              window.clearTimeout(this.hideTimer);
              this.hideTimer = null;
            }
          }

          position(trigger) {
            const rect = trigger.getBoundingClientRect();
            const popoverRect = this.popover.getBoundingClientRect();
            let left = rect.right + 8;
            let top = rect.top;
            if (left + popoverRect.width > window.innerWidth - 8) {
              left = Math.max(8, rect.left - popoverRect.width - 8);
            }
            if (top + popoverRect.height > window.innerHeight - 8) {
              top = Math.max(8, window.innerHeight - popoverRect.height - 8);
            }
            this.popover.style.left = left + "px";
            this.popover.style.top = top + "px";
          }
        }

        class PrototypeAnnotationController {
          constructor() {
            this.toggleEl = document.querySelector('[data-role="annotation-toggle"]');
            this.tagsEl = document.getElementById("annoFilterTags");
            this.activeVersion = "all";
            this.latestVersion = "";
            this.bindEvents();
          }

          bindEvents() {
            if (!this.toggleEl) return;
            this.toggleEl.addEventListener("click", () => {
              document.body.classList.toggle("annotation-mode");
              this.refresh();
            });
          }

          refresh() {
            if (!document.body.classList.contains("annotation-mode") || !this.tagsEl) return;
            const versions = Array.from(document.querySelectorAll(".anno[data-version]"))
              .map((node) => node.getAttribute("data-version"))
              .filter(Boolean)
              .filter((version, index, list) => list.indexOf(version) === index)
              .sort((left, right) => this.compareVersion(right, left));
            this.latestVersion = versions[0] || "";
            if (this.activeVersion !== "all" && versions.indexOf(this.activeVersion) === -1) {
              this.activeVersion = "all";
            }
            this.renderTags(versions);
            this.applyFilter();
          }

          renderTags(versions) {
            const renderTag = (label, version) => {
              const tag = document.createElement("span");
              tag.className = "anno-filter-tag" + (this.activeVersion === version ? " active" : "");
              tag.textContent = label;
              tag.addEventListener("click", () => {
                this.activeVersion = version;
                this.renderTags(versions);
                this.applyFilter();
              });
              return tag;
            };
            this.tagsEl.innerHTML = "";
            this.tagsEl.appendChild(renderTag("全部", "all"));
            versions.forEach((version) => this.tagsEl.appendChild(renderTag(version, version)));
          }

          applyFilter() {
            document.querySelectorAll(".anno[data-version]").forEach((node) => {
              const version = node.getAttribute("data-version");
              if (this.activeVersion === "all") {
                node.style.display = "";
                node.style.opacity = version === this.latestVersion ? "1" : "0.62";
                return;
              }
              node.style.display = version === this.activeVersion ? "" : "none";
              node.style.opacity = "1";
            });
          }

          compareVersion(left, right) {
            const parse = (value) => String(value || "").replace(/[^0-9.]/g, "").split(".").map((part) => Number(part) || 0);
            const leftParts = parse(left);
            const rightParts = parse(right);
            const length = Math.max(leftParts.length, rightParts.length);
            for (let i = 0; i < length; i += 1) {
              if ((leftParts[i] || 0) !== (rightParts[i] || 0)) {
                return (leftParts[i] || 0) - (rightParts[i] || 0);
              }
            }
            return 0;
          }
        }

        const store = new PrototypeStore();
        const renderer = new PrototypeRenderer(store, {
          topbar: document.getElementById("topbar"),
          sidebar: document.getElementById("sidebar"),
          content: document.getElementById("content"),
          overlay: document.getElementById("overlay"),
          toast: document.getElementById("toast-root")
        });
        window.prototypeAnnotationController = new PrototypeAnnotationController();
        window.demandExplainController = new DemandExplainController();
        const app = new PrototypeApp(store, renderer);
        app.init();
      })();
    </script>
  </body>
