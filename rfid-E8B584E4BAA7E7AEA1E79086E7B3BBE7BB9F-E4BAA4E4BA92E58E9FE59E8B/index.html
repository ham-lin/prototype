        static enrichRecognition(record, assetMap, channelMap) {
          const asset = assetMap.get(record.assetId);
          const channel = channelMap.get(record.channelId);
          const assetBound = Boolean(asset?.tagBound);
          const tagCode = record.tagCode || asset?.tagCode || "-";
          const extra = record.assetId ? ALERT_DEMO_ASSET_EXTRAS[record.assetId] : null;

          return {
            ...record,
            workOrderId: assetBound ? asset?.workOrderId || "-" : "-",
            assetName: assetBound ? asset?.name || "-" : "-",
            tagCode,
            owner: assetBound ? asset?.owner || "-" : "-",
            deviceStatus: assetBound ? asset?.status || "-" : "-",
            assetType: assetBound ? asset?.type || "-" : "-",
            assetLocation: assetBound ? asset?.location || "-" : "-",
            brandModel: assetBound ? asset?.brandModel || extra?.brandModel || asset?.type || "—" : "—",
            serialNumber: assetBound ? asset?.serialNumber || extra?.serialNumber || "—" : "—",
            sequenceNo: assetBound ? asset?.sequenceNo || extra?.sequenceNo || "—" : "—",
            idcRoom: assetBound ? asset?.idcRoom || extra?.idcRoom || "—" : "—",
            rack: assetBound ? asset?.rack || extra?.rack || "—" : "—",
            entryAt: assetBound ? asset?.entryAt || extra?.entryAt || "—" : "—",
            marketOrderNo: assetBound ? asset?.marketOrderNo || extra?.marketOrderNo || "—" : "—",
            assetBound,
            tagBound: assetBound,
            channelName: channel?.name || record.channelId,
            channelLocation: channel?.location || "-",
            channelBuilding: channel?.building || "-",
            alertIds: []
          };
        }
      }

      class PrototypeStore {
        constructor() {
          this.bus = new EventBus();
          this.ids = new IdFactory();
          this.aggregator = new AlertAggregator();
          this.channelGateway = new ChannelGateway();
          this.state = SeedFactory.create();
          this.ids.prime(this.state);
          this.alertEngine = new AlertEngine(this.ids);
          this.bootstrapAlerts();
        }

        subscribe(listener) {
          return this.bus.subscribe(listener);
        }

        emit() {
          this.bus.emit();
        }

        getState() {
          return this.state;
        }

        getListColumnPreset(listKey) {
          return LIST_COLUMN_PRESETS[listKey] || null;
        }

        getListColumnSettings(listKey) {
          const preset = this.getListColumnPreset(listKey);
          if (!preset) {
            return null;
          }

          const normalized = normalizeListColumnSettings(this.state.ui.listColumnSettings[listKey], preset);
          this.state.ui.listColumnSettings[listKey] = normalized;
          return normalized;
        }

        toggleListColumnMenu(listKey) {
          if (!this.getListColumnPreset(listKey)) {
            return;
          }

          this.state.ui.openListColumnMenu = this.state.ui.openListColumnMenu === listKey ? null : listKey;
          this.emit();
        }

        closeListColumnMenu() {
          if (!this.state.ui.openListColumnMenu) {
            return;
          }

          this.state.ui.openListColumnMenu = null;
          this.emit();
        }

        showAllListColumns(listKey) {
          const settings = this.getListColumnSettings(listKey);
          if (!settings) {
            return;
          }

          this.state.ui.listColumnSettings[listKey] = {
            ...settings,
            visible: [...settings.order]
          };
          this.emit();
        }

        toggleListColumnField(listKey, fieldId) {
          const settings = this.getListColumnSettings(listKey);
          if (!settings || !settings.order.includes(fieldId)) {
            return;
          }

          const visibleSet = new Set(settings.visible);
          if (visibleSet.has(fieldId)) {
            if (visibleSet.size <= 1) {
              this.pushToast("至少保留一列", "请至少保留一个字段用于表格展示。", "warning");
              this.emit();
              return;
            }
            visibleSet.delete(fieldId);
          } else {
            visibleSet.add(fieldId);
          }

          this.state.ui.listColumnSettings[listKey] = {
            ...settings,
            visible: settings.order.filter((id) => visibleSet.has(id))
          };
          this.emit();
        }

        reorderListColumnField(listKey, sourceId, targetId) {
          const settings = this.getListColumnSettings(listKey);
          if (!settings || sourceId === targetId) {
            return;
          }

          const sourceIndex = settings.order.indexOf(sourceId);
          const targetIndex = settings.order.indexOf(targetId);
          if (sourceIndex < 0 || targetIndex < 0) {
            return;
          }

          const nextOrder = [...settings.order];
          const [moved] = nextOrder.splice(sourceIndex, 1);
          nextOrder.splice(targetIndex, 0, moved);
          this.state.ui.listColumnSettings[listKey] = {
            ...settings,
            order: nextOrder,
            visible: nextOrder.filter((id) => settings.visible.includes(id))
          };
          this.emit();
        }

        bootstrapAlerts() {
          const chronological = cloneList(this.state.data.recognitionRecords).sort(
            (left, right) => new Date(left.occurredAt) - new Date(right.occurredAt)
          );

          chronological.forEach((record) => {
            const targetRecord = this.state.data.recognitionRecords.find((item) => item.id === record.id);
            if (!targetRecord) {
              return;
            }

            const generated = this.alertEngine.generateAlerts(targetRecord, this.state.data.alertRules);
            targetRecord.alertIds = generated.map((item) => item.id);
            this.state.data.alertRecords.push(...generated);
          });

          const seededStatuses = ["待处理", "已确认", "待处理", "已忽略", "待处理", "待处理", "已确认", "待处理", "已忽略"];
          const seededOperators = ["-", "王敏", "-", "李翔", "-", "-", "赵宁", "-", "陈越"];
          const seededRemarks = [
            "",
            "已联系租户确认，本次为计划内流转。",
            "",
            "经核查为测试演练流量，已忽略。",
            "",
            "",
            "通道识别正常，已补充处理说明。",
            "",
            "与当班运营确认后忽略，无需继续跟进。"
          ];
          this.state.data.alertRecords.forEach((alert, index) => {
            alert.resolutionStatus = seededStatuses[index % seededStatuses.length] || "待处理";
            if (alert.resolutionStatus === "待处理") {
              alert.processedBy = "-";
              alert.processedAt = "-";
              alert.resolutionRemark = "-";
              alert.processingHistory = [];
              return;
            }

            const firstAt = addMinutes(alert.occurredAt, 18 + index * 3);
            const firstBy = seededOperators[index % seededOperators.length] || CURRENT_USER_NAME;
            const firstRemark = seededRemarks[index % seededRemarks.length] || "已完成处理。";
            const status = alert.resolutionStatus;
            const baseEntry = {
              processedAt: formatDateTime(firstAt),
              processedBy: firstBy,
              status: status,
              remark: firstRemark
            };
            const history = [baseEntry];
            if (index === 1) {
              const secondAt = addMinutes(alert.occurredAt, 18 + index * 3 + 50);
              history.push({
                processedAt: formatDateTime(secondAt),
                processedBy: "赵宁",
                status: "已确认",
                remark: "二次复核，与租户运营确认，结论与首次处理一致。"
              });
            }
            alert.processingHistory = history;
            const last = history[history.length - 1];
            alert.processedBy = last.processedBy;
            alert.processedAt = last.processedAt;
            alert.resolutionRemark = last.remark;
          });

          this.sortCollections();
          this.recalculateChannelStats();
        }

        sortCollections() {
          this.state.data.recognitionRecords.sort((left, right) => new Date(right.occurredAt) - new Date(left.occurredAt));
          this.state.data.alertRecords.sort((left, right) => new Date(right.occurredAt) - new Date(left.occurredAt));
          this.state.data.syncLogs.sort((left, right) => new Date(right.time) - new Date(left.time));
          if (this.state.data.overviewDashboard) {
            this.state.data.overviewDashboard.assets.sort((left, right) => new Date(right.updatedAt) - new Date(left.updatedAt));
            this.state.data.overviewDashboard.powerTasks.sort((left, right) => new Date(right.occurredAt) - new Date(left.occurredAt));
            this.state.data.overviewDashboard.shelfUpTasks.sort((left, right) => new Date(right.occurredAt) - new Date(left.occurredAt));
            this.state.data.overviewDashboard.shelfDownTasks.sort((left, right) => new Date(right.occurredAt) - new Date(left.occurredAt));
          }
        }

        recalculateChannelStats() {
          const counters = new Map();
          const lastSeenMap = new Map();

          this.state.data.recognitionRecords.forEach((record) => {
            counters.set(record.channelId, (counters.get(record.channelId) || 0) + 1);
            if (!lastSeenMap.has(record.channelId) || new Date(record.occurredAt) > new Date(lastSeenMap.get(record.channelId))) {
              lastSeenMap.set(record.channelId, record.occurredAt);
            }
          });

          this.state.data.channels.forEach((channel) => {
            channel.todayPassCount = counters.get(channel.id) || 0;
            if (lastSeenMap.has(channel.id)) {
              channel.lastSeen = formatDateTime(lastSeenMap.get(channel.id));
            }
          });
        }

        getOwners() {
          return Array.from(
            new Set(
              this.state.data.assets
                .filter((asset) => asset.tagBound)
                .map((asset) => asset.owner)
            )
          );
        }

        getStatuses() {
          return Array.from(
            new Set(
              this.state.data.assets
                .filter((asset) => asset.tagBound)
                .map((asset) => asset.status)
            )
          );
        }

        getChannels() {
          return this.state.data.channels;
        }

        getFilteredChannels(filters = this.state.ui.channelFilters) {
          const f = { ...DEFAULT_CHANNEL_FILTERS, ...(filters || {}) };
          const keyword = String(f.keyword || "").trim().toLowerCase();
          return this.state.data.channels.filter((channel) => {
            const keywordMatched =
              !keyword ||
              [
                channel.id,
                channel.name,
                formatChannelPosition(channel.building, channel.location),
                channel.ip,
                channel.status
              ]
                .join(" ")
                .toLowerCase()
                .includes(keyword);
            const initMatched = f.initStatus === "ALL" || this.getChannelInitStatusLabel(channel) === f.initStatus;
            const statusMatched = f.status === "ALL" || channel.status === f.status;
            return keywordMatched && initMatched && statusMatched;
          });
        }

        getFilteredSyncLogs(filters = this.state.ui.syncLogFilters) {
          const f = { ...DEFAULT_SYNC_LOG_FILTERS, ...(filters || {}) };
          return this.state.data.syncLogs.filter((log) => this.matchesTimeRange(log.time, f, "sync"));
        }

        getChannelSyncPayloadPreview() {
          return this.state.data.channels.map((channel) => ({
            id: channel.id,
            status: channel.status,
            ip: channel.ip || ""
          }));
        }

        getTenants() {
          return this.state.data.tenants;
        }

        getTenantStatuses() {
          return Array.from(new Set(this.state.data.tenants.map((tenant) => tenant.status)));
        }

        getAssetById(assetId) {
          return this.state.data.assets.find((asset) => asset.assetId === assetId) || null;
        }

        getChannelById(channelId) {
          return this.state.data.channels.find((channel) => channel.id === channelId) || null;
        }

        isChannelInitialized(channelOrId) {
          const channel = typeof channelOrId === "string" ? this.getChannelById(channelOrId) : channelOrId;
          return Boolean(channel?.initialized);
        }

        getChannelInitStatusLabel(channelOrId) {
          return this.isChannelInitialized(channelOrId) ? "已初始化" : "未初始化";
        }

        getTenantById(tenantId) {
          return this.state.data.tenants.find((tenant) => tenant.id === tenantId) || null;
        }

        getTenantByName(tenantName) {
          const normalizedName = String(tenantName || "").trim();
          if (!normalizedName) {
            return null;
          }

          return this.state.data.tenants.find((tenant) => String(tenant.tenantName || "").trim() === normalizedName) || null;
        }

        getRecognitionById(recordId) {
          return this.state.data.recognitionRecords.find((record) => record.id === recordId) || null;
        }

        getAlertById(alertId) {
          return this.state.data.alertRecords.find((alert) => alert.id === alertId) || null;
        }

        getRuleById(ruleId) {
          return this.state.data.alertRules.find((rule) => rule.id === ruleId) || null;
        }

        getRecordAlerts(recordId) {
          return this.state.data.alertRecords.filter((alert) => alert.recognitionId === recordId);
        }

        getRuleHitCount(ruleId) {
          return this.state.data.alertRecords.filter((alert) => alert.ruleId === ruleId).length;
        }

        getMetrics() {
          const recognitionTotal = this.state.data.recognitionRecords.length;
          const alertTotal = this.state.data.alertRecords.length;
          const enabledRules = this.state.data.alertRules.filter((rule) => rule.enabled).length;
          const onlineChannels = this.state.data.channels.filter((channel) => channel.status === "在线").length;
          const hitCount = this.state.data.recognitionRecords.filter((record) => record.alertIds.length > 0).length;
          const highAlerts = this.state.data.alertRecords.filter((alert) => alert.level === "高").length;
          const pendingAlerts = this.state.data.alertRecords.filter((alert) => alert.resolutionStatus === "待处理").length;

          const topChannel = cloneList(this.state.data.channels).sort((left, right) => right.todayPassCount - left.todayPassCount)[0] || null;

          return {
            recognitionTotal,
            alertTotal,
            enabledRules,
            onlineChannels,
            hitRate: recognitionTotal ? Math.round((hitCount / recognitionTotal) * 100) : 0,
            highAlerts,
            pendingAlerts,
            topChannel
          };
        }

        getPrototypeReferenceTime(kind = "alert") {
          const source =
            kind === "recognition"
              ? this.state.data.recognitionRecords
              : kind === "sync"
                ? this.state.data.syncLogs
                : this.state.data.alertRecords;
          const key = kind === "sync" ? "time" : "occurredAt";
          const timestamps = source
            .map((item) => new Date(item[key]).getTime())
            .filter((value) => !Number.isNaN(value));
          return timestamps.length ? new Date(Math.max(...timestamps)) : new Date();
        }

        matchesTimeRange(value, filters, kind = "alert") {
          return matchesResolvedTimeRange(
            value,
            filters?.timeRange,
            this.getPrototypeReferenceTime(kind),
            filters?.customStart,
            filters?.customEnd
          );
        }

        getFilteredRecognitions(filters = this.state.ui.recognitionFilters) {
          const keyword = filters.keyword.trim().toLowerCase();

          return this.state.data.recognitionRecords.filter((record) => {
            const keywordMatched =
              !keyword ||
              [
                record.id,
                record.assetName,
                record.tagCode,
                record.owner,
                record.channelName,
                record.channelId
              ]
                .join(" ")
                .toLowerCase()
                .includes(keyword);

            const ownerMatched = matchesRuleCondition(filters.owner, record.owner);
            const statusMatched = matchesRuleCondition(filters.status, record.deviceStatus);
            const channelMatched = matchesRuleCondition(filters.channel, record.channelId);
            const timeMatched = this.matchesTimeRange(record.occurredAt, filters, "recognition");

            return keywordMatched && ownerMatched && statusMatched && channelMatched && timeMatched;
          });
        }

        getFilteredAlerts(filters = this.state.ui.alertFilters, options = {}) {
          const level = options.level || "ALL";
          const f = { ...DEFAULT_ALERT_FILTERS, ...(filters || {}) };

          return this.state.data.alertRecords.filter((record) => {
            const ownerMatched = matchesRuleCondition(f.owner, record.owner);
            const statusMatched = matchesRuleCondition(f.status, record.deviceStatus);
            const channelMatched = matchesRuleCondition(f.channel, record.channelId);
            const timeMatched = this.matchesTimeRange(record.occurredAt, f, "alert");
            const processStateMatched =
              f.processState === "ALL"
                ? true
                : f.processState === "processed"
                  ? record.resolutionStatus !== "待处理"
                  : record.resolutionStatus === "待处理";
            const pendingMatched = !options.pendingOnly || record.resolutionStatus === "待处理";
            const levelMatched = level === "ALL" || record.level === level;
            const brandMatched = matchAlertTextFilter(record.brandModel, f.brandModel);
            const serialMatched = matchAlertTextFilter(record.serialNumber, f.serialNumber);
            const seqMatched = matchAlertTextFilter(record.sequenceNo, f.sequenceNo);
            const roomMatched = matchAlertTextFilter(record.idcRoom, f.idcRoom);
            const rackMatched = matchAlertTextFilter(record.rack, f.rack);
            const marketMatched = matchAlertTextFilter(record.marketOrderNo, f.marketOrder);
            const entryMatched = matchAlertEntryTimeWindow(record.entryAt, f.entryTimeStart, f.entryTimeEnd);
            return (
              ownerMatched &&
              statusMatched &&
              channelMatched &&
              timeMatched &&
              processStateMatched &&
              pendingMatched &&
              levelMatched &&
              brandMatched &&
              serialMatched &&
              seqMatched &&
              roomMatched &&
              rackMatched &&
              marketMatched &&
              entryMatched
            );
          });
        }

        getFilteredRules(filters = this.state.ui.ruleFilters) {
          const f = { ...DEFAULT_RULE_FILTERS, ...(filters || {}) };
          const keyword = String(f.keyword || "").trim().toLowerCase();
          const anchor = this.getPrototypeReferenceTime("recognition");
          return this.state.data.alertRules.filter((rule) => {
            if (keyword && !String(rule.name || "").toLowerCase().includes(keyword)) {
              return false;
            }
            if (!ruleConditionOverlapsFilter(rule.ownerCondition, f.owner)) {
              return false;
            }
            if (!ruleConditionOverlapsFilter(rule.statusCondition, f.status)) {
              return false;
            }
            if (!ruleConditionOverlapsFilter(rule.channelCondition, f.channel)) {
              return false;
            }
            if (f.level && f.level !== "ALL" && rule.level !== f.level) {
              return false;
            }
            const lifecycleStatus = getRuleLifecycleStatus(rule, anchor);
            if ((f.enabled === "true" || f.enabled === "active") && lifecycleStatus !== "启用中") {
              return false;
            }
            if ((f.enabled === "false" || f.enabled === "stopped") && lifecycleStatus !== "已停用") {
              return false;
            }
            if (f.enabled === "expired" && lifecycleStatus !== "已过期") {
              return false;
            }
            return true;
          });
        }

        getAlertAggregates(options = {}) {
          const groupBy = options.groupBy || this.state.ui.alertGroupBy;
          const filters =
            options.filters ||
            (groupBy === "time"
              ? {
                  ...this.state.ui.alertFilters,
                  timeRange: "ALL",
                  customStart: "",
                  customEnd: ""
                }
              : this.state.ui.alertFilters);
          return this.aggregator.aggregate(
            this.getFilteredAlerts(filters),
            groupBy,
            this.state.data.channels,
            {
              anchorTime: this.getPrototypeReferenceTime("alert"),
              timeBuckets: ALERT_TIME_AGGREGATE_OPTIONS
            }
          );
        }

        getRecentRecognitions(limit = 5) {
          return this.state.data.recognitionRecords.slice(0, limit);
        }

        getRecentAlerts(limit = 5) {
          return this.state.data.alertRecords.slice(0, limit);
        }

        getPendingAlerts(filters = null, options = {}) {
          const activeFilters = filters || { ...DEFAULT_NOTICE_ALERT_FILTERS };
          return this.getFilteredAlerts(activeFilters, {
            pendingOnly: true,
            level: options.level || "ALL"
          });
        }

        getFilteredTenants(filters = this.state.ui.tenantFilters) {
          const keyword = String(filters?.keyword || "").trim().toLowerCase();
          const status = filters?.status || "ALL";

          return this.state.data.tenants.filter((tenant) => {
            const contactTexts = (tenant.contacts || []).flatMap((contact) => [contact.name, contact.phone, contact.email, contact.role]);
            const keywordMatched =
              !keyword ||
              [
                tenant.tenantName,
                tenant.tenantCode,
                tenant.status,
                tenant.address,
                tenant.sourceSystem,
                ...contactTexts
              ]
                .join(" ")
                .toLowerCase()
                .includes(keyword);
            const statusMatched = status === "ALL" || tenant.status === status;
            return keywordMatched && statusMatched;
          });
        }

        getOverviewDashboard() {
          return this.state.data.overviewDashboard || {
            assets: [],
            powerTasks: [],
            shelfUpTasks: [],
            shelfDownTasks: []
          };
        }

        getOverviewTenants() {
          const dashboard = this.getOverviewDashboard();
          return Array.from(
            new Set(
              [
                ...this.state.data.tenants.map((tenant) => tenant.tenantName),
                ...dashboard.assets.map((item) => item.tenant),
                ...dashboard.powerTasks.map((item) => item.tenant),
                ...dashboard.shelfUpTasks.map((item) => item.tenant),
                ...dashboard.shelfDownTasks.map((item) => item.tenant),
                ...this.state.data.alertRecords.map((item) => item.owner)
              ].filter(Boolean)
            )
          );
        }

        getOverviewReferenceTime() {
          const dashboard = this.getOverviewDashboard();
          const timestamps = [
            ...dashboard.assets.map((item) => new Date(item.updatedAt).getTime()),
            ...dashboard.powerTasks.map((item) => new Date(item.occurredAt).getTime()),
            ...dashboard.shelfUpTasks.map((item) => new Date(item.occurredAt).getTime()),
            ...dashboard.shelfDownTasks.map((item) => new Date(item.occurredAt).getTime()),
            ...this.state.data.recognitionRecords.map((item) => new Date(item.occurredAt).getTime()),
            ...this.state.data.alertRecords.map((item) => new Date(item.occurredAt).getTime())
          ].filter((value) => !Number.isNaN(value));
          return timestamps.length ? new Date(Math.max(...timestamps)) : new Date();
        }

        getOverviewRange(filters = this.state.ui.overviewFilters) {
          const anchor = this.getOverviewReferenceTime();
          const range = resolveTimeRangeWindow(filters?.timeRange || "ALL", anchor, filters?.customStart, filters?.customEnd);
          if (range) {
            return range;
          }
          return {
            start: addDays(anchor, -6),
            end: new Date(anchor)
          };
        }

        matchesOverviewTimeRange(value, filters = this.state.ui.overviewFilters) {
          return matchesResolvedTimeRange(
            value,
            filters?.timeRange || "ALL",
            this.getOverviewReferenceTime(),
            filters?.customStart,
            filters?.customEnd
          );
        }

        matchesOverviewFilters(item, filters = this.state.ui.overviewFilters, options = {}) {
          const tenantKey = options.tenantKey || "tenant";
          const timeKey = options.timeKey || "updatedAt";
          const tenantMatched = matchesRuleCondition(filters?.tenant || "ALL", item?.[tenantKey]);
          const timeMatched = !item?.[timeKey] || this.matchesOverviewTimeRange(item[timeKey], filters);
          return tenantMatched && timeMatched;
        }

        getOverviewAssets(filters = this.state.ui.overviewFilters) {
          return this.getOverviewDashboard().assets.filter((item) =>
            this.matchesOverviewFilters(item, filters, { tenantKey: "tenant", timeKey: "updatedAt" })
          );
        }

        getOverviewPowerTasks(filters = this.state.ui.overviewFilters) {
          return this.getOverviewDashboard().powerTasks.filter((item) =>
            this.matchesOverviewFilters(item, filters, { tenantKey: "tenant", timeKey: "occurredAt" })
          );
        }

        getOverviewShelfUpTasks(filters = this.state.ui.overviewFilters) {
          return this.getOverviewDashboard().shelfUpTasks.filter((item) =>
            this.matchesOverviewFilters(item, filters, { tenantKey: "tenant", timeKey: "occurredAt" })
          );
        }

        getOverviewShelfDownTasks(filters = this.state.ui.overviewFilters) {
          return this.getOverviewDashboard().shelfDownTasks.filter((item) =>
            this.matchesOverviewFilters(item, filters, { tenantKey: "tenant", timeKey: "occurredAt" })
          );
        }

        getOverviewAccessRecords(filters = this.state.ui.overviewFilters) {
          return this.state.data.recognitionRecords.filter((record) => {
            const tenantMatched = matchesRuleCondition(filters?.tenant || "ALL", record.owner);
            return tenantMatched && this.matchesOverviewTimeRange(record.occurredAt, filters);
          });
        }

        getOverviewAccessAlerts(filters = this.state.ui.overviewFilters) {
          return this.state.data.alertRecords.filter((record) => {
            const tenantMatched = matchesRuleCondition(filters?.tenant || "ALL", record.owner);
            return tenantMatched && this.matchesOverviewTimeRange(record.occurredAt, filters);
          });
        }

        getOverviewProcessedAlerts(filters = this.state.ui.overviewFilters) {
          return this.state.data.alertRecords.filter((record) => {
            if (!record.processedAt || record.processedAt === "-") {
              return false;
            }
            const tenantMatched = matchesRuleCondition(filters?.tenant || "ALL", record.owner);
            return tenantMatched && this.matchesOverviewTimeRange(record.processedAt, filters);
          });
        }

        isPowerTaskRisk(task) {
          return task.status === "异常" || (task.status === "测电中" && Number(task.elapsedHours || 0) > Number(task.slaHours || 0));
        }

        isShelfTaskOpen(task) {
          return task.status !== "已完成";
        }

        isShelfTaskRisk(task) {
          return task.status === "超时";
        }

        getOverviewAssetStatusCount(statuses, filters = this.state.ui.overviewFilters) {
          const targets = Array.isArray(statuses) ? statuses : [statuses];
          return this.getOverviewAssets(filters).filter((item) => targets.includes(item.deviceStatus)).length;
        }

        getOverviewDeviceStatusDistribution(filters = this.state.ui.overviewFilters) {
          const assets = this.getOverviewAssets({
            ...filters,
            timeRange: "ALL",
            customStart: "",
            customEnd: ""
          });
          const total = assets.length;
          return OVERVIEW_DEVICE_STATUS_OPTIONS.map((status) => {
            const value = assets.filter((item) => item.deviceStatus === status.key).length;
            return {
              ...status,
              value,
              percentage: total ? Math.round((value / total) * 1000) / 10 : 0
            };
          });
        }

        getOverviewKpis(filters = this.state.ui.overviewFilters) {
          const assets = this.getOverviewAssets(filters);
          const powerTasks = this.getOverviewPowerTasks(filters);
          const shelfUpTasks = this.getOverviewShelfUpTasks(filters);
          const shelfDownTasks = this.getOverviewShelfDownTasks(filters);
          const accessRecords = this.getOverviewAccessRecords(filters);
          const accessAlerts = this.getOverviewAccessAlerts(filters);
          const pendingAlerts = accessAlerts.filter((alert) => alert.resolutionStatus === "待处理");
          const onlineChannels = this.state.data.channels.filter((channel) => channel.status === "在线");

          return {
            totalAssets: assets.length,
            storedAssets: this.getOverviewAssetStatusCount("已入库", filters),
            waitPowerAssets: this.getOverviewAssetStatusCount("待测电及标签绑定", filters),
            powerReadyAssets: this.getOverviewAssetStatusCount("完成测电及标签绑定", filters),
            powerRiskCount: powerTasks.filter((task) => this.isPowerTaskRisk(task)).length,
            waitShelfUpAssets: this.getOverviewAssetStatusCount(["待上架验收", "待上架整改"], filters),
            waitShelfUpInspectAssets: this.getOverviewAssetStatusCount("待上架验收", filters),
            waitShelfUpRectifyAssets: this.getOverviewAssetStatusCount("待上架整改", filters),
            shelfUpRiskCount: shelfUpTasks.filter((task) => this.isShelfTaskRisk(task)).length,
            onlineAssets: this.getOverviewAssetStatusCount("已上架", filters),
            waitShelfDownAssets: this.getOverviewAssetStatusCount(["待下架", "待下架验收"], filters),
            waitShelfDownInspectAssets: this.getOverviewAssetStatusCount("待下架验收", filters),
            shelfDownRiskCount: shelfDownTasks.filter((task) => this.isShelfTaskRisk(task)).length,
            departedAssets: this.getOverviewAssetStatusCount("离场", filters),
            accessCount: accessRecords.length,
            pendingAlertCount: pendingAlerts.length,
            highPendingAlertCount: pendingAlerts.filter((alert) => alert.level === "高").length,
            onlineChannels: onlineChannels.length,
            offlineChannels: this.state.data.channels.length - onlineChannels.length,
            channelOnlineRate: this.state.data.channels.length
              ? Math.round((onlineChannels.length / this.state.data.channels.length) * 100)
              : 0
          };
        }

        getOverviewLifecycleSummary(filters = this.state.ui.overviewFilters) {
          const assets = this.getOverviewAssets({
            ...filters,
            timeRange: "ALL",
            customStart: "",
            customEnd: ""
          });
          const maxCount = Math.max(1, ...OVERVIEW_LIFECYCLE_STAGES.map((stage) => assets.filter((item) => item.lifecycle === stage.key).length));
          return OVERVIEW_LIFECYCLE_STAGES.map((stage) => {
            const count = assets.filter((item) => item.lifecycle === stage.key).length;
            return {
              ...stage,
              count,
              percentage: Math.round((count / maxCount) * 100)
            };
          });
        }

        getOverviewTrendBuckets(filters = this.state.ui.overviewFilters) {
          const range = this.getOverviewRange(filters);
          const totalHours = Math.max(1, Math.round((range.end - range.start) / 3600000));
          const useHourly = totalHours <= 48;
          const buckets = [];

          if (useHourly) {
            const bucketHours = 4;
            const anchor = new Date(range.end);
            anchor.setMinutes(0, 0, 0);
            const baseStart = new Date(anchor.getTime() - 5 * bucketHours * 3600000);
            for (let index = 0; index < 6; index += 1) {
              const start = new Date(baseStart.getTime() + index * bucketHours * 3600000);
              const end = new Date(start.getTime() + bucketHours * 3600000);
              buckets.push({
                label: formatHour(start),
                start,
                end
              });
            }
            return buckets;
          }

          const anchorDay = startOfDay(range.end);
          const baseStart = addDays(anchorDay, -5);
          for (let index = 0; index < 6; index += 1) {
            const start = startOfDay(addDays(baseStart, index));
            const end = addDays(start, 1);
            buckets.push({
              label: formatDate(start).slice(5),
              start,
              end
            });
          }
          return buckets;
        }

        countOverviewItemsInBucket(items, bucket, timeKey) {
          return items.filter((item) => {
            const rawValue = item?.[timeKey];
            if (!rawValue || rawValue === "-") {
              return false;
            }
            const date = new Date(String(rawValue).replace(" ", "T"));
            return !Number.isNaN(date.getTime()) && date >= bucket.start && date < bucket.end;
          }).length;
        }

        getOverviewRecognitionTrend(filters = this.state.ui.overviewFilters) {
          const records = this.getOverviewAccessRecords(filters);
          return this.getOverviewTrendBuckets(filters).map((bucket) => ({
            label: bucket.label,
            value: this.countOverviewItemsInBucket(records, bucket, "occurredAt")
          }));
        }

        getOverviewAlertTrend(filters = this.state.ui.overviewFilters) {
          const alerts = this.getOverviewAccessAlerts(filters);
          return this.getOverviewTrendBuckets(filters).map((bucket) => ({
            label: bucket.label,
            value: this.countOverviewItemsInBucket(alerts, bucket, "occurredAt")
          }));
        }

        getOverviewAlertProcessTrend(filters = this.state.ui.overviewFilters) {
          const processedAlerts = this.getOverviewProcessedAlerts(filters);
          return this.getOverviewTrendBuckets(filters).map((bucket) => ({
            label: bucket.label,
            value: this.countOverviewItemsInBucket(processedAlerts, bucket, "processedAt")
          }));
        }

        getOverviewTenantDistribution(filters = this.state.ui.overviewFilters, metric = "assets") {
          const assets = this.getOverviewAssets(filters);
          const powerTasks = this.getOverviewPowerTasks(filters);
          const shelfUpTasks = this.getOverviewShelfUpTasks(filters);
          const shelfDownTasks = this.getOverviewShelfDownTasks(filters);
          const alerts = this.getOverviewAccessAlerts(filters);
          return this.getOverviewTenants()
            .map((tenant) => {
              const assetCount = assets.filter((item) => item.tenant === tenant).length;
              const tenantPendingAlertCount = alerts.filter(
                (item) => item.owner === tenant && item.resolutionStatus === "待处理"
              ).length;
              const pendingCount =
                powerTasks.filter((item) => item.tenant === tenant && ["待测电", "测电中"].includes(item.status)).length +
                shelfUpTasks.filter((item) => item.tenant === tenant && this.isShelfTaskOpen(item)).length +
                shelfDownTasks.filter((item) => item.tenant === tenant && this.isShelfTaskOpen(item)).length +
                tenantPendingAlertCount;
              const value =
                metric === "pending" ? pendingCount : metric === "alerts" ? tenantPendingAlertCount : assetCount;
              return {
                label: tenant,
                value
              };
            })
            .sort((left, right) => right.value - left.value)
            .slice(0, 5);
        }

        getOverviewRiskDistribution(filters = this.state.ui.overviewFilters, dimension = this.state.ui.overviewChartSelections.riskDimension) {
          const assets = this.getOverviewAssets(filters);
          const powerTasks = this.getOverviewPowerTasks(filters);
          const shelfUpTasks = this.getOverviewShelfUpTasks(filters);
          const shelfDownTasks = this.getOverviewShelfDownTasks(filters);
          const alerts = this.getOverviewAccessAlerts(filters);
          const offlineChannels = this.state.data.channels.filter((channel) => channel.status !== "在线").length;
          const staleLedger = assets.filter((item) => item.deviceStatus === "已入库").length;
          const powerRisk = powerTasks.filter((item) => this.isPowerTaskRisk(item)).length;
          const shelfUpRisk = shelfUpTasks.filter((item) => this.isShelfTaskRisk(item)).length;
          const shelfDownRisk = shelfDownTasks.filter((item) => this.isShelfTaskRisk(item)).length;
          const accessRisk = alerts.filter((item) => item.level === "高" && item.resolutionStatus === "待处理").length + offlineChannels;

          if (dimension === "status") {
            return [
              { label: "异常", value: powerTasks.filter((item) => item.status === "异常").length, meta: "测电失败或需复检" },
              {
                label: "超时",
                value:
                  powerTasks.filter((item) => item.status === "测电中" && Number(item.elapsedHours || 0) > Number(item.slaHours || 0)).length +
                  shelfUpRisk +
                  shelfDownRisk,
                meta: "测电/上下架超 SLA"
              },
              { label: "待处理", value: alerts.filter((item) => item.resolutionStatus === "待处理").length, meta: "通行告警待闭环" },
              { label: "离线", value: offlineChannels, meta: "检测通道离线" }
            ];

            const next = { ...this.state.ui.alertFilters };
            if (groupBy === "owner") {
              next.owner = "ALL";
            } else if (groupBy === "channel") {
              next.channel = "ALL";
            } else if (groupBy === "status") {
              next.status = "ALL";

              next.customEnd = "";

            this.state.ui.alertFilters = normalizeMultiValueFilterGroup(next, ["owner", "status", "channel"]);

            this.state.ui.alertAggregatePage = 1;
            this.state.ui.alertPage = 1;
            this.state.ui.selectedAlertIds = [];
            this.emit();
            return;
          }

          const next = { ...this.state.ui.alertFilters };
          if (groupBy === "owner") {
            next.owner = key;
          } else if (groupBy === "channel") {
            next.channel = key;
          } else if (groupBy === "status") {

            this.emit();
            return;

          const availableIds = ids.filter((id) => !isAlertProcessLimitReached(this.getAlertById(id)));
          if (!availableIds.length) {
            this.pushToast("已达到处理上限", "所选告警均已处理 5 次，不能继续处理。", "warning");
            this.emit();
            return;

          if (availableIds.length < ids.length) {
            this.pushToast("部分告警已跳过", "已跳过达到 5 次处理上限的告警记录。", "warning");

          this.state.ui.modal = {

        saveAlertProcessing(payload) {
          const ids = Array.from(
            new Set(
              (Array.isArray(payload.ids) ? payload.ids : []).filter((id) => {
                const alert = this.getAlertById(id);
                return alert && !isAlertProcessLimitReached(alert);
              })
            )
          );
          if (!ids.length) {
            this.state.ui.modal = null;
            this.pushToast("已达到处理上限", "所选告警均已处理 5 次，不能继续处理。", "warning");
            this.emit();
            return;
          }

          const status = payload.status || "已确认";
          const processedBy = (payload.processedBy || CURRENT_USER_NAME).trim() || CURRENT_USER_NAME;
          const resolutionRemark = (payload.resolutionRemark || "").trim() || "已处理，未补充备注。";
          const processedAt = formatDateTime(new Date());

          ids.forEach((alertId) => {
            const alert = this.getAlertById(alertId);
            if (!alert) {
              return;
            }

            getSortedAlertProcessingHistory(alert);
            alert.processingHistory.push({
              processedAt: processedAt,
              processedBy: processedBy,
              status: status,
              remark: resolutionRemark
            });
            applyLatestAlertFieldsFromHistory(alert);
          });

          this.state.ui.selectedAlertIds = this.state.ui.selectedAlertIds.filter((id) => !ids.includes(id));
          this.state.ui.modal = null;
          this.pushToast(
            "告警处理完成",
            "已更新 " + ids.length + " 条告警记录的处理结果。",
            status === "已忽略" ? "warning" : "success"
          );
          this.emit();
        }

        openChannelInitModal(channelId) {
          const channel = this.getChannelById(channelId);
          if (!channel) {
            return;
          }
          this.state.ui.modal = { type: "channel-init", id: channelId };
          this.emit();
        }

        saveSyncTask(payload) {
          const task = this.state.data.syncTask;
          task.enabled = payload.enabled === "true";
          task.frequencyMinutes = Number(payload.frequencyMinutes || task.frequencyMinutes || 60);
          task.remark = (payload.remark || "").trim() || "按固定频率自动执行检测通道同步。";
          task.nextRunAt = task.enabled ? addMinutes(new Date(), task.frequencyMinutes).toISOString() : "-";

          this.state.ui.modal = null;
          this.pushToast(
            "定时任务已保存",
            task.enabled
              ? "检测通道定时同步已启用，执行频率为" + formatFrequencyLabel(task.frequencyMinutes) + "。"
              : "检测通道定时同步已停用。",
            task.enabled ? "success" : "warning"
          );
          this.emit();
        }

        saveChannelInitialization(payload) {
          const channel = this.getChannelById(payload.id);
          if (!channel) {
            return;
          }

          const { building, location } = parseChannelPositionValue(payload.position);
          if (!building || !location) {
            this.pushToast("位置未完成", "请先完整选择通道位置。", "warning");
            return;
          }

          const wasInitialized = this.isChannelInitialized(channel);
          channel.name = String(payload.name || "").trim();
          channel.building = building;
          channel.location = location;
          channel.initialized = true;
          channel.initializedAt = formatDateTime(new Date());
          this.state.ui.modal = null;
          this.pushToast(
            wasInitialized ? "通道档案已更新" : "通道初始化完成",
            wasInitialized
              ? channel.id + " 的档案信息已更新。"
              : channel.id + " 已补充初始化档案信息。",
            "success"
          );
          this.emit();
        }

        toggleSyncTaskEnabled() {
          const task = this.state.data.syncTask;
          task.enabled = !task.enabled;
          task.nextRunAt = task.enabled ? addMinutes(new Date(), task.frequencyMinutes).toISOString() : "-";
          this.pushToast(
            task.enabled ? "定时同步已启用" : "定时同步已停用",
            task.enabled
              ? "系统将按" + formatFrequencyLabel(task.frequencyMinutes) + "自动执行检测通道同步。"
              : "后续仅保留手动同步。",
            task.enabled ? "success" : "warning"
          );
          this.emit();
        }

        openRecognitionDetail(recordId) {
          this.state.ui.drawer = { type: "recognition", id: recordId };
          this.emit();
        }

        openAlertDetail(alertId) {
          this.state.ui.drawer = { type: "alert", id: alertId };
          this.emit();
        }

        openChannelDetail(channelId) {
          this.state.ui.drawer = { type: "channel", id: channelId };
          this.emit();
        }

        openTenantDetail(tenantId) {
          this.state.ui.drawer = { type: "tenant", id: tenantId };
          this.emit();
        }

        closeDrawer() {
          if (!this.state.ui.drawer) {
            return;
          }
          this.state.ui.drawer = null;
          this.emit();
        }

        openRuleModal(ruleId = null) {
          this.state.ui.modal = { type: "rule", id: ruleId };
          this.emit();
        }

        openApiModal() {
          this.state.ui.modal = { type: "api" };
          this.emit();
        }

        closeModal() {
          if (!this.state.ui.modal) {
            return;
          }
          this.state.ui.modal = null;
          this.emit();
        }

        toggleRule(ruleId) {
          const rule = this.getRuleById(ruleId);
          if (!rule) {
            return;
          }

          if (getRuleLifecycleStatus(rule, this.getPrototypeReferenceTime("recognition")) === "已过期") {
            this.pushToast("规则已过期", "已过期规则不能重新启用，请调整时间范围后再操作。", "warning");
            return;
          }

          rule.enabled = !rule.enabled;
          this.pushToast(
            rule.enabled ? "规则已启用" : "规则已停用",
            rule.enabled
              ? "后续识别事件会继续匹配这条规则。"
              : "这条规则不会再参与后续的告警生成。",
            rule.enabled ? "success" : "warning"
          );
          this.emit();
        }

        deleteRule(ruleId) {
          const index = this.state.data.alertRules.findIndex((rule) => rule.id === ruleId);
          if (index < 0) {
            return;
          }

          const [removed] = this.state.data.alertRules.splice(index, 1);
          if (this.state.ui.modal?.type === "rule" && this.state.ui.modal.id === ruleId) {
            this.state.ui.modal = null;
          }
          const rulePageSize = this.state.ui.rulePageSize || DEFAULT_ALERT_PAGE_SIZE;
          const ruleTotalPages = Math.max(1, Math.ceil(Math.max(this.getFilteredRules().length, 1) / rulePageSize));
          if (this.state.ui.rulePage > ruleTotalPages) {
            this.state.ui.rulePage = ruleTotalPages;
          }
          this.pushToast("规则已删除", removed.name + " 已从规则清单中删除，历史告警保留不变。", "warning");
          this.emit();
        }

        saveRule(payload) {
          const now = new Date();
          const rule = {
            id: payload.id || this.ids.nextRule(),
            name: payload.name.trim(),
            ownerCondition: normalizeRuleCondition(payload.ownerCondition),
            statusCondition: normalizeRuleCondition(payload.statusCondition),
            channelCondition: normalizeRuleCondition(payload.channelCondition),
            timeRange: payload.timeRange || "ALL",
            customStart: payload.customStart || "",
            customEnd: payload.customEnd || "",
            level: payload.level,
            enabled: payload.enabled === "true",
            action: payload.action.trim() || "通知服务台处理",
            description: payload.description.trim() || "暂无补充说明。"
          };

          if (payload.id) {
            const current = this.getRuleById(payload.id);
            if (current) {
              Object.assign(current, rule, { updatedAt: formatDateTime(now) });
            }
          } else {
            this.state.data.alertRules.unshift({
              ...rule,
              createdAt: formatDateTime(now)
            });
          }

          this.state.ui.modal = null;
          this.pushToast("规则已保存", "后续新的识别记录将按最新规则生成告警。", "success");
          this.emit();
        }

        setSyncingChannels(flag) {
          this.state.ui.syncingChannels = flag;
          this.emit();
        }

        mergeChannelPayload(payload, meta = {}) {
          const now = new Date();
          let addedCount = 0;
          const triggerType = meta.triggerType || "手动同步";
          const operator = meta.operator || CURRENT_USER_NAME;
          const currentMap = new Map(this.state.data.channels.map((channel) => [channel.id, channel]));

          payload.forEach((item) => {
            const normalized = {
              id: String(item?.id || "").trim(),
              status: String(item?.status || "离线").trim() || "离线",
              ip: String(item?.ip || "").trim()
            };
            if (!normalized.id) {
              return;
            }

            if (currentMap.has(normalized.id)) {
              Object.assign(currentMap.get(normalized.id), {
                id: normalized.id,
                status: normalized.status,
                ip: normalized.ip,
                lastSync: formatDateTime(now)
              });
            } else {
              addedCount += 1;
              this.state.data.channels.push({
                id: normalized.id,
                name: "",
                building: "",
                location: "",
                ip: normalized.ip,
                status: normalized.status,
                initialized: false,
                initializedAt: "",
                health: normalized.status === "在线" ? 90 : 50,
                lastSync: formatDateTime(now),
                lastSeen: "-",
                todayPassCount: 0
              });
            }
          });

          this.state.data.syncLogs.unshift({
            id: this.ids.nextSync(now),
            time: now.toISOString(),
            result: "成功",
            triggerType,
            operator,
            detail:
              triggerType +
              "执行完成，共返回 " +
              payload.length +
              " 条设备码、状态和 IP 信息" +
              (addedCount ? "，新增 " + addedCount + " 条新通道。" : "。"),
            payload
          });

          const task = this.state.data.syncTask;
          task.lastRunAt = now.toISOString();
          task.lastResult = "成功";
          task.lastTriggerType = triggerType;
          task.lastOperator = operator;
          if (task.enabled && triggerType === "定时任务") {
            task.nextRunAt = addMinutes(now, task.frequencyMinutes).toISOString();
          }

          this.recalculateChannelStats();
          this.sortCollections();
          this.pushToast(
            "通道同步完成",
            triggerType + "已获取 " + payload.length + " 条设备码、状态和 IP 信息。",
            "success"
          );
          this.emit();
        }

        simulateRecognition(payload) {
          const asset = this.getAssetById(payload.assetId);
          const normalizedChannels = normalizeRuleCondition(payload.channelId);
          const channelIds =
            normalizedChannels === "ALL"
              ? this.state.data.channels.map((channel) => channel.id)
              : normalizedChannels;
          const channels = channelIds
            .map((channelId) => this.getChannelById(channelId))
            .filter(Boolean);

          if (!asset || !channels.length) {
            return null;
          }

          if (!canGenerateRecognitionForAsset(asset)) {
            this.pushToast(
              "未生成识别记录",
              "仅当对象已具备 RFID 标签号时，经过检测通道才会产生识别记录。",
              "warning"
            );
            this.emit();
            return null;
          }

          const now = new Date();
          const assetMap = new Map(this.state.data.assets.map((item) => [item.assetId, item]));
          const channelMap = new Map(this.state.data.channels.map((item) => [item.id, item]));

          const records = [];
          const alerts = [];

          channels.forEach((channel, index) => {
            const occurredAt = new Date(now.getTime() + index * 1000);
            const record = SeedFactory.enrichRecognition(
              {
                id: this.ids.nextRecognition(occurredAt),
                occurredAt: occurredAt.toISOString(),
                assetId: asset.assetId,
                channelId: channel.id
              },
              assetMap,
              channelMap
            );

            const generatedAlerts = this.alertEngine.generateAlerts(record, this.state.data.alertRules);
            record.alertIds = generatedAlerts.map((item) => item.id);
            records.push(record);
            alerts.push(...generatedAlerts);
            channel.lastSync = formatDateTime(occurredAt);
            channel.lastSeen = formatDateTime(occurredAt);
          });

          this.state.data.recognitionRecords.unshift(...records);
          this.state.data.alertRecords.unshift(...alerts);
          this.recalculateChannelStats();
          this.sortCollections();

          const primaryRecord = records[0];
          const recordSubject = primaryRecord.assetBound ? primaryRecord.assetName : "标签 " + primaryRecord.tagCode;
          const channelHint =
            records.length === 1
              ? "经过 " + primaryRecord.channelName
              : "经过 " + records.length + " 个检测通道";
          const alertHint = alerts.length ? "，并生成 " + alerts.length + " 条告警" : "，未命中告警规则";
          this.pushToast("已生成识别记录", recordSubject + " " + channelHint + alertHint + "。", "success");
          this.emit();

          return records.length === 1 ? records[0] : records;
        }

        createRandomRecognition() {
          const eligibleAssets = this.state.data.assets.filter((asset) => canGenerateRecognitionForAsset(asset));
          const channels = this.state.data.channels.filter((channel) => channel.status === "在线");
          if (!eligibleAssets.length || !channels.length) {
            this.pushToast("无法模拟", "没有可用于模拟的 RFID 标签或没有在线通道。", "warning");
            this.emit();
            return null;
          }

          const asset = eligibleAssets[Math.floor(Math.random() * eligibleAssets.length)];
          const channel = channels[Math.floor(Math.random() * channels.length)];
          return this.simulateRecognition({
            assetId: asset.assetId,
            channelId: channel.id
          });
        }

        updateAlertStatus(alertId, status, meta = {}) {
          const alert = this.getAlertById(alertId);
          if (!alert) {
            return;
          }

          if (isAlertProcessLimitReached(alert)) {
            this.pushToast("已达到处理上限", "该告警已处理 5 次，不能继续处理。", "warning");
            this.emit();
            return;
          }

          getSortedAlertProcessingHistory(alert);
          const remark = (meta.resolutionRemark || "已处理，未补充备注。").trim() || "已处理，未补充备注。";
          const nextProcessedAt = meta.processedAt || formatDateTime(new Date());
          alert.processingHistory.push({
            processedAt: nextProcessedAt,
            processedBy: meta.processedBy || CURRENT_USER_NAME,
            status: status,
            remark: remark
          });
          applyLatestAlertFieldsFromHistory(alert);
          this.pushToast(
            "告警状态已更新",
            alert.ruleName + " 已标记为「" + status + "」。",
            status === "已忽略" ? "warning" : "success"
          );
          this.emit();
        }

        getCurrentDrawerData() {
          const drawer = this.state.ui.drawer;
          if (!drawer) {
            return null;
          }

          if (drawer.type === "recognition") {
            const record = this.getRecognitionById(drawer.id);
            if (!record) {
              return null;
            }
            return {
              type: "recognition",
              record,
              asset: this.getAssetById(record.assetId),
              alerts: this.getRecordAlerts(record.id)
            };
          }

          if (drawer.type === "alert") {
            const alert = this.getAlertById(drawer.id);
            if (!alert) {
              return null;
            }
            return {
              type: "alert",
              alert,
              recognition: this.getRecognitionById(alert.recognitionId),
              rule: this.getRuleById(alert.ruleId),
              tenant: this.getTenantByName(alert.owner)
            };
          }

          if (drawer.type === "channel") {
            const channel = this.getChannelById(drawer.id);
            if (!channel) {
              return null;
            }
            const recent = this.state.data.recognitionRecords.filter((record) => record.channelId === channel.id).slice(0, 4);
            return {
              type: "channel",
              channel,
              recent
            };
          }

          if (drawer.type === "tenant") {
            const tenant = this.getTenantById(drawer.id);
            if (!tenant) {
              return null;
            }
            return {
              type: "tenant",
              tenant
            };
          }

          return null;
        }

        getCurrentModalData() {
          const modal = this.state.ui.modal;
          if (!modal) {
            return null;
          }

          if (modal.type === "rule") {
            return {
              type: "rule",
              rule: modal.id ? this.getRuleById(modal.id) : null
            };
          }

          if (modal.type === "api") {
            const latest = this.state.data.syncLogs.find((log) => Array.isArray(log.payload) && log.payload.length);
            return {
              type: "api",
              payload: latest?.payload?.length ? latest.payload : this.getChannelSyncPayloadPreview()
            };
          }

          if (modal.type === "alert-process") {
            const alerts = modal.ids.map((id) => this.getAlertById(id)).filter(Boolean);
            if (!alerts.length) {
              return null;
            }

            return {
              type: "alert-process",
              alerts,
              ids: alerts.map((item) => item.id),
              defaultStatus: modal.defaultStatus || "",
              processedBy: CURRENT_USER_NAME,
              processedAt: formatDateTime(new Date())
            };
          }

          if (modal.type === "sync-task") {
            return {
              type: "sync-task",
              task: this.state.data.syncTask
            };
          }

          if (modal.type === "channel-init") {
            const channel = this.getChannelById(modal.id);
            if (!channel) {
              return null;
            }
            return {
              type: "channel-init",
              channel,
              positionOptions: getChannelPositionOptions(),
              selectedPosition: buildChannelPositionValue(channel.building, channel.location)
            };
          }

          if (modal.type === "notice-filter") {
            return {
              type: "notice-filter",
              filters: this.state.ui.noticeDrawer?.filters || { ...DEFAULT_NOTICE_ALERT_FILTERS }
            };
          }

          if (modal.type === "version-history") {
            return {
              type: "version-history",
              records: PROTOTYPE_CHANGELOG
            };
          }

          return null;
        }

        pushToast(title, message, tone = "success") {
          const toast = {
            id: this.ids.nextToast(),
            title,
            message,
            tone
          };

          this.state.ui.toasts = [toast, ...this.state.ui.toasts].slice(0, 4);
          window.setTimeout(() => {
            const before = this.state.ui.toasts.length;
            this.state.ui.toasts = this.state.ui.toasts.filter((item) => item.id !== toast.id);
            if (before !== this.state.ui.toasts.length) {
              this.emit();
            }
          }, 3200);
        }
      }

      class PrototypeRenderer {
        constructor(store, nodes) {
          this.store = store;
          this.nodes = nodes;
        }

        wrapProtoHint(state, hintText, innerHtml, options = {}) {
          if (!state.ui.requirementHintsEnabled) {
            return innerHtml;
          }
          if (hintText == null || hintText === "") {
            return innerHtml;
          }
          const tag = options.wrapperTag === "div" ? "div" : "span";
          const extraClass = options.wrapperClass ? " " + options.wrapperClass : "";
          const popoverHtml = renderProtoHintPopoverHtml(hintText);
          return `<${tag} class="proto-hint-host${extraClass}" tabindex="0">${innerHtml}<span class="proto-hint-anchor"><span class="proto-hint-badge" aria-hidden="true">需</span>${popoverHtml}</span></${tag}>`;
        }

        renderExpandToggleButton(action, expanded) {
          const label = getExpandToggleLabel(expanded);
          return `
            <button
              class="button ghost filter-toggle-icon-button"
              type="button"
              data-action="${escapeHtml(action)}"
              title="${escapeHtml(label)}"
              aria-label="${escapeHtml(label)}"
            >${getExpandToggleIconMarkup(expanded)}</button>`;
        }

        getChannelDisplayName(channel) {
          return String(channel?.name || "").trim() || "未初始化";
        }

        getChannelInitActionLabel(channel) {
          return this.store.isChannelInitialized(channel) ? "编辑初始化" : "初始化";
        }

        getChannelPositionLabel(channel) {
          return formatChannelPosition(channel?.building, channel?.location);
        }

        getChannelOptionLabel(channel, separator = " / ") {
          return channel.id + separator + this.getChannelDisplayName(channel);
        }

        renderChannelInitStatus(channel) {
          return this.renderBadge(this.store.getChannelInitStatusLabel(channel), "channel-init");
        }

        getConfiguredColumns(listKey, definitions) {
          const settings = this.store.getListColumnSettings(listKey);
          if (!settings) {
            return definitions;
          }

          const definitionMap = new Map(definitions.map((item) => [item.id, item]));
          return settings.order
            .map((id) => definitionMap.get(id))
            .filter((item) => item && settings.visible.includes(item.id));
        }

        renderListColumnOption(listKey, item, selected) {
          return `
            <button
              type="button"
              class="list-column-option ${selected ? "is-selected" : ""}"
              data-action="toggle-list-column-field"
              data-list="${escapeHtml(listKey)}"
              data-field="${escapeHtml(item.id)}"
              draggable="true"
            >
              <span class="list-column-check" aria-hidden="true">
                ${
                  selected
                    ? `
                      <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                        <path d="M3.5 8.2l2.5 2.6 6-6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    `
                    : ""
                }
              </span>
              <span class="list-column-option-label">${escapeHtml(item.label)}</span>
              <span class="list-column-grip" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                  <path d="M5 4h6M5 8h6M5 12h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </span>
            </button>
          `;
        }

        renderListColumnDropdown(listKey, preset, settings) {
          const allVisible = settings.visible.length === settings.order.length;
          const itemMap = new Map(preset.items.map((item) => [item.id, item]));
          const orderedItems = settings.order.map((id) => itemMap.get(id)).filter(Boolean);

          return `
            <div class="list-column-dropdown" role="dialog" aria-label="${escapeHtml(preset.title)}">
              <button type="button" class="list-column-option list-column-option-all ${allVisible ? "is-selected" : ""}" data-action="show-all-list-columns" data-list="${escapeHtml(listKey)}">
                <span class="list-column-check" aria-hidden="true">
                  ${
                    allVisible
                      ? `
                        <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                          <path d="M3.5 8.2l2.5 2.6 6-6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                      `
                      : ""
                  }
                </span>
                <span class="list-column-option-label">全选</span>
              </button>
              <div class="list-column-option-list">
                ${orderedItems.map((item) => this.renderListColumnOption(listKey, item, settings.visible.includes(item.id))).join("")}
              </div>
              <div class="list-column-dropdown-foot">勾选控制显示；拖拽右侧把手可调整字段顺序。</div>
            </div>
          `;
        }

        renderListColumnToolbar(listKey) {
          const preset = this.store.getListColumnPreset(listKey);
          if (!preset) {
            return "";
          }

          const state = this.store.getState();
          const settings = this.store.getListColumnSettings(listKey);
          const key = escapeHtml(listKey);
          const opened = state.ui.openListColumnMenu === listKey;
          const hintKey = LIST_COLUMN_TOOLBAR_HINT_KEYS[listKey];
          const hintText = hintKey ? PROTOTYPE_REQ_HINTS[hintKey] : "";
          const triggerButton = `
              <button
                type="button"
                class="list-column-trigger"
                data-action="toggle-list-column-menu"
                data-list="${key}"
                aria-label="打开字段设置"
                aria-expanded="${opened ? "true" : "false"}"
                title="字段设置"
              >
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M6.72 2.26h2.56l.26 1.27c.22.08.43.17.63.29l1.16-.59 1.81 1.81-.59 1.16c.12.2.22.41.29.63l1.27.26v2.56l-1.27.26c-.08.22-.17.43-.29.63l.59 1.16-1.81 1.81-1.16-.59c-.2.12-.41.22-.63.29l-.26 1.27H6.72l-.26-1.27a4.8 4.8 0 01-.63-.29l-1.16.59-1.81-1.81.59-1.16a4.8 4.8 0 01-.29-.63l-1.27-.26V6.98l1.27-.26c.08-.22.17-.43.29-.63l-.59-1.16 1.81-1.81 1.16.59c.2-.12.41-.22.63-.29l.26-1.27z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
                  <circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.1"/>
                </svg>
              </button>`;
          const wrappedTrigger = this.wrapProtoHint(state, hintText, triggerButton.trim());
          return `
            <div class="list-column-menu ${opened ? "is-open" : ""}" data-list-menu="${key}">
              ${wrappedTrigger}
              ${opened && settings ? this.renderListColumnDropdown(listKey, preset, settings) : ""}
            </div>
          `;
        }

        render() {
          const state = this.store.getState();
          if (this.nodes.topbar) {
            this.nodes.topbar.innerHTML = this.renderTopbar(state);
          }
          this.nodes.sidebar.innerHTML = this.renderSidebar(state);
          this.nodes.header.innerHTML = this.renderHeader(state);
          this.nodes.content.innerHTML = this.renderView(state);
          this.nodes.overlay.innerHTML = this.renderOverlay(state);
          this.nodes.toast.innerHTML = this.renderToasts(state);
        }

        renderTopbar(state) {
          const pendingAlerts = this.store.getPendingAlerts();
          const pendingCount = pendingAlerts.length;
          const pendingCountLabel = pendingCount > 99 ? "99+" : String(pendingCount);
          const noticeDrawerOpen = Boolean(state.ui.noticeDrawer?.open);
          const guideOpen = Boolean(state.ui.prototypeGuideMenuOpen);
          const noticeBtn = `
              <button
                type="button"
                class="topbar-ico ${noticeDrawerOpen ? "is-active" : ""}"
                data-action="toggle-notice-drawer"
                title="实时告警"
                aria-label="实时告警"
                aria-expanded="${noticeDrawerOpen ? "true" : "false"}"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M12 22a2 2 0 002-2H10a2 2 0 002 2zm6-6V11a6 6 0 10-12 0v5l-2 2v1h16v-1l-2-2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                </svg>

        renderNavItem(state, item, options = {}) {

        renderSidebar(state) {
          const metrics = this.store.getMetrics();
          const overviewItem = { id: "overview", label: "总览", hint: "全局运营态势", count: metrics.pendingAlerts };
          const ledgerItem = { id: "ledger", label: "设备台账", hint: "跳转外部系统", count: 0 };
          const mgmtItems = [
            { id: "power-mgmt", label: "测电管理", hint: "跳转外部系统", count: 0 },
            { id: "shelf-up", label: "上架管理", hint: "跳转外部系统", count: 0 },
            { id: "shelf-down", label: "下架管理", hint: "跳转外部系统", count: 0 }

          const accessItems = [
            { id: "recognition", label: "识别记录", hint: "检测事件明细", count: state.data.recognitionRecords.length },
            { id: "rules", label: "告警规则", hint: "条件与启停管理", count: state.data.alertRules.filter((rule) => rule.enabled).length },
            { id: "alerts", label: "告警记录", hint: "聚合、导出与处理跟踪", count: state.data.alertRecords.length },
            { id: "channels", label: "检测通道管理", hint: "接口同步与定时任务", count: state.data.channels.length }

          const infoItems = [

              <span class="sidebar-head-kicker">当前模块</span>
              <span class="sidebar-head-title">资产运营</span>

              <div class="nav-group">
                <div class="nav-group-title">管理活动</div>
                ${mgmtItems.map((item) => this.renderNavItem(state, item, { sub: true })).join("")}

              <div class="nav-group">
                <div class="nav-group-title">通行管理</div>
                ${accessItems.map((item) => this.renderNavItem(state, item, { sub: true })).join("")}
              </div>
              <div class="nav-group">
                <div class="nav-group-title">信息维护</div>
                ${infoItems.map((item) => this.renderNavItem(state, item, { sub: true })).join("")}

        renderHeader(state) {
          const view = VIEW_META[state.ui.currentView] || { label: "", subtitle: "" };

          return `
            <div>
              <h2 class="page-title">${escapeHtml(view.label)}</h2>
              <p class="page-subtitle">${escapeHtml(view.subtitle)}</p>
            </div>
            <div class="page-actions">
              ${this.renderHeaderActions(state)}
            </div>
          `;
        }

        renderHeaderActions(state) {
          const externalViews = new Set(["ledger", "power-mgmt", "shelf-up", "shelf-down"]);
          if (externalViews.has(state.ui.currentView)) {
            return this.wrapProtoHint(
              state,
              PROTOTYPE_REQ_HINTS.header_external,
              `<a class="button primary" href="${EXTERNAL_MODULE_URL}" target="_blank" rel="noopener noreferrer">新窗口打开外部系统</a>`
            );
          }

          if (state.ui.currentView === "overview") {
            return "";
          }

          if (state.ui.currentView === "recognition") {
            return "";
          }

          if (state.ui.currentView === "rules") {
            return this.wrapProtoHint(
              state,
              PROTOTYPE_REQ_HINTS.header_add_rule,
              `<button class="button primary" data-action="open-rule-modal">新增规则</button>`

          }

          if (state.ui.currentView === "channels") {
            return `
              ${this.wrapProtoHint(
