                PROTOTYPE_REQ_HINTS.header_sync_task,
                `<button class="button secondary" type="button" disabled title="本次先不做">定时任务设置</button>`
              )}
              ${this.wrapProtoHint(
                state,
                PROTOTYPE_REQ_HINTS.header_sync_channels,
                `<button class="button primary" type="button" disabled title="本次先不做">接口同步通道</button>`
              )}
            `;
          }

          return "";
        }

        renderExternalModule(state) {
          const meta = VIEW_META[state.ui.currentView] || { label: "外部模块", subtitle: "" };
          const showCredentials = ["ledger", "power-mgmt", "shelf-up", "shelf-down"].includes(
            state.ui.currentView
          );
          const credentialsBlock = showCredentials
            ? `<p class="external-link-credentials">
                演示环境账号与密码（联调/演示用，勿外泄）：账号 <strong>admin</strong>，密码 <strong>xbrother@136</strong>
              </p>`
            : "";
          return `
            <section class="card section-card external-link-card">
              <div class="card-head">
                <div>
                  <h3 class="card-title">${escapeHtml(meta.label)}</h3>
                  <p class="card-subtitle">${escapeHtml(meta.subtitle)}</p>
                </div>
              </div>
              <div style="padding: 0 1rem 1.25rem;">
                <p style="margin-bottom: 0.65rem; color: var(--text-secondary); font-size: 0.875rem;">
                  点击下方链接在新窗口打开既有业务系统页面。
                </p>
                <a class="external-link-url" href="${EXTERNAL_MODULE_URL}" target="_blank" rel="noopener noreferrer">${escapeHtml(EXTERNAL_MODULE_URL)}</a>
                ${credentialsBlock}
              </div>
            </section>
          `;
        }

        renderView(state) {
          switch (state.ui.currentView) {
            case "overview":
              return this.renderOverview(state);
            case "recognition":
              return this.renderRecognition(state);
            case "rules":
              return this.renderRules(state);
            case "alerts":
              return this.renderAlerts(state);
            case "channels":
              return this.renderChannels(state);
            case "tenants":
              return this.renderTenants(state);
            case "ledger":
            case "power-mgmt":
            case "shelf-up":
            case "shelf-down":
              return this.renderExternalModule(state);
            default:
              return "";
          }
        }

        renderOverviewFlowBoard(items) {
          return `
            <div class="overview-flow">
              ${items.map((item, index) => `
                <div class="overview-flow-step">
                  <div class="overview-flow-step-head">
                    <span class="overview-flow-index">${index + 1}</span>
                    <strong>${escapeHtml(item.label)}</strong>
                  </div>
                  <div class="overview-flow-count">${item.count}</div>
                  <div class="progress-track">
                    <div class="progress-fill" style="width:${item.percentage}%"></div>
                  </div>
                  <p>${escapeHtml(item.hint)}</p>
                </div>
              `).join("")}
            </div>
          `;
        }

        renderOverviewCompositeTrendChart(items) {
          if (!items.length) {
            return '<div class="empty-state">当前筛选条件下没有可展示的趋势数据。</div>';
          }

          const maxValue = Math.max(1, ...items.flatMap((item) => [item.recognition, item.alert, item.processed]));
          const n = items.length;
          const W = 640;
          const H = 124;
          const padL = 34;
          const padR = 14;
          const padT = 6;
          const padB = 2;
          const chartW = W - padL - padR;
          const chartH = H - padT - padB;
          const xAt = (i) => (n <= 1 ? padL + chartW / 2 : padL + (i / (n - 1)) * chartW);
          const yAt = (v) => padT + chartH * (1 - Math.min(Math.max(Number(v) || 0, 0), maxValue) / maxValue);

          const smoothPathThroughPoints = (pts) => {
            if (pts.length === 0) {
              return "";
            }
            if (pts.length === 1) {
              const p = pts[0];
              return `M ${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
            }
            let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)}`;
            for (let i = 0; i < pts.length - 1; i += 1) {
              const p0 = pts[Math.max(0, i - 1)];
              const p1 = pts[i];
              const p2 = pts[i + 1];
              const p3 = pts[Math.min(pts.length - 1, i + 2)];
              const cp1x = p1.x + (p2.x - p0.x) / 6;
              const cp1y = p1.y + (p2.y - p0.y) / 6;
              const cp2x = p2.x - (p3.x - p1.x) / 6;
              const cp2y = p2.y - (p3.y - p1.y) / 6;
              d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)} ${cp2x.toFixed(2)} ${cp2y.toFixed(2)} ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
            }
            return d;
          };

          const gridLines = [0, 0.25, 0.5, 0.75, 1]
            .map((t) => {
              const y = padT + chartH * (1 - t);
              return `<line x1="${padL}" y1="${y.toFixed(2)}" x2="${padL + chartW}" y2="${y.toFixed(2)}" stroke="#f2f3f5" stroke-width="1" />`;
            })
            .join("");

          const hoverBands = items
            .map((_, i) => {
              const left = i === 0 ? padL : (xAt(i - 1) + xAt(i)) / 2;
              const right = i === n - 1 ? padL + chartW : (xAt(i) + xAt(i + 1)) / 2;
              const w = Math.max(0, right - left);
              return `<rect class="overview-composite-hover-band" x="${left.toFixed(2)}" y="${padT}" width="${w.toFixed(2)}" height="${chartH}" fill="rgba(0,0,0,0)" pointer-events="all" data-slot-index="${i}" />`;
            })
            .join("");

          const series = [
            { color: "#1677ff", get: (row) => row.recognition },
            { color: "#fa541c", get: (row) => row.alert },
            { color: "#52c41a", get: (row) => row.processed }
          ];

          const smoothPaths = series
            .map((s) => {
              const pts = items.map((row, i) => ({ x: xAt(i), y: yAt(s.get(row)) }));
              const pathD = smoothPathThroughPoints(pts);
              return `<path fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="${pathD}" />`;
            })
            .join("");

          const dots = series
            .map((s) =>
              items
                .map((row, i) => {
                  const cx = xAt(i).toFixed(2);
                  const cy = yAt(s.get(row)).toFixed(2);
                  return `<circle cx="${cx}" cy="${cy}" r="3" fill="#fff" stroke="${s.color}" stroke-width="1.5" />`;
                })
                .join("")
            )
            .join("");

          const tipPayload = encodeURIComponent(
            JSON.stringify(
              items.map((row) => ({
                label: row.label,
                recognition: row.recognition,
                alert: row.alert,
                processed: row.processed
              }))
            )
          );

          return `
            <div class="overview-composite-trend-block">
              <div class="overview-trend-legend">
                <span class="legend-item"><span class="legend-dot overview-records"></span>识别记录</span>
                <span class="legend-item"><span class="legend-dot overview-alert-records"></span>告警记录</span>
                <span class="legend-item"><span class="legend-dot overview-alert-processed"></span>告警处置</span>
              </div>
              <div class="overview-trend-chart overview-composite-line-chart" data-composite-trend-chart="true" data-overview-trend-points="${tipPayload}">
                <svg class="overview-composite-line-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="综合趋势曲线图">
                  ${gridLines}
                  ${smoothPaths}
                  ${dots}
                  ${hoverBands}
                </svg>
                <div class="overview-composite-tooltip" hidden></div>
                <div class="overview-trend-x-labels" style="grid-template-columns: repeat(${n}, minmax(0, 1fr));">
                  ${items.map((item) => `<span class="trend-label">${escapeHtml(item.label)}</span>`).join("")}
                </div>
              </div>
            </div>
          `;
        }

        renderOverviewSingleTrendChart(items, toneClass = "overview-access", emptyText = "当前筛选条件下没有可展示的趋势数据。") {
          if (!items.length) {
            return `<div class="empty-state">${escapeHtml(emptyText)}</div>`;
          }

          const maxValue = Math.max(1, ...items.map((item) => item.value));
          return `
            <div class="overview-trend-chart overview-single-trend-chart">
              ${items.map((item) => `
                <div class="overview-trend-group">
                  <div class="overview-trend-value">${escapeHtml(String(item.value))}</div>
                  <div class="overview-trend-bars">
                    <div class="overview-trend-bar ${escapeHtml(toneClass)}" style="height:${item.value <= 0 ? 0 : Math.max(8, Math.round((item.value / maxValue) * 100))}%"></div>
                  </div>
                  <div class="trend-label">${escapeHtml(item.label)}</div>
                </div>
              `).join("")}
            </div>
          `;
        }

        renderOverviewStatusPie(items) {
          const total = items.reduce((sum, item) => sum + item.value, 0);
          if (!total) {
            return '<div class="empty-state">当前筛选条件下没有可展示的设备状态数据。</div>';
          }

          let angleCursor = 0;
          const pieSegments = items
            .filter((item) => item.value > 0)
            .map((item) => {
              const start = angleCursor;
              angleCursor += (item.value / total) * 360;
              return `${item.color} ${start.toFixed(2)}deg ${angleCursor.toFixed(2)}deg`;
            })
            .join(", ");

          return `
            <div class="overview-status-layout">
              <div class="overview-status-chart">
                <div class="overview-status-donut" style="background: conic-gradient(${pieSegments || "#E5E6EB 0deg 360deg"});">
                  <div class="overview-status-donut-inner">
                    <strong>${escapeHtml(String(total))}</strong>
                    <span>设备总量</span>
                  </div>
                </div>
              </div>
              <div class="overview-status-list">
                ${items.map((item) => `
                  <div class="overview-status-item ${item.value ? "" : "is-empty"}">
                    <div class="overview-status-item-head">
                      <span class="overview-status-dot" style="background:${escapeHtml(item.color)};"></span>
                      <strong>${escapeHtml(item.label)}</strong>
                    </div>
                    <div class="overview-status-item-meta">
                      <span>${escapeHtml(String(item.value))} 台</span>
                      <span>${escapeHtml(String(item.percentage))}%</span>
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          `;
        }

        renderOverviewBarList(items, emptyText = "暂无可展示数据") {
          if (!items.length) {
            return `<div class="empty-state">${escapeHtml(emptyText)}</div>`;
          }

          const maxValue = Math.max(1, ...items.map((item) => item.value));
          return `
            <div class="overview-bar-list">
              ${items.map((item) => `
                <div class="overview-bar-row">
                  <div class="overview-bar-main">
                    <div class="overview-bar-label">
                      <strong>${escapeHtml(item.label)}</strong>
                    </div>
                    <div class="progress-track">
                      <div class="progress-fill" style="width:${Math.round((item.value / maxValue) * 100)}%"></div>
                    </div>
                  </div>
                  <div class="overview-bar-value">${escapeHtml(String(item.value))}</div>
                </div>
              `).join("")}
            </div>
          `;
        }

        renderOverviewTenantTopCard(state, title, subtitle, items, emptyText, hintKey) {
          const titleBlock = this.wrapProtoHint(
            state,
            PROTOTYPE_REQ_HINTS[hintKey],
            `
                  <h3 class="card-title">${escapeHtml(title)}</h3>
                  <p class="card-subtitle">${escapeHtml(subtitle)}</p>
                `,
            { wrapperTag: "div" }
          );
          return `
            <div class="card section-card overview-tenant-top-card">
              <div class="card-head">
                <div>
                  ${titleBlock}
                </div>
              </div>
              ${this.renderOverviewBarList(items, emptyText)}
            </div>
          `;
        }

        renderOverviewModuleCard(state, item) {
          const moduleHint = PROTOTYPE_REQ_HINTS["module_" + item.viewId] || PROTOTYPE_REQ_HINTS.module_entry;
          const actionBtn = item.action
            ? `<button class="button ghost" data-action="${escapeHtml(item.action)}">${escapeHtml(item.actionLabel)}</button>`
            : `<button class="button ghost" data-action="switch-view" data-view="${escapeHtml(item.viewId)}">${escapeHtml(item.actionLabel)}</button>`;
          return `
            <div class="overview-module-card">
              <div class="overview-module-card-head">
                <span class="pill">${escapeHtml(item.helper)}</span>
                ${this.wrapProtoHint(state, moduleHint, actionBtn)}
              </div>
              <strong class="overview-module-title">${escapeHtml(item.title)}</strong>
              <div class="overview-module-value">${escapeHtml(String(item.value))}</div>
            </div>
          `;
        }

        renderOverview(state) {
          const filters = state.ui.overviewFilters || DEFAULT_OVERVIEW_FILTERS;
          const lifecycle = this.store.getOverviewLifecycleSummary(filters);
          const recognitionTrend = this.store.getOverviewRecognitionTrend(filters);
          const alertTrend = this.store.getOverviewAlertTrend(filters);
          const alertProcessTrend = this.store.getOverviewAlertProcessTrend(filters);
          const deviceStatusDistribution = this.store.getOverviewDeviceStatusDistribution(filters);
          const tenantTopAssets = this.store.getOverviewTenantDistribution(filters, "assets");
          const tenantTopPending = this.store.getOverviewTenantDistribution(filters, "pending");
          const tenantTopAlerts = this.store.getOverviewTenantDistribution(filters, "alerts");
          const moduleCards = this.store.getOverviewModuleCards({
            ...DEFAULT_OVERVIEW_FILTERS,
            timeRange: "ALL",
            customStart: "",
            customEnd: ""
          });
          const timeSummary = describeConfiguredTimeRange(filters.timeRange, filters.customStart, filters.customEnd);
          const compositeTrend = recognitionTrend.map((item, index) => {
            const floor = OVERVIEW_COMPOSITE_TREND_DEMO_FLOOR[index % OVERVIEW_COMPOSITE_TREND_DEMO_FLOOR.length] || {
              recognition: 1,
              alert: 0,
              processed: 0
            };
            return {
              label: item.label,
              recognition: Math.max(item.value, floor.recognition),
              alert: Math.max(alertTrend[index]?.value || 0, floor.alert),
              processed: Math.max(alertProcessTrend[index]?.value || 0, floor.processed)
            };
          });
          const compositeSummary =
            "识别 " +
            compositeTrend.reduce((sum, row) => sum + row.recognition, 0) +
            " / 告警 " +
            compositeTrend.reduce((sum, row) => sum + row.alert, 0) +
            " / 处置 " +
            compositeTrend.reduce((sum, row) => sum + row.processed, 0);
          const tenantOptions = this.store.getOverviewTenants().map((tenant) => ({
            value: tenant,
            label: tenant,
            summaryLabel: tenant
          }));
          const tenantLabel = this.getMultiSelectSummary(tenantOptions, filters.tenant, "全部租户");

          return `
            <section class="card section-card">
              <div class="card-head">
                <div>
                  ${this.wrapProtoHint(
                    state,
                    PROTOTYPE_REQ_HINTS.overview_module_section,
                    `
                  <h3 class="card-title">模块摘要与入口</h3>
                  <p class="card-subtitle">首页直接查看各模块规模、待办与异常，同时保留原有外链入口与实时告警入口。</p>
                `,
                    { wrapperTag: "div" }
                  )}
                </div>
              </div>
              <div class="overview-module-grid">
                ${moduleCards.map((item) => this.renderOverviewModuleCard(state, item)).join("")}
              </div>

        }

        renderRecognitionOwner(record) {
          return this.isBoundRecognition(record) ? escapeHtml(record.owner) : "—";
        }

        renderRecognitionStatus(record) {
          return this.isBoundRecognition(record) ? this.renderBadge(record.deviceStatus, "status") : "—";
        }

        renderRackUnit(record) {
          const match = String(record?.rack || "").match(/(\d+\s*U)\b/i);
          return match ? escapeHtml(match[1].replace(/\s+/g, "")) : "—";
        }

        renderSearchSelectControl(selectKey, name, options, selectedValue, config = {}) {
          const matchedOption = options.find((option) => String(option.value) === String(selectedValue));
          const normalizedValue = matchedOption?.value ?? (config.allowEmpty ? "" : options[0]?.value ?? "");
          const placeholder = config.placeholder || "请选择";
          const selectedOption = options.find((option) => String(option.value) === String(normalizedValue)) || null;
          const rootClass = [
            "search-select",
            config.compact ? "search-select-compact" : "",
            config.className || ""
          ]
            .filter(Boolean)
            .join(" ");
          const hiddenAttrs = [
            `type="hidden"`,
            `name="${escapeHtml(name)}"`,
            `value="${escapeHtml(String(normalizedValue))}"`
          ];

          if (config.onSelectAction) {
            hiddenAttrs.push(`data-on-select-action="${escapeHtml(config.onSelectAction)}"`);
          }

          return `
            <div class="${rootClass}" data-select-key="${escapeHtml(selectKey)}">
              <input ${hiddenAttrs.join(" ")} />
              <button
                type="button"
                class="search-select-trigger"
                data-action="toggle-search-select"
                data-select-key="${escapeHtml(selectKey)}"
                aria-expanded="false"
                ${config.disabled ? "disabled" : ""}
              >
                <span class="search-select-summary">${escapeHtml(selectedOption?.summaryLabel || selectedOption?.label || placeholder)}</span>
                <span class="search-select-arrow" aria-hidden="true"></span>
              </button>
              <div class="search-select-dropdown">
                <div class="search-select-search">
                  <input
                    type="search"
                    class="search-select-search-input"
                    placeholder="${escapeHtml(config.searchPlaceholder || "输入关键词搜索")}"
                    autocomplete="off"
                    ${config.disabled ? "disabled" : ""}
                  />
                </div>
                <div class="search-select-option-list" role="listbox">
                  ${options
                    .map((option) =>
                      this.renderSearchSelectOption(
                        selectKey,
                        option,
                        String(option.value) === String(normalizedValue)
                      )
                    )
                    .join("")}
                </div>
              </div>
            </div>
          `;
        }

        renderSearchSelectField(selectKey, name, label, options, selectedValue, config = {}) {
          return `
            <label class="field ${config.fieldClass || ""}">
              <span>${escapeHtml(label)}</span>
              ${this.renderSearchSelectControl(selectKey, name, options, selectedValue, config)}

        getRuleConditionOptions(type) {
          if (type === "owner") {
            return this.store.getOwners().map((item) => ({
              value: item,
              label: item
            }));
          }

          if (type === "status") {
            return this.store.getStatuses().map((item) => ({
              value: item,
              label: item
            }));
          }

          if (type === "channel") {
            return this.store.getChannels().map((channel) => ({
              value: channel.id,
              label: this.getChannelOptionLabel(channel),
              summaryLabel: channel.id
            }));
          }

          return [];
        }

        getMultiSelectSummary(options, condition, allLabel) {
          const normalized = normalizeRuleCondition(condition);
          if (normalized === "ALL") {
            return allLabel;
          }

          const labels = options
            .filter((option) => normalized.includes(option.value))
            .map((option) => option.summaryLabel || option.label);

          if (!labels.length) {
            return allLabel;
          }

          if (labels.length <= 2) {
            return labels.join("、");
          }

          return labels[0] + " 等" + labels.length + "项";
        }

        renderMultiSelectField(name, label, options, condition, allLabel, config = {}) {
          const normalized = normalizeRuleCondition(condition);
          return `
            <div class="field ${config.fieldClass || ""}">
              <span>${escapeHtml(label)}</span>
              <div class="multi-select" data-name="${escapeHtml(name)}" data-all-label="${escapeHtml(allLabel)}">
                <input type="hidden" name="${escapeHtml(name)}" value="${escapeHtml(serializeRuleCondition(normalized))}" />
                <button
                  type="button"
                  class="multi-select-trigger"
                  data-action="toggle-multiselect"
                  data-name="${escapeHtml(name)}"
                  aria-label="${escapeHtml(label)}"
                  aria-expanded="false"
                >
                  <span class="multi-select-summary">${escapeHtml(this.getMultiSelectSummary(options, normalized, allLabel))}</span>
                  <span class="multi-select-arrow" aria-hidden="true"></span>
                </button>
                <div class="multi-select-dropdown" role="listbox" aria-multiselectable="true">
                  <div class="multi-select-search">
                    <input
                      type="search"
                      class="multi-select-search-input"
                      placeholder="${escapeHtml(config.searchPlaceholder || "输入关键词搜索")}"
                      autocomplete="off"
                    />
                  </div>
                  <div class="multi-select-option-list">
                    ${this.renderMultiSelectOption(
                      name,
                      { value: "ALL", label: allLabel, summaryLabel: allLabel },
                      normalized === "ALL"
                    )}
                    ${options
                      .map((option) =>
                        this.renderMultiSelectOption(name, option, normalized !== "ALL" && normalized.includes(option.value))
                      )
                      .join("")}
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        renderRuleConditionField(name, label, options, condition, allLabel) {
          return this.renderMultiSelectField(name, label, options, condition, allLabel);
        }

        renderMultiSelectOption(name, option, selected) {
          return `
            <button
              type="button"
              class="multi-select-option ${selected ? "is-selected" : ""}"
              data-action="toggle-multiselect-option"
              data-name="${escapeHtml(name)}"
              data-value="${escapeHtml(option.value)}"
              data-label="${escapeHtml(option.label)}"
              data-summary-label="${escapeHtml(option.summaryLabel || option.label)}"
              role="option"
              aria-selected="${selected ? "true" : "false"}"
            >
              <span class="multi-select-check" aria-hidden="true"></span>
              <span class="multi-select-option-label">${escapeHtml(option.label)}</span>
            </button>
          `;
        }

        renderCondition(value, allLabel) {
          const normalized = normalizeRuleCondition(value);
          if (normalized === "ALL") {
            return `<span class="pill">${escapeHtml(allLabel)}</span>`;
          }

          return `<div class="condition-stack">${normalized
            .map((item) => `<span class="condition-chip">${escapeHtml(item)}</span>`)
            .join("")}</div>`;
        }

        renderConfiguredTimeRange(timeRange, customStart, customEnd) {
          const summary = describeConfiguredTimeRange(timeRange, customStart, customEnd);
          const detail =
            (timeRange || "ALL") === "CUSTOM"
              ? (formatDateOnlyValue(customStart) || "不限开始") + " 至 " + (formatDateOnlyValue(customEnd) || "不限结束")
              : summary.detail;
          if (!detail) {
            return `<span class="pill">${escapeHtml(summary.label)}</span>`;
          }

          return `
            <span class="pill">${escapeHtml(summary.label)}</span>
            <span class="row-meta">${escapeHtml(detail)}</span>
          `;
        }

        renderBadge(value, type) {
          const mappings = {
            level: {
              高: "badge level-high",
              中: "badge level-medium",
              低: "badge level-low"
            },
            status: {
              待入场: "badge channel-syncing",
              待上架: "badge status-borrowed",
              已入库: "badge status-pending",
              上架待验收: "badge level-medium",
              上架需整改: "badge level-high",
              上架整改中: "badge status-borrowed",
              已上架: "badge status-normal",
              出场: "badge status-repair",
              正常: "badge status-normal",
              借用中: "badge status-borrowed",
              待盘点: "badge status-pending",
              维修中: "badge status-repair"
            },
            channel: {
              在线: "badge channel-online",
              离线: "badge channel-offline",
              同步中: "badge channel-syncing"
            },
            "channel-init": {
              已初始化: "badge channel-online",
              未初始化: "badge status-pending"
            },
            "rule-status": {
              启用中: "badge channel-online",
              已停用: "badge level-low",
              已过期: "badge channel-offline"
            },
            tenant: {
              启用: "badge channel-online",
              停用: "badge level-low"
            },
            "alert-status": {
              待处理: "badge alert-pending",
              已确认: "badge alert-confirmed",
              已忽略: "badge alert-ignored"
            }
          };

          const className = mappings[type]?.[value] || "badge";
          return `<span class="${className}">${escapeHtml(value)}</span>`;
        }

        renderAggregateCard(item, maxTotal, state) {
          const percentage = item.total <= 0 ? 0 : Math.max(8, Math.round((item.total / Math.max(maxTotal, 1)) * 100));
          const selectedByCard =
            state.ui.alertAggregateSelection &&
            state.ui.alertAggregateSelection.groupBy === state.ui.alertGroupBy &&
            state.ui.alertAggregateSelection.key === item.key;
          const selectedByTimeFilter = state.ui.alertGroupBy === "time" && state.ui.alertFilters.timeRange === item.key;
          const selected = Boolean(selectedByCard || selectedByTimeFilter);
          const metaLabel = item.metaLabel || (item.latestAt ? "最新：" + formatDateTime(item.latestAt) : "当前无告警");

          const cardInner = `
            <button
              type="button"
              class="aggregation-card aggregation-card-btn ${selected ? "is-selected" : ""}"
              data-action="drilldown-aggregate"
              data-key="${escapeHtml(item.key)}"
              aria-pressed="${selected ? "true" : "false"}"
            >
              <strong>${escapeHtml(item.label)}</strong>
              <p>共聚合 ${item.total} 条告警，其中高等级 ${item.highLevelCount} 条。</p>
              <div class="progress-track">
                <div class="progress-fill" style="width:${percentage}%"></div>
              </div>
              <div class="aggregation-meta">
                <span>${escapeHtml(metaLabel)}</span>
                <span>${item.total} 条</span>
              </div>
            </button>`;
          return this.wrapProtoHint(state, PROTOTYPE_REQ_HINTS.alerts_aggregate_card, cardInner, { wrapperTag: "div" });
        }

        renderAggregateListItem(item) {
          return `
            <div class="list-item">
              <div>
                <strong>${escapeHtml(item.label)}</strong>
                <p>累计 ${item.total} 条告警，高等级 ${item.highLevelCount} 条。</p>
              </div>
              <span class="pill">${escapeHtml(formatDate(item.latestAt))}</span>
            </div>
          `;
        }

        renderGroupButton(value, label) {
          const current = this.store.getState().ui.alertGroupBy;
          return `<button type="button" class="${current === value ? "is-active" : ""}" data-action="set-group-by" data-value="${value}">${escapeHtml(label)}</button>`;
        }

        renderAlertProcessStateButton(value, label) {
          const current = this.store.getState().ui.alertFilters.processState || "ALL";
          return `<button type="button" class="${current === value ? "is-active" : ""}" data-action="set-alert-process-state" data-value="${value}">${escapeHtml(label)}</button>`;
        }

        groupByLabel(groupBy) {
          const labels = {
            owner: "按租户",
            channel: "按通道",
            status: "按状态",
            time: "按时间"
          };
          return labels[groupBy] || groupBy;
        }

        renderNoticeLevelButton(currentLevel, value, label, count) {
          return `<button type="button" class="${currentLevel === value ? "is-active" : ""}" data-action="set-notice-level" data-value="${value}">${escapeHtml(label)} ${count}</button>`;
        }

        hasActiveNoticeFilters(filters) {
          const normalized = normalizeMultiValueFilterGroup({
            ...DEFAULT_NOTICE_ALERT_FILTERS,
            ...filters
          }, ["owner", "status", "channel"]);
          return normalized.owner !== "ALL" ||
            normalized.status !== "ALL" ||
            normalized.channel !== "ALL" ||
            normalized.timeRange !== "ALL" ||
            Boolean(normalized.customStart) ||
            Boolean(normalized.customEnd);
        }

        renderNoticeFilterForm(filters) {
          return `
            <form
              id="notice-alert-filter-form"
              class="form-grid notice-filter-modal-form is-expanded"
              data-filter-panel="notice"
            >
              ${this.renderMultiSelectField(
                "owner",
                "租户",
                this.getRuleConditionOptions("owner"),
                filters.owner,
                "全部租户"
              )}
              ${this.renderMultiSelectField(
                "status",
                "设备状态",
                this.getRuleConditionOptions("status"),
                filters.status,
                "全部状态"
              )}
              ${this.renderMultiSelectField(
                "channel",
                "检测通道",
                this.getRuleConditionOptions("channel"),
                filters.channel,
                "全部通道"
              )}
              ${this.renderTimeRangeFields(filters, "notice-filter-time-range", "notice-filter", { full: false })}
              <div class="field full actions">
                <span>&nbsp;</span>
                <div class="button-row">
                  <button class="button primary" type="submit">查询</button>
                  <button class="button ghost" type="button" data-action="reset-notice-filters">重置</button>
                  <button class="button ghost" type="button" data-action="close-modal">取消</button>
                </div>
              </div>
            </form>
          `;
        }

        renderNoticeDrawer(state) {
          const noticeState = state.ui.noticeDrawer || {};
          const filters = noticeState.filters || DEFAULT_NOTICE_ALERT_FILTERS;
          const level = noticeState.level || "ALL";
          const levelSource = this.store.getPendingAlerts(filters);
          const pendingAlertsAll = this.store.getPendingAlerts(filters, { level });
          const selectedIds = state.ui.selectedAlertIds.filter((id) => pendingAlertsAll.some((alert) => alert.id === id));
          const heightRatio = state.ui.noticeDrawer?.heightRatio || 0.5;
          const viewportHeight = typeof window !== "undefined" ? window.innerHeight : 900;
          const drawerHeight = Math.round(Math.max(240, Math.min(viewportHeight - 24, viewportHeight * heightRatio)));
          const levelCounts = {
            ALL: levelSource.length,
            高: levelSource.filter((alert) => alert.level === "高").length,
            中: levelSource.filter((alert) => alert.level === "中").length,
            低: levelSource.filter((alert) => alert.level === "低").length
          };
          const hasActiveFilters = this.hasActiveNoticeFilters(filters);

          return `
            <div class="notice-drawer-backdrop" data-action="close-notice-drawer"></div>
            <section class="notice-drawer-panel" style="height:${drawerHeight}px;" aria-label="实时告警抽屉">
              <div class="notice-drawer-resizer" data-notice-resizer="true" aria-label="拖拽调整实时告警抽屉高度"></div>
              <div class="notice-drawer-head">
                <div>
                  <h3 class="notice-drawer-title">实时告警</h3>
                  <p class="notice-drawer-subtitle">仅展示待处理告警，点击记录可查看告警详情；点击页面空白处可关闭。</p>
                </div>
                <div class="notice-drawer-actions">
                  ${this.wrapProtoHint(
                    state,
                    PROTOTYPE_REQ_HINTS.notice_level_tabs,
                    `
                  <div class="segmented notice-level-tabs" role="tablist" aria-label="告警等级筛选">
                    ${this.renderNoticeLevelButton(level, "ALL", "全部", levelCounts.ALL)}
                    ${this.renderNoticeLevelButton(level, "高", "高", levelCounts["高"])}
                    ${this.renderNoticeLevelButton(level, "中", "中", levelCounts["中"])}
                    ${this.renderNoticeLevelButton(level, "低", "低", levelCounts["低"])}
                  </div>
                `,
                    { wrapperTag: "div", wrapperClass: "proto-hint-host--block" }
                  )}
                </div>
              </div>
              <div class="notice-drawer-content">
                <div class="notice-alert-list">
                  <div class="notice-alert-table-toolbar">
                    <div class="section-actions">
                      ${this.wrapProtoHint(
                        state,
                        PROTOTYPE_REQ_HINTS.notice_filter_button,
                        `
                      <button
                        class="button ${hasActiveFilters ? "secondary" : "ghost"}"
                        type="button"
                        data-action="open-notice-filter-modal"
                      >
                        筛选
                      </button>`
                      )}
                      ${this.renderListColumnToolbar("notice-alert-list")}
                    </div>
                  </div>
                  ${selectedIds.length
                    ? `
                      <div class="table-selection-bar notice-selection-bar">
                        ${this.wrapProtoHint(
                          state,
                          PROTOTYPE_REQ_HINTS.notice_batch_bar,
                          `
                        <span class="selection-summary">已选择 ${selectedIds.length} 条待处理告警，可发起批量处理。</span>
                        <div class="button-row">
                          <button class="button primary" data-action="open-alert-process-modal" data-ids="${escapeHtml(JSON.stringify(selectedIds))}">批量处理</button>
                          <button class="button ghost" data-action="clear-alert-selection">取消选择</button>
                        </div>
                      `,
                          { wrapperTag: "div", wrapperClass: "proto-hint-host--inline" }
                        )}
                      </div>
                    `
                    : ""}
                  ${this.renderNoticeAlertTable(pendingAlertsAll, state)}
                </div>
              </div>
            </section>
          `;
        }

        renderOverlay(state) {
          const drawer = this.store.getCurrentDrawerData();
          const modal = this.store.getCurrentModalData();
          const noticeDrawer = state.ui.noticeDrawer?.open ? this.renderNoticeDrawer(state) : "";
          return `${noticeDrawer}${drawer ? this.renderDrawer(drawer) : ""}${modal ? this.renderModal(modal) : ""}`;
        }

        renderDrawerShell(ariaLabel, innerHtml) {
          const w = clampSideDrawerWidthPx(this.store.getState().ui.sideDrawerWidthPx);
          return `
              <div class="drawer-backdrop" data-action="close-drawer"></div>
              <aside class="drawer-panel" style="width:${w}px;max-width:100%;" aria-label="${escapeHtml(ariaLabel)}">
                <div class="drawer-panel-resizer" data-side-drawer-resizer="true" aria-label="拖拽调整抽屉宽度"></div>
                ${innerHtml}
              </aside>
            `;
        }

        renderDrawer(drawer) {
          if (drawer.type === "recognition") {
            return this.renderDrawerShell(
              "识别记录详情",
              `
                <div class="drawer-card">
                  <div class="drawer-head">
                    <div>
                      <h3 class="drawer-title">识别记录详情</h3>
                      <p class="drawer-subtitle">查看一次检测事件的标签信息、通道信息以及关联告警。</p>
                    </div>
                    <button class="close-button" data-action="close-drawer" aria-label="关闭">×</button>
                  </div>
                  <div class="detail-grid">
                    <div class="detail-item"><span>识别记录号</span><strong>${escapeHtml(drawer.record.id)}</strong></div>
                    <div class="detail-item"><span>识别时间</span><strong>${escapeHtml(formatDateTime(drawer.record.occurredAt))}</strong></div>
                    <div class="detail-item"><span>设备名称</span><strong>${escapeHtml(drawer.record.assetName)}</strong></div>
                    <div class="detail-item"><span>标签号</span><strong>${escapeHtml(drawer.record.tagCode || "—")}</strong></div>
                    <div class="detail-item"><span>资产绑定</span><strong>${drawer.record.tagBound ? "已绑定资产" : "未绑定资产"}</strong></div>
                    <div class="detail-item"><span>租户</span><strong>${escapeHtml(drawer.record.owner)}</strong></div>
                    <div class="detail-item"><span>设备状态</span><strong>${escapeHtml(drawer.record.deviceStatus)}</strong></div>
                    <div class="detail-item"><span>检测通道</span><strong>${escapeHtml(drawer.record.channelId + " / " + drawer.record.channelName)}</strong></div>
                    ${this.renderRecognitionDrawerSelectedDetailItems(drawer.record)}
                  </div>
                  <div class="drawer-section">
                    <h4>事件时间线</h4>
                    <div class="timeline">
                      <div class="timeline-item">
                        <strong>通道识别成功</strong>
                        <p>${escapeHtml(drawer.record.channelName)} 检测到标签 ${escapeHtml(drawer.record.tagCode)}，系统生成识别记录。</p>
                      </div>
                      <div class="timeline-item">
                        <strong>${drawer.record.tagBound ? "设备快照固化" : "标签未绑定资产"}</strong>
                        <p>${
                          drawer.record.tagBound
                            ? "系统记录租户为 " + escapeHtml(drawer.record.owner) + "，设备状态为 " + escapeHtml(drawer.record.deviceStatus) + "。"
                            : "该标签尚未绑定资产，系统仅记录 RFID 标签号与通道信息。"
                        }</p>
                      </div>
                      <div class="timeline-item">
                        <strong>规则匹配完成</strong>
                        <p>${drawer.alerts.length ? "本次识别命中 " + drawer.alerts.length + " 条告警规则。" : "本次识别未命中任何告警规则。"}</p>
                      </div>
                    </div>
                  </div>
                  <div class="drawer-section">
                    <div class="drawer-section-head">
                      <h4>关联告警</h4>
                      ${this.renderListColumnToolbar("drawer-recognition-linked-alerts")}
                    </div>
                    <div class="mini-list">
                      ${
                        drawer.alerts.length
                          ? drawer.alerts
                              .map(
                                (alert) => `
                                  <button class="list-item" data-action="open-alert" data-id="${alert.id}">
                                    <div>
                                      <strong>${escapeHtml(alert.ruleName)}</strong>
                                      <p>${escapeHtml(alert.action)}</p>
                                    </div>
                                    ${this.renderBadge(alert.level, "level")}
                                  </button>
                                `
                              )
                              .join("")
                          : '<div class="empty-state">本次识别未产生告警。</div>'
                      }
                    </div>
                  </div>
                </div>
              `
            );
          }

          if (drawer.type === "alert") {
            return this.renderDrawerShell(
              "告警详情",
              `
                <div class="drawer-card">
                  <div class="drawer-head">
                    <div>
                      <h3 class="drawer-title">告警详情</h3>
                      <p class="drawer-subtitle">告警记录由识别事件命中规则后生成，可查看规则、资产和处理状态。</p>
                    </div>
                    <button class="close-button" data-action="close-drawer" aria-label="关闭">×</button>
                  </div>
                  <div class="detail-grid">
                    <div class="detail-item"><span>告警编号</span><strong>${escapeHtml(drawer.alert.id)}</strong></div>
                    <div class="detail-item"><span>告警时间</span><strong>${escapeHtml(formatDateTime(drawer.alert.occurredAt))}</strong></div>
                    <div class="detail-item"><span>规则名称</span><strong>${escapeHtml(drawer.alert.ruleName)}</strong></div>
                    <div class="detail-item"><span>告警级别</span><strong>${escapeHtml(drawer.alert.level)}</strong></div>
                    <div class="detail-item"><span>设备名称</span><strong>${escapeHtml(drawer.alert.assetName)}</strong></div>
                    <div class="detail-item"><span>租户</span><strong>${escapeHtml(drawer.alert.owner)}</strong></div>
                    <div class="detail-item"><span>设备状态</span><strong>${escapeHtml(drawer.alert.deviceStatus)}</strong></div>
                    <div class="detail-item"><span>处理状态</span><strong>${escapeHtml(drawer.alert.resolutionStatus)}</strong></div>
                    <div class="detail-item"><span>处理人</span><strong>${escapeHtml(drawer.alert.processedBy || "-")}</strong></div>
                    <div class="detail-item"><span>处理时间</span><strong>${escapeHtml(drawer.alert.processedAt || "-")}</strong></div>
                    ${this.renderAlertDrawerSelectedDetailItems(drawer.alert)}
                  </div>
                  <div class="drawer-section">
                    <h4>联系方式</h4>
                    ${this.renderTenantContactList(drawer.tenant?.contacts)}
                  </div>
                  <div class="drawer-section drawer-process-section">
                    <div class="drawer-section-head">
                      <h4>处置信息</h4>
                    </div>
                    <div class="drawer-note-grid single-note">
                      <div class="drawer-note-card">
                        <strong>处理建议</strong>
                        <div class="subtle-note">${this.renderAlertProcessSuggestion(drawer.alert)}</div>
                      </div>
                    </div>
                    <div class="drawer-process-timeline">
                      <h5>处理记录时间线</h5>
                      ${this.renderAlertProcessingTimeline(drawer.alert)}
                    </div>
                  </div>
                  <div class="drawer-section">
                    <h4>来源说明</h4>
                    <div class="timeline">
                      <div class="timeline-item">
                        <strong>识别事件来源</strong>
                        <p>${escapeHtml(drawer.recognition?.channelName || "-")} 于 ${escapeHtml(drawer.recognition ? formatDateTime(drawer.recognition.occurredAt) : "-")} 识别到资产。</p>
                      </div>
                      <div class="timeline-item">
                        <strong>匹配规则</strong>
                        <p>${escapeHtml(drawer.rule?.name || "-")} 命中后生成本条告警记录。</p>
                      </div>
                    </div>
                  </div>
                  <div class="drawer-section">
                    <div class="button-row">
                      ${this.renderAlertProcessActionButton(drawer.alert, drawer.alert.resolutionStatus === "待处理" ? "处理告警" : "重新处理", "primary")}
                    </div>
                  </div>
                </div>
              `
            );
          }

          if (drawer.type === "channel") {
            return this.renderDrawerShell(
              "通道详情",
              `
                <div class="drawer-card">
                  <div class="drawer-head">
                    <div>
                      <h3 class="drawer-title">检测通道详情</h3>
                      <p class="drawer-subtitle">设备码、状态和 IP 由接口同步，其余档案信息通过初始化维护，可查看最近识别事件。</p>
                    </div>
                    <div class="button-row">
                      <button class="button secondary" data-action="open-channel-init-modal" data-id="${drawer.channel.id}">${this.getChannelInitActionLabel(drawer.channel)}</button>
                      <button class="close-button" data-action="close-drawer" aria-label="关闭">×</button>
                    </div>
                  </div>
                  <div class="detail-grid">
                    <div class="detail-item"><span>设备码</span><strong>${escapeHtml(drawer.channel.id)}</strong></div>
                    <div class="detail-item"><span>档案状态</span><strong>${this.renderChannelInitStatus(drawer.channel)}</strong></div>
                    <div class="detail-item"><span>通道名称</span><strong>${escapeHtml(drawer.channel.name || "—")}</strong></div>
                    <div class="detail-item"><span>位置</span><strong>${escapeHtml(this.getChannelPositionLabel(drawer.channel))}</strong></div>
                    <div class="detail-item"><span>连接地址</span><strong>${escapeHtml(drawer.channel.ip || "—")}</strong></div>
                    <div class="detail-item"><span>在线状态</span><strong>${escapeHtml(drawer.channel.status)}</strong></div>
                    <div class="detail-item"><span>最近同步</span><strong>${escapeHtml(drawer.channel.lastSync)}</strong></div>
                  </div>
                  <div class="subtle-note">${this.store.isChannelInitialized(drawer.channel) ? "档案最近维护时间：" + escapeHtml(drawer.channel.initializedAt || "—") : "当前仅同步设备码、状态和 IP，通道档案尚未初始化，可点击上方“初始化”补充信息。"}</div>
                  <div class="drawer-section">
                    <div class="drawer-section-head">
                      <h4>最近识别事件</h4>

          if (modal.type === "notice-filter") {

          if (modal.type === "version-history") {

            return `

                <div class="modal-panel">
                  <div class="modal-head">

                      ${records

          if (modal.type === "api") {
            const payload = Array.isArray(modal.payload) ? modal.payload : [];
            const json = JSON.stringify(payload, null, 2);
            return `
              <div class="modal-host">
                <div class="modal-backdrop" data-action="close-modal"></div>
                <div class="modal-panel">
                  <div class="modal-head">

        renderToasts(state) {

            .map(
              (toast) => `
                <div class="toast ${toast.tone}">

                  <span>${escapeHtml(toast.message)}</span>

              `
            )
            .join("");

      }

      class PrototypeApp {
        constructor(store, renderer) {
          this.store = store;
          this.renderer = renderer;
          this.draggingListColumn = null;
          this.noticeResizeState = null;
          this.sideDrawerResizeState = null;
        }

        init() {
          this.store.subscribe(() => this.renderer.render());
          this.bindEvents();
          this.renderer.render();
        }

        resetSearchSelectFilter(root) {
          if (!root) {
            return;
          }

          const input = root.querySelector(".search-select-search-input");
          if (input) {
            input.value = "";
          }
          this.applySearchSelectFilter(root, "");
        }

        applySearchSelectFilter(root, keyword) {
          if (!root) {
            return;
          }

          const normalized = String(keyword || "").trim().toLowerCase();
          root.querySelectorAll(".search-select-option").forEach((button) => {
            const label = (button.getAttribute("data-label") || "").toLowerCase();
            button.classList.toggle("is-hidden", Boolean(normalized) && !label.includes(normalized));
          });
        }

        closeAllSearchSelects(except = null) {
          document.querySelectorAll(".search-select.is-open").forEach((node) => {
            if (except && node === except) {
              return;
            }
            node.classList.remove("is-open");
            this.resetSearchSelectFilter(node);
            const trigger = node.querySelector(".search-select-trigger");
            if (trigger) {
              trigger.setAttribute("aria-expanded", "false");
            }
          });
        }

        closeAllMultiSelects(except = null) {
          document.querySelectorAll(".multi-select.is-open").forEach((node) => {
            if (except && node === except) {
              return;
            }
            node.classList.remove("is-open");
            this.resetMultiSelectFilter(node);
            const trigger = node.querySelector(".multi-select-trigger");
            if (trigger) {
              trigger.setAttribute("aria-expanded", "false");
            }
          });
        }

        closeAllRuleDateRangePickers(except = null) {
          document.querySelectorAll(".rule-date-range-picker.is-open").forEach((node) => {
            if (except && node === except) {
              return;
            }
            node.classList.remove("is-open");
            const trigger = node.querySelector(".rule-date-range-trigger");
            if (trigger) {
              trigger.setAttribute("aria-expanded", "false");
            }
          });
        }

        syncRuleDateRangePicker(root) {
          if (!root) {
            return;
          }

          const minDate = root.getAttribute("data-min-date") || "";
          const startInput = root.querySelector('[data-role="rule-range-start"]');
          const endInput = root.querySelector('[data-role="rule-range-end"]');
          const hiddenTimeRange = root.querySelector('input[name="timeRange"]');
          const hiddenStart = root.querySelector('input[name="customStart"]');
          const hiddenEnd = root.querySelector('input[name="customEnd"]');
          const summary = root.querySelector(".rule-date-range-summary");
          const startDate = startInput?.value || "";
          let endDate = endInput?.value || "";
          const endMinDate = startDate && startDate > minDate ? startDate : minDate;

          if (endInput) {
            endInput.min = endMinDate;
            if (endDate && startDate && endDate < startDate) {
              endDate = "";
              endInput.value = "";
            }
          }

          if (hiddenTimeRange) {
            hiddenTimeRange.value = startDate || endDate ? "CUSTOM" : "ALL";
          }
          if (hiddenStart) {
            hiddenStart.value = buildRuleRangeStartDateTime(startDate);
          }
          if (hiddenEnd) {
            hiddenEnd.value = buildRuleRangeEndDateTime(endDate);
          }
          if (summary) {
            summary.textContent = formatRuleDateRangeSummary(startDate, endDate);
          }
        }

        toggleRuleDateRangePicker(trigger) {
          const root = trigger?.closest?.(".rule-date-range-picker");
          if (!root) {
            return;
          }

          const nextOpen = !root.classList.contains("is-open");
          this.closeAllSearchSelects();
          this.closeAllMultiSelects();
          this.closeAllRuleDateRangePickers(root);
          root.classList.toggle("is-open", nextOpen);
          trigger.setAttribute("aria-expanded", nextOpen ? "true" : "false");
          this.syncRuleDateRangePicker(root);
          if (nextOpen) {
            window.setTimeout(() => {
              root.querySelector('[data-role="rule-range-start"]')?.focus();
            }, 0);
          }
        }

        clearRuleDateRangePicker(trigger) {
          const root = trigger?.closest?.(".rule-date-range-picker");
          if (!root) {
            return;
          }

          const startInput = root.querySelector('[data-role="rule-range-start"]');
          const endInput = root.querySelector('[data-role="rule-range-end"]');
          if (startInput) {
            startInput.value = "";
          }
          if (endInput) {
            endInput.value = "";
          }
          this.syncRuleDateRangePicker(root);
        }

        clearListColumnDragState() {
          document.querySelectorAll(".list-column-option.is-dragging, .list-column-option.is-drag-over").forEach((node) => {
            node.classList.remove("is-dragging", "is-drag-over");
          });
        }

        applyNoticeDrawerHeight(heightRatio) {
          const panel = document.querySelector(".notice-drawer-panel");
          if (!panel) {
            return;
          }

          const viewportHeight = window.innerHeight || 900;
          const nextHeight = Math.round(Math.max(240, Math.min(viewportHeight - 24, viewportHeight * heightRatio)));
          panel.style.height = nextHeight + "px";
        }

        applySideDrawerWidth(px) {
          const panel = document.querySelector(".drawer-panel");
          if (!panel) {
            return;
          }

          const next = clampSideDrawerWidthPx(px);
          panel.style.width = `${next}px`;
          panel.style.maxWidth = "100%";
        }

        syncTimeRangeVisibility(form) {
          if (!form) {
            return;
          }

          const select = form.querySelector('[name="timeRange"]');
          const customWrap = form.querySelector("[data-time-range-custom]");
          if (!select || !customWrap) {
            return;
          }

          const isCustom = select.value === "CUSTOM";
          customWrap.classList.toggle("is-hidden", !isCustom);
          customWrap.querySelectorAll('input[type="datetime-local"]').forEach((input) => {
            input.disabled = !isCustom;
          });
        }

        setFilterPanelExpanded(form, expanded) {
          if (!form) {
            return;
          }

          form.classList.toggle("is-expanded", expanded);
          form.classList.toggle("is-collapsed", !expanded);
          const toggleButton = form.querySelector('[data-action="toggle-filter-panel"]');
          if (toggleButton) {
            const label = getExpandToggleLabel(expanded);
            toggleButton.title = label;
            toggleButton.setAttribute("aria-label", label);
            toggleButton.innerHTML = getExpandToggleIconMarkup(expanded);
          }
        }

        toggleFilterPanel(trigger) {
          const form = trigger.closest("form");
          if (!form) {
            return;
          }

          this.setFilterPanelExpanded(form, !form.classList.contains("is-expanded"));
          this.syncTimeRangeVisibility(form);
        }

        resetMultiSelectFilter(root) {
          if (!root) {
            return;
          }

          const input = root.querySelector(".multi-select-search-input");
          if (input) {
            input.value = "";
          }
          this.applyMultiSelectFilter(root, "");
        }

        applyMultiSelectFilter(root, keyword) {
          if (!root) {
            return;
          }

          const normalized = String(keyword || "").trim().toLowerCase();
          root.querySelectorAll(".multi-select-option").forEach((button) => {
            const optionValue = button.getAttribute("data-value") || "";
            const label = (button.getAttribute("data-label") || "").toLowerCase();
            const matches = optionValue === "ALL" || !normalized || label.includes(normalized);
            button.classList.toggle("is-hidden", !matches);
          });
        }

        getMultiSelectSummaryFromElement(root, condition) {
          const normalized = normalizeRuleCondition(condition);
          const allLabel = root.getAttribute("data-all-label") || "全部";
          if (normalized === "ALL") {
            return allLabel;
          }

          const labels = Array.from(root.querySelectorAll(".multi-select-option"))
            .filter((button) => {
              const optionValue = button.getAttribute("data-value");
              return optionValue && optionValue !== "ALL" && normalized.includes(optionValue);
            })
            .map((button) => button.getAttribute("data-summary-label") || button.getAttribute("data-label") || button.textContent.trim());

          if (!labels.length) {
            return allLabel;
          }

          if (labels.length <= 2) {
            return labels.join("、");
          }

          return labels[0] + " 等" + labels.length + "项";
        }

        parseIdList(rawValue) {
          if (!rawValue) {
            return [];
          }

          try {
            const parsed = JSON.parse(rawValue);
            return Array.isArray(parsed) ? parsed : [];
          } catch (error) {
            return [];
          }
        }

        toggleSearchSelect(selectKey) {
          const root = document.querySelector('.search-select[data-select-key="' + selectKey + '"]');
          if (!root) {
            return;
          }

          const nextOpen = !root.classList.contains("is-open");
          this.closeAllSearchSelects(root);
          this.closeAllMultiSelects();
          this.closeAllRuleDateRangePickers();
          root.classList.toggle("is-open", nextOpen);
          const trigger = root.querySelector(".search-select-trigger");
          if (trigger) {
            trigger.setAttribute("aria-expanded", nextOpen ? "true" : "false");
          }

          if (nextOpen) {
            this.resetSearchSelectFilter(root);
            window.setTimeout(() => {
              root.querySelector(".search-select-search-input")?.focus();
            }, 0);
          }
        }

        selectSearchSelectOption(target) {
          const root = target.closest(".search-select");
          if (!root) {
            return;
          }

          const hiddenInput = root.querySelector('input[type="hidden"]');
          const summary = root.querySelector(".search-select-summary");
          const value = target.getAttribute("data-value") || "";
          const summaryLabel = target.getAttribute("data-summary-label") || target.getAttribute("data-label") || value;

          if (hiddenInput) {
            hiddenInput.value = value;
          }

          if (summary) {
            summary.textContent = summaryLabel;
          }

          root.querySelectorAll(".search-select-option").forEach((button) => {
            const selected = button === target;
            button.classList.toggle("is-selected", selected);
            button.setAttribute("aria-selected", selected ? "true" : "false");
          });

          const form = root.closest("form");
          if (hiddenInput?.name === "timeRange") {
            if (value === "CUSTOM") {
              this.setFilterPanelExpanded(form, true);
            }
            this.syncTimeRangeVisibility(form);
          }

          if (hiddenInput?.getAttribute("data-on-select-action") === "set-alert-page-size") {
            this.store.setAlertPageSize(Number(value || DEFAULT_ALERT_PAGE_SIZE));
          }

          if (hiddenInput?.getAttribute("data-on-select-action") === "set-tenant-page-size") {
            this.store.setTenantPageSize(Number(value || DEFAULT_ALERT_PAGE_SIZE));
          }

          if (hiddenInput?.getAttribute("data-on-select-action") === "set-recognition-page-size") {
            this.store.setRecognitionPageSize(Number(value || DEFAULT_ALERT_PAGE_SIZE));
          }

          if (hiddenInput?.getAttribute("data-on-select-action") === "set-rule-page-size") {
            this.store.setRulePageSize(Number(value || DEFAULT_ALERT_PAGE_SIZE));
          }

          if (hiddenInput?.getAttribute("data-on-select-action") === "set-channel-page-size") {
            this.store.setChannelPageSize(Number(value || DEFAULT_ALERT_PAGE_SIZE));
          }

          if (hiddenInput?.getAttribute("data-on-select-action") === "set-notice-alert-page-size") {
            this.store.setNoticeAlertPageSize(Number(value || DEFAULT_ALERT_PAGE_SIZE));
          }

          this.closeAllSearchSelects();
        }

        getCurrentAlertPageRecords() {
          return this.store.getFilteredAlerts();
        }

        getCurrentNoticeAlertRecords() {
          const state = this.store.getState();
          const filters = state.ui.noticeDrawer?.filters || DEFAULT_NOTICE_ALERT_FILTERS;
          const level = state.ui.noticeDrawer?.level || "ALL";
          return this.store.getPendingAlerts(filters, { level });
        }

        exportAlerts() {
          const records = this.store.getFilteredAlerts();
          if (!records.length) {
            this.store.pushToast("暂无可导出数据", "当前筛选条件下没有告警记录。", "warning");
            return;
          }

          const rows = [
            [
              "告警编号",
              "告警时间",
              "规则名称",
              "设备类型",
              "品牌型号",
              "序列号",
              "序号",
              "机房",
              "机柜",
              "进入时间",
              "市场服务平台单号",
              "租户",
              "设备状态",
              "检测通道",
              "告警级别",
              "处理状态",
              "处理人",
              "处理时间",
              "处理备注"
            ],
            ...records.map((record) => [
              record.id,
              formatDateTime(record.occurredAt),
              record.ruleName,
              getDemoDeviceTypeLabel(record),
              record.brandModel || "-",
              record.serialNumber || "-",
              record.sequenceNo || "-",
              record.idcRoom || "-",
              record.rack || "-",
              record.entryAt && record.entryAt !== "—" && record.entryAt !== "-" ? formatDateTime(record.entryAt) : "-",
              record.marketOrderNo || "-",
              record.owner,
              record.deviceStatus,
              record.channelName,
              record.level,
              record.resolutionStatus,
              record.processedBy || "-",
              record.processedAt || "-",
              record.resolutionRemark || "-"
            ])
          ];
          const csv = "\uFEFF" + rows.map((row) => row.map((cell) => escapeCsvValue(cell)).join(",")).join("\r\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const url = window.URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "告警记录导出_" + formatDateKey(new Date()) + ".csv";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          window.URL.revokeObjectURL(url);
          this.store.pushToast("导出成功", "已导出当前筛选结果，共 " + records.length + " 条告警记录。", "success");
        }

        applyMultiSelectState(root, condition) {
          const normalized = normalizeRuleCondition(condition);
          const hiddenInput = root.querySelector('input[type="hidden"]');
          const summary = root.querySelector(".multi-select-summary");

          if (hiddenInput) {
            hiddenInput.value = serializeRuleCondition(normalized);

          if (summary) {
            summary.textContent = this.getMultiSelectSummaryFromElement(root, normalized);
          }

          root.querySelectorAll(".multi-select-option").forEach((button) => {
            const optionValue = button.getAttribute("data-value") || "";
            const selected =
              normalized === "ALL" ? optionValue === "ALL" : optionValue !== "ALL" && normalized.includes(optionValue);
            button.classList.toggle("is-selected", selected);
            button.setAttribute("aria-selected", selected ? "true" : "false");
          });
        }

        toggleMultiSelect(targetOrName) {
          const root =
            typeof targetOrName === "string"
              ? document.querySelector('.multi-select[data-name="' + targetOrName + '"]')
              : targetOrName?.closest?.(".multi-select") ||
                (targetOrName?.classList?.contains("multi-select") ? targetOrName : null);
          if (!root) {
            return;
          }

          const nextOpen = !root.classList.contains("is-open");
          this.closeAllMultiSelects(root);
          this.closeAllSearchSelects();
          this.closeAllRuleDateRangePickers();
          root.classList.toggle("is-open", nextOpen);
          const trigger = root.querySelector(".multi-select-trigger");
          if (trigger) {
            trigger.setAttribute("aria-expanded", nextOpen ? "true" : "false");
          }

          if (nextOpen) {
            this.resetMultiSelectFilter(root);
            window.setTimeout(() => {
              root.querySelector(".multi-select-search-input")?.focus();
            }, 0);
          }
        }

        toggleMultiSelectOption(target) {
          const root = target.closest(".multi-select");
          if (!root) {
            return;
          }

          const hiddenInput = root.querySelector('input[type="hidden"]');
          const optionValue = target.getAttribute("data-value") || "";
          const current = hiddenInput ? normalizeRuleCondition(hiddenInput.value) : "ALL";

          let next = current;
          if (optionValue === "ALL") {
            next = "ALL";
          } else {
            const values = current === "ALL" ? [] : [...current];
            const index = values.indexOf(optionValue);
            if (index >= 0) {
              values.splice(index, 1);
            } else {
              values.push(optionValue);
            }
            next = values.length ? values : "ALL";
          }

          this.applyMultiSelectState(root, next);
        }

          document.addEventListener("pointerdown", (event) => {
            const noticeHandle = event.target.closest("[data-notice-resizer]");

              event.preventDefault();
              this.noticeResizeState = { active: true };
              document.body.style.userSelect = "none";
              return;

            const sideHandle = event.target.closest("[data-side-drawer-resizer]");
            if (sideHandle && this.store.getState().ui.drawer) {
              event.preventDefault();
              this.sideDrawerResizeState = { active: true };
              document.body.style.userSelect = "none";
            }
          });

            if (this.noticeResizeState?.active) {
              const nextRatio = (window.innerHeight - event.clientY) / Math.max(window.innerHeight, 1);
              this.store.setNoticeDrawerHeight(nextRatio, { emit: false });
              this.applyNoticeDrawerHeight(this.store.getState().ui.noticeDrawer.heightRatio);
              return;

            if (this.sideDrawerResizeState?.active) {
              const next = clampSideDrawerWidthPx(window.innerWidth - event.clientX);

              this.applySideDrawerWidth(next);

            if (this.noticeResizeState?.active) {
              this.noticeResizeState = null;
              document.body.style.userSelect = "";
              this.store.emit();
              return;

            this.store.toggleNoticeDrawerExpanded();

            const target = event.target.closest(".list-column-option[data-field]");
            if (!target) {
              return;
