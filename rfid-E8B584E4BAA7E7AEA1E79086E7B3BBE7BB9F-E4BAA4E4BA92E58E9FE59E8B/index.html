<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IT智能资产管理系统</title>
    <style>
      :root {
        --bg: #f0f2f5;
        --surface: #ffffff;
        --surface-soft: #fafafa;
        --surface-strong: #f5f5f5;
        --text: rgba(0, 0, 0, 0.88);
        --text-secondary: rgba(0, 0, 0, 0.45);
        --text-tertiary: rgba(0, 0, 0, 0.35);
        --primary: #1677ff;
        --primary-deep: #0958d9;
        --primary-hover: #4096ff;
        --primary-soft: #e6f4ff;
        --topbar-bg: #001529;
        --topbar-text: rgba(255, 255, 255, 0.75);
        --success: #389e0d;
        --success-soft: #f6ffed;
        --warning: #d48806;
        --warning-soft: #fffbe6;
        --danger: #cf1322;
        --danger-soft: #fff2f0;
        --border: #d9d9d9;
        --border-strong: #bfbfbf;
        --table-head-bg: #fafafa;
        --shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.03);
        --radius-lg: 8px;
        --radius-md: 6px;
        --radius-sm: 4px;
        --topbar-h: 48px;
        --sidebar-w: 220px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 0.5rem 0.75rem;
        background: #fff;
        color: var(--text);
        font-size: 0.875rem;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.2);
      }

      textarea {
        min-height: 92px;
        resize: vertical;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      .app-topbar {
        flex: 0 0 var(--topbar-h);
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0 1rem 0 1.25rem;
        background: var(--topbar-bg);
        color: #fff;
        box-shadow: 0 1px 4px rgba(0, 21, 41, 0.12);
        z-index: 20;
      }

      .topbar-brand {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        flex-shrink: 0;
      }

      .topbar-logo {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .topbar-title {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .topbar-nav {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        min-width: 0;
        overflow: hidden;
      }

      .topbar-nav-link {
        padding: 0.35rem 0.85rem;
        font-size: 0.8125rem;
        color: var(--topbar-text);
        border-radius: var(--radius-sm);
        white-space: nowrap;
        cursor: default;
        user-select: none;
      }

      .topbar-nav-link.is-active {
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
      }

      .topbar-tools {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-shrink: 0;
      }

      .topbar-version {
        border: 0;
        background: transparent;
        color: var(--topbar-text);
        font-size: 0.78rem;
        padding: 0.25rem 0.35rem;
        border-radius: var(--radius-sm);
        white-space: nowrap;
        cursor: pointer;
      }

      .topbar-version:hover {
        color: var(--primary);
        background: var(--primary-soft);
      }

      .topbar-proto-wrap {
        position: relative;
        z-index: 30;
      }

      .topbar-proto-btn {
        height: 30px;
        padding: 0 0.65rem 0 0.75rem;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08);
        color: var(--topbar-text);
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.8125rem;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }

      .topbar-proto-btn:hover,
      .topbar-proto-btn.is-open {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.42);
        color: #fff;
      }

      .topbar-proto-btn svg {
        flex-shrink: 0;
        transition: transform 0.15s ease;
      }

      .topbar-proto-btn.is-open svg {
        transform: rotate(180deg);
      }

      .topbar-proto-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        min-width: 200px;
        padding: 0.5rem 0.65rem;
        border-radius: var(--radius-md);
        border: 1px solid var(--border);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .topbar-proto-toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        font-size: 0.8125rem;
        color: var(--text);
        cursor: pointer;
        user-select: none;
      }

      .topbar-proto-toggle-row input[type="checkbox"] {
        width: auto;
        margin: 0;
        cursor: pointer;
        accent-color: var(--primary);
      }

      .proto-hint-host {
        position: relative;
        display: block;
        width: 100%;
        overflow: visible;
      }

      .nav-list .proto-hint-host {
        width: 100%;
      }

      .topbar-tools .proto-hint-host,
      .page-actions .proto-hint-host {
        display: inline-flex;
        width: auto;
        vertical-align: middle;
      }

      .proto-hint-host.proto-hint-host--inline {
        display: inline-flex;
        align-items: center;
        width: auto;
        vertical-align: middle;
      }

      .overview-module-card .proto-hint-host {
        display: inline-flex;
        width: auto;
        align-self: flex-start;
      }

      .filter-form .proto-hint-host--inline {
        display: inline-flex;
        width: auto;
        vertical-align: middle;
      }

      .section-actions .proto-hint-host--inline {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
      }

      .aggregation-grid > .proto-hint-host {
        display: block;
        width: 100%;
        min-width: 0;
      }

      .table-wrap td .proto-hint-host {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem;
        width: auto;
        max-width: 100%;
        vertical-align: middle;
      }

      .notice-drawer-actions .proto-hint-host--block {
        display: block;
        width: 100%;
      }

      .proto-hint-anchor {
        position: absolute;
        top: 2px;
        right: 4px;
        z-index: 4;
        display: inline-flex;
        align-items: flex-start;
        pointer-events: none;
      }

      .proto-hint-host:hover .proto-hint-anchor,
      .proto-hint-host:focus-within .proto-hint-anchor {
        pointer-events: auto;
      }

      .proto-hint-badge {
        position: relative;
        top: auto;
        right: auto;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 999px;
        background: #165dff;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        line-height: 16px;
        text-align: center;
        flex-shrink: 0;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85);
      }

      .proto-hint-popover {
        position: fixed;
        left: -9999px;
        top: 0;
        min-width: 260px;
        max-width: min(360px, calc(100vw - 24px));
        padding: 12px 14px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 6px 24px rgba(15, 23, 42, 0.12), 0 0 1px rgba(15, 23, 42, 0.08);
        font-size: 12px;
        line-height: 1.55;
        color: var(--text-primary, #1d2129);
        text-align: left;
        word-break: break-word;
        overflow-wrap: anywhere;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.15s ease, visibility 0.15s ease;
        z-index: 10050;
      }

      .proto-hint-host .proto-hint-popover {
        display: none;
      }

      .proto-hint-global-popover.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .proto-hint-popover-title {
        font-weight: 700;
        font-size: 13px;
        margin: 0 0 10px;
        color: var(--text-primary, #1d2129);
        line-height: 1.4;
        word-break: break-word;
      }

      .proto-hint-popover-body {
        margin: 0;
      }

      .proto-hint-popover-line {
        margin: 0 0 8px;
      }

      .proto-hint-popover-line:last-child {
        margin-bottom: 0;
      }

      .proto-hint-popover-label {
        font-weight: 600;
        color: var(--text-secondary, #4e5969);
      }

      .proto-hint-host .nav-item.nav-item-sub ~ .proto-hint-anchor {
        right: 10px;
      }

      .topbar-tools .proto-hint-host .proto-hint-anchor {
        top: -2px;
        right: -4px;
      }

      .topbar-ico {
        position: relative;
        width: 36px;
        height: 36px;
        border-radius: var(--radius-sm);
        border: 0;
        background: transparent;
        color: var(--topbar-text);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .topbar-ico:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }

      .topbar-ico.is-active {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      .topbar-dot {
        position: absolute;
        top: 4px;
        right: 4px;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        border-radius: 999px;
        background: #ff4d4f;
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        line-height: 16px;
        text-align: center;
      }

      .topbar-user {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding-left: 0.5rem;
        border-left: 1px solid rgba(255, 255, 255, 0.15);
      }

      .topbar-avatar {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .topbar-name {
        font-size: 0.8125rem;
        color: rgba(255, 255, 255, 0.88);
        max-width: 5rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topbar-ico:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35);
      }

      .app-body {
        flex: 1;
        display: flex;
        min-height: 0;
        overflow: hidden;
      }

      .app-sidebar {
        flex: 0 0 var(--sidebar-w);
        width: var(--sidebar-w);
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 0 0 1rem;
        background: var(--surface);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .sidebar-head {
        padding: 1rem 1rem 0.75rem;
        border-bottom: 1px solid #f0f0f0;
      }

      .sidebar-head-kicker {
        display: block;
        font-size: 0.6875rem;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.25rem;
      }

      .sidebar-head-title {
        display: block;
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--text);
      }

      .nav-list {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
        margin-top: 0.5rem;
        padding: 0 0.5rem;
        flex: 1;
        min-height: 0;
      }

      .nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.55rem 0.65rem;
        border-radius: var(--radius-sm);
        color: var(--text);
        border: 0;
        background: transparent;
        width: 100%;
        text-align: left;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .nav-item:hover {
        background: var(--surface-strong);
        color: var(--text);
      }

      .nav-item.is-active {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .nav-item.is-active .nav-icon {
        background: rgba(22, 119, 255, 0.12);
        color: var(--primary);
      }

      .nav-meta {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }

      .nav-icon {
        width: 28px;
        height: 28px;
        border-radius: var(--radius-sm);
        flex: 0 0 auto;
        background: var(--surface-strong);
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .nav-label {
        min-width: 0;
      }

      .nav-label strong {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .nav-label span {
        display: block;
        margin-top: 0.1rem;
        font-size: 0.6875rem;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .nav-count {
        min-width: 22px;
        height: 20px;
        padding: 0 0.4rem;
        border-radius: 10px;
        background: #ff4d4f;
        color: #fff;
        font-size: 0.6875rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .nav-group {
        margin-top: 0.35rem;
        padding-top: 0.45rem;
        border-top: 1px solid #f0f0f0;
      }

      .nav-group-title {
        padding: 0.35rem 0.65rem 0.45rem;
        font-size: 0.6875rem;
        font-weight: 600;
        color: var(--text-tertiary);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .nav-item-sub {
        padding-left: 1.15rem;
      }

      .external-link-card {
        max-width: 720px;
      }

      .external-link-card .external-link-url {
        word-break: break-all;
        font-size: 0.8125rem;
        color: var(--primary-deep);
      }

      .external-link-card .external-link-credentials {
        margin: 1rem 0 0;
        padding: 0.75rem 0.9rem;
        border-radius: var(--radius-sm);
        background: var(--surface-soft);
        border: 1px dashed var(--border);
        color: var(--text-secondary);
        font-size: 0.8125rem;
        line-height: 1.6;
      }

      .external-link-card .external-link-credentials strong {
        color: var(--text);
        font-weight: 600;
      }

      .sidebar-footnote {
        margin: auto 0.75rem 0;
        padding: 0.65rem 0.75rem;
        border-radius: var(--radius-sm);
        background: var(--surface-soft);
        border: 1px solid #f0f0f0;
        color: var(--text-secondary);
        font-size: 0.75rem;
        line-height: 1.55;
      }

      .app-workspace {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg);
        overflow: hidden;
      }

      .page-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        flex-shrink: 0;
        padding: 1rem 1.5rem;
        background: var(--surface);
        border-bottom: 1px solid #f0f0f0;
      }

      .page-title {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 600;
        color: var(--text);
      }

      .page-subtitle {
        margin: 0.35rem 0 0;
        color: var(--text-secondary);
        line-height: 1.5;
        font-size: 0.8125rem;
      }

      .page-header-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .page-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        justify-content: flex-end;
      }

      .page-content {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-width: 0;
        flex: 1;
        overflow: auto;
        padding: 1rem 1.5rem 1.5rem;
        overscroll-behavior: contain;
      }

      .channels-main-stack {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        min-width: 0;
      }

      .card {
        background: var(--surface);
        border: 1px solid #f0f0f0;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
      }

      .hero-card {
        padding: 1rem 1.25rem;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 1rem;
        background: var(--surface);
      }

      .hero-card h2,
      .section-card h3,
      .card-title {
        margin: 0;
      }

      .section-card h3,
      .card-title {
        font-size: 0.9375rem;
        font-weight: 600;
        color: var(--text);
      }

      .hero-card h2 {
        font-size: 1.05rem;
        font-weight: 600;
      }

      .hero-card p {
        margin: 0.45rem 0 0;
        color: var(--text-secondary);
        line-height: 1.65;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-self: start;
        justify-content: flex-end;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        min-height: 32px;
        padding: 0.4rem 0.95rem;
        border-radius: var(--radius-sm);
        font-size: 0.875rem;
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
      }

      .button:hover {
        transform: none;
      }

      .button.primary {
        background: var(--primary);
        color: #ffffff;
        border: 1px solid var(--primary);
        box-shadow: none;
      }

      .button.primary:hover {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .button.secondary {
        background: var(--surface);
        border: 1px solid var(--primary);
        color: var(--primary);
      }

      .button.secondary:hover {
        color: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .button.ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-secondary);
      }

      .button.ghost:hover {
        color: var(--primary);
        border-color: var(--primary);
      }

      .button.danger {
        background: var(--danger-soft);
        color: var(--danger);
        border: 1px solid rgba(207, 19, 34, 0.22);
      }

      .button.danger:hover {
        border-color: rgba(207, 19, 34, 0.45);
        background: #fff1f0;
      }

      .button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .tag,
      .badge,
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0.28rem 0.68rem;
        font-size: 0.78rem;
        line-height: 1.2;
        white-space: nowrap;
      }

      .tag {
        background: var(--primary-soft);
        color: var(--primary-deep);
        border: 1px solid rgba(22, 119, 255, 0.25);
        border-radius: var(--radius-sm);
      }

      .badge.level-high,
      .badge.channel-offline,
      .badge.record-alert,
      .badge.status-repair {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .badge.level-medium,
      .badge.status-borrowed,
      .badge.status-pending,
      .badge.alert-pending {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .badge.level-low,
      .badge.alert-ignored {
        background: #eef2ff;
        color: #4f46e5;
      }

      .badge.channel-online,
      .badge.alert-confirmed,
      .badge.status-normal {
        background: var(--success-soft);
        color: var(--success);
      }

      .badge.channel-syncing {
        background: var(--primary-soft);
        color: var(--primary-deep);
      }

      .pill {
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: var(--radius-sm);
        border: 1px solid rgba(22, 119, 255, 0.2);
      }

      .pill.pill-muted {
        background: #f0f1f3;
        color: #8a8f99;
        border: 1px solid #e4e6eb;
      }

      .stats-grid,
      .insight-grid,
      .aggregation-grid,
      .channel-health-grid {
        display: grid;
        gap: 1rem;
      }

      .stats-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

        width: min(760px, 100%);
        max-height: calc(100vh - 2rem);
        overflow: auto;
        padding: 1rem 1rem 1.15rem;
      }

      .modal-body {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.85rem;
      }

      .form-grid .field.full {
        grid-column: 1 / -1;
      }

      .status-stack {
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }

      .status-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.8rem;
        width: 100%;
        text-align: left;
        padding: 0.8rem 0.9rem 0.8rem 1rem;
        border: 1px solid #edf1f5;
        border-radius: var(--radius-sm);
        background: linear-gradient(90deg, rgba(22, 119, 255, 0.05), rgba(255, 255, 255, 0.96) 42%);
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .status-row::before {
        content: "";
        position: absolute;
        left: 0.62rem;
        top: 0.72rem;
        bottom: 0.72rem;
        width: 3px;
        border-radius: 999px;
        background: var(--primary);
      }

      .status-row[data-status="在线"]::before {
        background: #52c41a;
      }

      .status-row[data-status="离线"]::before {
        background: #ff4d4f;
      }

      .status-row[data-status="同步中"]::before {
        background: #faad14;
      }

      .status-row:hover {
        border-color: rgba(22, 119, 255, 0.35);
        background: linear-gradient(90deg, rgba(22, 119, 255, 0.08), #ffffff 42%);
        box-shadow: var(--shadow-soft);
      }

      .status-row > div {
        min-width: 0;
      }

      .status-row .badge {
        margin-left: auto;
        flex-shrink: 0;
      }

      .status-row strong {
        display: block;
      }

      .status-row p {
        margin: 0.24rem 0 0;
      }

      .empty-state {
        padding: 1.5rem;
        text-align: center;
        color: var(--text-secondary);
        line-height: 1.7;
      }

      .toast-root {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
        z-index: 80;
      }

      .toast {
        min-width: 260px;
        max-width: 360px;
        padding: 0.82rem 0.95rem;
        border-radius: 16px;
        background: rgba(15, 23, 42, 0.96);
        color: #ffffff;
        box-shadow: var(--shadow);
      }

      .toast strong {
        display: block;
        font-size: 0.92rem;
      }

      .toast span {
        display: block;
        margin-top: 0.25rem;
        color: rgba(255, 255, 255, 0.76);
        font-size: 0.82rem;
        line-height: 1.55;
      }

      .toast.success {
        background: rgba(15, 118, 110, 0.96);
      }

      .toast.warning {
        background: rgba(180, 83, 9, 0.96);
      }

      .toast.danger {
        background: rgba(185, 28, 28, 0.96);
      }

      /* Arco Design inspired global theme overrides */
      :root {
        --bg: #f2f3f5;
        --surface: #ffffff;
        --surface-soft: #f7f8fa;
        --surface-strong: #f2f3f5;
        --text: #1d2129;
        --text-secondary: #4e5969;
        --text-tertiary: #86909c;
        --primary: #165dff;
        --primary-deep: #0e42d2;
        --primary-hover: #4080ff;
        --primary-soft: #e8f3ff;
        --topbar-bg: #ffffff;
        --topbar-text: #4e5969;
        --success: #00b42a;
        --success-soft: #e8ffea;
        --warning: #ff7d00;
        --warning-soft: #fff3e8;
        --danger: #f53f3f;
        --danger-soft: #ffece8;
        --border: #e5e6eb;
        --border-strong: #c9cdd4;
        --table-head-bg: #f7f8fa;
        --shadow: 0 12px 32px rgba(29, 33, 41, 0.12);
        --shadow-soft: 0 4px 12px rgba(29, 33, 41, 0.08);
        --radius-lg: 10px;
        --radius-md: 8px;
        --radius-sm: 4px;
      }

      input,
      select,
      textarea {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        font-size: 0.875rem;
      }

      input:hover,
      select:hover,
      textarea:hover {
        border-color: var(--border-strong);
      }

      input:disabled,
      select:disabled,
      textarea:disabled,
      input[readonly],
      textarea[readonly] {
        background: #f7f8fa;
        border-color: #e5e7eb;
        color: var(--text-secondary);
        cursor: not-allowed;
        box-shadow: none;
      }

      input:disabled:hover,
      select:disabled:hover,
      textarea:disabled:hover,
      input[readonly]:hover,
      textarea[readonly]:hover {
        border-color: #e5e7eb;
      }

      input:disabled:focus,
      select:disabled:focus,
      textarea:disabled:focus,
      input[readonly]:focus,
      textarea[readonly]:focus {
        border-color: #e5e7eb;
        box-shadow: none;
      }

      input:disabled::placeholder,
      textarea:disabled::placeholder,
      input[readonly]::placeholder,
      textarea[readonly]::placeholder {
        color: var(--text-tertiary);
      }

      input:focus,
      select:focus,
      textarea:focus,
      button:focus-visible {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.15);
      }

      .app-topbar {
        padding: 0 1.25rem 0 1.5rem;
        background: var(--topbar-bg);
        color: var(--text);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 1px 0 rgba(229, 230, 235, 0.8);
      }

      .topbar-logo {
        border: none;
        background: linear-gradient(135deg, var(--primary), var(--primary-hover));
        box-shadow: 0 8px 18px rgba(22, 93, 255, 0.2);
      }

      .topbar-title {
        color: var(--text);
      }

      .topbar-nav {
        justify-content: flex-start;
        padding-left: 0.5rem;
      }

      .topbar-nav-link {
        padding: 0.4rem 0.85rem;
        color: var(--topbar-text);
        font-size: 0.8125rem;
        border-radius: var(--radius-sm);
      }

      .topbar-nav-link:hover {
        background: var(--surface-soft);
        color: var(--text);
      }

      .topbar-nav-link.is-active {
        color: var(--primary);
        background: var(--primary-soft);
        font-weight: 600;
      }

      .topbar-ico {
        width: 32px;
        height: 32px;
        border: 1px solid transparent;
        color: var(--text-secondary);
      }

      .topbar-ico:hover {
        background: var(--surface-soft);
        color: var(--text);
        border-color: var(--border);
      }

      .topbar-ico.is-active {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .topbar-ico:focus-visible {
        box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.18);
      }

      .topbar-dot {
        background: var(--danger);
      }

      .topbar-user {
        padding-left: 0.75rem;
        border-left: 1px solid var(--border);
      }

      .topbar-avatar {
        background: var(--primary-soft);
        color: var(--primary);
      }

      .topbar-name {
        color: var(--text);
      }

      .app-sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
      }

      .sidebar-head {
        padding: 1.25rem 1rem 0.9rem;
        border-bottom: 1px solid var(--border);
      }

      .nav-list {
        gap: 0.25rem;
        margin-top: 0.65rem;
        padding: 0 0.5rem;
      }

      .nav-item {
        padding: 0.65rem 0.75rem;
        border-radius: var(--radius-md);
      }

      .nav-item:hover {
        background: var(--surface-soft);
      }

      .nav-item.is-active {
        background: var(--primary-soft);
        color: var(--primary);
        box-shadow: inset 2px 0 0 var(--primary);
      }

      .nav-item.is-active .nav-label span {
        color: var(--primary);
        opacity: 0.8;
      }

      .nav-icon {
        width: 24px;
        height: 24px;
        background: var(--surface-strong);
        color: var(--text-secondary);
      }

      .nav-group {
        margin-top: 0.45rem;
        padding-top: 0.6rem;
        border-top: 1px solid var(--border);
      }

      .nav-group-title {
        padding: 0.35rem 0.75rem 0.5rem;
        font-size: 0.75rem;
        color: var(--text-tertiary);
        text-transform: none;
        letter-spacing: normal;
      }

      .app-workspace {
        background: var(--bg);
      }

      .page-header {
        margin: 1rem 1.5rem 0;
        padding: 1rem 1.5rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
      }

      .page-title {
        font-size: 1.25rem;
        line-height: 1.35;
      }

      .page-subtitle {
        margin-top: 0.25rem;
        font-size: 0.8125rem;
        line-height: 1.6;
      }

      .page-content {
        gap: 1rem;
        padding: 1rem 1.5rem 1.5rem;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
      }

      .hero-card {
        background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
        border-color: rgba(22, 93, 255, 0.12);
      }

      .stat-card,
      .section-card,
      .toolbar {
        padding: 1rem;
      }

      .section-card.overview-tenant-top-card {
        padding-left: 2rem;
        padding-right: 2rem;
      }

      .toolbar {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-soft);
      }

      .card-title,
      .section-card h3 {
        font-size: 0.9375rem;
        font-weight: 600;
      }

      .card-subtitle,
      .stat-meta,
      .selection-summary,
      .pagination-meta {
        color: var(--text-secondary);
      }

      .stat-value {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      .button {
        min-height: 32px;
        padding: 0.35rem 0.9rem;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        font-weight: 500;
      }

      .button.primary {
        border-color: var(--primary);
        background: var(--primary);
        box-shadow: 0 2px 8px rgba(22, 93, 255, 0.2);
      }

      .button.primary:hover {
        background: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .button.secondary {
        border-color: var(--border);
        background: var(--surface);
        color: var(--text);
      }

      .button.secondary:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: var(--surface);
      }

      .button.ghost {
        border-color: transparent;
        background: var(--surface-soft);
        color: var(--text-secondary);
      }

      .button.ghost:hover {
        border-color: transparent;
        background: var(--primary-soft);
        color: var(--primary);
      }

      .button.danger {
        background: var(--danger-soft);
        border-color: rgba(245, 63, 63, 0.24);
        color: var(--danger);
      }

      .button.danger:hover {
        background: #ffe3e3;
        border-color: rgba(245, 63, 63, 0.42);
      }

      .tag,
      .badge,
      .pill {
        min-height: 24px;
        padding: 0.15rem 0.5rem;
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        font-weight: 500;
      }

      .tag {
        border-color: rgba(22, 93, 255, 0.16);
      }

      .pill {
        background: var(--surface-soft);
        border-color: rgba(22, 93, 255, 0.16);
      }

      .condition-chip {
        padding: 0.15rem 0.5rem;
        border-radius: var(--radius-sm);
      }

      .filter-form {
        gap: 1rem 1.25rem;
      }

      .field {
        gap: 0.4rem;
      }

      .field > span {
        color: var(--text-secondary);
        font-size: 0.75rem;
        font-weight: 500;
      }

      .multi-select-trigger,
      .search-select-trigger {
        min-height: 36px;
        padding: 0.45rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        box-shadow: none;
      }

      .multi-select-trigger:hover,
      .multi-select.is-open .multi-select-trigger,
      .search-select-trigger:hover,
      .search-select.is-open .search-select-trigger {
        border-color: var(--primary);
        background: var(--surface);
      }

      .multi-select-dropdown,
      .search-select-dropdown {
        top: calc(100% + 0.25rem);
        padding: 0.25rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow);
      }

      .multi-select-search,
      .search-select-search {
        padding: 0.25rem;
        border-bottom: 1px solid var(--border);
      }

      .multi-select-option:hover,
      .search-select-option:hover {
        background: var(--surface-soft);
      }

      .list-column-trigger {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        box-shadow: none;
      }

      .list-column-trigger:hover,
      .list-column-menu.is-open .list-column-trigger {
        border-color: var(--primary);
        background: var(--surface-soft);
        box-shadow: 0 2px 8px rgba(22, 93, 255, 0.12);
      }

      .list-column-dropdown {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow);
      }

      .list-column-option {
        padding: 0.65rem 0.75rem;
        border-bottom: 1px solid var(--border);
      }

      .table-wrap,
      .notice-alert-table-wrap {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }

      thead th {
        padding: 0.75rem 0.875rem;
        font-size: 0.75rem;
        color: var(--text-secondary);
        background: var(--table-head-bg);
        border-bottom: 1px solid var(--border);
      }

      tbody td {
        padding: 0.75rem 0.875rem;
        border-bottom: 1px solid var(--border);
      }

      tbody tr:hover {
        background: var(--surface-soft);
      }

      .table-pagination {
        padding: 0.85rem 1rem 0;
        border-top: 1px solid var(--border);
      }

      .table-selection-bar {
        padding: 0 1rem 1rem;
      }

      .list-item {
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
      }

      .list-item:hover {
        border-color: rgba(22, 93, 255, 0.22);
        background: #fcfdff;
      }

      .status-row {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
      }

      .status-row:hover {
        border-color: rgba(22, 93, 255, 0.24);
        background: #fcfdff;
        box-shadow: var(--shadow-soft);
      }

      .progress-track {
        height: 6px;
        background: #eef0f3;
      }

      .progress-fill {
        background: linear-gradient(90deg, var(--primary-hover), var(--primary));
      }

      .segmented {
        gap: 0.5rem;
      }

      .segmented button {
        min-height: 32px;
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text-secondary);
      }

      .segmented button.is-active {
        border-color: var(--primary);
        background: var(--primary-soft);
        color: var(--primary);
        box-shadow: inset 0 0 0 1px rgba(22, 93, 255, 0.08);
      }

      .overview-flow-step,
      .overview-module-card,
      .notice-alert-item,
      .notice-drawer-toolbar {
        border-color: var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
      }

      .overview-flow-step,
      .overview-module-card {
        background: var(--surface);
      }

      .notice-alert-item:hover,
      button.aggregation-card-btn:hover {
        border-color: rgba(22, 93, 255, 0.24);
        box-shadow: var(--shadow-soft);
      }

      .legend-dot.overview-power,
      .legend-dot.records {
        background: var(--primary);
      }

      .legend-dot.overview-shelf-up {
        background: var(--success);
      }

      .legend-dot.overview-shelf-down,
      .legend-dot.alerts {
        background: var(--warning);
      }

      .subtle-note {
        background: #f5faff;
        border: 1px dashed rgba(22, 93, 255, 0.22);
      }

      .drawer-backdrop {
        background: rgba(29, 33, 41, 0.28);
        backdrop-filter: blur(2px);
      }

      .drawer-panel {
        padding: 1rem;
        background: var(--bg);
        box-shadow: -8px 0 32px rgba(29, 33, 41, 0.14);
      }

      .drawer-card,
      .modal-panel {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }

      .detail-item {
        padding: 0.8rem 0.9rem;
        background: var(--surface-soft);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
      }

      .notice-drawer-panel {
        border: 1px solid var(--border);
        border-radius: 12px 12px 0 0;
        box-shadow: 0 -12px 32px rgba(29, 33, 41, 0.16);
      }

      .notice-drawer-content {
        background: var(--bg);
      }

      .empty-state {
        padding: 1.5rem;
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-soft);
      }

      .toast {
        background: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }

      .toast strong {
        color: var(--text);
      }

      .toast span {
        color: var(--text-secondary);
      }

      .toast.success,
      .toast.warning,
      .toast.danger {
        background: var(--surface);
      }

      .toast.success {
        border-left: 3px solid var(--success);
      }

      .toast.warning {
        border-left: 3px solid var(--warning);
      }

      .toast.danger {
        border-left: 3px solid var(--danger);
      }

      /* Arco Design inspired detail refinements */
      .table-selection-bar {
        margin-bottom: 0.9rem;
        padding: 0.85rem 1rem;
        border: 1px solid rgba(22, 93, 255, 0.16);
        border-radius: var(--radius-md);
        background: linear-gradient(90deg, rgba(22, 93, 255, 0.06), rgba(22, 93, 255, 0.02));
      }

      .selection-summary {
        font-weight: 500;
      }

      .table-wrap {
        position: relative;
        overflow: auto;
      }

      .table-wrap table {
        min-width: 100%;
        border-spacing: 0;
      }

      thead th:first-child,
      tbody td:first-child {
        padding-left: 1rem;
      }

      thead th:last-child,
      tbody td:last-child {
        padding-right: 1rem;
      }

      thead th {
        position: sticky;
        top: 0;
        z-index: 1;
      }

      tbody tr {
        transition: background 0.15s ease;
      }

      tbody td .row-meta + .row-meta {
        margin-top: 0.15rem;
      }

      .table-wrap tbody td,
      .notice-alert-table-wrap tbody td {
        white-space: nowrap;
      }

      .table-wrap .table-actions,
      .notice-alert-table-wrap .table-actions {
        flex-wrap: nowrap;
      }

      .table-wrap td .row-meta,
      .notice-alert-table-wrap td .row-meta {
        display: inline;
        margin-top: 0;
        margin-left: 0.35em;
      }

      /* 横向滚动时固定首列复选框、末列操作（与其它列表共用同一套表格容器） */
      .table-wrap thead th.checkbox-cell,
      .notice-alert-table-wrap thead th.checkbox-cell {
        position: sticky;
        left: 0;
        top: 0;
        z-index: 4;
        background: var(--table-head-bg);
        box-shadow: 4px 0 10px -4px rgba(29, 33, 41, 0.12);
      }

      .table-wrap tbody td.checkbox-cell,
      .notice-alert-table-wrap tbody td.checkbox-cell {
        position: sticky;
        left: 0;
        z-index: 2;
        background: var(--surface);
        box-shadow: 4px 0 10px -4px rgba(29, 33, 41, 0.08);
      }

      .table-wrap tbody tr:hover td.checkbox-cell,
      .notice-alert-table-wrap tbody tr:hover td.checkbox-cell {
        background: var(--surface-soft);
      }

      .table-wrap thead th:last-child,
      .notice-alert-table-wrap thead th:last-child {
        position: sticky;
        right: 0;
        top: 0;
        z-index: 3;
        background: var(--table-head-bg);
        box-shadow: -4px 0 10px -4px rgba(29, 33, 41, 0.12);
      }

      .table-wrap tbody td:last-child,
      .notice-alert-table-wrap tbody td:last-child {
        position: sticky;
        right: 0;
        z-index: 2;
        background: var(--surface);
        box-shadow: -4px 0 10px -4px rgba(29, 33, 41, 0.08);
      }

      .table-wrap tbody tr:hover td:last-child,
      .notice-alert-table-wrap tbody tr:hover td:last-child {
        background: var(--surface-soft);
      }

      .table-actions {
        gap: 0.75rem;
      }

      .table-actions .button {
        position: relative;
        padding: 0;
        color: var(--primary);
        font-weight: 500;
      }

      .alert-process-action-tip {
        display: inline-flex;
      }

      .filter-toggle-icon-button {
        width: 2rem;
        min-width: 2rem;
        height: 2rem;
        min-height: 2rem;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .filter-toggle-icon {
        display: block;
        width: 0.9rem;
        height: 0.9rem;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .table-actions .button::after {
        content: "";
        position: absolute;

          };

          behavior: "—",
          restriction: "—"
        };

        return `

      function getProtoHintGlobalPopover() {
        let pop = document.querySelector(".proto-hint-global-popover");
        if (pop) {
          return pop;
        }
        pop = document.createElement("div");
        pop.className = "proto-hint-popover proto-hint-global-popover";
        pop.setAttribute("role", "tooltip");
        document.body.appendChild(pop);
        return pop;
      }

      function hideProtoHintGlobalPopover() {
        const pop = document.querySelector(".proto-hint-global-popover");
        if (pop) {
          pop.classList.remove("is-visible");
        }
        document.querySelectorAll(".proto-hint-host.is-proto-hint-active").forEach((host) => {
          host.classList.remove("is-proto-hint-active");
        });
      }

      function updateProtoHintPopoverPosition(host) {
        const template = host.querySelector(".proto-hint-popover");
        const anchor = host.querySelector(".proto-hint-anchor");
        if (!template || !anchor) {
          return;
        }
        const pop = getProtoHintGlobalPopover();
        pop.innerHTML = template.innerHTML;
        pop.classList.remove("is-visible");
        const ar = anchor.getBoundingClientRect();
        const margin = 8;
        const pad = 12;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        pop.style.position = "fixed";
        pop.style.right = "auto";
        pop.style.bottom = "auto";
        pop.style.transform = "none";
        pop.style.margin = "0";
        pop.style.left = "-9999px";
        pop.style.top = "0";
        const pr = pop.getBoundingClientRect();
        let left = ar.left - pr.width - margin;
        if (left < pad) {
          left = ar.right + margin;
        }
        if (left + pr.width > vw - pad) {
          left = Math.max(pad, vw - pad - pr.width);
        }
        let top = ar.top + ar.height / 2 - pr.height / 2;
        top = Math.max(pad, Math.min(top, vh - pad - pr.height));
        pop.style.left = `${Math.round(left)}px`;
        pop.style.top = `${Math.round(top)}px`;
        pop.classList.add("is-visible");
      }

          if (getRuleLifecycleStatus(rule, record?.occurredAt || new Date()) !== "启用中") {
            return false;
          }

          const ownerMatched = matchesRuleCondition(rule.ownerCondition, record.owner);
          const statusMatched = matchesRuleCondition(rule.statusCondition, record.deviceStatus);
          const channelMatched = matchesRuleCondition(rule.channelCondition, record.channelId);
          const timeMatched = matchesResolvedTimeRange(
            record.occurredAt,
            rule.timeRange || "ALL",
            new Date(),
            rule.customStart,
            rule.customEnd
          );

          return ownerMatched && statusMatched && channelMatched && timeMatched;
        }

        generateAlerts(record, rules) {
          return rules
            .filter((rule) => this.matches(rule, record))
            .map((rule) => ({
              id: this.idFactory.nextAlert(record.occurredAt),
              ruleId: rule.id,
              ruleName: rule.name,
              recognitionId: record.id,
              assetId: record.assetId,
              assetName: record.assetName,
              assetType: record.assetType,
              brandModel: record.brandModel,
              serialNumber: record.serialNumber,
              sequenceNo: record.sequenceNo,
              idcRoom: record.idcRoom,
              rack: record.rack,
              entryAt: record.entryAt,
              marketOrderNo: record.marketOrderNo,
              tagCode: record.tagCode,
              workOrderId: record.workOrderId,
              owner: record.owner,
              deviceStatus: record.deviceStatus,
              channelId: record.channelId,
              channelName: record.channelName,
              occurredAt: record.occurredAt,
              level: rule.level,
              action: rule.action,
              description: rule.description,
              resolutionStatus: "待处理",
              processedBy: "-",
              processedAt: "-",
              resolutionRemark: "-",
              processingHistory: []
            }));
        }
      }

      class AlertAggregator {
        aggregate(records, groupBy, channels, options = {}) {
          if (groupBy === "time") {
            return this.aggregateByTime(records, options.anchorTime, options.timeBuckets || ALERT_TIME_AGGREGATE_OPTIONS);
          }

          const channelMap = new Map(channels.map((channel) => [channel.id, channel]));
          const strategies = {
            owner: (record) => ({
              key: record.owner,
              label: record.owner
            }),
            channel: (record) => ({
              key: record.channelId,
              label: channelMap.get(record.channelId)?.name || record.channelId
            }),
            status: (record) => ({
              key: record.deviceStatus,
              label: record.deviceStatus
            })
          };

          const resolveGroup = strategies[groupBy] || strategies.owner;
          const groups = new Map();

          records.forEach((record) => {
            const group = resolveGroup(record);
            if (!groups.has(group.key)) {
              groups.set(group.key, {
                key: group.key,
                label: group.label,
                total: 0,
                highLevelCount: 0,
                latestAt: record.occurredAt
              });
            }

            const target = groups.get(group.key);
            target.total += 1;
            if (record.level === "高") {
              target.highLevelCount += 1;
            }
            if (new Date(record.occurredAt) > new Date(target.latestAt)) {
              target.latestAt = record.occurredAt;
            }
          });

          return Array.from(groups.values()).sort((left, right) => {
            if (right.total !== left.total) {
              return right.total - left.total;
            }
            return new Date(right.latestAt) - new Date(left.latestAt);
          });
        }

        aggregateByTime(records, anchorInput, buckets) {
          const anchor = anchorInput instanceof Date ? new Date(anchorInput) : new Date(anchorInput);
          const safeAnchor = Number.isNaN(anchor.getTime()) ? new Date() : anchor;

          return buckets.map((bucket) => {
            const range = resolveTimeRangeWindow(bucket.value, safeAnchor);
            const matched = range
              ? records.filter((record) => {
                  const occurredAt = new Date(record.occurredAt);
                  return !Number.isNaN(occurredAt.getTime()) && occurredAt >= range.start && occurredAt <= range.end;
                })
              : records;
            const latest = matched.reduce((latestValue, current) => {
              if (!latestValue) {
                return current;
              }
              return new Date(current.occurredAt) > new Date(latestValue.occurredAt) ? current : latestValue;
            }, null);

            return {
              key: bucket.value,
              label: bucket.label,
              total: matched.length,
              highLevelCount: matched.filter((record) => record.level === "高").length,
              latestAt: latest?.occurredAt || "",
              metaLabel: latest ? "最新：" + formatDateTime(latest.occurredAt) : "当前无告警"
            };
          });
        }
      }
