            const list = target.getAttribute("data-list");
            const field = target.getAttribute("data-field");
            if (!list || !field) {
              return;
            }

            this.draggingListColumn = { list, field };
            this.clearListColumnDragState();
            target.classList.add("is-dragging");
            if (event.dataTransfer) {
              event.dataTransfer.effectAllowed = "move";
              event.dataTransfer.setData("text/plain", list + ":" + field);
            }
          });

          document.addEventListener("dragover", (event) => {
            if (!this.draggingListColumn) {
              return;
            }

            const target = event.target.closest(".list-column-option[data-field]");
            if (!target) {
              return;
            }

            const list = target.getAttribute("data-list");
            const field = target.getAttribute("data-field");
            if (!list || !field || list !== this.draggingListColumn.list || field === this.draggingListColumn.field) {
              return;
            }

            event.preventDefault();
            document.querySelectorAll(".list-column-option.is-drag-over").forEach((node) => {
              if (node !== target) {
                node.classList.remove("is-drag-over");
              }
            });
            target.classList.add("is-drag-over");
          });

          document.addEventListener("drop", (event) => {
            if (!this.draggingListColumn) {
              return;
            }

            const target = event.target.closest(".list-column-option[data-field]");
            if (target) {
              const list = target.getAttribute("data-list");
              const field = target.getAttribute("data-field");
              if (list === this.draggingListColumn.list && field && field !== this.draggingListColumn.field) {
                event.preventDefault();
                this.store.reorderListColumnField(list, this.draggingListColumn.field, field);
              }
            }

            this.draggingListColumn = null;
            this.clearListColumnDragState();
          });

          document.addEventListener("dragend", () => {
            this.draggingListColumn = null;
            this.clearListColumnDragState();
          });

          document.addEventListener("change", (event) => {
            const rawTarget = event.target;
          if (rawTarget?.matches?.('[data-role="rule-range-start"], [data-role="rule-range-end"]')) {
            this.syncRuleDateRangePicker(rawTarget.closest(".rule-date-range-picker"));
            return;
          }

            if (rawTarget && rawTarget.name === "timeRange") {
              const form = rawTarget.closest("form");
              if (rawTarget.value === "CUSTOM") {
                this.setFilterPanelExpanded(form, true);
              }
              this.syncTimeRangeVisibility(form);
            }

            const target = event.target.closest("[data-action]");
            if (!target) {
              return;
            }

            const action = target.getAttribute("data-action");
            if (action === "set-alert-page-size") {
              this.store.setAlertPageSize(Number(target.value || DEFAULT_ALERT_PAGE_SIZE));
              return;
            }

            if (action === "set-tenant-page-size") {
              this.store.setTenantPageSize(Number(target.value || DEFAULT_ALERT_PAGE_SIZE));
              return;
            }

            if (action === "set-recognition-page-size") {
              this.store.setRecognitionPageSize(Number(target.value || DEFAULT_ALERT_PAGE_SIZE));
              return;
            }

            if (action === "set-rule-page-size") {
              this.store.setRulePageSize(Number(target.value || DEFAULT_ALERT_PAGE_SIZE));
              return;
            }

            if (action === "set-channel-page-size") {
              this.store.setChannelPageSize(Number(target.value || DEFAULT_ALERT_PAGE_SIZE));
              return;
            }

            if (action === "set-notice-alert-page-size") {
              this.store.setNoticeAlertPageSize(Number(target.value || DEFAULT_ALERT_PAGE_SIZE));
              return;
            }
          });

          document.addEventListener("submit", (event) => {
            if (event.target.id === "overview-filter-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.setOverviewFilters({
                tenant: formData.get("tenant") || "ALL",
                timeRange: formData.get("timeRange") || "ALL",
                customStart: formData.get("customStart") || "",
                customEnd: formData.get("customEnd") || ""
              });
              return;
            }

            if (event.target.id === "recognition-filter-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.setRecognitionFilters({
                keyword: formData.get("keyword") || "",
                owner: formData.get("owner") || "ALL",
                status: formData.get("status") || "ALL",
                channel: formData.get("channel") || "ALL",
                timeRange: formData.get("timeRange") || "ALL",
                customStart: formData.get("customStart") || "",
                customEnd: formData.get("customEnd") || ""
              });
              return;
            }

            if (event.target.id === "alert-filter-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.setAlertFilters({
                owner: formData.get("owner") || "ALL",
                status: formData.get("status") || "ALL",
                channel: formData.get("channel") || "ALL",
                timeRange: formData.get("timeRange") || "ALL",
                customStart: formData.get("customStart") || "",
                customEnd: formData.get("customEnd") || "",
                processState: formData.get("processState") || "ALL",
                brandModel: formData.get("brandModel") || "",
                serialNumber: formData.get("serialNumber") || "",
                sequenceNo: formData.get("sequenceNo") || "",
                idcRoom: formData.get("idcRoom") || "",
                rack: formData.get("rack") || "",
                marketOrder: formData.get("marketOrder") || "",
                entryTimeStart: formData.get("entryTimeStart") || "",
                entryTimeEnd: formData.get("entryTimeEnd") || ""
              });
              return;
            }

            if (event.target.id === "channel-filter-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.setChannelFilters({
                keyword: formData.get("keyword") || "",
                initStatus: formData.get("initStatus") || "ALL",
                status: formData.get("status") || "ALL"
              });
              return;
            }

            if (event.target.id === "tenant-filter-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.setTenantFilters({
                keyword: formData.get("keyword") || "",
                status: formData.get("status") || "ALL"
              });
              return;
            }

            if (event.target.id === "rule-filter-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.setRuleFilters({
                keyword: formData.get("keyword") || "",
                owner: formData.get("owner") || "ALL",
                status: formData.get("status") || "ALL",
                channel: formData.get("channel") || "ALL",
                level: formData.get("level") || "ALL",
                enabled: formData.get("enabled") || "ALL"
              });
              return;
            }

            if (event.target.id === "notice-alert-filter-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.applyNoticeDrawerFilters({
                owner: formData.get("owner") || "ALL",
                status: formData.get("status") || "ALL",
                channel: formData.get("channel") || "ALL",
                timeRange: formData.get("timeRange") || "ALL",
                customStart: formData.get("customStart") || "",
                customEnd: formData.get("customEnd") || ""
              });
              return;
            }

            if (event.target.id === "sync-log-filter-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.setSyncLogFilters({
                timeRange: formData.get("timeRange") || "ALL",
                customStart: formData.get("customStart") || "",
                customEnd: formData.get("customEnd") || ""
              });
              return;
            }

            if (event.target.id === "simulation-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.simulateRecognition({
                assetId: formData.get("assetId"),
                channelId: formData.get("channelId")
              });
              return;
            }

            if (event.target.id === "rule-form") {
              event.preventDefault();
              const rangeStart = event.target.querySelector('[data-role="rule-range-start"]')?.value || "";
              const rangeEnd = event.target.querySelector('[data-role="rule-range-end"]')?.value || "";
              if ((rangeStart && !rangeEnd) || (!rangeStart && rangeEnd)) {
                this.store.pushToast("时间范围未完成", "请选择完整的开始日期和结束日期。", "warning");
                return;
              }
              const formData = new FormData(event.target);
              this.store.saveRule({
                id: formData.get("id") || "",
                name: formData.get("name") || "",
                ownerCondition: formData.get("ownerCondition") || "ALL",
                statusCondition: formData.get("statusCondition") || "ALL",
                channelCondition: formData.get("channelCondition") || "ALL",
                timeRange: formData.get("timeRange") || "ALL",
                customStart: formData.get("customStart") || "",
                customEnd: formData.get("customEnd") || "",
                level: formData.get("level") || "中",
                enabled: formData.get("enabled") || "true",
                action: formData.get("action") || "",
                description: formData.get("description") || ""
              });
              return;
            }

            if (event.target.id === "alert-process-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.saveAlertProcessing({
                ids: this.parseIdList(formData.get("ids")),
                status: formData.get("status") || "已确认",
                processedBy: formData.get("processedBy") || CURRENT_USER_NAME,
                resolutionRemark: formData.get("resolutionRemark") || ""
              });
              return;
            }

            if (event.target.id === "sync-task-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.saveSyncTask({
                enabled: formData.get("enabled") || "true",
                frequencyMinutes: Number(formData.get("frequencyMinutes") || 60),
                remark: formData.get("remark") || ""
              });
              return;
            }

            if (event.target.id === "channel-init-form") {
              event.preventDefault();
              const formData = new FormData(event.target);
              this.store.saveChannelInitialization({
                id: formData.get("id") || "",
                name: formData.get("name") || "",
                position: formData.get("position") || ""
              });
            }
          });

          document.addEventListener("keydown", (event) => {
            const rawTarget = event.target;
            if (
              event.key === "Enter" &&
              (rawTarget?.classList?.contains("search-select-search-input") || rawTarget?.classList?.contains("multi-select-search-input"))
            ) {
              event.preventDefault();
              return;
            }

            if (event.key !== "Escape") {
              return;
            }

            if (document.querySelector(".search-select.is-open")) {
              this.closeAllSearchSelects();
              return;
            }

            if (document.querySelector(".multi-select.is-open")) {
              this.closeAllMultiSelects();
              return;
            }

            if (document.querySelector(".rule-date-range-picker.is-open")) {
              this.closeAllRuleDateRangePickers();
              return;
            }

            if (this.store.getState().ui.openListColumnMenu) {
              this.store.closeListColumnMenu();
              return;
            }

            if (this.store.getState().ui.modal) {
              this.store.closeModal();
              return;
            }

            if (this.store.getState().ui.drawer) {
              this.store.closeDrawer();
              return;
            }

            if (this.store.getState().ui.noticeDrawer?.open) {
              this.store.closeNoticeDrawer();
            }
          });

          document.addEventListener(
            "mouseover",
            (event) => {
              const activePopover = document.querySelector(".proto-hint-global-popover");
              const host = event.target.closest(".proto-hint-host");
              if (!host || !host.querySelector(".proto-hint-popover")) {
                if (!activePopover?.contains(event.target)) {
                  hideProtoHintGlobalPopover();
                }
                return;
              }
              document.querySelectorAll(".proto-hint-host.is-proto-hint-active").forEach((node) => {
                if (node !== host) {
                  node.classList.remove("is-proto-hint-active");
                }
              });
              host.classList.add("is-proto-hint-active");
              window.requestAnimationFrame(() => {
                updateProtoHintPopoverPosition(host);
              });
            },
            true
          );

          document.addEventListener(
            "mouseout",
            (event) => {
              const host = event.target.closest(".proto-hint-host");
              if (!host) {
                return;
              }
              const related = event.relatedTarget;
              const pop = document.querySelector(".proto-hint-global-popover");
              if (host.contains(related) || pop?.contains(related)) {
                return;
              }
              window.setTimeout(() => {
                if (host.matches(":hover") || pop?.matches(":hover")) {
                  return;
                }
                hideProtoHintGlobalPopover();
              }, 0);
            },
            true
          );

          document.addEventListener(
            "focusin",
            (event) => {
              const host = event.target.closest(".proto-hint-host");
              if (!host || !host.querySelector(".proto-hint-popover")) {
                return;
              }
              host.classList.add("is-proto-hint-active");
              window.requestAnimationFrame(() => {
                updateProtoHintPopoverPosition(host);
              });
            },
            true
          );

          document.addEventListener(
            "focusout",
            (event) => {
              const host = event.target.closest(".proto-hint-host");
              if (!host) {
                return;
              }
              window.setTimeout(() => {
                if (host.contains(document.activeElement)) {
                  return;
                }
                hideProtoHintGlobalPopover();
              }, 0);
            },
            true
          );

          document.addEventListener(
            "scroll",
            () => {
              repositionActiveProtoHintHosts();
              document.querySelectorAll("[data-composite-trend-chart] .overview-composite-tooltip").forEach((node) => {
                node.hidden = true;
              });
            },
            true
          );

          document.addEventListener(
            "pointermove",
            (event) => {
              const band = event.target.closest(".overview-composite-hover-band");
              if (band) {
                const wrap = band.closest("[data-composite-trend-chart]");
                if (!wrap) {
                  return;
                }
                const raw = wrap.getAttribute("data-overview-trend-points");
                let points;
                try {
                  points = JSON.parse(decodeURIComponent(raw || "%5B%5D"));
                } catch (error) {
                  return;
                }
                const idx = Number(band.getAttribute("data-slot-index"));
                const row = points[idx];
                if (!row) {
                  return;
                }
                const tip = wrap.querySelector(".overview-composite-tooltip");
                if (!tip) {
                  return;
                }
                tip.innerHTML =
                  '<div class="overview-composite-tooltip-title">' +
                  escapeHtml(String(row.label)) +
                  '</div><div class="overview-composite-tooltip-body">' +
                  '<div class="overview-composite-tooltip-row"><span>识别记录</span><strong>' +
                  escapeHtml(String(row.recognition)) +
                  "</strong></div>" +
                  '<div class="overview-composite-tooltip-row"><span>告警记录</span><strong>' +
                  escapeHtml(String(row.alert)) +
                  "</strong></div>" +
                  '<div class="overview-composite-tooltip-row"><span>告警处置</span><strong>' +
                  escapeHtml(String(row.processed)) +
                  "</strong></div></div>";
                tip.hidden = false;
                const pad = 12;
                window.requestAnimationFrame(() => {
                  const rect = tip.getBoundingClientRect();
                  let left = event.clientX + pad;
                  let top = event.clientY + pad;
                  if (left + rect.width > window.innerWidth - 8) {
                    left = Math.max(8, event.clientX - rect.width - pad);
                  }
                  if (top + rect.height > window.innerHeight - 8) {
                    top = Math.max(8, event.clientY - rect.height - pad);
                  }
                  tip.style.left = left + "px";
                  tip.style.top = top + "px";
                });
                return;
              }
              document.querySelectorAll("[data-composite-trend-chart] .overview-composite-tooltip").forEach((node) => {
                node.hidden = true;
              });
            },
            true
          );

          window.addEventListener("resize", () => {
            repositionActiveProtoHintHosts();
            document.querySelectorAll("[data-composite-trend-chart] .overview-composite-tooltip").forEach((node) => {
              node.hidden = true;
            });
            const state = this.store.getState();
            if (state.ui.drawer) {
              const next = clampSideDrawerWidthPx(state.ui.sideDrawerWidthPx);
              if (next !== state.ui.sideDrawerWidthPx) {
                this.store.setSideDrawerWidthPx(next, { emit: false });
              }
              this.applySideDrawerWidth(next);
            }
            if (state.ui.noticeDrawer?.open) {
              this.store.emit();
            }
          });
        }

        syncChannels(meta = {}) {
          if (this.store.getState().ui.syncingChannels) {
            return;
          }

          this.store.setSyncingChannels(true);

          window.setTimeout(() => {
            const payload = this.store.channelGateway.fetchChannels();
            this.store.setSyncingChannels(false);
            this.store.mergeChannelPayload(payload, {
              triggerType: meta.triggerType || "手动同步",
              operator: meta.operator || CURRENT_USER_NAME
            });
          }, 1100);
        }
      }

      const store = new PrototypeStore();
      const renderer = new PrototypeRenderer(store, {
        topbar: document.getElementById("app-topbar"),
        sidebar: document.getElementById("sidebar"),
        header: document.getElementById("page-header"),
        content: document.getElementById("page-content"),
        overlay: document.getElementById("overlay-root"),
        toast: document.getElementById("toast-root")
      });
      const app = new PrototypeApp(store, renderer);
      app.init();
    </script>
  </body>
</html>
