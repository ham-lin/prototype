            this.state.ui.guidePage = null;
            this.state.ui.guideMenuOpen = false;
            this.emit();
          }

          setAssetDetailTab(tabId) {
            if (!this.state.ui.detailPage) {
              return;
            }
            this.state.ui.detailPage.activeTab = tabId;
            this.emit();
          }

          setAssetHistoryRange(rangeLabel) {
            if (!this.state.ui.detailPage) {
              return;
            }
            this.state.ui.detailPage.historyRange = rangeLabel;
            this.emit();
          }

          closeDrawer() {
            this.state.ui.drawer = null;
            this.emit();
          }

          closeRowMoreMenu(shouldEmit = true) {
            if (!this.state.ui.rowMoreMenu) {
              return false;
            }
            this.state.ui.rowMoreMenu = null;
            if (shouldEmit) {
              this.emit();
            }
            return true;
          }

          isRowMoreMenuOpen(viewId, rowId) {
            const rowMoreMenu = this.state.ui.rowMoreMenu;
            return Boolean(rowMoreMenu && rowMoreMenu.viewId === viewId && rowMoreMenu.rowId === rowId);
          }

          toggleRowMoreMenu(viewId, rowId) {
            this.closeGuideMenu(false);
            if (this.isRowMoreMenuOpen(viewId, rowId)) {
              this.state.ui.rowMoreMenu = null;
            } else {
              this.state.ui.rowMoreMenu = { viewId, rowId };
            }
            this.emit();
          }

          executeRowMoreAction(viewId, rowId, label) {
            const row = this.getRowById(viewId, rowId);
            const menuClosed = this.closeRowMoreMenu(false);
            if (!row) {
              if (menuClosed) {
                this.emit();
              }
              return;
            }
            if (label === "关联设备") {
              this.openRelationDialog(viewId, rowId);
              return;
            }
            if (ROW_MORE_PAGE_META[label]) {
              this.openOperationPage(viewId, rowId, label);
              return;
            }
            this.pushToast(label, row.name + " 已触发“" + label + "”演示动作。", "info");
          }

          openRelationDialog(viewId, rowId) {
            const row = this.getRowById(viewId, rowId);
            if (!row) {
              return;
            }
            this.state.ui.drawer = null;
            this.state.ui.operationPage = null;
            this.state.ui.guidePage = null;
            const defaultSource = RELATION_VIEW_TO_VIEW_ID[viewId] || "itFacility";
            this.state.ui.relationDialog = {
              viewId,
              rowId,
              step: 1,
              relationType: null,
              sourceViewId: defaultSource,
              keywords: { name: "", assetCode: "", assetCategory: "", assetLocation: "" },
              searchExpanded: false,
              page: 1,
              pageSize: 10,
              selected: [],
              error: null
            };
            this.emit();
          }

          closeRelationDialog() {
            if (!this.state.ui.relationDialog) {
              return;
            }
            this.state.ui.relationDialog = null;
            this.emit();
          }

          setRelationType(type) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            if (type !== RELATION_TYPE_PARENT && type !== RELATION_TYPE_CHILD) {
              return;
            }
            if (dialog.relationType !== type) {
              dialog.selected = [];
            }
            dialog.relationType = type;
            dialog.error = null;
            this.emit();
          }

          relationGoStep(step) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            const target = Number(step) === 2 ? 2 : 1;
            if (target === 2 && !dialog.relationType) {
              dialog.error = "请先选择关联类型。";
              this.emit();
              return;
            }
            if (target === 2) {
              const currentRow = this.getRowById(dialog.viewId, dialog.rowId);
              if (currentRow && this.isRelationStatusBlocked(currentRow.assetStatus)) {
                dialog.error = "当前资产状态为「" + currentRow.assetStatus + "」，禁止新增主从关系。";
                this.emit();
                return;
              }
              const existingParent = this.findParentOf(dialog.viewId, dialog.rowId);
              const existingChildren = this.findChildrenOf(dialog.viewId, dialog.rowId);
              if (dialog.relationType === RELATION_TYPE_PARENT) {
                if (existingParent) {
                  const parentRow = this.getRowById(existingParent.parentViewId, existingParent.parentRowId);
                  dialog.error = "当前设备已关联主设备「" + (parentRow?.name || existingParent.parentRowId) + "」，从设备只能关联一个主设备，请先解绑。";
                  this.emit();
                  return;
                }
                if (existingChildren.length > 0) {
                  dialog.error = "当前设备已作为主设备绑定了 " + existingChildren.length + " 个从设备，仅允许两层关系，不能再被关联为从。";
                  this.emit();
                  return;
                }
              } else {
                if (existingParent) {
                  const parentRow = this.getRowById(existingParent.parentViewId, existingParent.parentRowId);
                  dialog.error = "当前设备已是「" + (parentRow?.name || existingParent.parentRowId) + "」的从设备，仅允许两层关系，不能再关联从设备。";
                  this.emit();
                  return;
                }
              }
            }
            dialog.step = target;
            dialog.error = null;
            this.emit();
          }

          setRelationSource(sourceViewId) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.sourceViewId = sourceViewId;
            dialog.page = 1;
            dialog.selected = [];
            dialog.error = null;
            this.emit();
          }

          setRelationField(field, value) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            const allowed = ["name", "assetCode", "assetCategory", "assetLocation"];
            if (allowed.indexOf(field) === -1) {
              return;
            }
            dialog.keywords = { ...dialog.keywords, [field]: String(value || "") };
            dialog.page = 1;
            dialog.selected = [];
            this.emit();
          }

          resetRelationKeywords() {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.keywords = { name: "", assetCode: "", assetCategory: "", assetLocation: "" };
            dialog.page = 1;
            dialog.selected = [];
            this.emit();
          }

          toggleRelationSearchExpanded() {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.searchExpanded = !dialog.searchExpanded;
            this.emit();
          }

          setRelationPage(page) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.page = Math.max(1, Number(page) || 1);
            this.emit();
          }

          setRelationPageSize(size) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            dialog.pageSize = Math.max(1, Number(size) || 10);
            dialog.page = 1;
            this.emit();
          }

          toggleRelationSelection(sourceViewId, rowId) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            if (!Array.isArray(dialog.selected)) {
              dialog.selected = dialog.selected ? [dialog.selected] : [];
            }
            const idx = dialog.selected.findIndex((item) => item.sourceViewId === sourceViewId && item.rowId === rowId);
            if (dialog.relationType === RELATION_TYPE_PARENT) {
              dialog.selected = [{ sourceViewId, rowId }];
            } else if (idx >= 0) {
              dialog.selected.splice(idx, 1);
            } else {
              dialog.selected.push({ sourceViewId, rowId });
            }
            dialog.error = null;
            this.emit();
          }

          isRelationCandidateSelected(sourceViewId, rowId) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog || !Array.isArray(dialog.selected)) {
              return false;
            }
            return dialog.selected.some((item) => item.sourceViewId === sourceViewId && item.rowId === rowId);
          }

          confirmRelation() {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return;
            }
            const selectedList = Array.isArray(dialog.selected) ? dialog.selected : (dialog.selected ? [dialog.selected] : []);
            if (selectedList.length === 0) {
              dialog.error = "请先勾选至少一条设备记录。";
              this.emit();
              return;
            }
            if (dialog.relationType === RELATION_TYPE_PARENT && selectedList.length > 1) {
              dialog.error = "关联主设备只能选择一条记录。";
              this.emit();
              return;
            }
            for (let i = 0; i < selectedList.length; i++) {
              const candidate = selectedList[i];
              const validation = this.validateRelation(dialog, candidate);
              if (!validation.ok) {
                const targetRow = this.getRowById(candidate.sourceViewId, candidate.rowId);
                dialog.error = "「" + (targetRow?.name || candidate.rowId) + "」校验未通过：" + validation.message;
                this.emit();
                return;
              }
            }
            const currentRow = this.getRowById(dialog.viewId, dialog.rowId);
            const today = new Date().toISOString().slice(0, 10);
            const relations = selectedList.map((candidate) => (
              dialog.relationType === RELATION_TYPE_PARENT
                ? {
                    parentViewId: candidate.sourceViewId,
                    parentRowId: candidate.rowId,
                    childViewId: dialog.viewId,
                    childRowId: dialog.rowId,
                    linkedAt: today
                  }
                : {
                    parentViewId: dialog.viewId,
                    parentRowId: dialog.rowId,
                    childViewId: candidate.sourceViewId,
                    childRowId: candidate.rowId,
                    linkedAt: today
                  }
            ));
            this.state.data.relations.push(...relations);
            this.state.ui.relationDialog = null;
            const verb = dialog.relationType === RELATION_TYPE_PARENT ? "主设备" : "从设备";
            const message = selectedList.length === 1
              ? (currentRow?.name || "当前设备") + " 已关联" + verb + "「" + (this.getRowById(selectedList[0].sourceViewId, selectedList[0].rowId)?.name || "目标设备") + "」。"
              : (currentRow?.name || "当前设备") + " 已关联 " + selectedList.length + " 个" + verb + "。";
            this.pushToast("关联成功", message, "success");
          }

          validateRelation(dialog, candidate) {
            const currentRow = this.getRowById(dialog.viewId, dialog.rowId);
            const targetRow = this.getRowById(candidate.sourceViewId, candidate.rowId);
            if (!currentRow || !targetRow) {
              return { ok: false, message: "找不到当前设备或目标设备。" };
            }
            if (dialog.viewId === candidate.sourceViewId && dialog.rowId === candidate.rowId) {
              return { ok: false, message: "不能将设备关联到其自身。" };
            }
            if (this.isRelationStatusBlocked(currentRow.assetStatus)) {
              return { ok: false, message: "当前资产状态为「" + currentRow.assetStatus + "」，禁止新增主从关系。" };
            }
            if (this.isRelationStatusBlocked(targetRow.assetStatus)) {
              return { ok: false, message: "所选设备状态为「" + targetRow.assetStatus + "」，禁止建立关联。" };
            }
            const currentChildren = this.findChildrenOf(dialog.viewId, dialog.rowId);
            const currentParent = this.findParentOf(dialog.viewId, dialog.rowId);
            const targetChildren = this.findChildrenOf(candidate.sourceViewId, candidate.rowId);
            const targetParent = this.findParentOf(candidate.sourceViewId, candidate.rowId);
            if (dialog.relationType === RELATION_TYPE_PARENT) {
              if (currentParent) {
                return { ok: false, message: "当前设备已关联主设备，从设备只能关联一个主设备。" };
              }
              if (currentChildren.length > 0) {
                return { ok: false, message: "当前设备已作为主设备绑定了 " + currentChildren.length + " 个从设备，仅允许两层关系。" };
              }
              if (targetParent) {
                const targetParentRow = this.getRowById(targetParent.parentViewId, targetParent.parentRowId);
                return { ok: false, message: "所选主设备本身已是「" + (targetParentRow?.name || targetParent.parentRowId) + "」的从设备，仅允许两层关系。" };
              }
              if (this.wouldCauseCycle({
                parentViewId: candidate.sourceViewId,
                parentRowId: candidate.rowId,
                childViewId: dialog.viewId,
                childRowId: dialog.rowId
              })) {
                return { ok: false, message: "该关联会形成循环（祖孙互绑），已阻止。" };
              }
            } else {
              if (currentParent) {
                const parentRow = this.getRowById(currentParent.parentViewId, currentParent.parentRowId);
                return { ok: false, message: "当前设备已是「" + (parentRow?.name || currentParent.parentRowId) + "」的从设备，仅允许两层关系，不能再关联从设备。" };
              }
              if (targetParent) {
                const targetParentRow = this.getRowById(targetParent.parentViewId, targetParent.parentRowId);
                return { ok: false, message: "所选设备已关联主设备「" + (targetParentRow?.name || targetParent.parentRowId) + "」，请先解绑后再操作。" };
              }
              if (targetChildren.length > 0) {
                return { ok: false, message: "所选设备已作为主设备绑定了 " + targetChildren.length + " 个从设备，仅允许两层关系。" };
              }
              if (this.wouldCauseCycle({
                parentViewId: dialog.viewId,
                parentRowId: dialog.rowId,
                childViewId: candidate.sourceViewId,
                childRowId: candidate.rowId
              })) {
                return { ok: false, message: "该关联会形成循环（祖孙互绑），已阻止。" };
              }
            }
            return { ok: true };
          }

          isRelationStatusBlocked(status) {
            return RELATION_NON_BINDABLE_STATUS.indexOf(String(status || "")) !== -1;
          }

          findParentOf(viewId, rowId) {
            const relations = this.state.data.relations || [];
            return relations.find((rel) => rel.childViewId === viewId && rel.childRowId === rowId) || null;
          }

          findChildrenOf(viewId, rowId) {
            const relations = this.state.data.relations || [];
            return relations.filter((rel) => rel.parentViewId === viewId && rel.parentRowId === rowId);
          }

          wouldCauseCycle(candidate) {
            const visited = new Set();
            const queue = [{ viewId: candidate.childViewId, rowId: candidate.childRowId }];
            while (queue.length) {
              const node = queue.shift();
              const key = node.viewId + "::" + node.rowId;
              if (visited.has(key)) {
                continue;
              }
              visited.add(key);
              if (node.viewId === candidate.parentViewId && node.rowId === candidate.parentRowId) {
                return true;
              }
              const children = this.findChildrenOf(node.viewId, node.rowId);
              children.forEach((child) => queue.push({ viewId: child.childViewId, rowId: child.childRowId }));
            }
            return false;
          }

          getRelationSourceTabs() {
            return [
              { id: VIEW_IDS.IT_FACILITY, label: "IT设施-台账" },
              { id: VIEW_IDS.STATION_FACILITY, label: "场地设施-台账" },
              { id: VIEW_IDS.CABINET, label: "机柜管理-台账" },
              { id: VIEW_IDS.SPARE_PART, label: "备件-台账" },
              { id: "all", label: "全部" }
            ];
          }

          getRelationCandidateRows() {
            const dialog = this.state.ui.relationDialog;
            if (!dialog) {
              return [];
            }
            const tabs = this.getRelationSourceTabs().filter((tab) => tab.id !== "all");
            const sourceTab = tabs.find((tab) => tab.id === dialog.sourceViewId);
            const buildRows = (tab) => {
              const list = this.getListRows(tab.id) || [];
              return list.map((row) => ({
                ...row,
                __sourceViewId: tab.id,
                __sourceLabel: tab.label
              }));
            };
            const rows = dialog.sourceViewId === "all"
              ? tabs.flatMap((tab) => buildRows(tab))
              : (sourceTab ? buildRows(sourceTab) : []);
            const keywords = dialog.keywords || {};
            const matches = (row, field) => {
              const value = String(keywords[field] || "").trim().toLowerCase();
              if (!value) {
                return true;
              }
              return String(row[field] || "").toLowerCase().includes(value);
            };
            return rows.filter((row) =>
              matches(row, "name")
              && matches(row, "assetCode")
              && matches(row, "assetCategory")
              && matches(row, "assetLocation")
            );
          }

          isRowExpanded(viewId, rowId) {
            const map = this.state.ui.expandedRows?.[viewId];
            if (map && map[rowId]) return true;
            const auto = this.state.ui.autoExpandRows?.[viewId];
            return !!(auto && auto[rowId]);
          }

          toggleRowExpansion(viewId, rowId) {
            if (!this.state.ui.expandedRows) {
              this.state.ui.expandedRows = {};
            }
            const bucket = this.state.ui.expandedRows[viewId] || {};
            if (bucket[rowId]) {
              delete bucket[rowId];
            } else {
              bucket[rowId] = true;
            }
            this.state.ui.expandedRows[viewId] = bucket;
            this.emit();
          }

          unbindRelation(parentViewId, parentRowId, childViewId, childRowId) {
            const relations = this.state.data.relations || [];
            const before = relations.length;
            this.state.data.relations = relations.filter((rel) => !(
              rel.parentViewId === parentViewId
              && rel.parentRowId === parentRowId
              && rel.childViewId === childViewId
              && rel.childRowId === childRowId
            ));
            const removed = before - this.state.data.relations.length;
            const parentRow = this.getRowById(parentViewId, parentRowId);
            const childRow = this.getRowById(childViewId, childRowId);
            if (removed > 0) {
              this.pushToast(
                "已解绑",
                "「" + (childRow?.name || childRowId) + "」已从主设备「" + (parentRow?.name || parentRowId) + "」解除关联。",
                "success"
              );
            } else {
              this.emit();
            }
          }

          getRelationRowDisableReason(row) {
            const dialog = this.state.ui.relationDialog;
            if (!dialog || !row) {
              return null;
            }
            if (row.__sourceViewId === dialog.viewId && row.id === dialog.rowId) {
              return "当前设备";
            }
            if (this.isRelationStatusBlocked(row.assetStatus)) {
              return row.assetStatus;
            }
            const targetParent = this.findParentOf(row.__sourceViewId, row.id);
            const targetChildren = this.findChildrenOf(row.__sourceViewId, row.id);
            if (targetParent) {
              return "已是从设备";
            }
            if (targetChildren.length > 0) {
              return "已是主设备";
            }
            return null;
          }

          executeDrawerAction() {
            const drawer = this.state.ui.drawer;
            if (!drawer) {
              return;
            }
            const row = this.getRowById(drawer.viewId, drawer.rowId);
            if (!row) {
              return;
            }
            if (drawer.viewId === VIEW_IDS.PENDING_ASSET) {
              row.assetStatus = "已初始化";
              this.pushToast("初始化完成", row.name + " 已完成初始化并可进入正式台账。", "success");
            } else {
              this.pushToast("已记录操作", row.name + " 的演示操作已执行。", "success");
            }
            this.state.ui.drawer = null;
            this.emit();
          }

          handleRowAction(viewId, rowId, action) {
            if (action === "查看") {
              this.openDetailPage(viewId, rowId);
              return;
            }
            if (action === "初始化") {
              this.openDrawer(viewId, rowId, "init");
              return;
            }
            if (action === "更多") {
              return;
            }
            this.closeRowMoreMenu(false);
            this.pushToast("更多操作", LIST_PAGE_META[viewId].title + " 的更多动作已展开为原型反馈。", "info");
          }

          getAssetDetailPageData() {
            const detailPage = this.state.ui.detailPage;
            if (!detailPage) {
              return null;
            }

            const row = this.getRowById(detailPage.viewId, detailPage.rowId);
            if (!row) {
              return null;
            }

            const titleMap = {
              [VIEW_IDS.IT_FACILITY]: "IT设备详情",
              [VIEW_IDS.STATION_FACILITY]: "场地设施详情",
              [VIEW_IDS.CABINET]: "机柜详情",
              [VIEW_IDS.SPARE_PART]: "备件详情",
              [VIEW_IDS.RETIRED_ASSET]: "资产详情"
            };

            const normalize = (value) => (value === undefined || value === null || value === "" ? "-" : String(value));
            const locationLabel = normalize(row.assetLocation);
            const startU = Math.max(1, Number(row.startU) || 1);
            const unitHeight = Math.max(1, Number(row.uHeight) || 2);
            const unitEnd = startU + unitHeight - 1;
            const rackUnitHeight = 10;
            const rackUnitGap = 2;
            const locationParts = locationLabel === "-" ? [] : locationLabel.split("-");
            const rackUnits = Array.from({ length: 42 }, (_, index) => {
              const unit = 42 - index;
              let tone = "empty";
              if (unit >= startU && unit <= unitEnd) {
                tone = "selected";
              } else if (unit === unitEnd + 1 || unit === unitEnd + 2) {
                tone = "reserved";
              } else if (detailPage.viewId === VIEW_IDS.CABINET && unit < startU) {
                tone = "occupied";
              } else if (detailPage.viewId === VIEW_IDS.RETIRED_ASSET && unit <= 2) {
                tone = "removed";
              }
              return { unit, label: pad(unit, 2), tone };
            });
            const selectedIndexes = rackUnits
              .map((unit, index) => unit.tone === "selected" ? index : -1)
              .filter((index) => index > -1);
            const selectedStartIndex = selectedIndexes.length ? Math.min(...selectedIndexes) : 0;
            const selectedHeight = selectedIndexes.length
              ? (selectedIndexes.length * rackUnitHeight) + ((selectedIndexes.length - 1) * rackUnitGap)
              : rackUnitHeight;
            const selectedTop = selectedStartIndex * (rackUnitHeight + rackUnitGap);
            const cabinetHeight = Math.max(1, Number(row.cabinetHeight) || 42);
            const cabinetOccupiedStatusSlots = new Set([1, 6, 7]);
            const cabinetRackUnits = Array.from({ length: cabinetHeight }, (_, index) => {
              const unit = cabinetHeight - index;
              return {
                unit,
                label: pad(unit, 2),
                tone: "empty"
              };
            });
            const cabinetUPositionRows = Array.from({ length: 10 }, (_, index) => {
              const slot = index + 1;
              const occupied = cabinetOccupiedStatusSlots.has(slot);
              return {
                id: "U-" + pad(slot, 2),
                label: "第" + slot + "U位",
                status: occupied ? "占用" : "空闲",
                action: "禁用"
              };
            });
            const basicFields = [
              { label: "资产编号", value: normalize(row.assetCode) },
              { label: "名称", value: normalize(row.name) },
              { label: "资产状态", value: normalize(row.assetStatus) },
              { label: "资产分类", value: normalize(row.assetCategory) },
              { label: "资产位置", value: locationLabel },
              { label: "厂商", value: normalize(row.vendor) },
              { label: "编号", value: normalize(row.serialCode) },
              { label: "序列号", value: normalize(row.serialNumber) },
              { label: "起始U位", value: normalize(row.startU) },
              { label: "U高", value: normalize(row.uHeight || row.cabinetHeight) },
              { label: "机柜高度", value: normalize(row.cabinetHeight) },
              { label: "端口数量", value: normalize(row.portCount) },
              { label: "额定功率", value: normalize(row.ratedPower) },
              { label: "关联资产", value: normalize(row.relatedAsset) },
              { label: "描述", value: normalize(row.description || row.assetSummary) },
              { label: "验收日期", value: "2025-09-18" },
              { label: "投产日期", value: "2025-10-16" },
              { label: "通信状态", value: "-" },
              { label: "IP地址", value: "-" },
              { label: "MAC地址", value: "-" }
            ];
            const breadcrumb = [
              "上江区",
              "全场数据中心",
              locationParts[0] || "D8",
              "区厅",
              (locationParts[0] || "D8") + "-L41托管资源机房",
              "机柜_" + (locationLabel === "-" ? normalize(row.name) : locationLabel),
              startU + "U"
            ].join(" > ");
            const topologyNodes = [
              { id: "source", title: "属性", subtitle: "默认资产展示", left: "18%", top: "208px" },
              { id: "asset", title: "资产", subtitle: normalize(row.name), left: "50%", top: "208px", primary: true },
              { id: "cabinet", title: "机柜", subtitle: "机柜_" + (locationLabel === "-" ? normalize(row.name) : locationLabel), left: "82%", top: "208px" }
            ];
            return {
              title: titleMap[detailPage.viewId] || "资产详情",
              viewId: detailPage.viewId,
              row,
              activeTab: detailPage.activeTab,
              tabs: ASSET_DETAIL_TABS,
              historyRange: detailPage.historyRange || "近7日",
              historyRanges: ["近7日", "近10日", "近15日"],
              basicFields,
              breadcrumb,
              rackUnits,
              rackHoverCard: {
                top: selectedTop,
                height: selectedHeight,
                assetName: normalize(row.name),
                assetTag: normalize(row.relatedAsset || row.assetCode || row.serialNumber)
              },
              legends: [
                { label: "空闲", tone: "empty" },
                { label: "占用", tone: "occupied" },
                { label: "选中", tone: "selected" },
                { label: "预占", tone: "reserved" },
                { label: "禁用", tone: "removed" }
              ],
              topologyNodes,
              containsColumns: ["资产编号", "名称", "序列号", "资产状态", "资产分类", "资产位置", "U高", "开始U位", "额定功率", "操作"],
              containsEmptyText: "没有找到匹配的记录",
              cabinetContains: {
                relatedTitle: "关联资产",
                relatedColumns: ["资产编号", "名称", "序列号", "资产状态", "资产分类", "资产位置", "U高", "开始U位", "额定供电功率", "操作"],
                rackUnits: cabinetRackUnits,
                uTitle: "U位管理",
                batchActions: ["批量禁用", "批量启用"],
                uRows: cabinetUPositionRows
              }
            };
          }

          handleHeaderAction(label, viewId) {
            this.closeRowMoreMenu(false);
            if (label === "导出资产") {
              this.exportAssetsWithChildren(viewId);
              return;
            }
            if (label === "批量初始化") {
              this.pushToast("批量初始化", "已触发批量初始化任务，示例数据未批量写回。", "warning");
              return;
            }
            this.pushToast(label, LIST_PAGE_META[viewId].title + " 已触发“" + label + "”演示动作。", "info");
          }

          exportAssetsWithChildren(viewId) {
            const meta = LIST_PAGE_META[viewId];
            if (!meta) {
              this.pushToast("导出失败", "未识别的台账。", "warning");
              return;
            }
            const rows = this.getFilteredRows(viewId) || [];
            if (rows.length === 0) {
              this.pushToast("导出失败", "当前筛选结果为空。", "warning");
              return;
            }
            const fields = meta.columns.filter((column) => column.key !== "__select" && column.key !== "__actions");
            const relationColumn = { key: "__relation", label: "关系" };
            const exportColumns = fields.length > 0
              ? [fields[0], relationColumn, ...fields.slice(1)]
              : [relationColumn];
            const csvRows = [exportColumns.map((column) => column.label)];
            const formatCell = (value) => {
              if (value === undefined || value === null) {
                return "";
              }
              return String(value);
            };
            let parentCount = 0;
            let childCount = 0;
            let independentCount = 0;
            const buildLine = (row, relationLabel) => exportColumns.map((column) => {
              if (column.key === "__relation") return relationLabel;
              return formatCell(row[column.key]);
            });
            const topRows = rows.filter((row) => !this.findParentOf(viewId, row.id));
            topRows.forEach((row) => {
              const children = this.findChildrenOf(viewId, row.id);
              const isParent = children.length > 0;
              if (isParent) parentCount += 1; else independentCount += 1;
              csvRows.push(buildLine(row, isParent ? "主设备" : "独立设备"));
              children.forEach((rel) => {
                const childRow = this.getRowById(rel.childViewId, rel.childRowId);
                if (!childRow) return;
                childCount += 1;
                csvRows.push(buildLine(childRow, "从设备"));
              });
            });
            const escapeCsv = (value) => {
              const str = formatCell(value);
              if (/[",\n\r]/.test(str)) {
                return '"' + str.replace(/"/g, '""') + '"';
              }
              return str;
            };
            const csvBody = csvRows.map((columns) => columns.map(escapeCsv).join(",")).join("\r\n");
            const csvText = "\uFEFF" + csvBody;
            const now = new Date();
            const stamp = now.getFullYear()
              + pad(now.getMonth() + 1)
              + pad(now.getDate())
              + "_"
              + pad(now.getHours())
              + pad(now.getMinutes())
              + pad(now.getSeconds());
            const fileName = "R5_" + meta.title + "_" + stamp + ".csv";
            const totalRows = parentCount + independentCount + childCount;
            const summary = "主设备 " + parentCount
              + " / 从设备 " + childCount
              + " / 独立设备 " + independentCount
              + " = 共 " + totalRows + " 行";
            this.pushToast("正在生成", "导出 " + summary + "……", "info");
            try {
              const blob = new Blob([csvText], { type: "text/csv;charset=utf-8;" });
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);
              setTimeout(() => URL.revokeObjectURL(url), 0);
              setTimeout(() => {
                this.pushToast("导出完成", "已下载 " + fileName + "（" + summary + "）", "success");
              }, 600);
            } catch (error) {
              this.pushToast("导出失败", "浏览器拒绝了文件下载请求。", "warning");
            }
          }

          downloadMasterSlaveTemplate(scope = "all", ledgers = {}, autoFillRules = []) {
            const ledgerOptions = this.getMasterSlaveTemplateLedgerOptions();
            const selectedLedgers = scope === "all"

            const headers = ["台账类型", "设备编号", "设备名称", "资产状态", "资产位置", "从设备编号"];
            const allEntries = this.getMasterSlaveTemplateDeviceEntries(selectedLedgers);
            const allCodes = new Set(allEntries.map((entry) => entry.code).filter(Boolean));
            const rows = selectedLedgers.flatMap((ledger) =>

                this.getMasterSlaveTemplateDeviceCode(row),

            );
            if (rows.length === 0) {
              this.pushToast("下载失败", "所选台账暂无可导出的样例数据。", "warning");
              return;
            }
            const workbookText = this.buildMasterSlaveTemplateWorkbook(headers, rows, scope, selectedLedgers);
            try {
              const blob = new Blob([workbookText], { type: "application/vnd.ms-excel;charset=utf-8;" });
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = "主从设备关系导入模板_" + (scope === "all" ? "全量台账" : "部分台账") + ".xls";
              document.body.appendChild(link);

              this.pushToast("模板已下载", "已下载包含" + selectedLedgers.length + "类台账数据的主从设备关系导入模板。", "success");
            } catch (error) {
              this.pushToast("下载失败", "浏览器拒绝了模板下载请求。", "warning");

            this.emit();
          }

          getMasterSlaveTemplateDeviceCode(row) {
            return String(row?.assetCode || row?.serialCode || row?.serialNumber || row?.id || "");
          }

          getMasterSlaveTemplateDeviceEntries(selectedLedgers) {
            return selectedLedgers.flatMap((ledger) =>
              (this.getListRows(ledger.viewId) || []).map((row) => ({
                ledger,
                row,
                code: this.getMasterSlaveTemplateDeviceCode(row),
                name: row.name || "",
                category: row.assetCategory || ""
              }))
            );
          }

          getMasterSlaveTemplateDeviceCodeSet(selectedLedgers) {
            return new Set(this.getMasterSlaveTemplateDeviceEntries(selectedLedgers).map((entry) => entry.code).filter(Boolean));
          }

          getSelectedMasterSlaveTemplateLedgers(dialog) {
            const scope = dialog?.scope || "all";
            const ledgers = dialog?.ledgers || {};
            const ledgerOptions = this.getMasterSlaveTemplateLedgerOptions();
            return scope === "all" ? ledgerOptions : ledgerOptions.filter((item) => ledgers[item.viewId]);
          }

          normalizeMasterSlaveRuleText(value) {
            return String(value || "").trim().toLowerCase();
          }

          isMasterSlaveRuleMatched(row, rule) {
            if (!rule || rule.enabled === false || rule.ruleType === "none") {
              return false;
            }
            const keyword = this.normalizeMasterSlaveRuleText(rule.masterKeyword);
            if (!keyword) {
              return true;
            }
            const mainCode = this.getMasterSlaveTemplateDeviceCode(row);
            const haystack = this.normalizeMasterSlaveRuleText([
              mainCode,
              row?.name,
              row?.assetCategory
            ].join(" "));
            return haystack.includes(keyword);
          }

          isMasterSlaveEntryMatched(entry, keyword) {
            const normalized = this.normalizeMasterSlaveRuleText(keyword);
            if (!normalized) {
              return true;
            }
            const haystack = this.normalizeMasterSlaveRuleText([
              entry?.code,
              entry?.name,
              entry?.category
            ].join(" "));
            return haystack.includes(normalized);
          }

          buildMasterSlaveCandidateCodes(mainCode, rule = {}, allCodes = new Set()) {
            const start = Math.max(1, Number(rule.start) || 1);
            const end = Math.max(start, Number(rule.end || rule.count) || start);
            if (rule.ruleType === "prefix") {
              return [(rule.prefix || "") + mainCode];
            }
            if (rule.ruleType === "suffixSequence") {
              const delimiter = rule.delimiter || "#";
              return Array.from({ length: end - start + 1 }, (_, index) => mainCode + delimiter + (start + index));
            }
            if (rule.ruleType === "prefixSuffixEnum") {
              const prefix = rule.prefix || "";
              const suffixes = String(rule.suffixes || "")
                .split(/[,\uFF0C\u3001\n\r]+/)
                .map((item) => item.trim())
                .filter(Boolean);
              return suffixes.map((suffix) => prefix + mainCode + suffix);
            }
            if (rule.ruleType === "contains") {
              return Array.from(allCodes).filter((code) => code.indexOf(mainCode) > -1);
            }
            return [];
          }

          filterMasterSlaveCandidateCodes(candidates, mainCode, rule, allCodes, allEntries) {
            const unique = Array.from(new Set(candidates.filter(Boolean))).filter((code) => code !== mainCode);
            if (rule.onlyExisting === false) {
              return unique;
            }
            return unique.filter((code) => {
              if (!allCodes.has(code)) {
                return false;
              }
              const entry = allEntries.find((item) => item.code === code);
              return this.isMasterSlaveEntryMatched(entry, rule.childKeyword);
            });
          }

          resolveMasterSlaveTemplateRule(row, autoFillRules = [], allCodes = new Set(), allEntries = []) {
            const mainCode = this.getMasterSlaveTemplateDeviceCode(row);
            if (!mainCode) {
              return { rule: null, children: [] };
            }
            const rules = Array.isArray(autoFillRules) ? autoFillRules : [autoFillRules];
            for (const rule of rules) {
              if (!this.isMasterSlaveRuleMatched(row, rule)) {
                continue;
              }
              const candidates = this.buildMasterSlaveCandidateCodes(mainCode, rule, allCodes);
              const children = this.filterMasterSlaveCandidateCodes(candidates, mainCode, rule, allCodes, allEntries);
              if (children.length > 0 || rule.onlyExisting === false) {
                return { rule, children };
              }
            }
            return { rule: null, children: [] };
          }

          generateMasterSlaveChildCodes(row, autoFillRules = [], allCodes = new Set(), allEntries = []) {
            return this.resolveMasterSlaveTemplateRule(row, autoFillRules, allCodes, allEntries).children;
          }

          getMasterSlaveTemplatePreviewRows(dialog) {
            const selectedLedgers = this.getSelectedMasterSlaveTemplateLedgers(dialog);
            const allEntries = this.getMasterSlaveTemplateDeviceEntries(selectedLedgers);
            const allCodes = new Set(allEntries.map((entry) => entry.code).filter(Boolean));
            const rules = this.getMasterSlaveTemplateDialogRules(dialog);
            const rows = allEntries.map((entry) => {
              const resolved = this.resolveMasterSlaveTemplateRule(entry.row, rules, allCodes, allEntries);
              return {
                ledger: entry.ledger.label,
                code: entry.code,
                ruleName: resolved.rule?.name || "",
                children: resolved.children
              };
            });
            const matchedRows = rows.filter((row) => row.children.length > 0);
            const unmatchedRows = rows.filter((row) => row.children.length === 0);
            return [...matchedRows, ...unmatchedRows].slice(0, 5);
          }

          getMasterSlaveTemplateAutoFillSummary(dialog) {
            const selectedLedgers = this.getSelectedMasterSlaveTemplateLedgers(dialog);
            const allEntries = this.getMasterSlaveTemplateDeviceEntries(selectedLedgers);
            const allCodes = new Set(allEntries.map((entry) => entry.code).filter(Boolean));
            const rules = this.getEnabledMasterSlaveTemplateRules(dialog);
            const matchedCount = allEntries.reduce((count, entry) => {
              const resolved = this.resolveMasterSlaveTemplateRule(entry.row, rules, allCodes, allEntries);
              return count + (resolved.children.length > 0 ? 1 : 0);
            }, 0);
            return {
              enabledRulesCount: rules.length,
              matchedCount,
              totalCount: allEntries.length
            };
          }

          buildMasterSlaveTemplateWorkbook(headers, dataRows, scope, selectedLedgers) {
            const escapeXml = (value) => String(value ?? "")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");
            const renderSheet = (name, rows) => `
              <Worksheet ss:Name="${escapeXml(name)}">
                <Table>
                  ${rows.map((row) => `
                    <Row>
                      ${row.map((cell) => `<Cell><Data ss:Type="String">${escapeXml(cell)}</Data></Cell>`).join("")}
                    </Row>
                  `).join("")}
                </Table>
              </Worksheet>
            `;
            const ledgerLabels = selectedLedgers.map((item) => item.label).join("、");
            const instructionRows = [
              ["填写说明", ""],
              ["模板用途", "用于通过表格导入或更新主从设备关系数据。"],
              ["导出范围", scope === "all" ? "全量台账数据" : "部分台账数据：" + ledgerLabels],
              ["", ""],
              ["填写要求", ""],
              ["1", "系统带出的台账类型、设备编号、设备名称、资产状态、资产位置用于辅助识别设备，请勿随意修改。"],
              ["2", "数据页每一行的“设备编号”即当前行主设备编号，导入时系统按该编号作为主设备。"],
              ["3", "下载模板时可配置自动填充规则，系统会按规则预填“从设备编号”。"],
              ["4", "若未自动填充或需调整，用户可手动填写“从设备编号”；多个编号支持用中文顿号“、”、英文逗号“,”或换行分隔。"],
              ["", ""],
              ["系统校验规则", ""],
              ["1", "设备编号不能为空，且必须能匹配到台账设备。"],
              ["2", "从设备编号不能为空；填写多个编号时，系统会按“、”、\",\"或换行拆分后逐个校验。"],
              ["3", "拆分后的每个从设备编号都必须能匹配到台账设备。"],
              ["4", "设备编号和任一从设备编号不能相同。"],
              ["5", "同一个“从设备编号”单元格内不能重复填写同一从设备编号。"],
              ["6", "从设备只能关联一个主设备；若已存在主设备，导入时应提示冲突。"],
              ["7", "主设备可关联多个从设备。"],
              ["8", "仅支持两层主从关系：已是从设备的资产不能再作为主设备。"],
              ["9", "禁止形成循环关系，例如 A 为 B 的主设备时，B 不能再作为 A 的主设备。"],
              ["10", "已报废、待报废、已迁出、待迁出、已废弃等状态的设备禁止建立主从关系。"],
              ["11", "设备编号不存在、台账类型不匹配或重复导入同一关系时，系统应给出校验失败提示，并标明具体失败编号。"]
            ];
            return `<?xml version="1.0" encoding="UTF-8"?>
              <?mso-application progid="Excel.Sheet"?>
              <Workbook
                xmlns="urn:schemas-microsoft-com:office:spreadsheet"
                xmlns:o="urn:schemas-microsoft-com:office:office"
                xmlns:x="urn:schemas-microsoft-com:office:excel"
                xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
                ${renderSheet("主从关系数据", [headers, ...dataRows])}
                ${renderSheet("填写说明", instructionRows)}
              </Workbook>`;
          }

          saveTemplateConfig() {
            this.pushToast("配置已保存", "资产模板适配配置已暂存到当前原型状态。", "success");
            this.emit();
          }

          getActiveFormNodeLabel() {
            return this.findNodeLabel(FORM_TREE, this.state.ui.formDesign.activeNode) || "资产";
          }

          getFormFieldOptions() {
            const nodeId = this.state.ui.formDesign.activeNode;
            return FORM_FIELD_LIBRARY[nodeId] || FORM_FIELD_LIBRARY.default;
          }

          getSelectedFormFields() {
            const nodeId = this.state.ui.formDesign.activeNode;
            const selections = this.state.ui.formDesign.selections[nodeId] || this.state.ui.formDesign.selections.default;
            return selections;
          }

          setFormNode(nodeId) {
            this.state.ui.formDesign.activeNode = nodeId;
            this.expandTreeAncestors(this.state.ui.formDesign.expandedNodes, nodeId);
            if (!this.state.ui.formDesign.selections[nodeId]) {
              const fallback = FORM_FIELD_LIBRARY[nodeId] || FORM_FIELD_LIBRARY.default;
              this.state.ui.formDesign.selections[nodeId] = fallback.slice(0, Math.min(3, fallback.length));
            }
            this.emit();
          }

          toggleFormTreeNode(nodeId) {
            const current = Boolean(this.state.ui.formDesign.expandedNodes[nodeId]);
            this.state.ui.formDesign.expandedNodes[nodeId] = !current;
            this.emit();
          }

          toggleFormField(fieldName) {
            const nodeId = this.state.ui.formDesign.activeNode;
            const current = new Set(this.state.ui.formDesign.selections[nodeId] || []);
            if (current.has(fieldName)) {
              current.delete(fieldName);
            } else {
              current.add(fieldName);
            }
            this.state.ui.formDesign.selections[nodeId] = Array.from(current);
            this.emit();
          }

          saveFormDesign() {
            this.pushToast("表单设计已保存", this.getActiveFormNodeLabel() + " 的表单字段显示配置已更新。", "success");
            this.emit();
          }

          setDetailNode(nodeId) {
            this.state.ui.detailDesign.activeNode = nodeId;
            this.expandTreeAncestors(this.state.ui.detailDesign.expandedNodes, nodeId);
            this.emit();
          }

          toggleDetailTreeNode(nodeId) {
            const current = Boolean(this.state.ui.detailDesign.expandedNodes[nodeId]);
            this.state.ui.detailDesign.expandedNodes[nodeId] = !current;
            this.emit();
          }

          getRequiredDetailFields(tabId) {
            const options = DETAIL_FIELDS[tabId] || [];
            return DETAIL_REQUIRED_FIELDS.filter((field) => options.includes(field));
          }

          getDetailFieldOrder(tabId) {
            const options = DETAIL_FIELDS[tabId] || [];
            const current = this.state.ui.detailDesign.orders?.[tabId] || [];
            const normalized = [...current.filter((field) => options.includes(field)), ...options.filter((field) => !current.includes(field))];
            this.state.ui.detailDesign.orders[tabId] = normalized;
            return normalized;
          }

          getSelectedDetailFields(tabId) {
            const options = DETAIL_FIELDS[tabId] || [];
            const current = (this.state.ui.detailDesign.selections[tabId] || []).filter((field) => options.includes(field));
            const required = this.getRequiredDetailFields(tabId);
            const normalized = [];

            [...required, ...current].forEach((field) => {
              if (!normalized.includes(field)) {
                normalized.push(field);
              }
            });

            this.state.ui.detailDesign.selections[tabId] = normalized;
            return normalized;
          }

          setDetailTab(tabId) {
            this.state.ui.detailDesign.activeTab = tabId;
            this.getDetailFieldOrder(tabId);
            this.getSelectedDetailFields(tabId);
            this.emit();
          }

          setDetailLayout(layout) {
            this.state.ui.detailDesign.layout = layout;
            this.emit();
          }

          toggleDetailField(fieldName) {
            const tabId = this.state.ui.detailDesign.activeTab;
            const required = new Set(this.getRequiredDetailFields(tabId));
            if (required.has(fieldName)) {
              return;
            }
            const order = this.getDetailFieldOrder(tabId);
            const set = new Set(this.getSelectedDetailFields(tabId));
            if (set.has(fieldName)) {
              set.delete(fieldName);
            } else {
              set.add(fieldName);
            }
            this.state.ui.detailDesign.selections[tabId] = order.filter((field) => set.has(field));
            this.emit();
          }

          reorderDetailField(sourceField, targetField) {
            const tabId = this.state.ui.detailDesign.activeTab;
            const order = this.getDetailFieldOrder(tabId).slice();
            const sourceIndex = order.indexOf(sourceField);
            const targetIndex = order.indexOf(targetField);
            if (sourceIndex < 0 || targetIndex < 0 || sourceIndex === targetIndex) {
              return;
            }

            const [movedField] = order.splice(sourceIndex, 1);
            order.splice(targetIndex, 0, movedField);
            this.state.ui.detailDesign.orders[tabId] = order;

            const selected = new Set(this.getSelectedDetailFields(tabId));
            this.state.ui.detailDesign.selections[tabId] = order.filter((field) => selected.has(field));
            this.emit();
          }

          saveDetailDesign() {
            this.pushToast("详情设计已保存", "当前详情页签字段展示规则已更新。", "success");
            this.emit();
          }

          setLabelTemplate(templateId) {
            this.state.ui.labelConfig.activeTemplateId = templateId;
            this.emit();
          }

          setLabelField(key, value) {
            const nextValue = key === "width" || key === "height" ? Math.max(20, Number(value) || 20) : value;
            this.state.ui.labelConfig[key] = nextValue;
            this.emit();
          }

            this.pushToast("字段绑定", "已打开配置字段绑定入口，可继续扩展为真实字段映射。", "info");
          }

            this.pushToast("打印预览", "标签打印预览已按当前模板和尺寸刷新。", "success");
          }

          saveLabelConfig() {
            this.pushToast("标签配置已保存", "标签模板、尺寸和绑定字段已保存到当前原型。", "success");
          }

          pushToast(title, message, tone = "success") {
            const toast = {
              id: "toast-" + Date.now() + "-" + Math.random().toString(16).slice(2, 7),
              title,
              message,
              tone
            };
            this.state.ui.toasts = [toast, ...this.state.ui.toasts].slice(0, 4);
            this.emit();
            setTimeout(() => {
              const before = this.state.ui.toasts.length;
              this.state.ui.toasts = this.state.ui.toasts.filter((item) => item.id !== toast.id);
              if (before !== this.state.ui.toasts.length) {
                this.emit();
              }
            }, 2600);
          }

          findNodeLabel(nodes, targetId) {
            for (const node of nodes) {
              if (node.id === targetId) {
                return node.label;
              }
              if (node.children) {
                const child = this.findNodeLabel(node.children, targetId);
                if (child) {
                  return child;
                }
              }
            }
            return "";
          }

          findNodePath(nodes, targetId, path = []) {
            for (const node of nodes) {
              const nextPath = [...path, node.id];
              if (node.id === targetId) {
                return nextPath;
              }
              if (node.children) {
                const childPath = this.findNodePath(node.children, targetId, nextPath);
                if (childPath.length) {
                  return childPath;
                }
              }
            }
            return [];
          }

          expandTreeAncestors(expandedNodes, targetId) {
            const path = this.findNodePath(FORM_TREE, targetId);
            path.slice(0, -1).forEach((nodeId) => {
              expandedNodes[nodeId] = true;
            });
          }
        }

        class PrototypeRenderer {

            return {

                { label: "占用", tone: "occupied" },
                { label: "选中", tone: "selected" },
                { label: "预占", tone: "reserved" },
                { label: "禁用", tone: "removed" }
              ],
              rackUnits: Array.from({ length: 42 }, (_, index) => {
                const unit = 42 - index;
                let tone = "empty";
                if (unit <= 3) {
                  tone = "selected";
                } else if (unit === 4) {
                  tone = "reserved";
                }
                return { unit, label: pad(unit, 2), tone };
              }),
              historyRanges: ["近7日", "近10日", "近15日"],
              containsColumns: ["资产编号", "名称", "序列号", "资产状态", "资产分类", "资产位置", "U高", "开始U位", "额定供电功率", "操作"]
            };

          render() {
            const state = this.store.getState();

            this.nodes.topbar.innerHTML = this.renderTopbar(state);
            this.nodes.sidebar.innerHTML = this.renderSidebar(state);

            this.nodes.overlay.innerHTML = this.renderOverlay(state);

            window.demandExplainController?.refresh(Boolean(state.ui.demandExplainEnabled));
            window.prototypeAnnotationController?.refresh();

          captureRelationFieldFocus() {
            const active = document.activeElement;
            if (!active || typeof active.matches !== "function") {
              return null;
            }
            if (!active.matches('[data-role="relation-field"]')) {
              return null;
            }
            return {
              field: active.getAttribute("data-field"),
              start: active.selectionStart,
              end: active.selectionEnd
            };
          }

          restoreRelationFieldFocus(snapshot) {
            if (!snapshot || !snapshot.field) {
              return;
            }
            const next = this.nodes.overlay.querySelector('[data-role="relation-field"][data-field="' + snapshot.field + '"]');
            if (!next) {
              return;
            }
            next.focus();
            try {
              if (typeof snapshot.start === "number" && typeof snapshot.end === "number") {
                next.setSelectionRange(snapshot.start, snapshot.end);
              }
            } catch (error) {
              // ignore
            }

                    <div class="asset-rack">
                      <div class="rack-shell">
                        <div class="rack-frame">
                          <div class="rack-units">
                            ${detail.rackUnits.map((unit) => `<div class="rack-unit is-${escapeHtml(unit.tone)}" title="${escapeHtml(unit.label)}U"></div>`).join("")}
                            <div class="rack-device-hotspot" tabindex="0" style="top:${escapeHtml(detail.rackHoverCard.top)}px;height:${escapeHtml(detail.rackHoverCard.height)}px;">
                              <div class="rack-device-tooltip">

                      <div class="rack-index">

          renderAssetDetailHistory(detail) {

              <div class="asset-tab-panel">

                  ${detail.historyRanges.map((item) => `
                    <button class="mini-filter-btn ${item === detail.historyRange ? "is-active" : ""}" data-action="asset-history-range" data-value="${escapeHtml(item)}">${escapeHtml(item)}</button>

                    <div>没有找到匹配的记录</div>

              </div>
            `;

          renderAssetDetailRelation(detail) {
            return `

                    <div class="topology-mini-tools">
                      <span class="topology-mini-tool" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                          <path d="M2 8h9m0 0l-2-2m2 2l-2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                      </span>
                      <span class="topology-mini-tool is-secondary" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                          <path d="M14 8H5m0 0l2-2M5 8l2 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                      </span>
                    </div>
                    <svg class="topology-svg" viewBox="0 0 1000 480" preserveAspectRatio="none" aria-hidden="true">
                      <path d="M248 220 C 330 220, 360 220, 438 220" stroke="#5ba2d3" stroke-width="2" fill="none"></path>

                        <div class="topology-card-head">

          renderAssetDetailContains(detail) {
            if (detail.viewId === VIEW_IDS.CABINET) {
              return this.renderCabinetDetailContains(detail);
            }

            return `
              <div class="asset-contains-wrap">
                <div class="asset-contains-toolbar">
                  <div class="asset-contains-search">
                    <input placeholder="请输入关键字进行搜索" />
                    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                      <circle cx="7" cy="7" r="4.2" stroke="currentColor" stroke-width="1.3"></circle>
                      <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"></path>
                    </svg>
                  </div>
                </div>
                <div class="asset-contains-table">
                  <table class="asset-empty-table">
                    <thead>
                      <tr>
                        ${detail.containsColumns.map((column) => `<th>${escapeHtml(column)}</th>`).join("")}
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td colspan="${detail.containsColumns.length}">
                          <div class="empty-state">
                            <div class="empty-icon" aria-hidden="true"></div>
                            <div>${escapeHtml(detail.containsEmptyText)}</div>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            `;
          }

          renderCabinetDetailContains(detail) {
            const cabinet = detail.cabinetContains;
            return `
              <div class="cabinet-contains-layout">
                <div class="cabinet-contains-side">
                  <div class="asset-rack">
                    <div class="rack-shell">
                      <div class="rack-frame">
                        <div class="rack-units">
                          ${cabinet.rackUnits.map((unit) => `<div class="rack-unit is-${escapeHtml(unit.tone)}" title="${escapeHtml(unit.label)}U"></div>`).join("")}
                        </div>
                      </div>
                      <div class="rack-feet" aria-hidden="true"></div>
                    </div>
                    <div class="rack-index">
                      ${cabinet.rackUnits.map((unit) => `<span>${escapeHtml(unit.label)}</span>`).join("")}
                    </div>
                  </div>
                </div>
                <div class="cabinet-contains-main">
                  <section class="cabinet-section cabinet-related-panel">
                    <div class="cabinet-section-head">
                      <div class="cabinet-section-title">${escapeHtml(cabinet.relatedTitle)}</div>
                    </div>
                    <div class="cabinet-section-body">
                      <table class="cabinet-inline-table">
                        <thead>
                          <tr>
                            ${cabinet.relatedColumns.map((column, index) => `<th class="${index === cabinet.relatedColumns.length - 1 ? "op-cell" : ""}">${escapeHtml(column)}</th>`).join("")}
                          </tr>
                        </thead>
                        <tbody>
                          <tr>
                            <td colspan="${cabinet.relatedColumns.length}">
                              <div class="empty-state">
                                <div class="empty-icon" aria-hidden="true"></div>
                                <div>没有找到匹配的记录</div>
                              </div>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </section>
                  <section class="cabinet-section cabinet-u-panel">
                    <div class="cabinet-section-head">
                      <div class="cabinet-section-title">${escapeHtml(cabinet.uTitle)}</div>
                      <div class="cabinet-section-actions">
                        ${cabinet.batchActions.map((label) => `<button class="btn btn-primary cabinet-batch-btn" data-action="top-action" data-label="${escapeHtml(label)}">${escapeHtml(label)}</button>`).join("")}
                      </div>
                    </div>
                    <div class="cabinet-section-body">
                      <table class="cabinet-inline-table">
                        <thead>
                          <tr>
                            <th class="checkbox-cell"><span class="checkbox" aria-hidden="true"></span></th>
                            <th>U位名称</th>
                            <th>U位状态</th>
                            <th class="op-cell">操作</th>
                          </tr>
                        </thead>
                        <tbody>
                          ${cabinet.uRows.map((row) => `
                            <tr>
                              <td class="checkbox-cell"><span class="checkbox" aria-hidden="true"></span></td>
                              <td>${escapeHtml(row.label)}</td>
                              <td><span class="cabinet-u-status ${row.status === "占用" ? "is-occupied" : ""}">${escapeHtml(row.status)}</span></td>
                              <td class="op-cell"><button class="cabinet-op-link" data-action="top-action" data-label="${escapeHtml(row.action)}">${escapeHtml(row.action)}</button></td>
                            </tr>
                          `).join("")}
                        </tbody>
                      </table>
                    </div>
                  </section>
                </div>
              </div>
            `;
          }

          renderListPage(viewId, state) {
            const meta = LIST_PAGE_META[viewId];
            const rows = this.store.getFilteredRows(viewId);
            const renderHeaderTools = meta.showTools && viewId !== VIEW_IDS.SPARE_PART;
            const renderTableTools = meta.showTools && viewId === VIEW_IDS.SPARE_PART;
            return `
              <div class="page-surface list-page-surface">
                ${this.renderMasterSlaveListAnnotations(meta)}
                <div class="page-toolbar">
                  <div class="page-toolbar-left">
                    <div class="page-title">${escapeHtml(meta.title)}</div>
                    ${meta.modeLabel ? this.renderModeChip(meta.modeLabel) : ""}
                    <form class="search-form" data-view="${escapeHtml(viewId)}">
                      <input class="search-input" name="keyword" placeholder="${escapeHtml(meta.placeholder)}" value="${escapeHtml(state.ui.filters[viewId].keyword)}" />
                      <button class="btn btn-primary" type="submit">查询</button>
                      ${meta.secondaryLabel ? `<button class="btn btn-light" type="button" data-action="secondary-action" data-label="${escapeHtml(meta.secondaryLabel)}">${escapeHtml(meta.secondaryLabel)}</button>` : ""}
                    </form>
                  </div>
                  <div class="toolbar-actions">
                    ${meta.actions.map((action) => this.renderHeaderAction(action, viewId)).join("")}
                    ${renderHeaderTools ? this.renderToolbarTools() : ""}
                  </div>
                </div>
                <div class="table-panel">
                  ${renderTableTools ? `<div class="table-panel-head">${this.renderToolbarTools()}</div>` : ""}
                  <div class="table-wrap">
                    ${this.renderListTable(viewId, rows)}
                  </div>
                  ${this.renderPagination(meta, viewId, state.ui.pagers[viewId])}
                </div>
              </div>
            `;
          }

          renderModeChip(label) {
            return `
              <button class="mode-chip" type="button" data-action="secondary-action" data-label="${escapeHtml(label)}">
                <span>${escapeHtml(label)}</span>
                <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
                  <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </button>
            `;
          }

          renderToolbarTools() {
            return `
              <div class="toolbar-tools">
                <button class="tiny-icon-btn" data-action="tiny-tool" data-label="页面设置" aria-label="页面设置">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M10.4 2h3.2l.7 2.4a7.8 7.8 0 012.2 1.3l2.4-.8 1.6 2.8-1.9 1.7c.1.5.1 1 .1 1.6s0 1.1-.1 1.6l1.9 1.7-1.6 2.8-2.4-.8c-.7.6-1.4 1-2.2 1.3l-.7 2.4h-3.2l-.7-2.4a7.8 7.8 0 01-2.2-1.3l-2.4.8-1.6-2.8 1.9-1.7A8.7 8.7 0 015 12c0-.5 0-1.1.1-1.6L3.2 8.7l1.6-2.8 2.4.8c.7-.6 1.4-1 2.2-1.3L10.4 2zM12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"></path>
                  </svg>
                </button>
                <button class="tiny-icon-btn" data-action="tiny-tool" data-label="权限锁定" aria-label="权限锁定">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M7 10V8a5 5 0 1110 0v2m-9 0h8a1 1 0 011 1v8a1 1 0 01-1 1H8a1 1 0 01-1-1v-8a1 1 0 011-1z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                </button>
              </div>
            `;
          }

          renderHeaderAction(action, viewId) {
            const isPrimary = action.indexOf("批量初始化") > -1 || action.indexOf("批量上架") > -1 || action.indexOf("批量入库") > -1;
            return `
              <button class="btn ${isPrimary ? "btn-primary" : ""}" type="button" data-action="header-action" data-label="${escapeHtml(action)}" data-view="${escapeHtml(viewId)}">
                <span>${escapeHtml(action)}</span>
                ${action.indexOf("导出") > -1 ? `
                  <svg width="10" height="10" viewBox="0 0 16 16" fill="none">
                    <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                ` : ""}
              </button>
            `;
          }

          renderListTable(viewId, rows) {
            const meta = LIST_PAGE_META[viewId];
            if (!rows.length) {
              if (viewId === VIEW_IDS.SPARE_PART) {
                return this.renderEmptyListTable(viewId);
              }
              return `
                <div class="empty-state">
                  <div class="empty-icon" aria-hidden="true"></div>
                  <div>没有找到匹配的记录</div>
                </div>
              `;
            }

            return `
              <table class="table-resizable" data-view="${escapeHtml(viewId)}">
                <colgroup>
                  ${meta.columns.map((column) => `<col data-key="${escapeHtml(column.key)}" style="width:${this.store.getColumnWidth(viewId, column.key)}px;" />`).join("")}
                </colgroup>
                <thead>
                  <tr>
                    ${meta.columns.map((column) => this.renderTableHeader(viewId, column)).join("")}
                  </tr>
                </thead>
                <tbody>
                  ${rows.map((row, index) => this.renderListRowGroup(viewId, row, meta, index === this.getFirstRelationRowIndex(viewId, rows))).join("")}
                </tbody>
              </table>
            `;
          }

          renderEmptyListTable(viewId) {
            const meta = LIST_PAGE_META[viewId];
            return `
              <table class="table-resizable list-empty-table" data-view="${escapeHtml(viewId)}">
                <colgroup>
                  ${meta.columns.map((column) => `<col data-key="${escapeHtml(column.key)}" style="width:${this.store.getColumnWidth(viewId, column.key)}px;" />`).join("")}
                </colgroup>
                <thead>
                  <tr>
                    ${meta.columns.map((column) => this.renderTableHeader(viewId, column)).join("")}
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td class="list-empty-cell" colspan="${meta.columns.length}">
                      <div class="empty-state">
                        <div class="empty-icon" aria-hidden="true"></div>
                        <div>没有找到匹配的记录</div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            `;
          }

          renderTableHeader(viewId, column) {
            const stickyClass = column.key === "__select" ? "sticky-left" : column.key === "__actions" ? "sticky-right" : "";
            if (column.key === "__select") {
              return `<th class="${stickyClass}" style="width:${this.store.getColumnWidth(viewId, column.key)}px;"><span class="checkbox" aria-hidden="true"></span></th>`;
            }

            return `
              <th class="${stickyClass}" title="${escapeHtml(column.label)}" style="width:${this.store.getColumnWidth(viewId, column.key)}px;">
                <div class="th-content">
                  <span class="th-label">${escapeHtml(column.label)}</span>
                  <span class="col-resizer" data-action="resize-column" data-view="${escapeHtml(viewId)}" data-key="${escapeHtml(column.key)}" aria-hidden="true"></span>
                </div>
              </th>
            `;
          }

          getFirstRelationRowIndex(viewId, rows) {
            if (!this.store.isMasterSlaveEnabled()) {
              return -1;
            }
            return rows.findIndex((row) => {
              return this.store.findChildrenOf(viewId, row.id).length > 0 || !!this.store.findParentOf(viewId, row.id);
            });
          }

          renderListRowGroup(viewId, row, meta, isRepresentativeRelation = false) {
            const showMasterSlave = this.store.isMasterSlaveEnabled();
            const children = showMasterSlave ? this.store.findChildrenOf(viewId, row.id) : [];
            const parentRel = showMasterSlave ? this.store.findParentOf(viewId, row.id) : null;
            const hasRelations = children.length > 0 || !!parentRel;
            const expanded = this.store.isRowExpanded(viewId, row.id) && hasRelations;
            const mainRow = `
              <tr>
                ${meta.columns.map((column) => `
                  <td class="${[
                    column.key === "__select" ? "sticky-left checkbox-cell" : "",
                    column.key === "__actions" ? "sticky-right" : ""
                  ].filter(Boolean).join(" ")}">
                    ${this.renderTableCell(viewId, row, column.key, { hasRelations, expanded, isRepresentativeRelation })}
                  </td>
                `).join("")}
              </tr>
            `;
            if (!expanded) {
              return mainRow;
            }
            const parentSection = parentRel
              ? this.renderParentLinkRow(viewId, row, parentRel, meta)
              : "";
            const childRows = children.map((rel, index) => {
              const childRow = this.store.getRowById(rel.childViewId, rel.childRowId);
              if (!childRow) {
                return "";
              }
              return this.renderChildRow(viewId, row, rel, childRow, meta, index === 0);
            }).join("");
            return mainRow + parentSection + childRows;
          }

          renderParentLinkRow(currentViewId, currentRow, relation, meta) {
            const parentRow = this.store.getRowById(relation.parentViewId, relation.parentRowId);
            if (!parentRow) {
              return "";
            }
            const sourceLabel = RELATION_VIEW_LABELS[relation.parentViewId] || LIST_PAGE_META[relation.parentViewId]?.title || "台账";
            return `
              <tr class="row-parent-link">
                ${meta.columns.map((column) => {
                  if (column.key === "__select") {
                    return `<td class="sticky-left checkbox-cell"></td>`;
                  }
                  if (column.key === "__actions") {
                    return `
                      <td class="sticky-right">
                        <div class="action-links">
                          <button class="action-link" type="button" data-action="row-action" data-view="${escapeHtml(relation.parentViewId)}" data-id="${escapeHtml(relation.parentRowId)}" data-label="查看" data-demand-title="查看主设备" data-demand-text="交互目的：从当前从设备快速查看其所属主设备。||点击后行为：打开主设备详情或查看入口。||状态限制：主设备不存在或已删除时应提示关系异常，原型中按样例数据展示。">查看主设备</button>
                          <button class="action-link is-warning" type="button" data-action="unbind-relation" data-parent-view="${escapeHtml(relation.parentViewId)}" data-parent-id="${escapeHtml(relation.parentRowId)}" data-child-view="${escapeHtml(currentViewId)}" data-child-id="${escapeHtml(currentRow.id)}" data-demand-title="解绑主从关系" data-demand-text="交互目的：解除当前从设备与主设备之间的绑定关系。||点击后行为：原型直接执行解绑反馈；真实系统应二次确认并记录解绑原因。||状态限制：流程中、报废迁出中或存在业务占用时应限制解绑。">解绑</button>
                        </div>
                      </td>
                    `;
                  }
                  if (column.key === "name") {
                    const nameValue = parentRow.name || parentRow.assetCode || "-";
                    return `
                      <td>
                        <span class="name-cell">
                          <span class="text-ellipsis code-cell" title="${escapeHtml(nameValue)}">${escapeHtml(nameValue)}</span>
                          <span class="parent-source-tag">${escapeHtml(sourceLabel)}</span>
                        </span>
                      </td>
                    `;
                  }
                  if (column.key === "assetStatus") {
                    const value = parentRow[column.key];
                    const className = value === "在用" ? "in-use" : value === "空闲" ? "idle" : value === "报废" ? "discarded" : "";
                    return `<td><span class="status-text ${className}">${escapeHtml(value || "-")}</span></td>`;
                  }
                  const value = parentRow[column.key];
                  return `<td><span class="text-ellipsis" title="${escapeHtml(value || "-")}">${escapeHtml(value || "-")}</span></td>`;
                }).join("")}
              </tr>
            `;
          }

          renderChildRow(parentViewId, parentRow, relation, childRow, meta, isRepresentativeChild = false) {
            const sourceLabel = RELATION_VIEW_LABELS[relation.childViewId] || LIST_PAGE_META[relation.childViewId]?.title || "台账";
            const viewChildDemandAttrs = isRepresentativeChild
              ? ' data-demand-title="查看从设备" data-demand-text="交互目的：从主设备展开行快速查看下级从设备详情。||点击后行为：打开从设备详情或查看入口。||状态限制：从设备不存在或已删除时应提示关系异常，原型中按样例数据展示。"'
              : "";
            const unbindChildDemandAttrs = isRepresentativeChild
              ? ' data-demand-title="解绑从设备" data-demand-text="交互目的：解除主设备与该从设备之间的绑定关系。||点击后行为：原型直接执行解绑反馈；真实系统应二次确认并记录解绑原因。||状态限制：流程中、报废迁出中或存在业务占用时应限制解绑。"'
              : "";
            return `
              <tr class="row-child">
                ${meta.columns.map((column) => {
                  if (column.key === "__select") {
                    return `<td class="sticky-left checkbox-cell"></td>`;
                  }
                  if (column.key === "__actions") {
                    return `
                      <td class="sticky-right">
                        <div class="action-links">
                          <button class="action-link" type="button" data-action="row-action" data-view="${escapeHtml(relation.childViewId)}" data-id="${escapeHtml(relation.childRowId)}" data-label="查看"${viewChildDemandAttrs}>查看从设备</button>

          mapFieldLabel(key) {

              uHeight: "U高",
              vendor: "厂商",
              assetCode: "资产编号",
              assetCategory: "资产分类",
              portCount: "端口数",
              startU: "起始U位",
              serialCode: "编号",
              assetSummary: "资产流程状态",
              description: "描述",
              dataTag: "物理标签编号",
              serialNumber: "序列号",
              relatedAsset: "关联资产",
              cabinetHeight: "机柜高度"
            };
            return mapping[key] || key;
          }

          renderRelationDialog(dialog) {
            const currentRow = this.store.getRowById(dialog.viewId, dialog.rowId);
            if (!currentRow) {
              return "";
            }
            const currentViewLabel = RELATION_VIEW_LABELS[dialog.viewId] || LIST_PAGE_META[dialog.viewId]?.title || "台账";
            const parent = this.store.findParentOf(dialog.viewId, dialog.rowId);
            const parentRow = parent ? this.store.getRowById(parent.parentViewId, parent.parentRowId) : null;
            const children = this.store.findChildrenOf(dialog.viewId, dialog.rowId);
            const stepDot = (index, isActive, isDone) => `
              <div class="relation-modal-step ${isActive ? "is-active" : ""} ${isDone ? "is-done" : ""}">
                <span class="step-dot">${isDone ? "✓" : index}</span>
                <span>${index === 1 ? "选择关联类型" : "选择目标设备"}</span>
              </div>
            `;
            return `
              <div class="relation-modal-backdrop" data-action="close-relation"></div>
              <section class="relation-modal" role="dialog" aria-modal="true" aria-labelledby="relationDialogTitle">

                  data-demand-title="新增：关联设备弹窗"
                  data-demand-text="入口：行操作【更多】>【关联设备】。||交互：分两步——先选关联类型（主/从），再选目标设备。||校验：一主多从；一从一主；不能自关联；不能形成循环；报废/迁出态禁止。"
                >
                  <div>
                    <div class="relation-modal-title" id="relationDialogTitle">关联设备</div>

                <div class="relation-modal-steps">

                </div>
                <div class="relation-modal-body">
                  ${dialog.step === 1 ? `
                    <div class="relation-current">
                      <div class="relation-current-title">当前设备 · ${escapeHtml(currentViewLabel)}</div>

                        <span>资产状态<strong>${escapeHtml(currentRow.assetStatus || "-")}</strong></span>
                        <span>当前主设备<strong>${escapeHtml(parentRow ? (parentRow.name || parentRow.assetCode) : "无")}</strong></span>

                      </div>
