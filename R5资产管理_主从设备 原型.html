<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R5资产管理原型</title>
    <style>
      :root {
        --primary: #1677ff;
        --primary-deep: #0958d9;
        --primary-soft: #e8f3ff;
        --topbar: #1185ff;
        --bg: #f4f7fb;
        --surface: #ffffff;
        --surface-muted: #fafcff;
        --border: #e6edf5;
        --border-strong: #d4deea;
        --text: #1f2d3d;
        --text-secondary: #5f7086;
        --text-tertiary: #90a0b5;
        --success: #2e9c57;
        --warning: #d58c13;
        --danger: #ef5b56;
        --shadow: 0 6px 18px rgba(15, 37, 65, 0.08);
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --topbar-h: 50px;
        --sidebar-w: 196px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        font-size: 14px;
        line-height: 1.5;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        background: none;
        cursor: pointer;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: #fff;
        color: var(--text);
        padding: 6px 10px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      select:disabled,
      input:disabled,
      textarea:disabled {
        background: #f4f6f9;
        color: #9aa7b8;
        border-color: #e1e7ef;
        cursor: not-allowed;
      }

      input[type="checkbox"],
      input[type="radio"] {
        width: 14px;
        height: 14px;
        padding: 0;
        margin: 0;
        flex: 0 0 14px;
        accent-color: var(--primary);
        box-shadow: none;
      }

      input[type="checkbox"]:focus,
      input[type="radio"]:focus {
        box-shadow: none;
      }

      input[type="radio"] {
        border-radius: 50%;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.15);
      }

      body ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      body ::-webkit-scrollbar-thumb {
        background: rgba(117, 139, 167, 0.32);
        border-radius: 999px;
      }

      .app-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-width: 1280px;
      }

      .app-topbar {
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 12px 0 14px;
        background: linear-gradient(90deg, #0e85ff 0%, #0e83fc 34%, #0d7ef4 100%);
        color: #fff;
        box-shadow: 0 1px 4px rgba(17, 71, 135, 0.14);
        flex-shrink: 0;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.22);
      }

      .brand-text {
        font-size: 16px;
        white-space: nowrap;
      }

      .app-grid-btn {
        width: 24px;
        height: 24px;
        color: rgba(255, 255, 255, 0.92);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 4px;
      }

      .topbar-nav {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
      }

      .topbar-nav button {
        height: 30px;
        padding: 0 12px;
        border-radius: 5px;
        color: rgba(255, 255, 255, 0.78);
        white-space: nowrap;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .topbar-nav button.is-active {
        color: #fff;
        background: rgba(255, 255, 255, 0.16);
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }

      .topbar-guide-wrap {
        position: relative;
        z-index: 24;
      }

      .topbar-guide-btn {
        height: 28px;
        padding: 0 12px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .topbar-guide-btn:hover,
      .topbar-guide-btn.is-open {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.42);
      }

      .topbar-guide-btn svg {
        flex-shrink: 0;
        transition: transform 0.15s ease;
      }

      .topbar-guide-btn.is-open svg {
        transform: rotate(180deg);
      }

      .topbar-guide-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        min-width: 128px;
        padding: 4px;
        border-radius: 8px;
        border: 1px solid #dbe6f2;
        background: #fff;
        box-shadow: 0 10px 24px rgba(32, 58, 85, 0.16);
      }

      .topbar-guide-item {
        display: block;
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        text-align: left;
        color: #3d5874;
        white-space: nowrap;
      }

      .topbar-guide-item:hover {
        background: #f5f9ff;
        color: var(--primary-deep);
      }

      .topbar-guide-item.is-active {
        background: var(--primary-soft);
        color: var(--primary-deep);
        font-weight: 600;
      }

      .topbar-icon {
        position: relative;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.9);
      }

      .topbar-badge {
        position: absolute;
        top: -3px;
        right: -7px;
        min-width: 18px;
        height: 18px;
        padding: 0 4px;
        border-radius: 999px;
        background: #ff5a5a;
        color: #fff;
        font-size: 12px;
        line-height: 18px;
        text-align: center;
      }

      .topbar-user {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-left: 8px;
        border-left: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
      }

      .topbar-avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        font-weight: 700;
      }

      .app-main {
        flex: 1;
        min-height: 0;
        display: flex;
      }

      .app-sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: #fff;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .sidebar-header {
        padding: 12px 12px 8px;
        font-size: 16px;
        font-weight: 700;
      }

      .sidebar-scroll {
        flex: 1;
        overflow: auto;
        padding: 0 4px 12px;
      }

      .sidebar-group {
        margin-bottom: 4px;
      }

      .sidebar-trigger,
      .sidebar-child,
      .sidebar-static {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 6px;
        color: var(--text-secondary);
        text-align: left;
        min-height: 34px;
        overflow: hidden;
        font-size: 15px;
      }

      .sidebar-trigger:hover,
      .sidebar-child:hover,
      .sidebar-static:hover {
        background: #f4f8fd;
      }

      .sidebar-trigger .arrow {
        margin-left: auto;
        width: 0;
        height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 5px solid #9aacc3;
        transition: transform 0.15s ease;
      }

      .sidebar-trigger.is-open .arrow {
        transform: rotate(90deg);
      }

      .sidebar-icon {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: #ecf4ff;
        border: 1px solid #d7e7ff;
        color: var(--primary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .sidebar-icon svg {
        width: 12px;
        height: 12px;
        display: block;
      }

      .sidebar-trigger.is-active-group {
        color: var(--primary);
        background: #f5f9ff;
      }

      .sidebar-static.is-active {
        color: var(--primary);
        background: #f5f9ff;
        font-weight: 600;
      }

      .sidebar-trigger.is-active-group .sidebar-icon,
      .sidebar-static.is-active .sidebar-icon {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }

      .sidebar-children {
        padding: 2px 0 2px 20px;
      }

      .sidebar-child {
        position: relative;
        padding-left: 14px;
        font-size: 15px;
      }

      .sidebar-trigger > span:not(.sidebar-icon):not(.arrow),
      .sidebar-static > span:not(.sidebar-icon),
      .sidebar-child {
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .sidebar-child::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 50%;
        width: 4px;
        height: 4px;
        margin-top: -2px;
        border-radius: 50%;
        background: #b8c7d8;
      }

      .sidebar-child.is-active {
        background: #eaf4ff;
        color: var(--primary);
        font-weight: 600;
      }

      .sidebar-child.is-active::before {
        background: var(--primary);
      }

      .sidebar-footer {
        padding: 10px 12px 12px;
        border-top: 1px solid var(--border);
        color: var(--text-tertiary);
      }

      .collapse-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--text-secondary);
      }

      .workspace {
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 10px 12px;
      }

      .page-surface {
        min-height: calc(100vh - var(--topbar-h) - 20px);
        background: #fff;
        border: 1px solid #eef3f9;
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .page-toolbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 22px;
        padding: 12px 14px 10px;
      }

      .operation-page {
        display: flex;
        flex-direction: column;
      }

      .operation-page-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px 8px;
      }

      .operation-page-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #31485f;
        font-size: 14px;
        font-weight: 700;
      }

      .operation-page-back svg {
        color: #4c647c;
        flex-shrink: 0;
      }

      .operation-submit-btn {
        min-width: 72px;
      }

      .operation-card {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 0;
        flex: 1;
        padding: 0 12px 12px;
      }

      .operation-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 2px;
      }

      .operation-filter {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #4d6279;
        font-size: 12px;
      }

      .operation-filter select {
        width: 88px;
        height: 28px;
        border-radius: 4px;
      }

      .operation-toolbar-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .operation-toolbar-actions .btn {
        height: 28px;
        padding: 0 12px;
        border-radius: 14px;
        font-size: 12px;
      }

      .operation-sheet-shell {
        display: flex;
        flex-direction: column;
        min-height: 620px;
        border: 1px solid #eaf0f7;
        border-radius: 4px;
        overflow: hidden;
        background: #fff;
      }

      .operation-sheet-wrap {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: #fff;
      }

      .operation-sheet-table {
        width: max-content;
        min-width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }

      .operation-sheet-table col.row-index {
        width: 36px;
      }

      .operation-sheet-table thead th {
        position: static;
        height: 20px;
        padding: 0;
        border-right: 1px solid #edf2f8;
        border-bottom: 1px solid #edf2f8;
        background: #f7fbff;
        color: #667f99;
        font-size: 11px;
        font-weight: 500;
        text-align: center;
      }

      .operation-sheet-table thead th.sheet-corner {
        background: #fff;
      }

      .operation-sheet-table tbody th,
      .operation-sheet-table tbody td {
        border-right: 1px solid #edf2f8;
        border-bottom: 1px solid #edf2f8;
      }

      .operation-sheet-table tbody th {
        width: 36px;
        min-width: 36px;
        padding: 0;
        text-align: center;
        color: #7389a0;
        font-size: 11px;
        font-weight: 500;
        background: #fff;
      }

      .operation-sheet-table td {
        height: 24px;
        padding: 0 6px;
        color: #31485f;
        font-size: 12px;
        white-space: nowrap;
      }

      .operation-sheet-table .field-row th {
        background: #fff;
      }

      .operation-sheet-table .field-row td {
        height: 22px;
        background: #fbfdff;
        color: #5f748a;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
      }

      .operation-sheet-table td.is-selected {
        background: #d9ecff;
        box-shadow: inset 0 0 0 1px #6aa9f6;
      }

      .operation-sheet-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 10px;
        border-top: 1px solid #eef3f8;
        background: #fff;
      }

      .operation-scrollbar {
        position: relative;
        width: 316px;
        height: 6px;
        border-radius: 999px;
        background: #e5ebf2;
      }

      .operation-scrollbar::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 132px;
        border-radius: inherit;
        background: #b8c1cc;
      }

      .operation-zoom {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #6b8198;
        font-size: 12px;
      }

      .operation-zoom button {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid #d8e1ec;
        color: #677e95;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 1;
      }

      .operation-zoom-bar {
        position: relative;
        width: 48px;
        height: 4px;
        border-radius: 999px;
        background: #d8e2ee;
      }

      .operation-zoom-bar::after {
        content: "";
        position: absolute;
        right: 11px;
        top: -2px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #79a9e3;
      }

      .operation-print-page {
        padding: 12px 16px 16px;
      }

      .operation-print-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .operation-print-close {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        color: #8ba0b5;
        font-size: 18px;
        line-height: 1;
      }

      .operation-print-stage {
        min-height: 600px;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 42px;
      }

      .operation-print-label {
        width: 102px;
        min-height: 60px;
        padding: 8px 9px;
        border: 1px solid #e6edf5;
        background: #fff;
        box-shadow: 0 4px 10px rgba(40, 65, 92, 0.06);
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .operation-print-qr {
        width: 24px;
        height: 24px;
        background:
          linear-gradient(90deg, #111 50%, transparent 50%) 0 0 / 6px 6px,
          linear-gradient(#111 50%, transparent 50%) 0 0 / 6px 6px,
          linear-gradient(90deg, transparent 50%, #111 50%) 3px 3px / 6px 6px,
          linear-gradient(transparent 50%, #111 50%) 3px 3px / 6px 6px,
          #fff;
        border: 1px solid #d9e3ef;
      }

      .operation-print-brand {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }

      .operation-print-brand strong {
        color: #2c517d;
        font-size: 10px;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }

      .operation-print-brand span {
        color: #6a7f95;
        font-size: 9px;
        white-space: nowrap;
      }

      .guide-page {
        display: flex;
        flex-direction: column;
      }

      .guide-page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px 10px;
        border-bottom: 1px solid #eef3f8;
      }

      .guide-page-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #4b647d;
        font-size: 13px;
        font-weight: 700;
      }

      .guide-page-title {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 700;
        color: #30465d;
      }

      .guide-page-subtitle {
        margin-top: 6px;
        color: #6a8198;
        font-size: 13px;
      }

      .guide-page-body {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 18px;
      }

      .guide-page-note {
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #e3eef9;
        background: #f7fbff;
        color: #5e748b;
        font-size: 13px;
        line-height: 1.7;
      }

      .guide-card-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .guide-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 174px;
        padding: 16px;
        border-radius: 10px;
        border: 1px solid #eaf0f7;
        background: #fff;
        box-shadow: 0 4px 10px rgba(34, 61, 92, 0.04);
      }

      .guide-card-title {
        font-size: 16px;
        font-weight: 700;
        color: #30465d;
      }

      .guide-card-desc {
        color: #637b93;
        font-size: 13px;
        line-height: 1.7;
        flex: 1;
      }

      .guide-card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .guide-chip {
        display: inline-flex;
        align-items: center;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        background: #eef5ff;
        color: #4f77a1;
        font-size: 12px;
      }

      .guide-chip.is-subtle {
        background: #f4f7fb;
        color: #70869d;
      }

      .guide-card-links {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 20px;
      }

      .guide-inline-link {
        color: var(--primary);
        font-size: 12px;
        line-height: 1.4;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .guide-inline-link:hover {
        color: var(--primary-deep);
      }

      .guide-card-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .guide-card-actions .btn {
        text-decoration: none;
      }

      .page-toolbar-left {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .page-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
      }

      .mode-chip {
        min-width: 94px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        color: #4f6076;
        background: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .mode-chip svg {
        flex-shrink: 0;
      }

      .search-form {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .search-input {
        width: 210px;
      }

      .btn {
        height: 32px;
        padding: 0 14px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: #fff;
        color: #45607c;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.15s ease;
      }

      .btn:hover {
        border-color: #bcd7ff;

        min-width: 72px;

      }

      .detail-item span {
        color: #203247;
      }

      .settings-panel {
        padding: 12px 12px 16px;
        overflow: auto;
      }

      .settings-card {
        border: 1px solid #eef3f8;
        border-radius: 8px;
        background: #fff;
        margin-bottom: 10px;
        overflow: hidden;
      }

        padding: 10px 12px;
        border-bottom: 1px solid #f1f5fa;

      }

      .settings-body {

        flex-direction: column;
        gap: 8px;

        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

        min-height: 740px;
      }

      .label-side {

        justify-content: center;
        padding: 20px;

        height: 100%;

        border-radius: 8px;

        align-items: center;
        justify-content: center;
        padding: 18px;
      }

      .label-panel {
        padding: 14px 12px 16px;

      }

        border-bottom: 1px solid #f0f4fa;
      }

        margin: 0 0 10px;

        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

        grid-template-columns: 46px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        padding: 10px;

        border-radius: 6px;

        border-radius: 8px;

        min-height: 110px;

      .label-card.barcode {

      .qr-box {
        width: 40px;
        height: 40px;
        border: 1px solid #0e1620;
        background:
          linear-gradient(90deg, #111 25%, transparent 25%, transparent 50%, #111 50%, #111 75%, transparent 75%),
          linear-gradient(#111 25%, transparent 25%, transparent 50%, #111 50%, #111 75%, transparent 75%);
        background-size: 10px 10px;
        background-position: 0 0, 0 0;
      }

      .label-card.large .qr-box {
        width: 56px;
        height: 56px;
      }

      .barcode-box {
        width: 100%;
        height: 18px;
        margin-top: 6px;
        background: repeating-linear-gradient(
          90deg,
          #111 0,
          #111 2px,
          transparent 2px,
          transparent 4px,
          #111 4px,
          #111 5px,
          transparent 5px,
          transparent 7px
        );
      }

      .label-brand {

        letter-spacing: 0.02em;

        color: #1565d8;
      }

        gap: 2px;
        min-width: 0;
        color: #364e68;
      }

      .label-lines strong,
      .label-lines span {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .upload-box {
        border: 1px dashed #c6daef;
        border-radius: 8px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #7e95b0;
        background: #fafcff;
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(18, 33, 52, 0.3);
        z-index: 40;
      }

      .drawer-panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 380px;
        background: #fff;
        box-shadow: -10px 0 28px rgba(16, 33, 51, 0.18);
        z-index: 41;
        display: flex;
        flex-direction: column;
      }

      .drawer-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 16px 12px;
        border-bottom: 1px solid #f1f5fa;
      }

      .drawer-head h3 {
        margin: 0;
        font-size: 18px;
      }

      .drawer-subtitle {
        margin: 4px 0 0;
        color: var(--text-secondary);
      }

      .close-btn {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: #6e8197;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .close-btn:hover {
        background: #f4f7fb;
      }

      .drawer-body {
        flex: 1;
        overflow: auto;
        padding: 16px;
      }

      .drawer-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      .drawer-field {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding-bottom: 10px;
        border-bottom: 1px dashed #edf2f8;
      }

        width: 84px;
        color: var(--text-secondary);
        font-weight: 600;
        flex-shrink: 0;
      }

      .drawer-note {
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        background: #f7fbff;
        color: #46607b;
      }

      .drawer-footer {
        padding: 14px 16px;
        border-top: 1px solid #f1f5fa;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .toast-root {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 60;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .toast {
        min-width: 240px;
        max-width: 340px;
        padding: 12px 14px;
        border-radius: 8px;
        color: #fff;
        box-shadow: 0 12px 24px rgba(16, 33, 51, 0.18);
      }

      .toast.success {
        background: linear-gradient(135deg, #2ca867 0%, #299a60 100%);
      }

      .toast.info {
        background: linear-gradient(135deg, #2587ff 0%, #1570ef 100%);
      }

      .toast.warning {
        background: linear-gradient(135deg, #e0a128 0%, #d18c15 100%);
      }

      .toast strong {
        display: block;
        margin-bottom: 3px;
        font-size: 13px;
      }

      .toast span {
        display: block;
        opacity: 0.92;
      }
      .demand-anchor {
        position: relative;
      }

      .demand-badge {
        display: none;
        position: absolute;
        top: 6px;
        right: 6px;
        z-index: 6;
        pointer-events: none;
      }

      body.is-demand-mode .demand-badge {
        display: block;
      }

      .demand-badge[hidden] {
        display: none !important;
      }

      .demand-badge-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        padding: 0;
        line-height: 1;
        border-radius: 50%;
        background: #ff7a45;
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        pointer-events: auto;
        box-shadow: 0 2px 6px rgba(255, 122, 69, 0.3);
      }

      .demand-badge-trigger:hover {
        background: #ff5d1f;
      }

      .demand-popover {
        position: fixed;
        z-index: 1000;
        display: none;
        max-width: 320px;
        padding: 12px 14px;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 12px 32px rgba(15, 37, 65, 0.18);
        border: 1px solid #ffd9c4;
        font-size: 12px;
        color: #4d627a;
      }

      .demand-popover strong {
        display: block;
        margin-bottom: 4px;
        color: #1f2d3d;
        font-size: 13px;
      }

      .demand-popover p {
        margin: 6px 0 0;
        line-height: 1.55;
      }

      .row-expand-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        margin-right: 6px;
        border-radius: 4px;
        background: var(--primary-soft);
        color: var(--primary);
        flex-shrink: 0;
        vertical-align: -4px;
        transition: transform 0.18s ease, color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      }

      .row-expand-toggle:hover {
        background: var(--primary);
        color: #fff;
        box-shadow: 0 2px 6px rgba(22, 119, 255, 0.25);
      }

      .row-expand-toggle.is-expanded {
        transform: rotate(90deg);
        background: var(--primary);
        color: #fff;
        box-shadow: 0 2px 6px rgba(22, 119, 255, 0.25);
      }

      .row-expand-spacer {
        display: inline-block;
        width: 20px;
        margin-right: 6px;
      }

      .name-cell {
        display: inline-flex;
        align-items: center;
        max-width: 100%;
        min-width: 0;
      }

      .name-cell .text-ellipsis {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      tbody tr.row-child > td {
        background: #f6faff;
      }

      tbody tr.row-child:hover > td {
        background: #eef5ff;
      }

      tbody tr.row-child .name-cell {
        padding-left: 22px;
        position: relative;
        color: var(--text);
      }

      tbody tr.row-child .name-cell::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 50%;
        width: 8px;
        height: 8px;
        border-left: 1px solid #c2d4ec;
        border-bottom: 1px solid #c2d4ec;
        transform: translateY(-50%);
      }

      tbody tr.row-child .child-source-tag {
        display: inline-flex;
        align-items: center;
        margin-left: 6px;
        padding: 0 6px;
        height: 18px;
        border-radius: 9px;
        background: var(--primary-soft);
        color: var(--primary);
        font-size: 11px;
        white-space: nowrap;
      }

      tbody tr.row-child .action-link.is-danger {
        color: var(--danger);
      }

      tbody tr.row-child .action-link.is-danger:hover {
        color: #b8211a;
      }

      tbody tr.row-parent-link > td {
        background: #fff8ec;
      }

      tbody tr.row-parent-link:hover > td {
        background: #ffefd1;
      }

      tbody tr.row-parent-link .name-cell {
        padding-left: 22px;
        position: relative;
        color: var(--text);
      }

      tbody tr.row-parent-link .name-cell::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 50%;
        width: 8px;
        height: 8px;
        border-left: 1px solid #f0c785;
        border-top: 1px solid #f0c785;
        transform: translateY(-50%);
      }

      tbody tr.row-parent-link .action-link.is-warning {
        color: #d97706;
      }

      tbody tr.row-parent-link .action-link.is-warning:hover {
        color: #b45309;
      }

      tbody tr.row-parent-link .parent-source-tag {
        display: inline-flex;
        align-items: center;
        margin-left: 6px;
        padding: 0 6px;
        height: 18px;
        border-radius: 9px;
        background: #fff1d9;
        color: #b06a00;
        border: 1px solid #ffd9a8;
        font-size: 11px;
        white-space: nowrap;
      }

      .relation-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 37, 65, 0.32);
        z-index: 50;
      }

      .relation-modal {
        position: fixed;
        inset: 0;
        margin: auto;
        z-index: 51;
        width: min(960px, calc(100vw - 64px));
        height: min(640px, calc(100vh - 64px));
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 24px 60px rgba(16, 33, 51, 0.24);
        display: flex;
        flex-direction: column;
        overflow: hidden;

        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        padding: 18px 20px 12px;
        border-bottom: 1px solid var(--border);
      }

      .relation-modal-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }

      .relation-modal-subtitle {
        margin-top: 4px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .relation-modal-close {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: var(--text-tertiary);
        font-size: 18px;
        line-height: 1;
      }

      .relation-modal-close:hover {
        background: #f4f7fb;
        color: var(--text);
      }

      .relation-modal-steps {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        background: var(--surface-muted);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-secondary);

        align-items: center;
        gap: 6px;

        display: inline-flex;

        justify-content: center;

        border-radius: 50%;
        background: #e1e7ef;
        color: #fff;
        font-size: 11px;

        background: var(--primary);

        background: var(--success);

      .relation-modal-step.is-active span {
        color: var(--text);

      .relation-modal-divider {

        flex-direction: column;

        align-items: center;
        justify-content: space-between;
        font-size: 14px;
        font-weight: 600;
        color: var(--text);

        display: inline-flex;

        border-radius: 10px;

        font-size: 11px;
        color: var(--text-secondary);
      }

      .relation-type-card.is-selected .relation-type-card-tag {
        border-color: var(--primary);
        color: var(--primary);

      .relation-type-card-desc {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.55;
      }

      .relation-type-card-rule {
        margin-top: 6px;
        padding-top: 8px;
        border-top: 1px dashed #e1e7ef;
        font-size: 12px;
        color: var(--warning);
      }

      .relation-rule-tip {
        padding: 10px 12px;
        border-radius: 6px;
        background: #fff7e6;
        border: 1px solid #ffe2b3;
        color: #804a00;
        font-size: 12px;
        line-height: 1.55;
      }

      .relation-source-tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border);
      }

      .relation-source-tab {
        position: relative;
        padding: 8px 14px;
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        border-radius: 6px 6px 0 0;
      }

      .relation-source-tab.is-active {
        color: var(--primary);
        font-weight: 600;
      }

      .relation-source-tab.is-active::after {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: -1px;
        height: 2px;
        background: var(--primary);
        border-radius: 1px;
      }

      .relation-search {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px 14px;
        align-items: end;
      }

      .relation-search.is-collapsed {
        grid-template-columns: minmax(200px, 1fr) minmax(200px, 1fr) auto;
      }

      .relation-search-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }

      .relation-search-field label {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .relation-search-field input {
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      .relation-search-actions {
        display: flex;
        align-items: end;
        gap: 8px;
        white-space: nowrap;
      }

      .relation-search-toggle {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 30px;
        padding: 0 10px;
        background: transparent;
        color: var(--primary);
        font-size: 12px;
      }

      .relation-search-toggle svg {
        transition: transform 0.18s ease;
      }

      .relation-search-toggle.is-expanded svg {
        transform: rotate(180deg);
      }

      .relation-summary {
        display: flex;
        gap: 16px;
        font-size: 12px;
        color: var(--text-secondary);
      }

      .relation-table-wrap {
        flex: 1;
        min-height: 200px;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: auto;
      }

      .relation-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }

      .relation-table th,
      .relation-table td {
        padding: 9px 10px;
        border-bottom: 1px solid #f0f3f8;
        text-align: left;
        white-space: nowrap;
      }

      .relation-table thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #f7faff;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .relation-table tbody tr:hover td {
        background: #f8fbff;
      }

      .relation-table tbody tr.is-selected td {
        background: #f3f9ff;
      }

      .relation-table tbody tr.is-disabled td {
        color: var(--text-tertiary);
      }

      .relation-table .relation-row-disabled-tag {
        display: inline-flex;
        align-items: center;
        padding: 0 6px;
        height: 18px;
        margin-left: 6px;
        border-radius: 9px;
        background: #fff7e6;
        color: #b06a00;
        border: 1px solid #ffd9a8;
        font-size: 11px;
      }

      .relation-pagination {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: nowrap;
        gap: 12px;
        font-size: 12px;
        color: var(--text-secondary);
        white-space: nowrap;
      }

      .relation-pagination > div {
        flex-shrink: 0;
      }

      .relation-pagination .pager-right {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: nowrap;
      }

      .relation-pagination .pager-list {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-wrap: nowrap;
      }

      .relation-pagination .pager-btn,
      .relation-pagination .pager-ellipsis {
        min-width: 24px;
        height: 24px;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: #fff;
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
      }

      .relation-pagination .pager-btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }

      .relation-pagination .pager-btn.is-active {
        color: var(--primary);
        border-color: var(--primary);
      }

      .relation-pagination .pager-btn:disabled {
        color: var(--text-tertiary);
        background: #f6f8fb;
        cursor: not-allowed;
      }

      .relation-pagination .pager-ellipsis {
        cursor: default;
        border: none;
        background: transparent;
      }

      .relation-page-size {
        height: 24px;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-size: 12px;
        background: #fff;
      }

      .relation-modal-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 20px 16px;
        border-top: 1px solid var(--border);
        background: var(--surface-muted);
      }

      .relation-selected-text {
        font-size: 12px;
        color: var(--text-secondary);
      }

      .relation-selected-text.is-error {
        color: var(--danger);
      }

      .relation-modal-actions {
        display: inline-flex;
        gap: 8px;
      }

      /* Arco Design inspired component polish for the HTML prototype. */
      :root {
        --primary: #165dff;
        --primary-deep: #0e42d2;
        --primary-soft: #e8f3ff;
        --topbar: #165dff;
        --bg: #f2f3f5;
        --surface-muted: #f7f8fa;
        --border: #e5e6eb;
        --border-strong: #c9cdd4;
        --text: #1d2129;
        --text-secondary: #4e5969;
        --text-tertiary: #86909c;
        --success: #00b42a;
        --warning: #ff7d00;
        --danger: #f53f3f;
        --shadow: 0 4px 10px rgba(29, 33, 41, 0.08);
        --radius-sm: 2px;
        --radius-md: 4px;
        --radius-lg: 6px;
      }

      body {
        color: var(--text);
        background: var(--bg);
        font-size: 14px;
      }

      input,
      select,
      textarea {
        min-height: 32px;
        border-color: var(--border);
        border-radius: 2px;
        color: var(--text);
        background: #fff;
      }

      input:hover,
      select:hover,
      textarea:hover {
        border-color: var(--primary);
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.12);
      }

      input:disabled,
      select:disabled,
      textarea:disabled {
        color: var(--text-tertiary);
        background: #f2f3f5;
        border-color: var(--border);
      }

      .app-topbar {
        background: #165dff;
        box-shadow: 0 2px 8px rgba(22, 93, 255, 0.18);
      }

      .topbar-nav {
        gap: 4px;
      }

      .topbar-nav button {
        height: 34px;
        padding: 0 14px;
        border-radius: 4px 4px 0 0;
        color: rgba(255, 255, 255, 0.78);
      }

      .topbar-nav button:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
      }

      .topbar-nav button.is-active {
        color: var(--primary);
        background: #fff;
        font-weight: 600;
      }

      .app-sidebar {
        border-right-color: var(--border);
        background: #fff;
      }

      .sidebar-trigger,
      .sidebar-child,
      .sidebar-static {
        min-height: 36px;
        border-radius: 4px;
        color: var(--text-secondary);
        font-size: 14px;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .sidebar-trigger:hover,
      .sidebar-child:hover,
      .sidebar-static:hover {
        background: #f7f8fa;
        color: var(--primary);
      }

      .sidebar-trigger.is-active-group,
      .sidebar-static.is-active,
      .sidebar-child.is-active {
        background: #e8f3ff;
        color: var(--primary);
        font-weight: 600;
      }

      .sidebar-icon {
        width: 16px;
        height: 16px;
        border: 0;
        background: transparent;
        color: #86909c;
      }

      .sidebar-trigger.is-active-group .sidebar-icon,
      .sidebar-static.is-active .sidebar-icon {
        background: transparent;
        color: var(--primary);
      }

      .page-surface {
        border-color: var(--border);
        border-radius: 4px;
        box-shadow: var(--shadow);
      }

      .list-page-surface {
        height: calc(100vh - var(--topbar-h) - 20px);
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .list-page-surface .page-toolbar,
      .list-page-surface .pagination {
        flex-shrink: 0;
      }

      .config-toolbar,
      .page-toolbar,
      .integration-list-head {
        border-bottom-color: var(--border);
        background: #fff;
      }

      .btn {
        height: 32px;
        padding: 0 15px;
        border-radius: 2px;
        border-color: var(--border);
        color: var(--text);
        background: #fff;
        font-weight: 400;
      }

      .btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        background: #fff;
      }

      .btn:disabled {
        color: var(--text-tertiary);
        background: #f2f3f5;
        border-color: var(--border);
        cursor: not-allowed;
      }

      .btn-primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .btn-primary:hover {
        border-color: #4080ff;
        background: #4080ff;
        color: #fff;
      }

      .btn-danger-text {
        border-color: transparent;
        color: #d93026;
        background: transparent;
      }

      .btn-danger-text:hover {
        border-color: transparent;
        color: #b42318;
        background: #fff1f0;
      }

      .btn-danger {
        border-color: #f53f3f;
        background: #f53f3f;
        color: #fff;
      }

      .btn-danger:hover {
        border-color: #cb2634;
        background: #cb2634;
        color: #fff;
      }

      .btn-light {
        border-color: transparent;
        color: var(--primary);
        background: #e8f3ff;
      }

      thead th,
      .integration-data-table th,
      .integration-config-table th {
        background: #f7f8fa;
        color: var(--text);
        font-weight: 600;
        border-bottom-color: var(--border);
      }

      tbody td,
      .integration-data-table td,
      .integration-config-table td {
        color: var(--text);
        border-bottom-color: var(--border);
      }

      tbody tr:hover,
      tbody tr:hover .sticky-left,
      tbody tr:hover .sticky-right,
      .integration-data-table tbody tr:hover td,
      .integration-config-table tbody tr:hover td {
        background: #f7f8fa;
      }

      .action-link,
      .integration-action-link {
        color: var(--primary);
        font-weight: 500;
      }

      .action-link:hover,
      .integration-action-link:hover {
        color: var(--primary-deep);
      }

      .pagination,
      .integration-list-footer {
        border-top-color: var(--border);
        color: var(--text-secondary);
        background: #fff;
      }

      .page-size,
      .pager-btn,
      .pager-ellipsis,
      .integration-pager select,
      .integration-pager input {
        min-height: 28px;
        border: 1px solid var(--border);
        border-radius: 2px;
        color: var(--text-secondary);
        background: #fff;
      }

      .pager-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .pager-btn.is-active,
      .integration-pager strong {
        min-width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--primary);
        border-radius: 2px;
        color: var(--primary);
        background: #fff;
      }

      .integration-list-filters input,
      .integration-list-filters select,
      .integration-form-row select,
      .integration-config-table select {
        height: 32px;
        border-radius: 2px;
        border-color: var(--border);
        color: var(--text);
      }

      .integration-status-card {
        border-color: var(--border);
        border-radius: 2px;
        box-shadow: none;
      }

      button.integration-status-card {
        font: inherit;
      }

      .integration-status-card.is-active {
        border-color: var(--primary);
        box-shadow: 0 0 0 1px rgba(22, 93, 255, 0.16);
      }

      .integration-tabs {
        border-bottom-color: var(--border);
      }

      .integration-tabs button.is-active {
        color: var(--primary);
        background: transparent;
        border-bottom-color: var(--primary);
      }

      .toast,
      .action-more-menu,
      .topbar-guide-menu,
      .relation-modal,
      .drawer {
        border-radius: 4px;
        box-shadow: 0 6px 18px rgba(29, 33, 41, 0.12);
      }

      /* Arco Menu/Layout refinement: closer to Layout.Sider + Menu vertical mode. */
      :root {
        --sidebar-w: 200px;
      }

      .app-sidebar {
        background: #fff;
        border-right: 1px solid var(--border);
      }

      .sidebar-header {
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
      }

      .sidebar-scroll {
        padding: 4px 8px 12px;
      }

      .sidebar-group {
        margin-bottom: 2px;
      }

      .sidebar-trigger,
      .sidebar-static {
        position: relative;
        min-height: 40px;
        padding: 0 12px;
        border-radius: 4px;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 40px;
      }

      .sidebar-child {
        position: relative;
        min-height: 40px;
        padding: 0 12px 0 38px;
        border-radius: 4px;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 40px;
      }

      .sidebar-trigger:hover,
      .sidebar-static:hover,
      .sidebar-child:hover {
        background: #f7f8fa;
        color: var(--primary);
      }

      .sidebar-trigger.is-active-group {
        color: var(--primary);
        background: transparent;
        font-weight: 500;
      }

      .sidebar-static.is-active,
      .sidebar-child.is-active {
        color: var(--primary);
        background: #e8f3ff;
        font-weight: 600;
      }

      .sidebar-static.is-active::before,
      .sidebar-child.is-active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 7px;
        width: 3px;
        height: 26px;
        border-radius: 0 2px 2px 0;
        background: var(--primary);
      }

      .sidebar-child::before {
        content: "";
        position: absolute;
        left: 22px;
        top: 18px;
        width: 4px;
        height: 4px;
        margin: 0;
        border-radius: 50%;
        background: #c9cdd4;
      }

      .sidebar-child.is-active::before {
        left: 0;
        top: 7px;
        width: 3px;
        height: 26px;
        border-radius: 0 2px 2px 0;
        background: var(--primary);
      }

      .sidebar-children {
        padding: 2px 0 4px;
      }

      .sidebar-icon {
        width: 16px;
        height: 16px;
        color: var(--text-tertiary);
        margin-right: 4px;
      }

      .sidebar-trigger.is-active-group .sidebar-icon,
      .sidebar-static.is-active .sidebar-icon,
      .sidebar-trigger:hover .sidebar-icon,
      .sidebar-static:hover .sidebar-icon {
        color: var(--primary);
      }

      .sidebar-trigger .arrow {
        border-left-color: #c9cdd4;
      }

      .sidebar-trigger.is-open .arrow {
        transform: rotate(90deg);
        border-left-color: var(--text-tertiary);
      }

      .sidebar-trigger.is-active-group .arrow {
        border-left-color: var(--primary);
      }

      .collapse-link {
        min-height: 32px;
        padding: 0 4px;
        color: var(--text-tertiary);
      }

      .collapse-link:hover {
        color: var(--primary);
      }

      /* Arco component details: Form / Table / Pagination density and states. */
      .config-toolbar {
        min-height: 56px;
        padding: 0 16px;
      }

      .page-card-title,
      .integration-list-title {
        color: var(--text);
        font-size: 16px;
        font-weight: 600;
      }

      .integration-form-row {
        grid-template-columns: 220px minmax(0, 520px);
        min-height: 40px;
        margin-bottom: 12px;
      }

      .integration-label,
      .field-block span {
        color: var(--text);
        font-weight: 400;
      }

      .integration-section-heading,
      .config-section-title {
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
      }

      .integration-list-head {
        min-height: 56px;
        padding: 0 16px;
        flex-wrap: nowrap;
      }

      .integration-list-filters,
      .integration-list-actions {
        flex-wrap: nowrap;
      }

      .integration-list-filters {
        overflow: hidden;
      }

      .integration-list-filters input,
      .integration-list-filters select {
        width: 168px;
        min-width: 168px;
        flex: 0 0 168px;
      }

      .integration-list-filters input {
        width: 220px;
        min-width: 220px;
        flex-basis: 220px;
      }

      table,
      .integration-data-table,
      .integration-config-table {
        border-collapse: separate;
        border-spacing: 0;
      }

      thead th,
      .integration-data-table th,
      .integration-config-table th {
        height: 40px;
        padding: 0 12px;
        background: #f7f8fa;
        color: var(--text-secondary);
        font-weight: 500;
      }

      tbody td,
      .integration-data-table td,
      .integration-config-table td {
        height: 40px;
        padding: 0 12px;
      }

      .checkbox {
        width: 14px;
        height: 14px;
        border-color: #c9cdd4;
        border-radius: 2px;
      }

      .checkbox:hover {
        border-color: var(--primary);
      }

      .pagination,
      .integration-list-footer {
        min-height: 48px;
        padding: 8px 16px;
        flex-wrap: nowrap;
        white-space: nowrap;
        width: 100%;
        min-width: 0;
      }

      .pager-list,
      .integration-pager {
        gap: 6px;
        flex-wrap: nowrap;
        white-space: nowrap;
      }

      .integration-list-footer > span,
      .integration-pager > * {
        flex-shrink: 0;
      }

      .integration-list-footer > span {
        min-width: 0;
      }

      .integration-pager {
        max-width: calc(100% - 120px);
        overflow: visible;
        margin-left: auto;
      }

      .page-size,
      .pager-btn,
      .pager-ellipsis,
      .integration-pager select,
      .integration-pager input {
        height: 28px;
        min-width: 28px;
      }

      .action-more-menu {
        padding: 4px;
        border-radius: 4px;
      }

      .action-menu-item {
        height: 32px;
        padding: 0 10px;
        border-radius: 2px;
      }

      .anno,
      .anno-filter-bar {
        display: none;
      }

      body.annotation-mode .anno {
        display: block;
      }

      body.annotation-mode .anno-filter-bar {
        display: flex;
      }

      .anno-filter-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #fff7e6;
        border-bottom: 1px solid #ffd591;
        color: #8a4b00;
        font-size: 12px;
      }

      .anno-filter-label {
        font-weight: 600;
        white-space: nowrap;
      }

      .anno-filter-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .anno-filter-tag {
        padding: 2px 10px;
        border: 1px solid #ffd591;
        border-radius: 4px;
        background: #fff1d6;
        cursor: pointer;
      }

      .anno-filter-tag.active {
        background: #fa8c16;
        border-color: #fa8c16;
        color: #fff;
      }

      .anno {
        margin: 10px 0 12px;
        padding: 12px 14px;
        border-left: 4px solid #475569;
        border-radius: 0 6px 6px 0;
        background: rgba(71, 85, 105, 0.06);
        color: #334155;
        font-size: 12px;
        line-height: 1.7;
        text-align: left;
      }

      .anno-version-header,
      .anno-req {
        border-left-color: #1e40af;
        background: rgba(30, 64, 175, 0.05);
      }

      .anno-ux {
        border-left-color: #7c3aed;
        background: rgba(124, 58, 237, 0.05);
      }

      .anno-field {
        border-left-color: #059669;
        background: rgba(5, 150, 105, 0.05);
      }

      .anno-data {
        border-left-color: #d97706;
        background: rgba(217, 119, 6, 0.05);
      }

      .anno-state {
        border-left-color: #0891b2;
        background: rgba(8, 145, 178, 0.05);
      }

      .anno-edge {
        border-left-color: #475569;
        background: rgba(71, 85, 105, 0.06);
      }

      .anno-tag,
      .anno-version,
      .anno-source {
        display: inline-flex;
        align-items: center;
        min-height: 18px;
        margin-right: 6px;
        padding: 0 7px;
        border-radius: 3px;
        font-size: 11px;
        line-height: 18px;
      }

      .anno-tag {
        background: #475569;
        color: #fff;
        font-weight: 600;
      }

      .anno-version-header .anno-tag,
      .anno-req .anno-tag {
        background: #1e40af;
      }

      .anno-ux .anno-tag {
        background: #7c3aed;
      }

      .anno-field .anno-tag {
        background: #059669;
      }

      .anno-data .anno-tag {
        background: #d97706;
      }

        function escapeHtml(value) {
          return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        function pad(value, length = 2) {
          return String(value).padStart(length, "0");
        }

        function summarizeText(value, max = 22) {
          const text = String(value ?? "");
          return text.length > max ? text.slice(0, max) + "..." : text;
        }

        function createMermaidLiveUrl(code) {
          const payload = JSON.stringify({
            code,
            mermaid: JSON.stringify({ theme: "default" }),
            panZoom: true,
            updateDiagram: true
          });
          const bytes = new TextEncoder().encode(payload);

          if (window.pako?.deflate) {
            const compressed = window.pako.deflate(bytes, { level: 9 });
            return "https://mermaid.live/edit#pako:" + toBase64Url(compressed);
          }

          return "https://mermaid.live/edit#base64:" + toBase64Url(bytes);
        }

        function toBase64Url(bytes) {
          let binary = "";
          const chunkSize = 0x8000;

          for (let index = 0; index < bytes.length; index += chunkSize) {
            binary += Array.from(
              bytes.subarray(index, Math.min(index + chunkSize, bytes.length)),
              (byte) => String.fromCharCode(byte)
            ).join("");
          }

          return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
        }

        function buildPager(current, total) {
          if (total <= 7) {
            return Array.from({ length: total }, (_, index) => index + 1);
          }
          if (current <= 4) {
            return [1, 2, 3, 4, 5, "...", total];
          }
          if (current >= total - 3) {
            return [1, "...", total - 4, total - 3, total - 2, total - 1, total];
          }
          return [1, "...", current - 1, current, current + 1, "...", total];
        }

        function disambiguateNames(rows, key = "name") {
          const counts = rows.reduce((acc, row) => {
            const name = String(row[key] || "");
            acc[name] = (acc[name] || 0) + 1;
            return acc;
          }, {});
          const seen = {};
          return rows.map((row) => {
            const name = String(row[key] || "");
            if (counts[name] <= 1) {
              return row;
            }
            seen[name] = (seen[name] || 0) + 1;
            return { ...row, [key]: pad(seen[name], 2) + "# " + name };
          });
        }

        class EventBus {
          constructor() {
            this.listeners = new Set();
          }

          subscribe(listener) {
            this.listeners.add(listener);
            return () => this.listeners.delete(listener);
          }

          emit() {
            this.listeners.forEach((listener) => listener());
          }
        }

        class PrototypeStore {
          constructor() {
            this.bus = new EventBus();
            this.state = SeedFactory.create();
          }

          subscribe(listener) {
            return this.bus.subscribe(listener);
          }

          emit() {
            writeLastViewPreference(this.state.ui);
            this.bus.emit();
          }

          getState() {
            return this.state;
          }

          toggleGroup(groupId) {
            this.state.ui.expandedGroups[groupId] = !this.state.ui.expandedGroups[groupId];
            this.emit();
          }

          setTopNav(navLabel) {
            if (!TOP_NAV.includes(navLabel)) {
              return;
            }
            this.state.ui.currentTopNav = navLabel;
            this.state.ui.currentView = navLabel === "集成系统"
              ? VIEW_IDS.INTEGRATION_ASSET_DETECTION_CONFIG
              : VIEW_IDS.IT_FACILITY;
            this.state.ui.operationPage = null;
            this.state.ui.drawer = null;
            this.state.ui.detailPage = null;
            this.state.ui.guidePage = null;
            this.closeRowMoreMenu(false);
            this.closeGuideMenu(false);
            this.emit();
          }

          setView(viewId) {
            this.state.ui.currentTopNav = INTEGRATION_VIEW_IDS.has(viewId) ? "集成系统" : "运营管理";
            this.state.ui.currentView = viewId;
            this.state.ui.integrationConfigEditing = false;
            this.state.ui.operationPage = null;
            this.state.ui.drawer = null;
            this.state.ui.detailPage = null;
            this.state.ui.guidePage = null;
            this.closeRowMoreMenu(false);
            this.closeGuideMenu(false);
            this.emit();
          }

          editIntegrationConfig() {
            this.state.ui.integrationConfigEditing = true;
            this.emit();
          }

          saveIntegrationConfig() {
            this.state.ui.integrationConfigEditing = false;
            this.pushToast("保存成功", "资产检测设备配置已保存。", "success");
          }

          cancelIntegrationConfig() {
            this.state.ui.integrationConfigEditing = false;
            this.pushToast("已取消", "已退出资产检测设备配置编辑。", "info");
          }

          setIntegrationAssetDetectEnabled(enabled) {
            this.state.ui.integrationAssetDetectEnabled = !!enabled;
            this.emit();
          }

          getIntegrationStatusFilter(viewId) {
            return this.state.ui.integrationStatusFilters?.[viewId] || "全部";
          }

          setIntegrationStatusFilter(viewId, status) {
            if (!viewId) {
              return;
            }
            if (!this.state.ui.integrationStatusFilters) {
              this.state.ui.integrationStatusFilters = {};
            }
            this.state.ui.integrationStatusFilters[viewId] = status || "全部";
            this.closeRowMoreMenu(false);
            this.emit();
          }

          setFilter(viewId, keyword) {
            this.state.ui.filters[viewId] = { keyword: String(keyword || "") };
            this.state.ui.pagers[viewId] = 1;
            this.closeRowMoreMenu(false);
            this.emit();
          }

          resetFilter(viewId) {
            this.state.ui.filters[viewId] = { keyword: "" };
            this.state.ui.pagers[viewId] = 1;
            this.closeRowMoreMenu(false);
            this.pushToast("已重置筛选", LIST_PAGE_META[viewId].title + " 已恢复为默认筛选条件。", "info");
            this.emit();
          }

          setPage(viewId, page) {
            const meta = LIST_PAGE_META[viewId];
            if (!meta) {
              return;
            }
            const target = Math.max(1, Math.min(meta.pageCount, Number(page) || 1));
            this.state.ui.pagers[viewId] = target;
            this.closeRowMoreMenu(false);
            this.pushToast("已切换页码", meta.title + " 已切换到第 " + target + " 页，当前原型保留第一页样例数据。", "info");
            this.emit();
          }

          getListRows(viewId) {
            return this.state.data.lists[viewId] || [];
          }

          getRowById(viewId, rowId) {
            return this.getListRows(viewId).find((item) => item.id === rowId) || null;
          }

          getColumnWidth(viewId, columnKey) {
            return this.state.ui.columnWidths?.[viewId]?.[columnKey] || DEFAULT_COLUMN_WIDTHS[columnKey] || 128;
          }

          setColumnWidth(viewId, columnKey, width) {
            if (!this.state.ui.columnWidths[viewId]) {
              this.state.ui.columnWidths[viewId] = {};
            }
            const minWidth = columnKey === "__select" ? 36 : columnKey === "__actions" ? 86 : 72;
            this.state.ui.columnWidths[viewId][columnKey] = Math.max(minWidth, Math.round(width));
            this.emit();
          }

          getFilteredRows(viewId) {
            const rows = this.getListRows(viewId);
            const keyword = (this.state.ui.filters[viewId]?.keyword || "").trim().toLowerCase();
            const applyMasterSlaveMode = (items) => {
              if (!this.isMasterSlaveEnabled() || this.getMasterSlaveDisplayMode() !== "masters") {
                return items;
              }
              return items.filter((row) => !this.findParentOf(viewId, row.id));
            };
            if (!this.state.ui.autoExpandRows) {
              this.state.ui.autoExpandRows = {};
            }
            if (!keyword) {
              this.state.ui.autoExpandRows[viewId] = {};
              return applyMasterSlaveMode(rows);
            }
            const rowMatchesKeyword = (row) => {
              if (!row) return false;
              return Object.values(row).join(" ").toLowerCase().includes(keyword);
            };
            const autoExpand = {};
            const result = rows.filter((row) => {
              if (rowMatchesKeyword(row)) {
                return true;
              }
              const children = this.findChildrenOf(viewId, row.id);
              for (const rel of children) {
                const childRow = this.getRowById(rel.childViewId, rel.childRowId);
                if (rowMatchesKeyword(childRow)) {
                  autoExpand[row.id] = true;
                  return true;
                }
              }
              const parentRel = this.findParentOf(viewId, row.id);
              if (parentRel) {
                const parentRow = this.getRowById(parentRel.parentViewId, parentRel.parentRowId);
                if (rowMatchesKeyword(parentRow)) {
                  autoExpand[row.id] = true;
                  return true;
                }
              }
              return false;
            });
            this.state.ui.autoExpandRows[viewId] = autoExpand;
            return applyMasterSlaveMode(result);
          }

          openDrawer(viewId, rowId, intent = "view") {
            this.state.ui.operationPage = null;
            this.state.ui.guidePage = null;
            this.state.ui.drawer = { viewId, rowId, intent };
            this.closeRowMoreMenu(false);
            this.closeGuideMenu(false);

          toggleDemandExplain() {

            if (!this.state.ui.demandExplainEnabled) {
              window.demandExplainController?.hide();
            }
            this.emit();

          closeGuideMenu(shouldEmit = true) {
            if (!this.state.ui.guideMenuOpen) {
              return false;
            }
            this.state.ui.guideMenuOpen = false;
            if (shouldEmit) {
              this.emit();
            }
            return true;
          }

          openGuidePage(pageId = "flowcharts") {
            this.state.ui.guidePage = pageId;
            this.state.ui.guideMenuOpen = false;
            this.closeRowMoreMenu(false);
            this.emit();
          }
