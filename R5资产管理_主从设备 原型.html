                  ` : ""}
                  ${dialog.step === 1
                    ? this.renderRelationStepType(dialog, currentRow, parent)
                    : this.renderRelationStepDevice(dialog)}
                  ${dialog.error ? `<div class="relation-rule-tip" style="color:#a8071a;background:#fff1f0;border-color:#ffa39e;">${escapeHtml(dialog.error)}</div>` : ""}
                </div>
                ${this.renderRelationDialogFooter(dialog)}
              </section>

          }

          renderRelationStepType(dialog, currentRow, existingParent) {
            const existingChildren = this.store.findChildrenOf(dialog.viewId, dialog.rowId);
            const isAlreadyParent = existingChildren.length > 0;
            const isAlreadyChild = !!existingParent;
            const parentDisabled = isAlreadyChild || isAlreadyParent;
            const childDisabled = isAlreadyChild;
            let parentTag = "可选";
            let parentRule = "规则：一个从设备只能关联一个主设备。";
            if (isAlreadyChild) {
              parentTag = "已存在主设备";
              parentRule = "校验：当前设备已存在主设备，不可再次关联。";
            } else if (isAlreadyParent) {
              parentTag = "已是主设备";
              parentRule = "校验：当前设备已作为主设备绑定 " + existingChildren.length + " 个从设备，仅允许两层关系。";
            }
            const childTag = childDisabled ? "已是从设备" : "可选";
            const childRule = childDisabled
              ? "校验：当前设备已作为从设备被绑定，仅允许两层关系，不能再关联从设备。"
              : "规则：一个主设备可关联多个从设备；所选设备若已被关联，需要先解绑。";
            return `
              <div
                class="relation-type-grid"
                data-demand-title="关联类型选择"

                    <span>关联主设备</span>
                    <span class="relation-type-card-tag">${escapeHtml(parentTag)}</span>
                  </div>

                  <div class="relation-type-card-rule">${escapeHtml(parentRule)}</div>
                </div>
                <div
                  class="relation-type-card ${dialog.relationType === "child" ? "is-selected" : ""} ${childDisabled ? "is-disabled" : ""}"
                  data-action="${childDisabled ? "" : "set-relation-type"}"
                  data-type="child"
                >
                  <div class="relation-type-card-head">
                    <span>关联从设备</span>
                    <span class="relation-type-card-tag">${escapeHtml(childTag)}</span>
                  </div>
                  <div class="relation-type-card-desc">将其他设备设为「${escapeHtml(currentRow.name || "当前设备")}」的从设备；可绑定多个。</div>
                  <div class="relation-type-card-rule">${escapeHtml(childRule)}</div>
                </div>
              </div>
              <div class="relation-rule-tip">提示：仅支持两层主从关系（主→从）；已是主或已是从的设备，不能再向上/向下扩展层级。</div>
            `;
          }

          renderRelationStepDevice(dialog) {
            const sources = this.store.getRelationSourceTabs();
            const allRows = this.store.getRelationCandidateRows();
            const pageSize = Math.max(1, Number(dialog.pageSize) || 10);
            const total = allRows.length;
            const totalPages = Math.max(1, Math.ceil(total / pageSize));
            const currentPage = Math.min(Math.max(1, Number(dialog.page) || 1), totalPages);
            const sliceStart = (currentPage - 1) * pageSize;
            const pagedRows = allRows.slice(sliceStart, sliceStart + pageSize);
            const selectedList = Array.isArray(dialog.selected) ? dialog.selected : [];
            const isSelected = (row) => selectedList.some((item) => item.sourceViewId === row.__sourceViewId && item.rowId === row.id);
            const pagerItems = buildPager(currentPage, totalPages);
            const keywords = dialog.keywords || { name: "", assetCode: "", assetCategory: "", assetLocation: "" };
            const expanded = !!dialog.searchExpanded;
            const renderField = (field, label, placeholder) => `
              <div class="relation-search-field">
                <label>${escapeHtml(label)}</label>
                <input
                  value="${escapeHtml(keywords[field] || "")}"
                  placeholder="${escapeHtml(placeholder)}"
                  data-role="relation-field"
                  data-field="${escapeHtml(field)}"
                />
              </div>
            `;
            const advancedFields = expanded
              ? renderField("assetCategory", "资产分类", "请输入资产分类")
                + renderField("assetLocation", "资产位置", "请输入资产位置")
              : "";
            const verb = dialog.relationType === "parent" ? "主设备" : "从设备";
            return `
              <div
                class="relation-source-tabs"
                data-demand-title="设备来源切换"
                data-demand-text="默认按当前设备所属台账高亮，可切换到其它台账或全部范围。"
              >
                ${sources.map((source) => `
                  <button
                    class="relation-source-tab ${source.id === dialog.sourceViewId ? "is-active" : ""}"
                    type="button"
                    data-action="set-relation-source"
                    data-view="${escapeHtml(source.id)}"
                  >${escapeHtml(source.label)}</button>
                `).join("")}
              </div>
              <div class="relation-search${expanded ? "" : " is-collapsed"}">
                ${renderField("name", "资产名称", "请输入资产名称")}
                ${renderField("assetCode", "资产编号", "请输入资产编号")}
                ${advancedFields}
                <div class="relation-search-actions">
                  <button class="btn" type="button" data-action="reset-relation-search">重置</button>
                  <button class="relation-search-toggle ${expanded ? "is-expanded" : ""}" type="button" data-action="toggle-relation-search-expanded">
                    <span>${expanded ? "收起" : "展开"}</span>
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                      <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="relation-summary">
                <span>关联方向：${escapeHtml(verb)}</span>
                <span>筛选结果：${total} 条</span>
                <span>已勾选：${selectedList.length} 条${dialog.relationType === "child" ? "（支持多选）" : "（单选）"}</span>
              </div>
              <div class="relation-table-wrap">
                <table class="relation-table">
                  <thead>
                    <tr>
                      <th style="width:42px;">选择</th>
                      <th>名称</th>
                      <th>资产编号</th>
                      <th>来源台账</th>
                      <th>资产分类</th>
                      <th>资产状态</th>
                      <th>资产位置</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${pagedRows.length ? pagedRows.map((row) => {
                      const disabledReason = this.store.getRelationRowDisableReason(row);
                      const checked = isSelected(row);
                      const inputType = dialog.relationType === "parent" ? "radio" : "checkbox";
                      return `
                        <tr class="${checked ? "is-selected" : ""} ${disabledReason ? "is-disabled" : ""}">
                          <td>
                            <input
                              type="${inputType}"
                              name="relation-target"
                              data-role="relation-check"
                              data-view="${escapeHtml(row.__sourceViewId)}"
                              data-id="${escapeHtml(row.id)}"
                              ${checked ? "checked" : ""}
                              ${disabledReason ? "disabled" : ""}
                            />
                          </td>
                          <td>${escapeHtml(row.name || "-")}${disabledReason ? `<span class="relation-row-disabled-tag">${escapeHtml(disabledReason)}</span>` : ""}</td>
                          <td>${escapeHtml(row.assetCode || "-")}</td>
                          <td>${escapeHtml(row.__sourceLabel || "-")}</td>
                          <td>${escapeHtml(row.assetCategory || "-")}</td>
                          <td>${escapeHtml(row.assetStatus || "-")}</td>
                          <td>${escapeHtml(row.assetLocation || "-")}</td>
                        </tr>
                      `;
                    }).join("") : `
                      <tr><td colspan="7" style="padding: 32px; text-align: center; color: var(--text-tertiary);">未匹配到设备，请调整筛选条件。</td></tr>

                  </tbody>
                </table>
              </div>
              ${total > 0 ? `
                <div class="relation-pagination">
                  <div>共 ${total} 条 · 第 ${currentPage} / ${totalPages} 页</div>
                  <div class="pager-right">
                    <select class="relation-page-size" data-role="relation-page-size" aria-label="每页条数">
                      ${RELATION_PAGE_SIZE_OPTIONS.map((size) => `<option value="${size}" ${size === pageSize ? "selected" : ""}>${size} 条/页</option>`).join("")}
                    </select>
                    <div class="pager-list">
                      <button class="pager-btn" type="button" data-action="set-relation-page" data-page="${currentPage - 1}" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
                      ${pagerItems.map((item) => typeof item === "number"
                        ? `<button class="pager-btn ${item === currentPage ? "is-active" : ""}" type="button" data-action="set-relation-page" data-page="${item}">${item}</button>`
                        : `<span class="pager-ellipsis">${item}</span>`).join("")}
                      <button class="pager-btn" type="button" data-action="set-relation-page" data-page="${currentPage + 1}" ${currentPage >= totalPages ? "disabled" : ""}>下一页</button>
                    </div>
                  </div>
                </div>
              ` : ""}
            `;
          }

          renderRelationDialogFooter(dialog) {
            if (dialog.step === 1) {
              const canNext = !!dialog.relationType;
              return `
                <footer class="relation-modal-footer">
                  <div class="relation-selected-text">选择类型后，进入设备选择。</div>
                  <div class="relation-modal-actions">
                    <button class="btn" type="button" data-action="close-relation">取消</button>
                    <button class="btn btn-primary" type="button" data-action="relation-go-step" data-step="2" ${canNext ? "" : "disabled"}>下一步</button>

              text = dialog.relationType === "child" ? "请勾选目标从设备（可多选）" : "请勾选一条主设备";

              const row = this.store.getRowById(selectedList[0].sourceViewId, selectedList[0].rowId);

            return `

                  <button class="btn" type="button" data-action="close-relation">取消</button>
                  <button class="btn btn-primary" type="button" data-action="relation-confirm" ${selectedList.length > 0 ? "" : "disabled"}>确认关联</button>

          renderToasts(state) {
            return state.ui.toasts.map((toast) => `
              <div class="toast ${escapeHtml(toast.tone)}">
                <strong>${escapeHtml(toast.title)}</strong>
                <span>${escapeHtml(toast.message)}</span>
              </div>
            `).join("");
          }
        }

        class PrototypeApp {
          constructor(store, renderer) {
            this.store = store;
            this.renderer = renderer;
            this.columnResizeState = null;
            this.detailFieldDragState = null;
          }

          init() {
            this.store.subscribe(() => this.renderer.render());
            this.bindEvents();
            this.renderer.render();
          }

          bindEvents() {
            document.addEventListener("click", (event) => {
              const actionTarget = event.target.closest("[data-action]");
              const insideMoreMenu = event.target.closest(".action-menu-wrap");
              const insideGuideMenu = event.target.closest(".topbar-guide-wrap");
              if (!actionTarget) {
                if (!insideMoreMenu) {
                  this.store.closeRowMoreMenu();
                }
                if (!insideGuideMenu) {
                  this.store.closeGuideMenu();
                }
                return;
              }

          startColumnResize(handle, startX) {
            const key = handle.getAttribute("data-key");
            const viewId = handle.getAttribute("data-view");
            const th = handle.closest("th");
            const table = handle.closest("table");
            if (!key || !viewId || !th || !table) {
              return;

            const col = table.querySelector(`col[data-key="${key}"]`);
            const handleNode = handle;
            handleNode.classList.add("is-dragging");
            document.body.style.cursor = "col-resize";
            document.body.style.userSelect = "none";
            this.columnResizeState = {
              key,
              viewId,
              startX,
              startWidth: th.getBoundingClientRect().width,
              currentWidth: th.getBoundingClientRect().width,
              minWidth: key === "__select" ? 36 : key === "__actions" ? 86 : 72,
              th,
              col,
              handleNode
            };
          }

          stopColumnResize() {
            if (!this.columnResizeState) {
              return;
            }

            const { viewId, key, currentWidth, handleNode } = this.columnResizeState;
            handleNode.classList.remove("is-dragging");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            this.store.setColumnWidth(viewId, key, currentWidth);
            this.columnResizeState = null;

        class DemandExplainController {
          constructor() {
            this.enabled = false;
            this.popover = document.createElement("div");
            this.popover.className = "demand-popover";
            document.body.appendChild(this.popover);
            this.bindEvents();
          }

          bindEvents() {
            document.addEventListener("mouseover", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                this.showFor(trigger);
              }
            });
            document.addEventListener("mouseout", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                this.hide();
              }
            });
            document.addEventListener("focusin", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                this.showFor(trigger);
              }
            });
            document.addEventListener("focusout", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                this.hide();
              }
            });
            document.addEventListener("click", (event) => {
              const trigger = event.target.closest(".demand-badge-trigger");
              if (trigger) {
                event.preventDefault();
                event.stopPropagation();
                return;
              }
              if (!event.target.closest(".demand-popover")) {
                this.hide();
              }
            });
            window.addEventListener("scroll", () => this.hide(), true);
            window.addEventListener("resize", () => this.hide());
          }

          refresh(enabled) {
            this.setEnabled(enabled);
            const scopes = document.querySelectorAll("[data-demand-text]");
            scopes.forEach((scope) => {
              if (scope.classList.contains("demand-badge-trigger")) {
                return;
              }
              if (scope.querySelector(":scope > .demand-badge")) {
                return;
              }
              scope.classList.add("demand-anchor");
              const badge = document.createElement("span");
              badge.className = "demand-badge";
              badge.hidden = !this.enabled;
              const trigger = document.createElement("button");
              trigger.type = "button";
              trigger.className = "demand-badge-trigger";
              trigger.textContent = "需";
              trigger.dataset.demandTitleRef = scope.dataset.demandTitle || "需求说明";
              trigger.dataset.demandTextRef = scope.dataset.demandText || "";
              badge.appendChild(trigger);
              scope.appendChild(badge);
            });
            this.syncBadges();
          }

          setEnabled(enabled) {
            this.enabled = Boolean(enabled);
            if (!this.enabled) {
              this.hide();
            }
            this.syncBadges();
          }

          syncBadges() {
            document.querySelectorAll(".demand-badge").forEach((badge) => {
              badge.hidden = !this.enabled;
            });
          }

          showFor(trigger) {
            if (!this.enabled) {
              this.hide();
              return;
            }
            const title = trigger.dataset.demandTitleRef || "需求说明";
            const parts = String(trigger.dataset.demandTextRef || "")
              .split("||")
              .map((part) => part.trim())
              .filter(Boolean);
            const escape = (value) => String(value).replace(/[&<>"']/g, (ch) => ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;"
            }[ch]));
            this.popover.innerHTML = "<strong>" + escape(title) + "</strong>"
              + parts.map((part) => "<p>" + escape(part) + "</p>").join("");
            this.popover.style.display = "block";
            this.position(trigger);
          }

          hide() {
            this.popover.style.display = "none";
          }

          position(trigger) {
            const rect = trigger.getBoundingClientRect();
            const popoverRect = this.popover.getBoundingClientRect();
            let left = rect.right + 8;
            let top = rect.top;
            if (left + popoverRect.width > window.innerWidth - 8) {
              left = Math.max(8, rect.left - popoverRect.width - 8);
            }
            if (top + popoverRect.height > window.innerHeight - 8) {
              top = Math.max(8, window.innerHeight - popoverRect.height - 8);
            }
            this.popover.style.left = left + "px";
            this.popover.style.top = top + "px";
          }
        }

        class PrototypeAnnotationController {
          constructor() {
            this.toggleEl = document.querySelector('[data-role="annotation-toggle"]');
            this.tagsEl = document.getElementById("annoFilterTags");
            this.activeVersion = "all";
            this.latestVersion = "";
            this.bindEvents();
          }

          bindEvents() {
            if (!this.toggleEl) return;
            this.toggleEl.addEventListener("click", () => {
              document.body.classList.toggle("annotation-mode");
              this.refresh();
            });
          }

          refresh() {
            if (!document.body.classList.contains("annotation-mode") || !this.tagsEl) return;
            const versions = Array.from(document.querySelectorAll(".anno[data-version]"))
              .map((node) => node.getAttribute("data-version"))
              .filter(Boolean)
              .filter((version, index, list) => list.indexOf(version) === index)
              .sort((left, right) => this.compareVersion(right, left));
            this.latestVersion = versions[0] || "";
            if (this.activeVersion !== "all" && versions.indexOf(this.activeVersion) === -1) {
              this.activeVersion = "all";
            }
            this.renderTags(versions);
            this.applyFilter();
          }

          renderTags(versions) {
            const renderTag = (label, version) => {
              const tag = document.createElement("span");
              tag.className = "anno-filter-tag" + (this.activeVersion === version ? " active" : "");
              tag.textContent = label;
              tag.addEventListener("click", () => {
                this.activeVersion = version;
                this.renderTags(versions);
                this.applyFilter();
              });
              return tag;
            };
            this.tagsEl.innerHTML = "";
            this.tagsEl.appendChild(renderTag("全部", "all"));
            versions.forEach((version) => this.tagsEl.appendChild(renderTag(version, version)));
          }

          applyFilter() {
            document.querySelectorAll(".anno[data-version]").forEach((node) => {
              const version = node.getAttribute("data-version");
              if (this.activeVersion === "all") {
                node.style.display = "";
                node.style.opacity = version === this.latestVersion ? "1" : "0.62";
                return;
              }
              node.style.display = version === this.activeVersion ? "" : "none";
              node.style.opacity = "1";
            });
          }

          compareVersion(left, right) {
            const parse = (value) => String(value || "").replace(/[^0-9.]/g, "").split(".").map((part) => Number(part) || 0);
            const leftParts = parse(left);
            const rightParts = parse(right);
            const length = Math.max(leftParts.length, rightParts.length);
            for (let i = 0; i < length; i += 1) {
              if ((leftParts[i] || 0) !== (rightParts[i] || 0)) {
                return (leftParts[i] || 0) - (rightParts[i] || 0);
              }
            }
            return 0;
          }
        }

        const store = new PrototypeStore();
        const renderer = new PrototypeRenderer(store, {
          topbar: document.getElementById("topbar"),
          sidebar: document.getElementById("sidebar"),
          content: document.getElementById("content"),
          overlay: document.getElementById("overlay"),
          toast: document.getElementById("toast-root")
        });
        window.prototypeAnnotationController = new PrototypeAnnotationController();
        window.demandExplainController = new DemandExplainController();
        const app = new PrototypeApp(store, renderer);
        app.init();
      })();
    </script>
  </body>
</html>
