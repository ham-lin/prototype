function scene(a){$('sceneText').textContent=S.metric==='energy'?'机柜数值：月有功电能（kWh）':'机柜色标：'+(S.metric==='u'?'U位使用率':'实时功率 / 额定功率');if(S.scope==='room'){$('scene').innerHTML='<div class="floor"><div class="room-outline"></div><div class="cols">'+rows.map((row,i)=>'<div class="col" data-row="'+row.id+'"><button class="colname">'+row.name+'</button>'+racks.filter(r=>r.row===row.id).map(r=>'<button class="rack" style="--color:'+color(r)+'" data-r="'+r.id+'">'+(S.metric==='energy'?F(r.energy,0):String(r.pos).padStart(2,'0'))+'</button>').join('')+'</div>').join('')+'</div></div>'}else{const pct=r=>{const x=S.metric==='u'?r.used/42:S.metric==='energy'?r.energy/3200:r.real/r.rate;return Math.max(0,Math.min(100,x*100))},shown=a.slice(0,13);$('scene').innerHTML='<div class="cabrow">'+shown.map(r=>{const p=pct(r),fh=(p/100*150).toFixed(1),fy=(168-p/100*150).toFixed(1);return'<button class="cab" type="button" data-r="'+r.id+'"><span class="cab-no">'+String(r.pos).padStart(2,'0')+'</span><svg class="cab-svg" viewBox="-1 0 72 170" aria-hidden="true"><defs><clipPath id="cabp'+r.id+'"><path d="M11 2h48l11 16v150H0V18Z"/></clipPath></defs><rect width="70" height="168" fill="#e8f3fb" clip-path="url(#cabp'+r.id+')"/><rect y="'+fy+'" width="70" height="'+fh+'" fill="#21a347" clip-path="url(#cabp'+r.id+')"/><path d="M11 2h48l11 16v150H0V18Z" fill="none" stroke="#2a5c88" stroke-width="2"/><g fill="#c5d4df"><circle cx="8" cy="30" r="1.15"/><circle cx="8" cy="38" r="1.15"/><circle cx="8" cy="46" r="1.15"/></g></svg></button>'}).join('')+'</div>';}document.querySelectorAll('[data-r]').forEach(b=>{b.onclick=()=>tip(+b.dataset.r,b);b.ondblclick=()=>openRack(+b.dataset.r)});document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>go('row',+b.dataset.row))}
function tip(i,b){let r=racks[i],p=S.metric==='u'?[['已用U位',r.used+' U'],['空闲U位',r.free+' U'],['使用率',F(r.used/42*100)+'%']]:S.metric==='power'?[['已用功率（实际采集）',F(r.real)+' kW'],['近一月功率最大值',F(r.peak)+' kW'],['额定功率',F(r.rate)+' kW']]:[['月有功电能',F(r.energy)+' kWh'],['统计周期','近一月（最近30天）']];$('tip').innerHTML='<h3>'+r.name+' </h3><div>1F主机房 / '+rows[r.row-1].name+'机柜列 / 机柜位'+r.pos+'</div><dl>'+p.map(x=>'<dt>'+x[0]+'</dt><dd>'+x[1]+'</dd>').join('')+'</dl><div class="tip-foot"><button class="link" id="tr">机柜详情</button>'+(S.scope==='row'?'':'<button class="link" id="tw">所属机柜列详情</button>')+'</div>';$('tip').classList.add('show');let q=b.getBoundingClientRect(),t=$('tip');t.style.left=Math.min(q.right+10,innerWidth-290)+'px';t.style.top=Math.max(8,q.top)+'px';if($('tc'))$('tc').onclick=()=>hide();$('tr').onclick=()=>openRack(i);if($('tw'))$('tw').onclick=()=>go('row',r.row)}function hide(){$('tip').classList.remove('show')}
function table(a){let cols=S.metric==='u'?[['额定U位','total'],['已用U位','used'],['空闲U位','free'],['使用率','usage']]:S.metric==='power'?[['额定功率','rate'],['已用功率（实际采集）','real'],['近一月功率最大值','peak']]:[['月有功电能（kWh）','energy']];$('tableTitle').textContent={u:'机柜U位明细',power:'机柜功率明细',energy:'机柜月有功电能明细'}[S.metric];let z=a.filter(r=>r.name.toLowerCase().includes(S.q.toLowerCase()));let v=(r,k)=>k==='total'?42:k==='usage'?r.used/42*100:k==='remaining'?r.rate-r.real:r[k];z.sort((x,y)=>S.sort==='name'?x.id-y.id:(v(x,S.sort)-v(y,S.sort))*(S.desc?-1:1));let sh=z.slice((S.page-1)*10,S.page*10);$('table').innerHTML='<thead><tr><th>序号</th><th>机柜名称</th><th>所属机柜列</th>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'<th>操作</th></tr></thead><tbody>'+sh.map((r,i)=>'<tr><td>'+((S.page-1)*10+i+1)+'</td><td><button class="link" data-o="'+r.id+'">'+r.name+'</button></td><td>'+rows[r.row-1].name+'</td>'+cols.map(c=>'<td class="num">'+F(v(r,c[1]),c[1].includes('total')?0:2)+(c[1]==='usage'?' %':S.metric==='u'?' U':S.metric==='power'?' kW': ' kWh')+'</td>').join('')+'<td><button class="link" data-o="'+r.id+'">详情图</button></td></tr>').join('')+'</tbody>';$('count').textContent='显示 '+Math.min(z.length,(S.page-1)*10+1)+'–'+Math.min(z.length,S.page*10)+' 条，共 '+z.length+' 个机柜';document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>openRack(+b.dataset.o))}
function detail(){let r=racks[S.rack],d=r.dev;$('detail').innerHTML='<div><div class="rackframe"><div class="unums">'+Array.from({length:42},(_,i)=>'<span>'+(42-i)+'</span>').join('')+'</div><div class="rail">'+Array.from({length:42},(_,i)=>'<i class="empty"></i>').join('')+d.map(x=>'<button class="device" style="grid-row:'+(43-x.e)+'/span '+x.z+'" data-d="'+x.id+'">'+x.id+'</button>').join('')+'</div></div><p class="period">蓝灰色：已上架设备　浅灰色：空闲U位</p></div><div><h2>关联资产（'+d.length+' 台）</h2><table class="table"><tr><th>资产编号</th><th>资产名称</th><th>U位位置</th><th>状态</th><th>操作</th></tr>'+d.map(x=>'<tr><td>'+x.id+'</td><td>'+x.name+'</td><td>U'+x.s+'–U'+x.e+'</td><td>在用</td><td><button class="link" data-a="'+x.id+'">查看</button></td></tr>').join('')+'</table><div class="info">机柜位置：数字福建云计算中心 / 1F主机房 / '+rows[r.row-1].name+'机柜列 / '+r.name+'</div><p><button class="back" onclick="go(\'row\','+r.row+')">查看所属机柜列详情</button></p></div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{let x=d.find(q=>q.id===b.dataset.a);$('db').innerHTML='<dl><dt>资产编号</dt><dd>'+x.id+'</dd><dt>资产名称</dt><dd>'+x.name+'</dd><dt>所属机柜</dt><dd>'+r.name+'</dd><dt>U位位置</dt><dd>U'+x.s+'–U'+x.e+'</dd><dt>状态</dt><dd>在用</dd></dl>';$('dlg').showModal()})}
document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>go(b.dataset.scope));document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{S.metric=b.dataset.metric;S.page=1;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(b.disabled||b.dataset.tab==='table')return;S.tab=b.dataset.tab;render()});$('scope').onchange=e=>go(e.target.value==='room'?'room':'row',e.target.value==='room'?1:+e.target.value);$('back').onclick=()=>{if(hist.length)Object.assign(S,hist.pop());render()};$('search').oninput=e=>{S.q=e.target.value;S.page=1;render()};$('x').onclick=()=>$('dlg').close();document.addEventListener('click',e=>{if(!e.target.closest('.tip,[data-r]'))hide()});render();
</script>
